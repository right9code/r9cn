      q5: { q: 'Find a word in the extract which means \u201cdisrespect towards something sacred\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['desecration'] }], why: '\u201cDesecration\u201d means disrespect to something sacred \u2014 what her father feared.' },
      index: 4
    },
    {
      chapter: 'Twin Melodies',
      paras: [
        'In the middle of the performance, Shruti\u2019s parents entered the room and stood in a corner. Slowly, her parents became engrossed, and her father was seen evidently enjoying, tapping his feet. As soon as the performance ended, they moved towards the centre and clapped. Nabin clapped furiously and wore an expression of pride. \u201cWah, how soulful! You did not lose sight of the notes of the raga even once!\u201d',
        '\u201cYour own father,\u201d said Leela, \u201chad to go against his family\u2019s wishes to play the violin. His was a family of vocalists. Your grandfather saw this choice as a kind of betrayal of family values and tradition. But your father worked his fingers to the bone \u2014 and see where the violin got him.\u201d Nabin admitted, \u201cI underestimated the power of our own music. I was afraid you would be lost to us. I realise that my fears were baseless. I will root for your group at the concert!\u201d'
      ],
      q1: { q: 'State whether the following is TRUE or FALSE: \u201cNabin himself had once chosen an instrument against his own family\u2019s wishes.\u201d', a: true, why: 'Leela reveals that Nabin chose the violin although his family were vocalists.' },
      q2: { q: 'What instrument did Nabin\u2019s family traditionally follow?', opts: ['The tabla', 'Vocal music (singing)', 'The keyboard', 'Western drums'], a: 1, why: 'His family of vocalists belonged to a highly traditional school of singing.' },
      q3: { q: 'What did Nabin offer the children after the performance?', opts: ['A holiday', 'The school\u2019s music room for regular practice', 'New violins', 'A newspaper interview'], a: 1, why: 'He planned to offer them the music room with better equipment for regular practice.' },
      q4: { q: 'What change does Nabin\u2019s admission \u2014 \u201cmy fears were baseless\u201d \u2014 show in him?', opts: ['He now fears music', 'He accepts Shruti\u2019s choice and trusts her', 'He has given up the violin', 'He blames Leela'], a: 1, why: 'He admits he had underestimated their own music and now fully supports Shruti.' },
      q5: { q: 'Find a word in the extract which means \u201cto show support and cheer for someone\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['root'] }], why: 'To \u201croot for\u201d someone is to support them (\u201cI will root for your group\u201d).' },
      index: 4
    },
    {
      chapter: 'Follow That Dream',
      paras: [
        'It starts with a passion for a particular interest, then comes the conviction that it is imperative to realise it. Count the cost in years of effort, financial investments and sacrifice. Then if it is still burning in your blood and you are ready to commit yourself to the task, plunge.',
        'It could be in any field \u2014 sports, science, arts, business, or design. The road may be uphill most of the way and often you are buoyed up only by the knowledge that you are doing what you love best and are doing the right thing. When stamina is running out, the prospect of success will keep you on track.'
      ],
      q1: { q: 'State whether the following is TRUE or FALSE: \u201cThe mother says reaching a world-class standard takes about ten years of focused pursuit.\u201d', a: true, why: 'The letter states one must pursue a subject singularly and intensively for at least ten years.' },
      q2: { q: 'According to the extract, what must one do before plunging?', opts: ['Tell everyone about the dream', 'Count the cost in years of effort, investment and sacrifice', 'Buy expensive equipment', 'Win a competition first'], a: 1, why: 'She advises counting the cost first \u2014 only then plunge if the passion still burns.' },
      q3: { q: 'What often keeps a person going when the road is uphill?', opts: ['Fame and money alone', 'The knowledge that you are doing what you love best', 'Shortcuts and luck', 'Other people\u2019s praise'], a: 1, why: 'Doing what one loves and believes right is the buoy that keeps the dreamer afloat.' },
      q4: { q: 'What does the phrase \u201cplunge\u201d tell us about commitment?', opts: ['It should be gradual and half-hearted', 'It calls for complete, immediate commitment', 'It means to quit early', 'It means to wait for permission'], a: 1, why: 'To plunge is to throw oneself completely into the pursuit.' },
      q5: { q: 'Find a word in the extract which means \u201cabsolutely necessary\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['imperative'] }], why: '\u201cImperative\u201d means necessary (\u201cthe conviction that it is imperative to realise it\u201d).' },
      index: 5
    },
    {
      chapter: 'Follow That Dream',
      paras: [
        'From my own experience, life itself may change a person\u2019s dreams. These hopes and aspirations are no less than the original dream of younger days. To fulfil them you will need to negotiate a path through a maze of hurdles. The dream will take a much longer time to realise, and the people who are participants in your dreamscape would be many more.',
        'For example, publishing this book is a dream I have chased in the last ten years. This was not the dream I had in my youth, but my original dream has changed over the years. I am really quite excited about it. So, I wish at least one of your dreams comes true too.'
      ],
      q1: { q: 'State whether the following is TRUE or FALSE: \u201cThe mother believes that changed dreams are inferior to the dreams of youth.\u201d', a: false, why: 'She says these hopes and aspirations are \u201cno less\u201d than the original dream.' },
      q2: { q: 'What example does the mother give of her own changed dream?', opts: ['Winning the Academy Award', 'Publishing her book after ten years', 'Becoming a teacher', 'Travelling the world'], a: 1, why: 'She chased the dream of publishing her book for the last ten years.' },
      q3: { q: 'What does \u201ca maze of hurdles\u201d suggest about the path to fulfilment?', opts: ['It is short and straight', 'It is complex and full of obstacles', 'It is fenced and guarded', 'It is free of difficulties'], a: 1, why: 'A maze of hurdles is a confusing path full of obstacles.' },
      q4: { q: 'Why will \u201cthe people who are participants in your dreamscape\u201d be \u201cmany more\u201d for a grown-up\u2019s dream?', opts: ['Children have more friends', 'Adult dreams involve families, colleagues and a wider world of helpers', 'Dreams need no helpers', 'Only winners need support'], a: 1, why: 'As life widens, more people \u2014 family, colleagues, supporters \u2014 take part in realising a dream.' },
      q5: { q: 'Find a word in the extract which means \u201cstrong hopes of achieving something\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['aspirations'] }], why: '\u201cAspirations\u201d are strong hopes and ambitions.' },
      index: 5
    }
  ];

  var LETTERS = ['a', 'b', 'c', 'd'];
  var ROMAN = ['i', 'ii', 'iii', 'iv', 'v'];

  var root = document.documentElement;
  try { var savedTheme = localStorage.getItem('c9-lit-q11-theme'); if (savedTheme) root.setAttribute('data-theme', savedTheme); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('c9-lit-q11-theme', next); } catch (e) {}
  });

  var tabsEl = document.getElementById('tabs');
  var extractCard = document.getElementById('extractCard');
  var quiz = document.getElementById('quiz');
  var scorebar = document.getElementById('scorebar');
  var cur = 0;
  var state = EXTRACTS.map(function () { return { sel: {}, text: {}, score: null }; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function whyHtml(q) { return q.why ? '<span class="why">' + esc(q.why) + '</span>' : ''; }
  function rotOff(qi) { return ((qi * 2) + cur) % 4; }
  function ansVal(q, qi) { return (q.a + rotOff(qi)) % 4; }

  function renderTabs() {
    tabsEl.innerHTML = EXTRACTS.map(function (p, i) {
      return '<button type="button" class="tab' + (i === cur ? ' active' : '') + '" data-i="' + i + '">Extract ' + (i + 1) + '</button>';
    }).join('');
  }

  function renderExtract() {
    var ex = EXTRACTS[cur];
    var html = '<span class="section-tag">Section C — Literature · Prose Extract</span>';
    html += '<h2>Extract ' + (cur + 1) + ' of 12</h2>';
    html += '<p class="instructions">Read the extract and answer the five questions. The chapter is revealed only when you check.</p>';
    html += '<div class="extract">' + ex.paras.map(function (t) { return '<p>' + t + '</p>'; }).join('') + '</div>';
    extractCard.innerHTML = html;
  }

  function tfHtml(q, qi) {
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">(' + ROMAN[qi] + ')</span> ' + q.q + '</div>';
    h += '<div class="options">';
    ['TRUE', 'FALSE'].forEach(function (o, oi) {
      var val = oi === 0 ? 'true' : 'false';
      h += '<button type="button" class="opt" data-val="' + val + '"><span>' + o + '</span></button>';
    });
    h += '</div>';
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function mcqHtml(q, qi) {
    var off = rotOff(qi);
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">(' + ROMAN[qi] + ')</span> ' + q.q + '</div>';
    h += '<div class="options">';
    for (var oi = 0; oi < 4; oi++) {
      var src = (oi - off + 4) % 4;
      h += '<button type="button" class="opt" data-val="' + oi + '"><span class="letter">(' + LETTERS[oi] + ')</span><span>' + esc(q.opts[src]) + '</span></button>';
    }
    h += '</div>';
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function vocabHtml(q, qi) {
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">(' + ROMAN[qi] + ')</span> ' + q.q + '</div>';
    h += '<div class="subpart"><input class="word-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type one word"></div>';
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function renderQuiz() {
    var ex = EXTRACTS[cur];
    var html = '<p class="instructions"><strong>Five questions per extract:</strong> (i) tap TRUE or FALSE; (ii)–(iv) tap an option; (v) type one word from the extract.</p>';
    html += tfHtml(ex.q1, 0) + mcqHtml(ex.q2, 1) + mcqHtml(ex.q3, 2) + mcqHtml(ex.q4, 3) + vocabHtml(ex.q5, 4);
    html += '<div class="actions"><button class="btn primary" id="checkBtn" type="button">Check answers</button>' +
      '<button class="btn" id="resetBtn" type="button">Reset this extract</button></div>';
    quiz.innerHTML = html;
    restore();
    updateScore();
  }

  function markTf(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var ans = String(q.a);
    var sel = st.sel[qi];
    qEl.classList.remove('correct', 'wrong');
    qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('correct', 'wrong'); });
    var good = qEl.querySelector('.opt[data-val="' + ans + '"]');
    if (good) good.classList.add('correct');
    if (sel === undefined) {
      if (good) good.classList.remove('correct');
      fb.textContent = 'Not answered yet.';
      fb.className = 'feedback bad';
      return false;
    }
    if (sel !== ans) {
      var bad = qEl.querySelector('.opt[data-val="' + sel + '"]');
      if (bad) { bad.classList.remove('correct'); bad.classList.add('wrong'); }
    }
    var ok = sel === ans;
    fb.innerHTML = esc(ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.') + whyHtml(q);
    fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    qEl.classList.add(ok ? 'correct' : 'wrong');
    return ok;
  }

  function markMcq(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var ans = String(ansVal(q, qi));
    var sel = st.sel[qi];
    qEl.classList.remove('correct', 'wrong');
    qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('correct', 'wrong'); });
    var good = qEl.querySelector('.opt[data-val="' + ans + '"]');
    if (good) good.classList.add('correct');
    if (sel === undefined) {
      if (good) good.classList.remove('correct');
      fb.textContent = 'Not answered yet.';
      fb.className = 'feedback bad';
      return false;
    }
    if (sel !== ans) {
      var bad = qEl.querySelector('.opt[data-val="' + sel + '"]');
      if (bad) { bad.classList.remove('correct'); bad.classList.add('wrong'); }
    }
    var ok = sel === ans;
    fb.innerHTML = esc(ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.') + whyHtml(q);
    fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    qEl.classList.add(ok ? 'correct' : 'wrong');
    return ok;
  }

  function markVocab(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var inp = qEl.querySelector('.word-input');
    var val = (inp.value || '').trim().toLowerCase();
    inp.classList.remove('correct', 'wrong');
    qEl.classList.remove('correct', 'wrong');
    if (!val) {
      fb.textContent = 'Not answered yet (type one word).';
      fb.className = 'feedback bad';
      return false;
    }
    var ok = q.parts[0].a.some(function (x) { return x.toLowerCase() === val; });
    inp.classList.add(ok ? 'correct' : 'wrong');
    var msg = ok ? 'Correct.' : 'Not quite. Correct answer: ' + q.parts[0].a[0] + '.';
    fb.innerHTML = esc(msg) + whyHtml(q);
    fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    qEl.classList.add(ok ? 'correct' : 'wrong');
    return ok;
  }

  function showAnswer(q, qi, kind) {
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return;
    var fb = qEl.querySelector('.feedback');
    if (kind === 'vocab') {
      var inp = qEl.querySelector('.word-input');
      inp.value = q.parts[0].a[0];
      state[cur].text[qi] = q.parts[0].a[0];
      fb.innerHTML = esc('Answer: ' + q.parts[0].a[0] + '.') + whyHtml(q);
    } else if (kind === 'tf') {
      qEl.querySelectorAll('.opt').forEach(function (b) {
        b.classList.toggle('correct', b.getAttribute('data-val') === String(q.a));
      });
      fb.innerHTML = esc('Answer: ' + (q.a ? 'TRUE' : 'FALSE') + '.') + whyHtml(q);
    } else {
      var av = ansVal(q, qi);
      qEl.querySelectorAll('.opt').forEach(function (b) {
        b.classList.toggle('correct', b.getAttribute('data-val') === String(av));
      });
      fb.innerHTML = esc('Answer: (' + LETTERS[av] + ') ' + q.opts[q.a] + '.') + whyHtml(q);
    }
    fb.className = 'feedback info';
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'true'); sb.textContent = 'Hide answer'; }
  }

  function restore() {
    var st = state[cur];
    Object.keys(st.sel).forEach(function (qi) {
      var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
      if (!qEl) return;
      var b = qEl.querySelector('.opt[data-val="' + st.sel[qi] + '"]');
      if (b) b.classList.add('selected');
    });
    Object.keys(st.text).forEach(function (qi) {
      var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
      if (!qEl) return;
      var inp = qEl.querySelector('.word-input');
      if (inp) inp.value = st.text[qi];
    });
    if (st.score !== null) {
      var ex = EXTRACTS[cur];
      markTf(ex.q1, 0); markMcq(ex.q2, 1); markMcq(ex.q3, 2); markMcq(ex.q4, 3); markVocab(ex.q5, 4);
    }
  }

  function updateScore() {
    var st = state[cur];
    var checked = state.filter(function (s) { return s.score !== null; });
    var total = checked.reduce(function (a, s) { return a + s.score; }, 0);
    var head = 'Extract ' + (cur + 1) + ': ' + (st.score === null ? '—' : st.score) + ' / 5';
    var note = checked.length
      ? 'Checked so far: ' + checked.length + ' of ' + EXTRACTS.length + ' extracts · ' + total + ' / ' + (checked.length * 5) + ' overall.'
      : 'Tap an option to choose it; you can change it any time before you check.';
    scorebar.innerHTML = head + '<div class="small">' + note + '</div>';
  }

  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tab');
    if (tab) {
      cur = Number(tab.getAttribute('data-i'));
      renderTabs();
      renderExtract();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    if (ev.target.id === 'checkBtn') {
      var ex = EXTRACTS[cur];
      var score = 0;
      if (markTf(ex.q1, 0)) score++;
      if (markMcq(ex.q2, 1)) score++;
      if (markMcq(ex.q3, 2)) score++;
      if (markMcq(ex.q4, 3)) score++;
      if (markVocab(ex.q5, 4)) score++;
      state[cur].score = score;
      var reveal = extractCard.querySelector('.reveal') || extractCard.appendChild(document.createElement('div'));
      reveal.className = 'reveal shown';
      reveal.textContent = 'This extract is from \u201c' + ex.chapter + '\u201d.';
      updateScore();
      return;
    }

    if (ev.target.id === 'resetBtn') {
      state[cur] = { sel: {}, text: {}, score: null };
      renderExtract();
      renderQuiz();
      updateScore();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    var sb = ev.target.closest('.show-ans');
    if (sb && quiz.contains(sb)) {
      var qBox = sb.closest('.q');
      var qi = Number(qBox.getAttribute('data-qi'));
      var exx = EXTRACTS[cur];
      if (sb.getAttribute('data-shown') === 'true') {
        var fb3 = qBox.querySelector('.feedback');
        fb3.textContent = '';
        fb3.className = 'feedback';
        qBox.classList.remove('correct', 'wrong');
        qBox.querySelectorAll('.opt').forEach(function (b) {
          b.classList.remove('correct', 'wrong');
          var sel = state[cur].sel[qi];
          if (sel !== undefined && b.getAttribute('data-val') === sel) b.classList.add('selected');
        });
        sb.setAttribute('data-shown', 'false');
        sb.textContent = 'Show answer';
      } else {
        if (qi === 4) showAnswer(exx.q5, 4, 'vocab');
        else if (qi === 0) showAnswer(exx.q1, 0, 'tf');
        else if (qi === 1) showAnswer(exx.q2, 1);
        else if (qi === 2) showAnswer(exx.q3, 2);
        else showAnswer(exx.q4, 3);
      }
      return;
    }

    var opt = ev.target.closest('.opt');
    if (opt && quiz.contains(opt)) {
      var qBox2 = opt.closest('.q');
      var qi2 = Number(qBox2.getAttribute('data-qi'));
      qBox2.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected', 'correct', 'wrong'); });
      opt.classList.add('selected');
      state[cur].sel[qi2] = opt.getAttribute('data-val');
      state[cur].score = null;
      qBox2.classList.remove('correct', 'wrong');
      var fb4 = qBox2.querySelector('.feedback');
      fb4.textContent = '';
      fb4.className = 'feedback';
      var sbx = qBox2.querySelector('.show-ans');
      if (sbx) { sbx.setAttribute('data-shown', 'false'); sbx.textContent = 'Show answer'; }
      updateScore();
    }
  });

  document.addEventListener('input', function (ev) {
    var inp = ev.target.closest ? ev.target.closest('.word-input') : null;
    if (!inp || !quiz.contains(inp)) return;
    var qBox = inp.closest('.q');
    var qi = Number(qBox.getAttribute('data-qi'));
    state[cur].text[qi] = inp.value;
    state[cur].score = null;
    inp.classList.remove('correct', 'wrong');
    qBox.classList.remove('correct', 'wrong');
    var fb = qBox.querySelector('.feedback');
    fb.textContent = '';
    fb.className = 'feedback';
    var sbx = qBox.querySelector('.show-ans');
    if (sbx) { sbx.setAttribute('data-shown', 'false'); sbx.textContent = 'Show answer'; }
    updateScore();
  });

  renderTabs();
  renderExtract();
  renderQuiz();
})();
</script>
</body>
</html>
