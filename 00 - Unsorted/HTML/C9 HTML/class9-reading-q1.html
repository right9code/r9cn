    {
      title: 'Architecture That Breathes: India’s Ancient Stepwells',
      paras: [
        'Across the semi-arid plains of Gujarat and Rajasthan, where monsoon rains arrive briefly and vanish into parched soil, medieval builders devised an ingenious answer to seasonal drought. Rather than digging simple vertical shafts, they carved deep, terraced stone chambers into the earth known locally as vavs or baoris. These stepwells were not merely reservoirs for storing water; they were subterranean civic monuments that blended hydrology, architecture and community life.',
        'Every detail of a stepwell followed clear scientific logic. Broad flights of steps allowed residents to reach the water table safely whether the well brimmed after the August rains or sank several storeys deep during the scorching May heat. Narrow stone galleries and carved pavilions shaded the water surface from direct sunlight, sharply reducing evaporation while keeping the lower chambers five to six degrees cooler than the street above.',
        'Equally important was the stepwell’s role as an underground aquifer charger. During heavy downpours, stone channels guided surface runoff through settling basins called silt traps before letting clean rainwater seep into porous rock layers below. Beyond engineering, the cool landings served as egalitarian gathering spaces where travellers rested, women exchanged news, and merchants escaped the midday glare.',
        'During the nineteenth and twentieth centuries, piped water networks and electric borewells gradually pushed traditional stepwells into neglect. Many historic structures dried up as indiscriminate groundwater pumping lowered the water table, while others became choked with rubble and plastic waste. What had sustained towns for centuries was dismissed as an outdated relic.',
        'Today, hydrologists and urban planners are revisiting these forgotten wells as cities confront acute water stress once again. Restored stepwells in Jodhpur, Bundi and Ahmedabad are already harvesting millions of litres of rainwater every monsoon. Their revival offers a vital lesson for modern design: durable technology works in partnership with local geography rather than trying to overpower it.'
      ],
      questions: [
        { t: 'mcq', q: 'What makes traditional stepwells far more than ordinary water tanks?', opts: ['They were built exclusively as royal palaces above ground.', 'They combined scientific water harvesting, passive cooling and shared community space.', 'They pumped river water uphill using steam engines.', 'They prevented monsoon clouds from leaving western India.'], a: 1, why: 'Paragraph 1 explains that stepwells blended hydrology, architecture and community life rather than acting merely as storage tanks.' },
        { t: 'mcq', q: 'Why were stepwells built with broad flights of descending steps?', opts: ['So people could safely reach the water level across both rainy and dry seasons', 'To keep birds from entering the lower galleries', 'Because builders had no tools to dig vertical wells', 'To store grain sacks during winter harvests'], a: 0, why: 'Paragraph 2 states that broad steps let residents reach the water whether it brimmed after rains or dropped deep in May.' },
        { t: 'text', q: 'Replace the underlined phrase in the sentence below with a suitable word from Paragraph 1:<br>“Engineers proposed an <u>inventive and clever</u> solution to harvest rainwater on rocky slopes.” <span class="hint">(one word)</span>', parts: [{ label: 'Word:', a: ['ingenious'] }], why: 'In Paragraph 1, “ingenious” means inventive and clever (“devised an ingenious answer to seasonal drought”).' },
        { t: 'mcq', q: 'How did shaded stone galleries help conserve water inside a stepwell?', opts: ['By freezing the water into solid ice', 'By sealing the well completely against fresh air', 'By mixing salt into the stored rainwater', 'By shielding the surface from direct sunlight and reducing evaporation'], a: 3, why: 'Paragraph 2 notes that shaded galleries and pavilions kept direct sunlight off the water surface, sharply reducing evaporation.' },
        { t: 'mcq', q: 'Why did many historic stepwells fall into disuse during the nineteenth and twentieth centuries?', opts: ['Monsoon rains stopped falling across Rajasthan altogether.', 'Earthquakes destroyed every stone stepwell in western India.', 'Piped water systems and heavy borewell pumping led people to neglect them.', 'Ancient builders had designed them to last only fifty years.'], a: 2, why: 'Paragraph 4 explains that piped water networks and electric borewells pushed stepwells into neglect while lowering groundwater.' },
        { t: 'mcq', q: 'Which central lesson does the revival of stepwells offer modern cities?', opts: ['Lasting engineering works in harmony with local geography rather than against it.', 'Ancient monuments should only be preserved as ticketed museums.', 'Electric borewells can supply unlimited water without recharge.', 'Rainwater harvesting is useful only in small mountain villages.'], a: 0, why: 'Paragraph 5 concludes that durable technology works in partnership with local geography rather than trying to overpower it.' },
        { t: 'text', q: 'Find a word in Paragraph 1 which means “existing, situated, or operating beneath the surface of the earth”: <span class="hint">(one word)</span>', parts: [{ a: ['subterranean'] }], why: 'In Paragraph 1, “subterranean” means beneath the earth’s surface (“subterranean civic monuments”).' },
        { t: 'text', q: 'Fill in the blank: Before rainwater seeped underground, stone channels guided runoff through settling basins called ____________ traps. <span class="hint">(one word)</span>', parts: [{ a: ['silt'] }], why: 'Paragraph 3 states that runoff passed through settling basins called silt traps.' },
        { t: 'tf', q: 'State whether the following statement is TRUE or FALSE: “The lower chambers of a stepwell stayed several degrees cooler than the street above.”', a: true, why: 'Paragraph 2 states that shaded galleries kept the lower chambers five to six degrees cooler than the street above.' },
        { t: 'mcq', q: 'Complete the sentence based on the passage: Indiscriminate groundwater pumping harmed traditional stepwells because it ____________.', opts: ['flooded the upper pavilions with mud', 'turned the carved sandstone into soft clay', 'lowered the underground water table until many wells dried up', 'blocked travellers from resting on the landings'], a: 2, why: 'Paragraph 4 explains that indiscriminate groundwater pumping lowered the water table, causing many stepwells to dry up.' }
      ]
    },
    {
      title: 'The Quiet Science of Biomimicry',
      paras: [
        'For centuries, industrial invention relied on brute force—burning hotter fuels, forging heavier steel, and manufacturing harsh synthetic chemicals to solve mechanical problems. Over the past three decades, however, a quieter discipline called biomimicry has transformed modern engineering. Instead of treating nature merely as a warehouse of raw materials, biomimicry studies living organisms as mentors whose designs have already survived millions of years of evolutionary testing.',
        'One celebrated example comes from Japan’s high-speed rail network. Early bullet trains travelling at nearly three hundred kilometres per hour compressed air inside narrow tunnels, producing thunderous sonic booms each time they exited. Chief engineer Eiji Nakashima, an avid birdwatcher, noticed how a kingfisher plunges from air into denser water with barely a splash. By reshaping the train’s nose after the bird’s streamlined beak, engineers eliminated the noise while cutting electricity use by fifteen percent.',
        'Architecture has benefited just as dramatically from biological observation. In Harare, Zimbabwe, architect Mick Pearce studied tall earthen mounds built by tiny termites that farm temperature-sensitive fungi underground. Although desert-like daytime heat scorches the outside air, termites keep their chambers cool through a network of vents that draw in night air and release rising warm air. Modelled on this principle, Harare’s Eastgate Centre maintains comfortable indoor temperatures without conventional air-conditioning.',
        'Microscopic textures in nature have proved equally instructive. Botanists examining the lotus leaf discovered that its surface is covered with tiny wax-coated bumps that prevent water droplets from spreading flat; instead, rolling beads of rain pick up dust particles and leave the leaf spotless. Material scientists have adapted this self-cleaning geometry to create exterior paints, solar-panel coatings and stain-resistant fabrics.',
        'Biomimicry reminds inventors that efficiency rarely requires waste. Every shell, feather and leaf is built at ambient temperature using local materials that eventually return harmlessly to the soil. As humanity confronts rising energy demands and industrial pollution, observing the living world with humility may prove our smartest path forward.'
      ],
      questions: [
        { t: 'mcq', q: 'How does biomimicry differ from traditional industrial approaches to engineering?', opts: ['It avoids studying living creatures altogether.', 'It relies on burning hotter fuels and heavier steel.', 'It treats living organisms as design mentors rather than mere raw materials.', 'It replaces all modern transport with animal-drawn carts.'], a: 2, why: 'Paragraph 1 explains that biomimicry studies living organisms as mentors tested by evolution instead of treating nature only as raw materials.' },
        { t: 'mcq', q: 'What problem plagued early Japanese bullet trains when exiting narrow tunnels?', opts: ['Compressed air created loud sonic booms at tunnel exits.', 'Their steel wheels melted on wooden tracks.', 'Birds nested inside the passenger carriages.', 'The trains could not travel faster than fifty kilometres per hour.'], a: 0, why: 'Paragraph 2 states that early bullet trains compressed air in narrow tunnels, producing thunderous sonic booms on exit.' },
        { t: 'text', q: 'Replace the underlined phrase in the sentence below with a suitable word from Paragraph 1:<br>“The robotics team tested <u>man-made chemical</u> fibres before switching to natural silk.” <span class="hint">(one word)</span>', parts: [{ label: 'Word:', a: ['synthetic'] }], why: 'In Paragraph 1, “synthetic” means man-made by chemical processes (“harsh synthetic chemicals”).' },
        { t: 'mcq', q: 'How did reshaping the bullet train’s nose like a kingfisher’s beak improve performance?', opts: ['It allowed the train to float across lakes.', 'It eliminated tunnel sonic booms and reduced power consumption by fifteen percent.', 'It doubled the weight of each locomotive.', 'It removed the need for railway tunnels completely.'], a: 1, why: 'Paragraph 2 notes that the beak-inspired nose eliminated the noise and cut electricity use by fifteen percent.' },
        { t: 'mcq', q: 'What inspired Mick Pearce’s passive cooling design for the Eastgate Centre in Harare?', opts: ['Deep ocean coral reefs', 'Wax-coated bumps on lotus leaves', 'Hollow bones of migratory birds', 'Self-ventilating earthen mounds built by termites'], a: 3, why: 'Paragraph 3 describes how Mick Pearce modelled the Eastgate Centre’s ventilation on termite mounds.' },
        { t: 'mcq', q: 'What broader message does the author convey in the final paragraph?', opts: ['Natural designs demonstrate waste-free efficiency that can guide sustainable innovation.', 'Solar panels cannot function without daily chemical washing.', 'Evolution has stopped producing useful adaptations.', 'Modern cities must abandon electricity altogether.'], a: 0, why: 'Paragraph 5 highlights that natural structures are built without waste and that observing nature with humility guides sustainable progress.' },
        { t: 'text', q: 'Find a word in Paragraph 5 which means “relating to the immediate surroundings, such as normal surrounding temperature”: <span class="hint">(one word)</span>', parts: [{ a: ['ambient'] }], why: 'In Paragraph 5, “ambient” refers to the natural temperature of the immediate surroundings (“built at ambient temperature”).' },
        { t: 'text', q: 'Fill in the blank: Tiny wax-coated bumps on the ____________ leaf cause rolling raindrops to carry away dust. <span class="hint">(one word)</span>', parts: [{ a: ['lotus'] }], why: 'Paragraph 4 explains that botanists discovered this self-cleaning texture on the lotus leaf.' },
        { t: 'tf', q: 'State whether the following statement is TRUE or FALSE: “Harare’s Eastgate Centre depends entirely on heavy conventional air-conditioning to stay cool.”', a: false, why: 'Paragraph 3 explicitly states that Eastgate Centre maintains comfortable indoor temperatures without conventional air-conditioning.' },
        { t: 'mcq', q: 'Complete the sentence based on the passage: Material scientists adapted the microscopic geometry of the lotus leaf to develop ____________.', opts: ['underground fungal farms and railway tunnels', 'high-temperature blast furnaces for steel', 'self-cleaning paints, solar-panel coatings and stain-resistant fabrics', 'acoustic barriers for busy airports'], a: 2, why: 'Paragraph 4 states that scientists adapted it to create exterior paints, solar-panel coatings and stain-resistant fabrics.' }

    {
      title: 'When Languages Fall Silent',
      paras: [
        'Linguists estimate that roughly seven thousand languages are spoken across the globe today, yet nearly half of them face extinction before the end of this century. Every fortnight, somewhere in the world, an elderly speaker passes away carrying the final echoes of an unrecorded mother tongue. While some dismiss this shift as a convenient march toward effortless global communication, scholars warn that a vanishing language represents an irreplaceable intellectual loss.',
        'A language is never merely a list of interchangeable labels for familiar objects; it is a living archive of how a community perceives and interacts with its environment. Indigenous coastal fishers in the Andaman Islands, for instance, possess distinct terms describing subtle changes in ocean currents and wind behaviour long before storms strike. Similarly, forest-dwelling communities across the Northeast encode centuries of botanical remedies and seasonal rhythms within everyday proverbs and plant names.',
        'Languages rarely disappear because their speakers suddenly forget words. Instead, decline begins when economic and social pressures persuade younger generations that ancestral speech is a barrier to modern opportunity. When schooling, employment and digital media operate exclusively in dominant regional or global tongues, children gradually stop speaking their grandparents’ language at home, severing an unbroken chain of oral transmission.',
        'Encouragingly, grassroots revival movements are proving that linguistic erosion is not inevitable. University linguists and community elders are collaborating to record folk songs, oral histories and illustrated dictionaries on accessible mobile platforms. In several districts of Odisha and Arunachal Pradesh, multilingual primary classrooms now teach early literacy in a child’s mother tongue before bridging smoothly into state and national languages.',
        'Preserving minority languages does not mean rejecting global connectivity or scientific progress. Multilingual individuals move comfortably between local roots and wider horizons, enriched rather than restricted by knowing more than one tongue. Safeguarding linguistic diversity ultimately protects the full spectrum of human memory, ecological wisdom and cultural dignity.'
      ],
      questions: [
        { t: 'mcq', q: 'Why do scholars view the disappearance of small languages as a serious loss?', opts: ['Because each language holds unique environmental knowledge, memory and worldviews', 'Because learning dominant languages is impossible for adults', 'Because translators will lose their jobs in international airports', 'Because printed paper becomes more expensive when languages decline'], a: 0, why: 'Paragraphs 1 and 2 explain that each language is an irreplaceable archive of how a community understands its environment and history.' },
        { t: 'mcq', q: 'What example does the passage give of ecological knowledge preserved in indigenous languages?', opts: ['Formulas for manufacturing synthetic fertilizers', 'Satellite navigation codes used by cargo ships', 'Distinct terms used by Andaman fishers for subtle ocean currents and winds', 'Ancient recipes for baking wheat bread in Europe'], a: 2, why: 'Paragraph 2 mentions indigenous coastal fishers in the Andaman Islands who have distinct terms for ocean currents and wind shifts.' },
        { t: 'text', q: 'Replace the underlined phrase in the sentence below with a suitable word from Paragraph 1:<br>“The fire destroyed priceless manuscripts that were <u>impossible to substitute if lost</u>.” <span class="hint">(one word)</span>', parts: [{ label: 'Word:', a: ['irreplaceable'] }], why: 'In Paragraph 1, “irreplaceable” means impossible to replace if lost (“an irreplaceable intellectual loss”).' },
        { t: 'mcq', q: 'According to Paragraph 3, what primarily causes a language to decline across generations?', opts: ['Sudden memory loss among elderly speakers', 'Social and economic pressures that make youth abandon ancestral speech for dominant tongues', 'Government bans on writing dictionaries', 'A shortage of musical instruments in rural villages'], a: 1, why: 'Paragraph 3 explains that economic and social pressures lead younger generations to shift exclusively to dominant languages.' },
        { t: 'mcq', q: 'How are schools in parts of Odisha and Arunachal Pradesh supporting language preservation?', opts: ['By banning national and international languages after Class V', 'By replacing classroom teachers with recorded radio broadcasts', 'By testing students only through silent drawing exams', 'By teaching early literacy in the child’s mother tongue before bridging to wider languages'], a: 3, why: 'Paragraph 4 states that multilingual primary classrooms teach early literacy in the mother tongue before bridging to state and national languages.' },
        { t: 'mcq', q: 'What balanced view does the author express in the concluding paragraph?', opts: ['People should speak only one global language for peace.', 'Children become confused if they learn more than one language.', 'Preserving local languages and participating in the modern world can go hand in hand.', 'Digital technology always destroys oral traditions.'], a: 2, why: 'Paragraph 5 argues that preserving minority languages does not reject global connectivity; multilingual speakers thrive in both worlds.' },
        { t: 'text', q: 'Find a word in Paragraph 4 which means “certain to happen; unavoidable”: <span class="hint">(one word)</span>', parts: [{ a: ['inevitable'] }], why: 'In Paragraph 4, “inevitable” means unavoidable (“linguistic erosion is not inevitable”).' },
        { t: 'text', q: 'Fill in the blank: Forest communities encode centuries of ____________ remedies and seasonal rhythms within plant names. <span class="hint">(one word)</span>', parts: [{ a: ['botanical'] }], why: 'Paragraph 2 states that forest-dwelling communities encode centuries of botanical remedies within proverbs and plant names.' },
        { t: 'tf', q: 'State whether the following statement is TRUE or FALSE: “Digital tools are only harming minority languages and cannot be used to preserve them.”', a: false, why: 'Paragraph 4 notes that linguists and elders record folk songs, oral histories and dictionaries on accessible mobile platforms.' },
        { t: 'mcq', q: 'Complete the sentence based on the passage: When children stop speaking their grandparents’ tongue at home, it breaks ____________.', opts: ['an unbroken chain of oral transmission', 'their ability to learn mathematics at school', 'all trade links with neighbouring towns', 'regional weather forecasting stations'], a: 0, why: 'Paragraph 3 states that stopping home use severs “an unbroken chain of oral transmission”.' }
      ]
    },
    {
      title: 'Dark Skies and the Vanishing Night',
      paras: [
        'For nearly all of human history, anyone stepping outdoors on a cloudless night looked up into a glittering river of stars stretching from horizon to horizon. Today, satellite measurements reveal that more than eighty percent of the world’s population lives beneath artificially brightened skies, and most urban teenagers have never glimpsed the Milky Way from their own neighbourhoods. This creeping orange haze above towns and highways—known to astronomers as skyglow—is the most visible sign of light pollution.',
        'Light pollution occurs when streetlamps, billboards, floodlights and glass office towers scatter unshielded light sideways and upward into the atmosphere, where dust and moisture reflect it back down. Unlike chemical spills that linger in soil for decades, wasted light performs no useful work and vanishes the instant a switch is turned off, yet cities burn millions of megawatt-hours every year illuminating empty skies.',
        'The consequences extend far beyond frustrated stargazers. Life on Earth evolved under a reliable daily rhythm of bright daylight and genuine darkness. Migratory songbirds navigating by starlight become disoriented by glowing skyscrapers, exhausting themselves in circles or colliding with glass facades. Along tropical beaches, newly hatched sea turtles instinctively crawl toward the brightest horizon—once the moonlit ocean, now often a coastal highway—with fatal results.',
        'Human health is subtly tied to natural darkness as well. Exposure to harsh blue-white outdoor lamps streaming through bedroom windows suppresses melatonin, the hormone that regulates deep restorative sleep and circadian balance. Researchers increasingly treat excessive night-time glare not as a symbol of metropolitan progress, but as an environmental stressor that disrupts ecosystems and human wellbeing alike.',
        'Fortunately, light pollution is among the easiest environmental problems to reverse. Cities from Flagstaff to parts of Europe have adopted downward-shielded fixtures, motion sensors and warm amber LEDs that keep pavements safe without flooding the heavens. In Ladakh, India’s first Dark Sky Reserve at Hanle now draws astro-tourists while supporting local homestays—proving that protecting the night sky benefits science, wildlife and communities together.'
      ],
      questions: [
        { t: 'mcq', q: 'What is “skyglow” as described in Paragraph 1?', opts: ['A natural aurora seen only near the North Pole', 'Sunlight reflected off snow-covered mountain peaks', 'A rare cloud formation before monsoon thunderstorms', 'The artificial orange haze above towns caused by scattered outdoor lighting'], a: 3, why: 'Paragraph 1 defines skyglow as the creeping orange haze above towns and highways caused by artificial light pollution.' },
        { t: 'mcq', q: 'How does light pollution differ from chemical soil contamination?', opts: ['Wasted light disappears immediately once switched off or properly shielded.', 'Light pollution takes centuries to clean up after lamps are turned off.', 'Light pollution affects only astronomers’ telescopes.', 'Chemical spills use more electricity than streetlamps.'], a: 0, why: 'Paragraph 2 contrasts chemical spills that linger for decades with wasted light that vanishes the instant a switch is turned off.' },
        { t: 'text', q: 'Replace the underlined phrase in the sentence below with a suitable word from Paragraph 3:<br>“Thick fog left the hikers <u>confused about their direction</u> on the mountain trail.” <span class="hint">(one word)</span>', parts: [{ label: 'Word:', a: ['disoriented'] }], why: 'In Paragraph 3, “disoriented” means having lost one’s sense of direction (“become disoriented by glowing skyscrapers”).' },
        { t: 'mcq', q: 'Why do coastal highway lights endanger newly hatched sea turtles?', opts: ['The heat of the lamps dries up ocean tides.', 'Bright light prevents turtle eggs from hatching in the sand.', 'Hatchlings mistake bright artificial roads for the moonlit sea and crawl inland.', 'Sea gulls only hunt under amber streetlamps.'], a: 2, why: 'Paragraph 3 explains that hatchlings instinctively crawl toward the brightest horizon and are drawn toward lit highways instead of the moonlit ocean.' },
        { t: 'mcq', q: 'How does harsh blue-white night lighting affect human health according to Paragraph 4?', opts: ['It strengthens night vision permanently.', 'It suppresses melatonin and disrupts restorative sleep and circadian balance.', 'It increases vitamin production during sleep.', 'It lowers blood pressure instantly.'], a: 1, why: 'Paragraph 4 states that blue-white light suppresses melatonin, which regulates deep restorative sleep and circadian balance.' },
        { t: 'mcq', q: 'What does the success of the Dark Sky Reserve at Hanle in Ladakh demonstrate?', opts: ['Towns must remove all streetlights and remain unsafe at night.', 'Stargazing is possible only in uninhabited polar deserts.', 'Amber LEDs consume twice as much electricity as floodlights.', 'Protecting dark skies can advance astronomy, wildlife safety and local livelihoods together.'], a: 3, why: 'Paragraph 5 notes that Hanle draws astro-tourists and supports homestays, showing dark-sky protection benefits science, wildlife and communities.' },
        { t: 'text', q: 'Find a word in Paragraph 4 which means “restoring health, strength, or wellbeing”: <span class="hint">(one word)</span>', parts: [{ a: ['restorative'] }], why: 'In Paragraph 4, “restorative” means restoring strength and health (“deep restorative sleep”).' },
        { t: 'text', q: 'Fill in the blank: Exposure to harsh night-time glare suppresses ____________, a hormone that regulates sleep. <span class="hint">(one word)</span>', parts: [{ a: ['melatonin'] }], why: 'Paragraph 4 identifies melatonin as the hormone suppressed by blue-white light.' },
        { t: 'tf', q: 'State whether the following statement is TRUE or FALSE: “Downward-shielded warm amber lamps allow streets to stay safe without illuminating empty skies.”', a: true, why: 'Paragraph 5 explains that downward-shielded fixtures and warm amber LEDs keep pavements safe without flooding the heavens.' },
        { t: 'mcq', q: 'Complete the sentence based on the passage: Migratory songbirds suffer in brightly lit cities because they ____________.', opts: ['stop migrating during winter months altogether', 'build nests inside glass billboards', 'rely on starlight to navigate and get confused by glowing skyscrapers', 'feed only during total solar eclipses'], a: 2, why: 'Paragraph 3 explains that migratory songbirds navigating by starlight become disoriented by glowing skyscrapers.' }
      ]
    },
    {
      title: 'Seed Vaults: Safeguarding Tomorrow’s Harvests',
      paras: [
        'Walk through a modern supermarket and the produce shelves appear dazzlingly abundant, stacked high with glossy apples, uniform potatoes and bright yellow bananas. Beneath this visual plenty, however, lies a quiet vulnerability. Over the past century, commercial farming has narrowed its focus onto a handful of high-yielding crop varieties bred for rapid growth, shelf life and uniform size, while thousands of local heirloom strains have vanished from farmers’ fields.',
        'Genetic uniformity carries serious risks. When millions of hectares are planted with nearly identical seeds, a single unfamiliar fungus, insect pest or prolonged heatwave can sweep across entire regions unchecked. History offered a stark warning during the nineteenth-century Irish potato famine, when reliance on one susceptible potato variety allowed blight to destroy a nation’s staple harvest.',
        'Wild crop relatives and traditional landraces—varieties shaped over generations by smallholder farmers—often hold the exact genetic keys needed for survival. A modest village millet in Bundelkhand may yield smaller harvests than hybrid grain in ideal weather, yet thrive through blistering drought; a coastal paddy strain from the Sundarbans can tolerate salty floodwaters that wither ordinary rice. Losing these seeds erases traits that laboratories cannot invent from scratch.',
        'To prevent irreversible loss, scientists and farming communities have built a two-tiered safety net. Deep inside an Arctic mountain on the Norwegian island of Svalbard, a permafrost vault stores duplicate packets of over one million seed samples from around the world at minus eighteen degrees Celsius. Closer to the soil, community seed banks across states like Telangana, Maharashtra and Uttarakhand keep native varieties alive by lending seeds to farmers each sowing season and collecting fresh harvests in return.',
        'Both approaches play complementary roles: frozen vaults guard against global catastrophe, while village seed banks allow crops to keep adapting in living soil year after year. Together, they remind us that tomorrow’s food security depends not merely on producing bigger harvests today, but on keeping our agricultural heritage wonderfully diverse.'
      ],
      questions: [
        { t: 'mcq', q: 'What hidden weakness lies behind the apparent abundance of modern supermarket produce?', opts: ['Commercial agriculture depends on very few uniform crop varieties while thousands of local strains have vanished.', 'Supermarkets refuse to sell fruits grown on farms.', 'Modern vegetables contain no vitamins at all.', 'Farmers have stopped using irrigation canals across the world.'], a: 0, why: 'Paragraph 1 explains that beneath supermarket plenty lies vulnerability because farming relies on a handful of uniform varieties.' },
        { t: 'mcq', q: 'Why is planting genetically identical crops across vast areas dangerous?', opts: ['Uniform crops refuse to grow in sunlight.', 'Identical seeds require harvesting by hand at midnight.', 'Consumers dislike fruits of uniform size.', 'A single disease, pest or heatwave can wipe out harvests across whole regions.'], a: 3, why: 'Paragraph 2 states that when fields share nearly identical genetics, one fungus, pest or heatwave can sweep across entire regions.' },
        { t: 'text', q: 'Replace the underlined phrase in the sentence below with a suitable word from Paragraph 2:<br>“Unvaccinated saplings were <u>easily harmed or affected</u> by the fungal infection.” <span class="hint">(one word)</span>', parts: [{ label: 'Word:', a: ['susceptible'] }], why: 'In Paragraph 2, “susceptible” means easily harmed or vulnerable (“one susceptible potato variety”).' },
        { t: 'mcq', q: 'What valuable advantage do traditional landraces like Sundarbans paddy or Bundelkhand millet offer?', opts: ['They grow twice as tall as coconut palms.', 'They possess resilient traits such as tolerance to salty floodwaters or severe drought.', 'They never require soil or sunlight to germinate.', 'They taste identical to imported apples.'], a: 1, why: 'Paragraph 3 highlights that Bundelkhand millet endures drought and Sundarbans paddy tolerates salty floodwaters.' },
        { t: 'mcq', q: 'How do village community seed banks operate differently from the Arctic Svalbard vault?', opts: ['They freeze seeds in liquid nitrogen inside underground caves.', 'They export all local harvests to Norway every winter.', 'They keep native seeds circulating and adapting in living soil through seasonal farmer lending.', 'They store only ornamental garden flowers.'], a: 2, why: 'Paragraphs 4 and 5 explain that community seed banks lend seeds each sowing season so crops keep adapting in living soil.' },
        { t: 'mcq', q: 'Which central conclusion does the passage draw about future food security?', opts: ['Frozen Arctic vaults make local farmers unnecessary.', 'Laboratories can easily manufacture new plant genes without wild seeds.', 'Traditional grains should never be planted outside museums.', 'True food security requires preserving diverse crop varieties alongside productive farming.'], a: 3, why: 'Paragraph 5 concludes that tomorrow’s food security depends not just on bigger harvests today, but on keeping agricultural heritage diverse.' },
        { t: 'text', q: 'Find a word in Paragraph 5 which means “combining in such a way as to enhance or complete each other”: <span class="hint">(one word)</span>', parts: [{ a: ['complementary'] }], why: 'In Paragraph 5, “complementary” describes two different approaches that complete and strengthen each other (“play complementary roles”).' },
        { t: 'text', q: 'Fill in the blank: Inside the Arctic mountain on ____________, seed samples are stored in permafrost at minus eighteen degrees Celsius. <span class="hint">(one word)</span>', parts: [{ a: ['svalbard'] }], why: 'Paragraph 4 states that the permafrost vault is located on the Norwegian island of Svalbard.' },
        { t: 'tf', q: 'State whether the following statement is TRUE or FALSE: “Modern laboratories can easily recreate lost evolutionary crop traits from scratch once native seeds go extinct.”', a: false, why: 'Paragraph 3 states explicitly that losing these seeds erases traits that laboratories cannot invent from scratch.' },
        { t: 'mcq', q: 'Complete the sentence based on the passage: The nineteenth-century Irish potato famine demonstrated the danger of ____________.', opts: ['relying heavily on a single disease-prone crop variety', 'storing seeds inside cold mountain vaults', 'exchanging native millets among village farmers', 'growing salt-tolerant rice near river deltas'], a: 0, why: 'Paragraph 2 cites the Irish potato famine as a stark warning of relying on one susceptible potato variety.' }
      ]
    }
  ];

  var ROMAN = ['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii', 'viii', 'ix', 'x'];
  var LETTERS = ['a', 'b', 'c', 'd'];

  var root = document.documentElement;
  try { var savedTheme = localStorage.getItem('c9-reading-q1-theme'); if (savedTheme) root.setAttribute('data-theme', savedTheme); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('c9-reading-q1-theme', next); } catch (e) {}
  });

  var tabsEl = document.getElementById('tabs');
  var passageCard = document.getElementById('passageCard');
  var quiz = document.getElementById('quiz');
  var scorebar = document.getElementById('scorebar');
  var cur = 0;
  var state = PASSAGES.map(function () { return { sel: {}, text: {}, res: {}, score: null }; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function norm(s) { return (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' '); }
  function whyHtml(q) { return q.why ? '<span class="why">' + esc(q.why) + '</span>' : ''; }

  function renderTabs() {
    tabsEl.innerHTML = PASSAGES.map(function (p, i) {
      return '<button type="button" class="tab' + (i === cur ? ' active' : '') + '" data-i="' + i + '">Passage ' + (i + 1) + '</button>';
    }).join('');
  }

  function renderPassage() {
    var p = PASSAGES[cur];
    var html = '<span class="section-tag">Section A — Reading Skills</span>';
    html += '<h2>' + (cur + 1) + '. ' + esc(p.title) + '</h2>';
    html += '<div class="passage">' + p.paras.map(function (t) { return '<p>' + t + '</p>'; }).join('') + '</div>';
    passageCard.innerHTML = html;
  }

  function questionHtml(q, qi) {
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">(' + ROMAN[qi] + ')</span> ' + q.q + '</div>';
    if (q.t === 'mcq' || q.t === 'tf') {
      var opts = q.t === 'tf' ? ['TRUE', 'FALSE'] : q.opts;
      h += '<div class="options">';
      opts.forEach(function (o, oi) {
        var val = q.t === 'tf' ? (oi === 0 ? 'true' : 'false') : String(oi);
        h += '<button type="button" class="opt" data-val="' + val + '">' +
          (q.t === 'tf' ? '' : '<span class="letter">(' + LETTERS[oi] + ')</span>') +
          '<span>' + esc(o) + '</span></button>';
      });
      h += '</div>';
    } else {
      q.parts.forEach(function (part, pi) {
        var id = 'q' + qi + 'p' + pi;
        h += '<div class="subpart">';
        if (part.label) h += '<label for="' + id + '">' + esc(part.label) + '</label>';
        h += '<input id="' + id + '" class="word-input" data-part="' + pi + '" type="text" inputmode="' +
          (part.num ? 'numeric' : 'text') + '" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type one word">';
        h += '</div>';
      });
    }
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function renderQuiz() {
    var p = PASSAGES[cur];
    var html = '<p class="instructions"><strong>Answer the questions.</strong> Tap an option where choices are given; type <strong>one word</strong> where the answer is a word from the passage (capital or small letters both accepted). Use <strong>Check answers</strong> for feedback on all ten, or <strong>Show answer</strong> on a single question to see the model answer and why.</p>';
    html += p.questions.map(questionHtml).join('');
    html += '<div class="actions"><button class="btn primary" id="checkBtn" type="button">Check answers</button>' +
      '<button class="btn" id="resetBtn" type="button">Reset this passage</button></div>';
    quiz.innerHTML = html;
    restore();
    updateScore();
  }

  function resetShow(qEl) {
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'false'); sb.textContent = 'Show answer'; }
  }

  function mark(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var ok = false;
    qEl.classList.remove('correct', 'wrong');
    if (q.t === 'mcq' || q.t === 'tf') {
      var ans = String(q.a);
      var sel = st.sel[qi];
      qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('correct', 'wrong'); });
      var good = qEl.querySelector('.opt[data-val="' + ans + '"]');
      if (good) good.classList.add('correct');
      if (sel === undefined) {
        if (good) good.classList.remove('correct');
        fb.textContent = 'Not answered yet.';
        fb.className = 'feedback bad';
        return false;
      }
      if (sel !== ans) {
        var bad = qEl.querySelector('.opt[data-val="' + sel + '"]');
        if (bad) { bad.classList.remove('correct'); bad.classList.add('wrong'); }
      }
      ok = sel === ans;
      fb.innerHTML = esc(ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.') + whyHtml(q);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    } else {
      var inputs = qEl.querySelectorAll('.word-input');
      var filled = true, goodCount = 0;
      q.parts.forEach(function (part, pi) {
        var inp = inputs[pi];
        var val = norm((st.text[qi] || [])[pi] || '');
        if (!inp) return;
        inp.classList.remove('correct', 'wrong');
        if (!val) { filled = false; return; }
        if (part.a.some(function (x) { return norm(x) === val; })) { goodCount++; inp.classList.add('correct'); }
        else inp.classList.add('wrong');
      });
      if (!filled) {
        fb.textContent = q.parts.length > 1 ? 'Not answered yet (fill in both parts, one word each).' : 'Not answered yet (type one word).';
        fb.className = 'feedback bad';
        return false;
      }
      ok = goodCount === q.parts.length;
      var msg;
      if (ok) msg = 'Correct.';
      else if (q.parts.length > 1) msg = 'Not quite. Correct answers: ' + q.parts.map(function (part, pi) { return '(' + LETTERS[pi] + ') ' + part.a[0]; }).join(', ') + '.';
      else msg = 'Not quite. Correct answer: ' + q.parts[0].a[0] + '.';
      fb.innerHTML = esc(msg) + whyHtml(q);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    }
    qEl.classList.add(ok ? 'correct' : 'wrong');
    st.res[qi] = ok;
    return ok;
  }

  function showAnswer(q, qi) {
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return;
    var fb = qEl.querySelector('.feedback');
    if (q.t === 'mcq' || q.t === 'tf') {
      var ans = String(q.a);
      qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.toggle('correct', b.getAttribute('data-val') === ans); });
      var label = q.t === 'tf' ? (q.a ? 'TRUE' : 'FALSE') : '(' + LETTERS[q.a] + ') ' + q.opts[q.a];
      fb.innerHTML = esc('Answer: ' + label + '.') + whyHtml(q);
    } else {
      var txt = q.parts.map(function (part, pi) {
        return q.parts.length > 1 ? '(' + LETTERS[pi] + ') ' + part.a[0] : part.a[0];
      }).join('; ');
      fb.innerHTML = esc('Answer: ' + txt + '.') + whyHtml(q);
    }
    fb.className = 'feedback info';
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'true'); sb.textContent = 'Hide answer'; }
  }

  function restore() {
    var st = state[cur];
    PASSAGES[cur].questions.forEach(function (q, qi) {
      var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
      if (!qEl) return;
      if (st.sel[qi] !== undefined) {
        var b = qEl.querySelector('.opt[data-val="' + st.sel[qi] + '"]');
        if (b) b.classList.add('selected');
      }
      if (st.text[qi]) {
        var inputs = qEl.querySelectorAll('.word-input');
        st.text[qi].forEach(function (v, pi) { if (inputs[pi]) inputs[pi].value = v; });
      }
    });
    if (st.score !== null) {
      PASSAGES[cur].questions.forEach(function (q, qi) { mark(q, qi); });
    }
  }

  function updateScore() {
    var st = state[cur];
    var checked = state.filter(function (s) { return s.score !== null; });
    var total = checked.reduce(function (a, s) { return a + s.score; }, 0);
    var head = 'Passage ' + (cur + 1) + ': ' + (st.score === null ? '—' : st.score) + ' / ' + PASSAGES[cur].questions.length;
    var note = checked.length
      ? 'Checked so far: ' + checked.length + ' of ' + PASSAGES.length + ' passages · ' + total + ' / ' + (checked.length * PASSAGES[cur].questions.length) + ' correct.'
      : 'Tap an option to choose it; you can change it any time before you check.';
    scorebar.innerHTML = head + '<div class="small">' + note + '</div>';
  }

  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tab');
    if (tab) {
      cur = Number(tab.getAttribute('data-i'));
      renderTabs();
      renderPassage();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    if (ev.target.id === 'checkBtn') {
      var score = 0;
      PASSAGES[cur].questions.forEach(function (q, qi) { if (mark(q, qi)) score++; });
      state[cur].score = score;
      updateScore();
      return;
    }

    if (ev.target.id === 'resetBtn') {
      state[cur] = { sel: {}, text: {}, res: {}, score: null };
      renderQuiz();
      updateScore();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    var sb = ev.target.closest('.show-ans');
    if (sb && quiz.contains(sb)) {
      var qEl = sb.closest('.q');
      var qi = Number(qEl.getAttribute('data-qi'));
      if (sb.getAttribute('data-shown') === 'true') {
        var fb = qEl.querySelector('.feedback');
        fb.textContent = '';
        fb.className = 'feedback';
        qEl.classList.remove('correct', 'wrong');
        qEl.querySelectorAll('.opt').forEach(function (b) {
          b.classList.remove('correct', 'wrong');
          if (state[cur].sel[qi] !== undefined && b.getAttribute('data-val') === state[cur].sel[qi]) b.classList.add('selected');
        });
        resetShow(qEl);
      } else {
        showAnswer(PASSAGES[cur].questions[qi], qi);
      }
      return;
    }

    var opt = ev.target.closest('.opt');
    if (opt && quiz.contains(opt)) {
      var qBox = opt.closest('.q');
      var qi2 = Number(qBox.getAttribute('data-qi'));
      qBox.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected', 'correct', 'wrong'); });
      opt.classList.add('selected');
      state[cur].sel[qi2] = opt.getAttribute('data-val');
      delete state[cur].res[qi2];
      state[cur].score = null;
      qBox.classList.remove('correct', 'wrong');
      var fb2 = qBox.querySelector('.feedback');
      fb2.textContent = '';
      fb2.className = 'feedback';
      resetShow(qBox);
      updateScore();
    }
  });

  document.addEventListener('input', function (ev) {
    var inp = ev.target.closest ? ev.target.closest('.word-input') : null;
    if (!inp || !quiz.contains(inp)) return;
    var qBox = inp.closest('.q');
    var qi = Number(qBox.getAttribute('data-qi'));
    var pi = Number(inp.getAttribute('data-part'));
    var st = state[cur];
    st.text[qi] = st.text[qi] || [];
    st.text[qi][pi] = inp.value;
    delete st.res[qi];
    st.score = null;
    inp.classList.remove('correct', 'wrong');
    qBox.classList.remove('correct', 'wrong');
    var fb = qBox.querySelector('.feedback');
    fb.textContent = '';
    fb.className = 'feedback';
    resetShow(qBox);
    updateScore();
  });

  renderTabs();
  renderPassage();
  renderQuiz();
})();
</script>
</body>
</html>
