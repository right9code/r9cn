        { q: 'Either my father or my mother __________ coming to the meeting.', opts: ['is', 'are', 'were', 'have'], a: 0, why: 'With either…or, the verb agrees with the nearer subject (my mother → is).' },
        { q: 'Ravi and Rahul __________ want to see the play.', opts: ["doesn't", "don't", "hasn't", "isn't"], a: 1, why: 'A plural compound subject takes do not.' },

        { q: 'One of my friends __________ going to London on a trip.', opts: ['is', 'are', 'were', 'have'], a: 0, why: 'The verb agrees with “one” (singular), not with the plural in the of-phrase.' },

        { q: 'Either answer __________ acceptable.', opts: ['is', 'are', 'were', 'have'], a: 0, why: 'Either used as a pronoun for two items is singular.' },
        { q: 'Everyone of those books __________ fiction.', opts: ['is', 'are', 'were', 'have'], a: 0, why: 'Everyone is singular, even though “of those books” follows it.' },

        { q: 'This is one of the best pictures that __________ been released this year.', opts: ['has', 'have', 'is', 'was'], a: 1, why: 'The relative pronoun “that” refers to “pictures” (plural), so the verb in the clause is plural.' },

        { q: 'Two-thirds of the city __________ in ruins.', opts: ['is', 'are', 'were', 'have'], a: 0, why: 'Fractions of an uncountable/mass idea like “the city” take a singular verb.' },

        { q: 'A bouquet of yellow roses __________ colour and fragrance to the room.', opts: ['lend', 'lends', 'lending', 'have lent'], a: 1, why: 'The verb agrees with the singular head noun “a bouquet”, not with “roses”.' },

        { q: 'My grandfather __________ take a long brisk walk every morning before breakfast.', opts: ['used to', 'ought to', 'must', 'is used to'], a: 0, why: 'A discontinued past routine is expressed by used to + verb (I).' },

        { q: 'The sky is clear, but weather forecasts say it __________ shower lightly in the evening.', opts: ['must', 'might', 'will', 'shall'], a: 1, why: 'A weak or remote possibility is expressed by might.' },
        { q: 'Which sentence expresses a polite request?', opts: ['Will you do this work now?', 'Would you mind helping me with this suitcase?', 'Must you come here today?', 'Shall you open the door?'], a: 1, why: '“Would you mind + -ing” is the politest request form among these.' },
        { q: 'Since you have already paid the complete registration fee, you __________ pay anything extra.', opts: ['must not', 'need not', 'cannot', 'ought not'], a: 1, why: 'The absence of obligation is expressed by need not.' },

        { q: 'Patient: “__________ I attend my practical exam tomorrow morning, Doctor?”', opts: ['May', 'Must', 'Should', 'Shall'], a: 0, why: 'Asking permission takes May (or Can) I…' },

        { q: '“__________ the members of the committee agreed to the proposed amendments.”', opts: ['Each', 'Every', 'All', 'Either'], a: 2, why: 'All is used before a plural countable noun with the: All the members.' },

        { q: 'Mother said to Varun, “Why are you sitting idle in your room?”', opts: ['Mother asked Varun why he was sitting idle in his room.', 'Mother asked Varun why was he sitting idle in his room.', 'Mother told Varun why he is sitting idle in his room.', 'Mother requested Varun that why he sat idle in his room.'], a: 0, why: 'Wh-questions keep the wh-word with assertive order (subject + verb), not interrogative inversion.' },
        { q: 'Priya said, “I have been practising classical dance since morning.”', opts: ['Priya said that she had been practising classical dance since morning.', 'Priya said that she has been practising classical dance since morning.', 'Priya said that she was practising classical dance since morning.', 'Priya said that she practised classical dance since morning.'], a: 0, why: 'Present Perfect Continuous becomes Past Perfect Continuous with a past reporting verb.' },
        { q: 'The librarian said to the students, “Do not make noise in the reading hall.”', opts: ['The librarian ordered the students not to make noise in the reading hall.', 'The librarian told the students do not make noise in the reading hall.', 'The librarian asked the students if they made noise in the reading hall.', 'The librarian requested the students that they should make noise in the reading hall.'], a: 0, why: 'Negative commands become ordered + object + not to + verb (I).' },
        { q: 'Ananya said, “Hurrah! My elder sister has cleared the civil services exam!”', opts: ['Ananya exclaimed with joy that her elder sister had cleared the civil services exam.', 'Ananya said with joy that her elder sister has cleared the civil services exam.', 'Ananya asked joyfully if her elder sister had cleared the civil services exam.', 'Ananya exclaimed with sorrow that her elder sister had cleared the civil services exam.'], a: 0, why: 'Hurrah expresses joy → exclaimed with joy; present perfect → past perfect.' },
        { q: 'He said, “I will definitely help you tomorrow.”', opts: ['He said that he would definitely help me the next day.', 'He said that he will definitely help me tomorrow.', 'He said that he would definitely helped me the next day.', 'He told that he would definitely help me tomorrow.'], a: 0, why: 'Will becomes would and tomorrow becomes the next day with a past reporting verb.' },
        { q: 'The doctor said to the patient, “Take these medicines regularly for two weeks.”', opts: ['The doctor advised the patient to take those medicines regularly for two weeks.', 'The doctor advised the patient take those medicines regularly for two weeks.', 'The doctor asked the patient if he took those medicines regularly for two weeks.', 'The doctor said the patient to take this medicines regularly for two weeks.'], a: 0, why: 'Advice becomes advised + object + to + verb (I); these becomes those.' },
        { q: 'Rohan said, “I am reading an interesting novel.”', opts: ['Rohan said that he was reading an interesting novel.', 'Rohan said that he is reading an interesting novel.', 'Rohan said that he had been read an interesting novel.', 'Rohan asked that he was reading an interesting novel.'], a: 0, why: 'Past reporting verb + present continuous → was reading.' },
        { q: 'The teacher said, “The sun is a huge ball of burning gases.”', opts: ['The teacher said that the sun was a huge ball of burning gases.', 'The teacher said that the sun is a huge ball of burning gases.', 'The teacher told that the sun had been a huge ball of burning gases.', 'The teacher asked if the sun is a huge ball of burning gases.'], a: 1, why: 'Universal truths keep their tense even after a past reporting verb.' },
        { q: 'Kavita said to me, “Can you lend me your dictionary for an hour?”', opts: ['Kavita asked me that if I could lend her my dictionary for an hour.', 'Kavita told me if I can lend her my dictionary for an hour.', 'Kavita asked me if I could lend her my dictionary for an hour.', 'Kavita requested me that I could lend her my dictionary for an hour.'], a: 2, why: 'Requests with can become asked + if + could (with pronoun changes).' },
        { q: 'The inspector said to the suspect, “Where were you at 9:00 PM yesterday?”', opts: ['The inspector asked the suspect where he was at 9:00 PM the previous day.', 'The inspector asked the suspect where had he been at 9:00 PM yesterday.', 'The inspector asked the suspect where he had been at 9:00 PM the previous day.', 'The inspector enquired the suspect where he was at 9:00 PM the previous day.'], a: 2, why: 'Simple past → past perfect, with assertive order and yesterday → the previous day.' },
        { q: 'Father noticed Aryan looking stressed and asked him __________. (choose the FIRST blank)', opts: ['why he was looking so worried', 'why was he looking so worried', 'why is he looking so worried', 'that why he looked so worried'], a: 0, why: 'Reported wh-questions keep the wh-word and use assertive (subject + verb) order.' },
        { q: 'Aryan replied that __________ his mathematics pre-board examination the next day. (choose the SECOND blank)', opts: ['he had', 'he has', 'he was having', 'he would have'], a: 0, why: 'Present simple “I have” becomes Past Perfect “he had” with a past reporting verb.' },
        { q: 'Aryan replied that he had his examination the next day and that __________ geometry yet. (choose the THIRD blank)', opts: ['he had not revised', 'he has not revised', 'he did not revise', 'he would not revise'], a: 0, why: 'Present Perfect “I haven’t revised” becomes Past Perfect “he had not revised”.' },
        { q: 'Father advised him not to panic and instructed him __________ on the key formulas. (choose the FOURTH blank)', opts: ['to focus', 'focusing', 'that he focus', 'for focusing'], a: 0, why: 'Imperatives are reported with instructed/advised + object + to + verb (I).' },
        { q: 'Father instructed him to focus on the key formulas and __________ two practice theorems that night. (choose the FIFTH blank)', opts: ['to solve', 'solving', 'that he solved', 'for solving'], a: 0, why: 'A second instruction keeps the same to + verb (I) structure.' },
        { q: 'He said, “Alas! I have lost my wallet.”', opts: ['He exclaimed with sorrow that he had lost his wallet.', 'He exclaimed with sorrow that he has lost his wallet.', 'He exclaimed with joy that he had lost his wallet.', 'He said with sorrow that he loses his wallet.'], a: 0, why: 'Alas expresses sorrow → exclaimed with sorrow; present perfect → past perfect.' }
      ]
    }
  ];

  var LETTERS = ['a', 'b', 'c', 'd'];

  var root = document.documentElement;
  try { var savedTheme = localStorage.getItem('c9-grammar-q3-theme'); if (savedTheme) root.setAttribute('data-theme', savedTheme); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('c9-grammar-q3-theme', next); } catch (e) {}
  });

  var tabsEl = document.getElementById('tabs');
  var topicCard = document.getElementById('topicCard');
  var quiz = document.getElementById('quiz');
  var scorebar = document.getElementById('scorebar');
  var cur = 0;
  var state = TOPICS.map(function () { return { sel: {}, res: {}, score: null }; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function whyHtml(q) { return q.why ? '<span class="why">' + esc(q.why) + '</span>' : ''; }

  // Deterministic rotation so correct answers are not always (a) on screen.
  function rotOff(qi) { return ((qi * 3) + cur) % 4; }
  function ansVal(q, qi) { return (q.a + rotOff(qi)) % 4; }

  function renderTabs() {
    tabsEl.innerHTML = TOPICS.map(function (t, i) {
      return '<button type="button" class="tab' + (i === cur ? ' active' : '') + '" data-i="' + i + '">' + esc(t.name) + '</button>';
    }).join('');
  }

  function renderTopic() {
    var t = TOPICS[cur];
    var html = '<span class="section-tag">Section B — Grammar</span>';
    html += '<h2>' + esc(t.name) + '</h2>';
    html += '<p class="instructions">' + esc(t.source) + ' · ' + t.questions.length + ' questions. Fill in the blank by tapping the correct option, then <strong>Check answers</strong>.</p>';
    topicCard.innerHTML = html;
  }

  function questionHtml(q, qi) {
    var off = rotOff(qi);
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">' + (qi + 1) + '.</span> ' + q.q + '</div>';
    h += '<div class="options">';
    for (var oi = 0; oi < 4; oi++) {
      var src = (oi - off + 4) % 4;
      h += '<button type="button" class="opt" data-val="' + oi + '"><span class="letter">(' + LETTERS[oi] + ')</span><span>' + esc(q.opts[src]) + '</span></button>';
    }
    h += '</div>';
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function renderQuiz() {
    var t = TOPICS[cur];
    quiz.innerHTML = t.questions.map(questionHtml).join('') +
      '<div class="actions"><button class="btn primary" id="checkBtn" type="button">Check answers</button>' +
      '<button class="btn" id="resetBtn" type="button">Reset this topic</button></div>';
    restore();
    updateScore();
  }

  function mark(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var ans = String(ansVal(q, qi));
    var sel = st.sel[qi];
    qEl.classList.remove('correct', 'wrong');
    qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('correct', 'wrong'); });
    var good = qEl.querySelector('.opt[data-val="' + ans + '"]');
    if (good) good.classList.add('correct');
    if (sel === undefined) {
      if (good) good.classList.remove('correct');
      fb.textContent = 'Not answered yet.';
      fb.className = 'feedback bad';
      return false;
    }
    if (sel !== ans) {
      var bad = qEl.querySelector('.opt[data-val="' + sel + '"]');
      if (bad) { bad.classList.remove('correct'); bad.classList.add('wrong'); }
    }
    var ok = sel === ans;
    fb.innerHTML = esc(ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.') + whyHtml(q);
    fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    qEl.classList.add(ok ? 'correct' : 'wrong');
    st.res[qi] = ok;
    return ok;
  }

  function showAnswer(q, qi) {
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return;
    var fb = qEl.querySelector('.feedback');
    var av = ansVal(q, qi);
    qEl.querySelectorAll('.opt').forEach(function (b) {
      b.classList.toggle('correct', b.getAttribute('data-val') === String(av));
    });
    fb.innerHTML = esc('Answer: (' + LETTERS[av] + ') ' + q.opts[q.a] + '.') + whyHtml(q);
    fb.className = 'feedback info';
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'true'); sb.textContent = 'Hide answer'; }
  }

  function restore() {
    var st = state[cur];
    TOPICS[cur].questions.forEach(function (q, qi) {
      var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
      if (!qEl) return;
      if (st.sel[qi] !== undefined) {
        var b = qEl.querySelector('.opt[data-val="' + st.sel[qi] + '"]');
        if (b) b.classList.add('selected');
      }
    });
    if (st.score !== null) {
      TOPICS[cur].questions.forEach(function (q, qi) { mark(q, qi); });
    }
  }

  function updateScore() {
    var st = state[cur];
    var checked = state.filter(function (s) { return s.score !== null; });
    var total = checked.reduce(function (a, s) { return a + s.score; }, 0);
    var head = esc(TOPICS[cur].name) + ': ' + (st.score === null ? '—' : st.score) + ' / ' + TOPICS[cur].questions.length;
    var note = checked.length
      ? 'Checked so far: ' + checked.length + ' of ' + TOPICS.length + ' topics · ' + total + ' / ' + (checked.reduce(function (a, s, i) { return a + TOPICS[i].questions.length; }, 0)) + ' correct.'
      : 'Tap an option to choose it; you can change it any time before you check.';
    scorebar.innerHTML = head + '<div class="small">' + note + '</div>';
  }

  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tab');
    if (tab) {
      cur = Number(tab.getAttribute('data-i'));
      renderTabs();
      renderTopic();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    if (ev.target.id === 'checkBtn') {
      var score = 0;
      TOPICS[cur].questions.forEach(function (q, qi) { if (mark(q, qi)) score++; });
      state[cur].score = score;
      updateScore();
      return;
    }

    if (ev.target.id === 'resetBtn') {
      state[cur] = { sel: {}, res: {}, score: null };
      renderQuiz();
      updateScore();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    var sb = ev.target.closest('.show-ans');
    if (sb && quiz.contains(sb)) {
      var qEl = sb.closest('.q');
      var qi = Number(qEl.getAttribute('data-qi'));
      if (sb.getAttribute('data-shown') === 'true') {
        var fb = qEl.querySelector('.feedback');
        fb.textContent = '';
        fb.className = 'feedback';
        qEl.classList.remove('correct', 'wrong');
        qEl.querySelectorAll('.opt').forEach(function (b) {
          b.classList.remove('correct', 'wrong');
          if (state[cur].sel[qi] !== undefined && b.getAttribute('data-val') === state[cur].sel[qi]) b.classList.add('selected');
        });
        sb.setAttribute('data-shown', 'false');
        sb.textContent = 'Show answer';
      } else {
        showAnswer(TOPICS[cur].questions[qi], qi);
      }
      return;
    }

    var opt = ev.target.closest('.opt');
    if (opt && quiz.contains(opt)) {
      var qBox = opt.closest('.q');
      var qi2 = Number(qBox.getAttribute('data-qi'));
      qBox.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected', 'correct', 'wrong'); });
      opt.classList.add('selected');
      state[cur].sel[qi2] = opt.getAttribute('data-val');
      delete state[cur].res[qi2];
      state[cur].score = null;
      qBox.classList.remove('correct', 'wrong');
      var fb2 = qBox.querySelector('.feedback');
      fb2.textContent = '';
      fb2.className = 'feedback';
      var sbx = qBox.querySelector('.show-ans');
      if (sbx) { sbx.setAttribute('data-shown', 'false'); sbx.textContent = 'Show answer'; }
      updateScore();
    }
  });

  renderTabs();
  renderTopic();
  renderQuiz();
})();
</script>
</body>
</html>
