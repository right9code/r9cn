<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Class IX Grammar — Q5 Transform the Sentences</title>
<style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eef2f7;
  --text: #1f2937;
  --muted: #5f6b7a;
  --border: #d8dee8;
  --primary: #2563eb;
  --primary-soft: #dbeafe;
  --success: #15803d;
  --success-soft: #dcfce7;
  --danger: #b91c1c;
  --danger-soft: #fee2e2;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #111827;
  --surface-2: #1f2937;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --border: #334155;
  --primary: #60a5fa;
  --primary-soft: #1e3a5f;
  --success: #4ade80;
  --success-soft: #14532d;
  --danger: #f87171;
  --danger-soft: #7f1d1d;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.25);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  font-size: 16px;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 12px 12px 48px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 1.2rem; margin: 0 0 4px; line-height: 1.25; }
.sub { margin: 0; color: var(--muted); font-size: .9rem; }
.icon-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 10px; padding: 8px 10px; font-size: .9rem; cursor: pointer;
  flex: 0 0 auto;
}
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 8px; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  padding: 8px 14px; border-radius: 999px; font-size: .9rem; font-weight: 600; cursor: pointer;
}
.tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.section-tag {
  display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  color: var(--primary); background: var(--primary-soft); padding: 3px 8px; border-radius: 999px; margin-bottom: 8px;
}
h2 { font-size: 1rem; margin: 0 0 8px; }
.instructions { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }
.q {
  border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px;
  background: var(--surface);
}
.q.correct { border-color: var(--success); background: var(--success-soft); }
.q.wrong { border-color: var(--danger); background: var(--danger-soft); }
.qhead { font-weight: 600; margin-bottom: 8px; }
.qhead .num { color: var(--primary); margin-right: 4px; }
.qhead u { text-decoration: underline; text-underline-offset: 2px; }
.qhead .task { display: block; color: var(--primary); font-size: .88rem; margin-top: 2px; }
.options { display: grid; gap: 8px; }
.opt {
  display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  padding: 10px 12px; border-radius: 10px; font-size: .97rem; cursor: pointer;
}
.opt.selected { border-color: var(--primary); background: var(--primary-soft); }
.opt.correct { border-color: var(--success); background: var(--success-soft); }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.opt .letter { font-weight: 700; min-width: 1.2em; }
.qtools { margin-top: 8px; }
.link-btn {
  border: 0; background: none; color: var(--primary); padding: 0; font: inherit; font-size: .88rem;
  font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
.feedback { margin-top: 8px; font-size: .9rem; font-weight: 600; min-height: 1.2em; }
.feedback.ok { color: var(--success); }
.feedback.bad { color: var(--danger); }
.feedback.info { color: var(--muted); font-weight: 500; }
.feedback .why { display: block; margin-top: 4px; font-weight: 500; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  padding: 10px 14px; border-radius: 10px; font-size: .95rem; font-weight: 600; cursor: pointer;
}
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.scorebar {
  margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--surface-2);
  border: 1px solid var(--border); font-weight: 700;
}
.small { font-size: .86rem; color: var(--muted); font-weight: 500; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Class IX — Grammar: Transform the Sentences (Q5)</h1>
      <p class="sub">Section B, Q5 style · tap the correct transformed sentence</p>
    </div>
    <button class="icon-btn" id="themeBtn" type="button">Theme</button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Choose a transformation type"></nav>
  <div class="card" id="topicCard"></div>
  <div class="card" id="quiz"></div>
  <div class="scorebar" id="scorebar" aria-live="polite"></div>
</div>

<script>
(function () {
  var TOPICS = [
    {
      name: 'Tense Change',
      source: 'Notes: G-01 Tenses',
      questions: [
        { task: 'Change the Tense to Past Continuous:', q: 'The stars shine brightly in the clear night sky.', opts: ['The stars were shining brightly in the clear night sky.', 'The stars are shining brightly in the clear night sky.', 'The stars had been shining brightly in the clear night sky.', 'The stars shone brightly in the clear night sky.'], a: 0, why: 'Past Continuous = was/were + verb-ing; plural subject “stars” takes were shining.' },
        { task: 'Change the Tense to Present Continuous:', q: 'She eats an orange.', opts: ['She ate an orange.', 'She is eating an orange.', 'She has eaten an orange.', 'She was eating an orange.'], a: 1, why: 'Present Continuous = is/am/are + verb-ing (is eating).' },
        { task: 'Change the Tense to Past Indefinite:', q: 'The bell rings at 8:50 AM.', opts: ['The bell is ringing at 8:50 AM.', 'The bell has rung at 8:50 AM.', 'The bell rang at 8:50 AM.', 'The bell will ring at 8:50 AM.'], a: 2, why: 'Past Indefinite uses the past form of the verb: rang.' },
        { task: 'Change the Tense to Present Perfect:', q: 'I finish my homework.', opts: ['I finished my homework.', 'I had finished my homework.', 'I am finishing my homework.', 'I have finished my homework.'], a: 3, why: 'Present Perfect = has/have + past participle (have finished).' },
        { task: 'Change the Tense to Future Perfect:', q: 'They will complete the whole syllabus by next Sunday.', opts: ['They will have completed the whole syllabus by next Sunday.', 'They will be completing the whole syllabus by next Sunday.', 'They completed the whole syllabus by next Sunday.', 'They have completed the whole syllabus by next Sunday.'], a: 0, why: 'Future Perfect = will have + past participle, for an action finished before a future point.' },
        { task: 'Change the Tense to Simple Past:', q: 'Columbus discovers America in 1492.', opts: ['Columbus has discovered America in 1492.', 'Columbus discovered America in 1492.', 'Columbus had discovered America in 1492.', 'Columbus was discovering America in 1492.'], a: 1, why: 'A completed action at a stated past time takes the Simple Past: discovered.' },
        { task: 'Change the Tense to Present Perfect Continuous:', q: 'Priya practises classical dance since morning.', opts: ['Priya was practising classical dance since morning.', 'Priya has been practising classical dance since morning.', 'Priya had been practising classical dance since morning.', 'Priya is practising classical dance since morning.'], a: 1, why: 'Present Perfect Continuous = has/have been + verb-ing, for actions continuing since a past point.' },
        { task: 'Change the Tense to Future Continuous:', q: 'This time tomorrow we fly to the capital.', opts: ['This time tomorrow we shall be flying to the capital.', 'This time tomorrow we shall fly to the capital.', 'This time tomorrow we flew to the capital.', 'This time tomorrow we have flown to the capital.'], a: 0, why: 'Future Continuous = shall/will be + verb-ing, for an action in progress at a future moment.' },
        { task: 'Change the Tense to Past Continuous:', q: 'The birds chirp merrily at dawn.', opts: ['The birds chirped merrily at dawn.', 'The birds have chirped merrily at dawn.', 'The birds were chirping merrily at dawn.', 'The birds are chirping merrily at dawn.'], a: 2, why: 'Past Continuous = was/were + verb-ing (were chirping).' },
        { task: 'Change the Tense to Past Perfect Continuous:', q: 'He worked for two hours before the guests arrived.', opts: ['He was working for two hours before the guests arrived.', 'He had been working for two hours before the guests arrived.', 'He has been working for two hours before the guests arrived.', 'He worked for two hours before the guests had arrived.'], a: 1, why: 'Past Perfect Continuous = had been + verb-ing, for a duration leading up to a past event.' }
      ]
    },
    {
      name: 'Indirect Speech',
      source: 'Notes: G-05 Reported Speech',
      questions: [
        { task: 'Change into Indirect (Reported) Speech:', q: 'He said to me, “You are late for the lecture.”', opts: ['He told me that I was late for the lecture.', 'He told me that you are late for the lecture.', 'He told me that I am late for the lecture.', 'He asked me that I was late for the lecture.'], a: 0, why: 'said to → told; second person “you” refers to the listener → I; present simple → past simple (was).' },
        { task: 'Change into Indirect Speech:', q: 'Ravi said to Meera, “I am going to the market now.”', opts: ['Ravi told Meera that he is going to the market now.', 'Ravi told Meera that he was going to the market then.', 'Ravi told Meera that she was going to the market then.', 'Ravi asked Meera if he was going to the market then.'], a: 1, why: 'First person “I” → he; am going → was going; now → then with a past reporting verb.' },
        { task: 'Change into Indirect Speech:', q: 'The coach said to the team, “Practise hard for the finals.”', opts: ['The coach told the team that they practise hard for the finals.', 'The coach asked the team to practise hard for the finals.', 'The coach advised the team to practise hard for the finals.', 'The coach said the team to practise hard for the finals.'], a: 2, why: 'Imperative advice becomes advised + object + to + verb (I).' },
        { task: 'Change into Indirect Speech:', q: 'Sana said, “Wow! What a beautiful painting!”', opts: ['Sana exclaimed with wonder that it was a very beautiful painting.', 'Sana exclaimed with wonder that it is a very beautiful painting.', 'Sana asked what a beautiful painting it was.', 'Sana told that it was a very beautiful painting.'], a: 0, why: 'Exclamations become exclaimed with + emotion; present → past; what a → very.' },
        { task: 'Change into Indirect Speech:', q: 'Grandfather said, “May you succeed in your exams!”', opts: ['Grandfather wished that I might succeed in my exams.', 'Grandfather said that I may succeed in my exams.', 'Grandfather wished that I might succeeded in my exams.', 'Grandfather asked if I might succeed in my exams.'], a: 0, why: 'Optative sentences (May you…) are reported with wished/blessed + might.' },
        { task: 'Change into Indirect Speech:', q: 'The stranger asked, “Could you tell me the way to the museum?”', opts: ['The stranger asked if I could tell him the way to the museum.', 'The stranger asked that I could tell him the way to the museum.', 'The stranger asked if you can tell me the way to the museum.', 'The stranger enquired that could I tell him the way to the museum.'], a: 0, why: 'Polite questions with could keep could and take if/whether with pronoun changes.' },
        { task: 'Change into Indirect Speech:', q: 'Anita said, “I will join the practice tomorrow.”', opts: ['Anita said that she will join the practice tomorrow.', 'Anita said that she would join the practice the next day.', 'Anita said that she would join the practice tomorrow.', 'Anita told that she would join the practice the next day.'], a: 1, why: 'Will → would and tomorrow → the next day with a past reporting verb.' },
        { task: 'Change into Indirect Speech:', q: 'The watchman said to the boys, “Do not cross the railway line.”', opts: ['The watchman told the boys do not cross the railway line.', 'The watchman warned the boys not to cross the railway line.', 'The watchman asked the boys if they crossed the railway line.', 'The watchman said the boys not to cross the railway line.'], a: 1, why: 'Negative commands become warned/told + object + not to + verb (I).' }
      ]
    },
    {
      name: 'Sentence Combining',
      source: 'Notes: G-07 Noun and Relative Clauses',
      questions: [
        { task: 'Combine using a Noun Clause:', q: 'He will win the competition. I am sure of it.', opts: ['I am sure that he will win the competition.', 'I am sure of that he will win the competition.', 'I am sure why he will win the competition.', 'I am sure whether he will win the competition.'], a: 0, why: 'A noun clause after “sure” is introduced by that: I am sure that…' },
        { task: 'Combine using a Relative Clause with who:', q: 'The girl won the gold medal in badminton. She lives in our neighbourhood.', opts: ['The girl who lives in our neighbourhood won the gold medal in badminton.', 'The girl which lives in our neighbourhood won the gold medal in badminton.', 'The girl who she lives in our neighbourhood won the gold medal in badminton.', 'The girl that whose lives in our neighbourhood won the gold medal in badminton.'], a: 0, why: 'Who replaces the repeated subject “she” and attaches the clause to “the girl”.' },
        { task: 'Combine into a single sentence using a Noun Clause with that:', q: 'He is telling the truth. I am completely confident of it.', opts: ['I am completely confident that he is telling the truth.', 'I am completely confident of that he is telling the truth.', 'I am completely confident what he is telling the truth.', 'I am completely confident so that he is telling the truth.'], a: 0, why: 'The noun clause after “confident” is introduced by that.' },
        { task: 'Combine using a Relative Clause with whose:', q: 'A man was arrested by the cyber cell. His bank account had been used for illegal transfers.', opts: ['A man whose bank account had been used for illegal transfers was arrested by the cyber cell.', 'A man which bank account had been used for illegal transfers was arrested by the cyber cell.', 'A man who bank account had been used for illegal transfers was arrested by the cyber cell.', 'A man whose of bank account had been used for illegal transfers was arrested by the cyber cell.'], a: 0, why: 'Whose shows possession and replaces “his” before the noun “bank account”.' },
        { task: 'Combine using an Adverb Clause of Condition with Unless:', q: 'You must work sincerely every day. Otherwise, you will not clear the competitive exam.', opts: ['Unless you work sincerely every day, you will not clear the competitive exam.', 'Unless you do not work sincerely every day, you will not clear the competitive exam.', 'Unless you will work sincerely every day, you will not clear the competitive exam.', 'Unless you worked sincerely every day, you will not clear the competitive exam.'], a: 0, why: 'Unless already carries the negative, so the clause keeps the positive verb in the present tense.' },
        { task: 'Combine using a Noun Clause in Apposition with “The fact that…”:', q: 'The scientist made a breakthrough discovery. The entire world praised him for it.', opts: ['The fact that the scientist made a breakthrough discovery was praised by the entire world.', 'The fact which the scientist made a breakthrough discovery was praised by the entire world.', 'The fact that did the scientist make a breakthrough discovery was praised by the entire world.', 'The fact why the scientist made a breakthrough discovery was praised by the entire world.'], a: 0, why: 'A noun clause in apposition to “fact” is introduced by that.' },
        { task: 'Combine using an Adverb Clause of Purpose with so that:', q: 'She took detailed notes during the lecture. She did not want to miss any key points while revising.', opts: ['She took detailed notes during the lecture so that she would not miss any key points while revising.', 'She took detailed notes during the lecture so that she will not miss any key points while revising.', 'She took detailed notes during the lecture so that not to miss any key points while revising.', 'She took detailed notes during the lecture so that she does not miss any key points while revising.'], a: 0, why: 'So that + would/could expresses purpose in reported past narration.' },
        { task: 'Combine using an Adverb Clause of Result with so…that:', q: 'The storm blew violently throughout the night. The old banyan tree was uprooted.', opts: ['The storm blew so violently throughout the night that the old banyan tree was uprooted.', 'The storm blew so violently throughout the night that the old banyan tree was uprooted it.', 'The storm blew such violently throughout the night that the old banyan tree was uprooted.', 'The storm blew so violent throughout the night that the old banyan tree was uprooted.'], a: 0, why: 'So + adverb (violently) + that + result clause expresses degree and result.' }
      ]
    }
  ];

  var LETTERS = ['a', 'b', 'c', 'd'];

  var root = document.documentElement;
  try { var savedTheme = localStorage.getItem('c9-grammar-q5-theme'); if (savedTheme) root.setAttribute('data-theme', savedTheme); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('c9-grammar-q5-theme', next); } catch (e) {}
  });

  var tabsEl = document.getElementById('tabs');
  var topicCard = document.getElementById('topicCard');
  var quiz = document.getElementById('quiz');
  var scorebar = document.getElementById('scorebar');
  var cur = 0;
  var state = TOPICS.map(function () { return { sel: {}, res: {}, score: null }; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function whyHtml(q) { return q.why ? '<span class="why">' + esc(q.why) + '</span>' : ''; }
  function rotOff(qi) { return ((qi * 3) + cur) % 4; }
  function ansVal(q, qi) { return (q.a + rotOff(qi)) % 4; }

  function renderTabs() {
    tabsEl.innerHTML = TOPICS.map(function (t, i) {
      return '<button type="button" class="tab' + (i === cur ? ' active' : '') + '" data-i="' + i + '">' + esc(t.name) + '</button>';
    }).join('');
  }

  function renderTopic() {
    var t = TOPICS[cur];
    var html = '<span class="section-tag">Section B — Grammar</span>';
    html += '<h2>' + esc(t.name) + '</h2>';
    html += '<p class="instructions">' + esc(t.source) + ' · ' + t.questions.length + ' transformations. Read the instruction above each sentence, then tap the correctly transformed option.</p>';
    topicCard.innerHTML = html;
  }

  function questionHtml(q, qi) {
    var off = rotOff(qi);
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">' + (qi + 1) + '.</span> <span class="task">' + esc(q.task) + '</span> ' + esc(q.q) + '</div>';
    h += '<div class="options">';
    for (var oi = 0; oi < 4; oi++) {
      var src = (oi - off + 4) % 4;
      h += '<button type="button" class="opt" data-val="' + oi + '"><span class="letter">(' + LETTERS[oi] + ')</span><span>' + esc(q.opts[src]) + '</span></button>';
    }
    h += '</div>';
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function renderQuiz() {
    var t = TOPICS[cur];
    quiz.innerHTML = t.questions.map(questionHtml).join('') +
      '<div class="actions"><button class="btn primary" id="checkBtn" type="button">Check answers</button>' +
      '<button class="btn" id="resetBtn" type="button">Reset this tab</button></div>';
    restore();
    updateScore();
  }

  function mark(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var ans = String(ansVal(q, qi));
    var sel = st.sel[qi];
    qEl.classList.remove('correct', 'wrong');
    qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('correct', 'wrong'); });
    var good = qEl.querySelector('.opt[data-val="' + ans + '"]');
    if (good) good.classList.add('correct');
    if (sel === undefined) {
      if (good) good.classList.remove('correct');
      fb.textContent = 'Not answered yet.';
      fb.className = 'feedback bad';
      return false;
    }
    if (sel !== ans) {
      var bad = qEl.querySelector('.opt[data-val="' + sel + '"]');
      if (bad) { bad.classList.remove('correct'); bad.classList.add('wrong'); }
    }
    var ok = sel === ans;
    fb.innerHTML = esc(ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.') + whyHtml(q);
    fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    qEl.classList.add(ok ? 'correct' : 'wrong');
    st.res[qi] = ok;
    return ok;
  }

  function showAnswer(q, qi) {
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return;
    var fb = qEl.querySelector('.feedback');
    var av = ansVal(q, qi);
    qEl.querySelectorAll('.opt').forEach(function (b) {
      b.classList.toggle('correct', b.getAttribute('data-val') === String(av));
    });
    fb.innerHTML = esc('Answer: (' + LETTERS[av] + ') ' + q.opts[q.a] + '.') + whyHtml(q);
    fb.className = 'feedback info';
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'true'); sb.textContent = 'Hide answer'; }
  }

  function restore() {
    var st = state[cur];
    TOPICS[cur].questions.forEach(function (q, qi) {
      var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
      if (!qEl) return;
      if (st.sel[qi] !== undefined) {
        var b = qEl.querySelector('.opt[data-val="' + st.sel[qi] + '"]');
        if (b) b.classList.add('selected');
      }
    });
    if (st.score !== null) {
      TOPICS[cur].questions.forEach(function (q, qi) { mark(q, qi); });
    }
  }

  function updateScore() {
    var st = state[cur];
    var checked = state.filter(function (s) { return s.score !== null; });
    var total = checked.reduce(function (a, s) { return a + s.score; }, 0);
    var head = esc(TOPICS[cur].name) + ': ' + (st.score === null ? '—' : st.score) + ' / ' + TOPICS[cur].questions.length;
    var note = checked.length
      ? 'Checked so far: ' + checked.length + ' of ' + TOPICS.length + ' tabs · ' + total + ' / ' + (checked.reduce(function (a, s, i) { return a + TOPICS[i].questions.length; }, 0)) + ' correct.'
      : 'Tap an option to choose it; you can change it any time before you check.';
    scorebar.innerHTML = head + '<div class="small">' + note + '</div>';
  }

  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tab');
    if (tab) {
      cur = Number(tab.getAttribute('data-i'));
      renderTabs();
      renderTopic();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    if (ev.target.id === 'checkBtn') {
      var score = 0;
      TOPICS[cur].questions.forEach(function (q, qi) { if (mark(q, qi)) score++; });
      state[cur].score = score;
      updateScore();
      return;
    }

    if (ev.target.id === 'resetBtn') {
      state[cur] = { sel: {}, res: {}, score: null };
      renderQuiz();
      updateScore();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    var sb = ev.target.closest('.show-ans');
    if (sb && quiz.contains(sb)) {
      var qEl = sb.closest('.q');
      var qi = Number(qEl.getAttribute('data-qi'));
      if (sb.getAttribute('data-shown') === 'true') {
        var fb = qEl.querySelector('.feedback');
        fb.textContent = '';
        fb.className = 'feedback';
        qEl.classList.remove('correct', 'wrong');
        qEl.querySelectorAll('.opt').forEach(function (b) {
          b.classList.remove('correct', 'wrong');
          if (state[cur].sel[qi] !== undefined && b.getAttribute('data-val') === state[cur].sel[qi]) b.classList.add('selected');
        });
        sb.setAttribute('data-shown', 'false');
        sb.textContent = 'Show answer';
      } else {
        showAnswer(TOPICS[cur].questions[qi], qi);
      }
      return;
    }

    var opt = ev.target.closest('.opt');
    if (opt && quiz.contains(opt)) {
      var qBox = opt.closest('.q');
      var qi2 = Number(qBox.getAttribute('data-qi'));
      qBox.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected', 'correct', 'wrong'); });
      opt.classList.add('selected');
      state[cur].sel[qi2] = opt.getAttribute('data-val');
      delete state[cur].res[qi2];
      state[cur].score = null;
      qBox.classList.remove('correct', 'wrong');
      var fb2 = qBox.querySelector('.feedback');
      fb2.textContent = '';
      fb2.className = 'feedback';
      var sbx = qBox.querySelector('.show-ans');
      if (sbx) { sbx.setAttribute('data-shown', 'false'); sbx.textContent = 'Show answer'; }
      updateScore();
    }
  });

  renderTabs();
  renderTopic();
  renderQuiz();
})();
</script>
</body>
</html>
