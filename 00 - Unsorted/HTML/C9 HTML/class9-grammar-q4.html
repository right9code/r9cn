<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Class IX Grammar — Q4 Rearrange the Words</title>
<style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eef2f7;
  --text: #1f2937;
  --muted: #5f6b7a;
  --border: #d8dee8;
  --primary: #2563eb;
  --primary-soft: #dbeafe;
  --success: #15803d;
  --success-soft: #dcfce7;
  --danger: #b91c1c;
  --danger-soft: #fee2e2;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #111827;
  --surface-2: #1f2937;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --border: #334155;
  --primary: #60a5fa;
  --primary-soft: #1e3a5f;
  --success: #4ade80;
  --success-soft: #14532d;
  --danger: #f87171;
  --danger-soft: #7f1d1d;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.25);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  font-size: 16px;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 12px 12px 48px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 1.2rem; margin: 0 0 4px; line-height: 1.25; }
.sub { margin: 0; color: var(--muted); font-size: .9rem; }
.icon-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 10px; padding: 8px 10px; font-size: .9rem; cursor: pointer;
  flex: 0 0 auto;
}
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.section-tag {
  display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  color: var(--primary); background: var(--primary-soft); padding: 3px 8px; border-radius: 999px; margin-bottom: 8px;
}
h2 { font-size: 1rem; margin: 0 0 8px; }
.instructions { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }
.q {
  border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px;
  background: var(--surface);
}
.q.correct { border-color: var(--success); background: var(--success-soft); }
.q.wrong { border-color: var(--danger); background: var(--danger-soft); }
.qhead { font-weight: 600; margin-bottom: 8px; }
.qhead .num { color: var(--primary); margin-right: 4px; }
.slot {
  min-height: 48px; border: 1.5px dashed var(--border); border-radius: 10px;
  background: var(--surface-2); padding: 7px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.slot.filled { border-style: solid; }
.slot .placeholder { color: var(--muted); font-size: .85rem; padding: 2px 4px; }
.bank { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.bank-label { width: 100%; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin-bottom: 2px; }
.chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 7px 12px; border-radius: 999px; font-size: .95rem; font-weight: 600; cursor: pointer;
}
.chip.in-slot { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.q.correct .chip.in-slot { background: var(--success-soft); border-color: var(--success); color: var(--success); }
.q.wrong .chip.in-slot { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.qtools { margin-top: 8px; }
.link-btn {
  border: 0; background: none; color: var(--primary); padding: 0; font: inherit; font-size: .88rem;
  font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
.link-btn + .link-btn { margin-left: 14px; }
.feedback { margin-top: 8px; font-size: .9rem; font-weight: 600; min-height: 1.2em; }
.feedback.ok { color: var(--success); }
.feedback.bad { color: var(--danger); }
.feedback.info { color: var(--muted); font-weight: 500; }
.feedback .why { display: block; margin-top: 4px; font-weight: 500; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  padding: 10px 14px; border-radius: 10px; font-size: .95rem; font-weight: 600; cursor: pointer;
}
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.scorebar {
  margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--surface-2);
  border: 1px solid var(--border); font-weight: 700;
}
.small { font-size: .86rem; color: var(--muted); font-weight: 500; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Class IX — Grammar: Rearrange the Words (Q4)</h1>
      <p class="sub">Section B, Q4 style · tap the words in the right order</p>
    </div>
    <button class="icon-btn" id="themeBtn" type="button">Theme</button>
  </header>

  <div class="card" id="introCard"></div>
  <div class="card" id="quiz"></div>
  <div class="scorebar" id="scorebar" aria-live="polite"></div>
</div>

<script>
(function () {
  var ITEMS = [
    { tokens: ['the', 'Sun', 'rises', 'in', 'the', 'east', 'every', 'morning'], sentence: 'The Sun rises in the east every morning.', why: 'Statement order: subject (the Sun) + verb (rises) + place (in the east) + time (every morning).' },
    { tokens: ['the', 'student', 'who', 'works', 'hard', 'succeeds', 'in', 'life'], sentence: 'The student who works hard succeeds in life.', why: 'Subject (the student) + relative clause (who works hard) + verb (succeeds) + rest (in life).' },
    { tokens: ['nobody', 'is', 'perfect', 'in', 'this', 'world'], sentence: 'Nobody is perfect in this world.', why: 'Subject (nobody) + verb (is) + complement (perfect) + place (in this world).' },
    { tokens: ['my', 'sister', 'sings', 'beautifully', 'in', 'the', 'school', 'choir'], sentence: 'My sister sings beautifully in the school choir.', why: 'Subject (my sister) + verb (sings) + manner (beautifully) + place (in the school choir).' },
    { tokens: ['the', 'gardener', 'waters', 'the', 'plants', 'every', 'evening'], sentence: 'The gardener waters the plants every evening.', why: 'Subject (the gardener) + verb (waters) + object (the plants) + time (every evening).' },
    { tokens: ['we', 'reached', 'the', 'station', 'before', 'the', 'train', 'left'], sentence: 'We reached the station before the train left.', why: 'Main clause (we reached the station) + time clause introduced by before (before the train left).' },
    { tokens: ['the', 'children', 'were', 'playing', 'football', 'when', 'it', 'started', 'raining'], sentence: 'The children were playing football when it started raining.', why: 'Past Continuous main clause + when + simple past interrupting action.' },
    { tokens: ['honesty', 'is', 'the', 'best', 'policy', 'in', 'every', 'situation'], sentence: 'Honesty is the best policy in every situation.', why: 'Subject (honesty) + verb (is) + complement (the best policy) + phrase (in every situation).' },
    { tokens: ['the', 'teacher', 'praised', 'the', 'students', 'for', 'their', 'hard', 'work'], sentence: 'The teacher praised the students for their hard work.', why: 'Subject + verb + object (the students) + reason (for their hard work).' },
    { tokens: ['my', 'grandfather', 'tells', 'us', 'folk', 'tales', 'every', 'night'], sentence: 'My grandfather tells us folk tales every night.', why: 'Subject + verb + indirect object (us) + direct object (folk tales) + time (every night).' },
    { tokens: ['the', 'library', 'closes', 'at', 'five', "o'clock", 'on', 'weekdays'], sentence: 'The library closes at five o’clock on weekdays.', why: 'Subject + verb + exact time (at five o’clock) + day (on weekdays).' },
    { tokens: ['the', 'chef', 'prepared', 'a', 'delicious', 'meal', 'for', 'the', 'guests'], sentence: 'The chef prepared a delicious meal for the guests.', why: 'Subject + verb + object with adjective order (a delicious meal) + purpose (for the guests).' }
  ];

  var root = document.documentElement;
  try { var savedTheme = localStorage.getItem('c9-grammar-q4-theme'); if (savedTheme) root.setAttribute('data-theme', savedTheme); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('c9-grammar-q4-theme', next); } catch (e) {}
  });

  var quiz = document.getElementById('quiz');
  var scorebar = document.getElementById('scorebar');
  var state = ITEMS.map(function () { return { placed: [], res: null, score: null }; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function norm(s) { return s.toLowerCase().replace(/[\u2018\u2019']/g, "'").replace(/\s+/g, ' ').trim(); }

  // Deterministic shuffle of display order for the bank chips.
  function shuffledOrder(n, seed) {
    var arr = [];
    for (var i = 0; i < n; i++) arr.push(i);
    var s = seed * 2654435761 % 4294967296;
    for (var j = n - 1; j > 0; j--) {
      s = (s * 1103515245 + 12345) % 2147483648;
      var k = s % (j + 1);
      var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;
    }
    var same = arr.every(function (v, idx) { return v === idx; });
    if (same && n > 1) { arr.push(arr.shift()); }
    return arr;
  }

  function placedText(st, item) {
    return st.placed.map(function (ti) { return item.tokens[ti]; }).join(' ');
  }

  function cardHtml(item, ci) {
    var st = state[ci];
    var order = shuffledOrder(item.tokens.length, ci + 1);
    var inBank = order.filter(function (ti) { return st.placed.indexOf(ti) === -1; });
    var h = '<div class="q" data-ci="' + ci + '">';
    h += '<div class="qhead"><span class="num">' + (ci + 1) + '.</span> Arrange the words to make a meaningful sentence:</div>';
    h += '<div class="slot' + (st.placed.length ? ' filled' : '') + '">';
    if (!st.placed.length) h += '<span class="placeholder">Tap words below to build the sentence here</span>';
    else h += st.placed.map(function (ti) {
      return '<button type="button" class="chip in-slot" data-ci="' + ci + '" data-ti="' + ti + '">' + esc(item.tokens[ti]) + '</button>';
    }).join('');
    h += '</div>';
    h += '<div class="bank"><span class="bank-label">Word bank</span>';
    h += inBank.map(function (ti) {
      return '<button type="button" class="chip bank-chip" data-ci="' + ci + '" data-ti="' + ti + '">' + esc(item.tokens[ti]) + '</button>';
    }).join('');
    h += '</div>';
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button>' +
      '<button type="button" class="link-btn clear-btn">Clear</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function render() {
    var html = '<p class="instructions">Tap a word in the <strong>word bank</strong> to move it into the sentence; tap a word <strong>inside the sentence</strong> to send it back. A full stop is added for you. Use <strong>Check answers</strong> for feedback on all twelve, or <strong>Show answer</strong> on a single card.</p>';
    html += ITEMS.map(cardHtml).join('');
    html += '<div class="actions"><button class="btn primary" id="checkBtn" type="button">Check answers</button>' +
      '<button class="btn" id="resetBtn" type="button">Reset all</button></div>';
    quiz.innerHTML = html;
    updateScore();
  }

  function markCard(ci, opts) {
    opts = opts || {};
    var item = ITEMS[ci];
    var st = state[ci];
    var qEl = quiz.querySelector('.q[data-ci="' + ci + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    qEl.classList.remove('correct', 'wrong');
    if (!st.placed.length) {
      fb.textContent = 'Not answered yet — tap the words to build the sentence first.';
      fb.className = 'feedback bad';
      return false;
    }
    var ok = norm(placedText(st, item)) === norm(item.tokens.join(' '));
    st.res = ok;
    if (!opts.noMark) {
      qEl.classList.add(ok ? 'correct' : 'wrong');
      fb.innerHTML = esc(ok ? 'Correct: ' + item.sentence : 'Not quite. The correct order is: ' + item.sentence) +
        '<span class="why">' + esc(item.why) + '</span>';
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    }
    return ok;
  }

  function showAnswer(ci) {
    var item = ITEMS[ci];
    var st = state[ci];
    st.placed = item.tokens.map(function (_, i) { return i; });
    renderCard(ci);
    var qEl = quiz.querySelector('.q[data-ci="' + ci + '"]');
    if (!qEl) return;
    qEl.querySelector('.feedback').innerHTML =
      '<span class="why">' + esc(item.sentence) + ' — ' + esc(item.why) + '</span>';
    qEl.querySelector('.feedback').className = 'feedback info';
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'true'); sb.textContent = 'Hide answer'; }
  }

  function renderCard(ci) {
    var qEl = quiz.querySelector('.q[data-ci="' + ci + '"]');
    if (!qEl) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = cardHtml(ITEMS[ci], ci);
    qEl.replaceWith(tmp.firstElementChild);
  }

  function updateScore() {
    var checked = state.filter(function (s) { return s.score !== null; });
    var total = checked.reduce(function (a, s) { return a + s.score; }, 0);
    scorebar.innerHTML = 'Score: ' + total + ' / ' + ITEMS.length +
      '<div class="small">' + (checked.length ? 'Checked so far: ' + checked.length + ' of ' + ITEMS.length + ' sentences.' : 'Build each sentence, then tap Check answers.') + '</div>';
  }

  document.addEventListener('click', function (ev) {
    var chip = ev.target.closest('.chip');
    if (chip && quiz.contains(chip)) {
      var ci = Number(chip.getAttribute('data-ci'));
      var ti = Number(chip.getAttribute('data-ti'));
      var st = state[ci];
      var wasShown = quiz.querySelector('.q[data-ci="' + ci + '"] .show-ans');
      var shown = wasShown && wasShown.getAttribute('data-shown') === 'true';
      if (shown) {
        // Hide the revealed answer on any interaction.
        wasShown.setAttribute('data-shown', 'false');
        wasShown.textContent = 'Show answer';
        var fb0 = quiz.querySelector('.q[data-ci="' + ci + '"] .feedback');
        fb0.textContent = '';
        fb0.className = 'feedback';
        st.placed = [];
      }
      if (chip.classList.contains('bank-chip')) {
        if (st.placed.indexOf(ti) === -1) st.placed.push(ti);
      } else {
        var idx = st.placed.indexOf(ti);
        if (idx !== -1) st.placed.splice(idx, 1);
      }
      st.res = null;
      st.score = null;
      renderCard(ci);
      updateScore();
      return;
    }

    var clear = ev.target.closest('.clear-btn');
    if (clear && quiz.contains(clear)) {
      var ci2 = Number(clear.closest('.q').getAttribute('data-ci'));
      state[ci2] = { placed: [], res: null, score: null };
      renderCard(ci2);
      updateScore();
      return;
    }

    var sb = ev.target.closest('.show-ans');
    if (sb && quiz.contains(sb)) {
      var ci3 = Number(sb.closest('.q').getAttribute('data-ci'));
      if (sb.getAttribute('data-shown') === 'true') {
        state[ci3] = { placed: [], res: null, score: null };
        renderCard(ci3);
        updateScore();
      } else {
        showAnswer(ci3);
      }
      return;
    }

    if (ev.target.id === 'checkBtn') {
      ITEMS.forEach(function (_, ci4) {
        var ok = markCard(ci4);
        state[ci4].score = ok ? 1 : 0;
      });
      updateScore();
      return;
    }

    if (ev.target.id === 'resetBtn') {
      state = ITEMS.map(function () { return { placed: [], res: null, score: null }; });
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
  });

  var introCard = document.getElementById('introCard');
  introCard.innerHTML = '<span class="section-tag">Section B — Grammar</span>' +
    '<h2>Rearrange the Jumbled Words</h2>' +
    '<p class="instructions">Twelve sentences to rebuild — every word is given, but in the wrong order.</p>';

  render();
})();
</script>
</body>
</html>
