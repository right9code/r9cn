<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Class IX Literature — Q10 Poem Extracts</title>
<style>
:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #eef2f7; --text: #1f2937; --muted: #5f6b7a;
  --border: #d8dee8; --primary: #2563eb; --primary-soft: #dbeafe; --success: #15803d; --success-soft: #dcfce7;
  --danger: #b91c1c; --danger-soft: #fee2e2; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
}
[data-theme="dark"] {
  --bg: #0f172a; --surface: #111827; --surface-2: #1f2937; --text: #e5e7eb; --muted: #9ca3af;
  --border: #334155; --primary: #60a5fa; --primary-soft: #1e3a5f; --success: #4ade80; --success-soft: #14532d;
  --danger: #f87171; --danger-soft: #7f1d1d; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.25);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; font-size: 16px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 12px 12px 48px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 1.2rem; margin: 0 0 4px; line-height: 1.25; }
.sub { margin: 0; color: var(--muted); font-size: .9rem; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px; padding: 8px 10px; font-size: .9rem; cursor: pointer; flex: 0 0 auto; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 8px; }
.tab { flex: 0 0 auto; border: 1px solid var(--border); background: var(--surface); color: var(--muted); padding: 8px 14px; border-radius: 999px; font-size: .9rem; font-weight: 600; cursor: pointer; }
.tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.section-tag { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--primary); background: var(--primary-soft); padding: 3px 8px; border-radius: 999px; margin-bottom: 8px; }
h2 { font-size: 1rem; margin: 0 0 8px; }
.instructions { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }
.extract { font-style: italic; border-left: 3px solid var(--primary); background: var(--surface-2); border-radius: 8px; padding: 12px; margin-bottom: 12px; white-space: pre-line; }
.q { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--surface); }
.q.correct { border-color: var(--success); background: var(--success-soft); }
.q.wrong { border-color: var(--danger); background: var(--danger-soft); }
.qhead { font-weight: 600; margin-bottom: 8px; }
.qhead .num { color: var(--primary); margin-right: 4px; }
.qhead u { text-decoration: underline; text-underline-offset: 2px; }
.options { display: grid; gap: 8px; }
.opt { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: .97rem; cursor: pointer; }
.opt.selected { border-color: var(--primary); background: var(--primary-soft); }
.opt.correct { border-color: var(--success); background: var(--success-soft); }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.opt .letter { font-weight: 700; min-width: 1.2em; }
.qtools { margin-top: 8px; }
.link-btn { border: 0; background: none; color: var(--primary); padding: 0; font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.feedback { margin-top: 8px; font-size: .9rem; font-weight: 600; min-height: 1.2em; }
.feedback.ok { color: var(--success); } .feedback.bad { color: var(--danger); } .feedback.info { color: var(--muted); font-weight: 500; }
.feedback .why { display: block; margin-top: 4px; font-weight: 500; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); padding: 10px 14px; border-radius: 10px; font-size: .95rem; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.scorebar { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 700; }
.small { font-size: .86rem; color: var(--muted); font-weight: 500; margin-top: 4px; }
.identify-box { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--surface); margin: 8px 0; }
.slot-row { margin: 8px 0; font-size: .97rem; }
.slot { display: inline-block; min-width: 150px; min-height: 1.6em; padding: 4px 10px; border: 2px dashed var(--border); border-radius: 8px; background: var(--surface-2); color: var(--muted); font-weight: 600; cursor: pointer; vertical-align: middle; }
.slot.filled { border-style: solid; color: var(--text); }
.slot.active { outline: 2px solid var(--primary); background: var(--primary-soft); }
.slot.correct { border-color: var(--success); background: var(--success-soft); color: var(--success); }
.slot.wrong { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.tile { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); padding: 7px 12px; border-radius: 999px; font-size: .9rem; font-weight: 600; cursor: pointer; }
.tile.used { opacity: .45; }
.reveal { margin-top: 8px; font-size: .92rem; font-weight: 700; color: var(--muted); }
.reveal.shown { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Class IX — Literature: Poem Extracts (Q10)</h1>
      <p class="sub">Section C, Q10 style · 10 extracts × 5 questions · poem and poet stay hidden until you check</p>
    </div>
    <button class="icon-btn" id="themeBtn" type="button">Theme</button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Choose an extract"></nav>
  <div class="card" id="extractCard"></div>
  <div class="card" id="quiz"></div>
  <div class="scorebar" id="scorebar" aria-live="polite"></div>
</div>

<script>
(function () {
  var POEMS = [
    { poem: 'Believe in Yourself', poet: 'Robert Langley' },
    { poem: 'Bharat Our Land', poet: 'Subramania Bharati' },
    { poem: 'A Friend Found in Music', poet: 'Bryanna T. Perkins' },
    { poem: 'Words', poet: 'Charles Swain' },
    { poem: 'I Cannot Remember My Mother', poet: 'Rabindranath Tagore' }
  ];
  var EXTRA_POETS = ['Temsula Ao', 'Asha Nehemiah'];

  var EXTRACTS = [
    {
      lines: 'Step up to the challenge\nThere is no crowd to see,\nIt\u2019s just you and the future\nAnd where you want to be.',
      q1: { q: 'Who is watching when you step up to the challenge?', opts: ['A large cheering crowd', 'No one \u2014 \u201cthere is no crowd to see\u201d', 'Your teachers and parents', 'A panel of judges'], a: 1, why: 'The extract says plainly: \u201cThere is no crowd to see.\u201d' },
      q2: { q: 'What does the phrase \u201cstep up to the challenge\u201d suggest?', opts: ['To walk towards a raised platform', 'To face the difficult task bravely', 'To avoid hard situations', 'To wait for someone\u2019s help'], a: 1, why: '\u201cStep up\u201d means to come forward and face the challenge willingly.' },
      q4: { q: 'What does \u201cIt\u2019s just you and the future\u201d emphasise?', opts: ['Life is lonely and sad', 'Your progress depends on your own effort, not on spectators', 'The future is always frightening', 'Only famous people have futures'], a: 1, why: 'With no crowd watching, the responsibility for reaching \u201cwhere you want to be\u201d rests entirely on you.' },
      q5: { q: 'Find a word in the extract which means \u201ca difficult task that tests your ability\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['challenge'] }], why: 'A \u201cchallenge\u201d is a difficult task that tests ability; it appears in the first line.' },
      index: 0
    },
    {
      lines: 'The first step is the hardest\nThere is no turning back,\nYou just need to believe in yourself\nFor your future to be on track.',
      q1: { q: 'According to the poet, what is the hardest thing to do?', opts: ['The last step', 'The first step', 'Turning back', 'Believing in others'], a: 1, why: 'The extract opens with \u201cThe first step is the hardest\u201d.' },
      q2: { q: 'What does \u201con track\u201d mean here?', opts: ['Lying on a railway line', 'Moving steadily towards the goal', 'Trapped in one place', 'Running faster than others'], a: 1, why: '\u201cOn track\u201d means progressing in the right direction towards the goal.' },
      q4: { q: 'What does \u201cThere is no turning back\u201d imply about commitment?', opts: ['You may quit whenever you wish', 'Once you begin, you should commit fully and not retreat', 'Only winners may look back', 'Beginners must always step back'], a: 1, why: 'The line suggests total commitment \u2014 no retreat once you have begun.' },
      q5: { q: 'Find a word in the extract which means \u201cto have firm trust or confidence\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['believe'] }], why: '\u201cBelieve (in yourself)\u201d means to have firm trust or confidence.' },
      index: 0
    },
    {
      lines: 'The mighty Himavant is ours-\nthere\u2019s no equal anywhere on earth.\nThe generous Ganga is ours-\nwhich other river can match her grace?\nThe sacred Upanishads are ours-\nwhat scriptures else to name with them?\nThis sunny golden land is ours-\nshe\u2019s peerless, let\u2019s praise her!',
      q1: { q: 'Which mountain range is praised in the first line?', opts: ['The Vindhyas', 'The Himavant (the Himalayas)', 'The Western Ghats', 'The Aravallis'], a: 1, why: 'The \u201cmighty Himavant\u201d is the Himalayan range.' },
      q2: { q: 'What does \u201csacred\u201d suggest about the Upanishads?', opts: ['They are old and torn', 'They are holy and deserve reverence', 'They are printed in gold', 'They are sung aloud'], a: 1, why: '\u201cSacred\u201d marks the Upanishads as holy scriptures held in reverence.' },
      q4: { q: 'What does the repeated phrase \u201cis ours\u201d emphasise?', opts: ['That the poet wants to sell everything', 'Pride of collective ownership of a great heritage', 'That foreigners own the country', 'Doubt about who the land belongs to'], a: 1, why: 'The repetition builds pride of shared ownership of India\u2019s natural and spiritual wealth.' },
      q5: { q: 'Find a word in the extract which means \u201chaving no equal; matchless\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['peerless'] }], why: '\u201cPeerless\u201d means without an equal (\u201cshe\u2019s peerless, let\u2019s praise her!\u201d).' },
      index: 1
    },
    {
      lines: 'Gallant warriors have lived here,\nmany a sage has sanctified this land.\nThe divinest music has been heard here,\nand here all auspicious things are found.',
      q1: { q: 'Who, according to the extract, \u201csanctified this land\u201d?', opts: ['Foreign traders', 'Many a sage', 'Mountain climbers', 'Modern musicians'], a: 1, why: 'The second line says \u201cmany a sage has sanctified this land\u201d.' },
      q2: { q: 'What does \u201causpicious\u201d mean?', opts: ['Unlucky and threatening', 'Promising good fortune; blessed', 'Loud and colourful', 'Rare and expensive'], a: 1, why: '\u201cAuspicious\u201d means favourable, promising good fortune.' },
      q4: { q: 'Listing warriors, sages and divinest music together shows that India\u2019s greatness is:', opts: ['only military', 'heroic, spiritual and artistic all at once', 'purely modern', 'borrowed from abroad'], a: 1, why: 'The extract balances bravery, holiness and art \u2014 many-sided greatness.' },
      q5: { q: 'Find a word in the extract which means \u201cbrave and heroic\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['gallant'] }], why: '\u201cGallant\u201d means brave and heroic (\u201cGallant warriors have lived here\u201d).' },
      index: 1
    },
    {
      lines: 'Music is the ocean\nThat pulls me to the shore.\nMusic is the rhythm\nThat moves me to the core.',
      q1: { q: 'What is music compared to in the first two lines?', opts: ['A mountain', 'An ocean', 'A river', 'A drum'], a: 1, why: 'The extract opens with the metaphor \u201cMusic is the ocean\u201d.' },
      q2: { q: 'What does \u201cmoves me to the core\u201d mean?', opts: ['Shifts the poet to another room', 'Affects the poet very deeply, to her innermost being', 'Makes the poet stand still', 'Confuses the poet completely'], a: 1, why: 'To move someone \u201cto the core\u201d is to touch them at the deepest level.' },
      q4: { q: 'The ocean metaphor suggests that music is:', opts: ['shallow and boring', 'vast and irresistible, drawing the poet in', 'cold and frightening', 'only for swimmers'], a: 1, why: 'An ocean is vast and pulls everything towards it \u2014 like music\u2019s pull on the poet.' },
      q5: { q: 'Find a word in the extract which means \u201ca repeated pattern of beats or sounds\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['rhythm'] }], why: '\u201cRhythm\u201d is a repeated pattern of beats (\u201cMusic is the rhythm\u201d).' },
      index: 2
    },
    {
      lines: 'The times when I\u2019m most cheerful,\nIt\u2019s clear, music was there.\nMusic is the needed friend\nWhen no one seems to care.',
      q1: { q: 'When, according to the extract, is music present with the poet?', opts: ['Only in her saddest moments', 'In her happiest and most cheerful times too', 'Only during exams', 'Only when she performs'], a: 1, why: 'The extract says in her most cheerful times \u201cIt\u2019s clear, music was there\u201d.' },
      q2: { q: 'What does \u201cmost cheerful\u201d mean?', opts: ['most tired', 'happiest and in highest spirits', 'quietest', 'busiest'], a: 1, why: '\u201cCheerful\u201d means happy and in good spirits.' },
      q4: { q: 'Calling music \u201cthe needed friend\u201d stresses that music is:', opts: ['an expensive hobby', 'a constant companion even when people fail her', 'a passing fashion', 'only a background noise'], a: 1, why: 'A \u201cneeded friend\u201d is dependable when \u201cno one seems to care\u201d.' },
      q5: { q: 'Find a word in the extract which means \u201ca person who accompanies and supports you\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['friend'] }], why: 'A \u201cfriend\u201d accompanies and supports you \u2014 music is called \u201cthe needed friend\u201d.' },
      index: 2
    },
    {
      lines: 'A little said, and truly said,\nCan deeper joy impart\nThan hosts of words, which reach the head,\nBut never touch the heart.',
      q1: { q: 'What, according to the poet, can impart deeper joy?', opts: ['A flood of clever words', 'A few words that are truly said', 'Silence and gestures', 'Long lectures'], a: 1, why: 'The extract says \u201cA little said, and truly said, / Can deeper joy impart\u201d.' },
      q2: { q: 'What does \u201cimpart\u201d mean?', opts: ['to hide away', 'to give or convey', 'to delay', 'to argue'], a: 1, why: '\u201cImpart\u201d means to give or convey (\u201cdeeper joy impart\u201d).' },
      q4: { q: 'Words that \u201creach the head, but never touch the heart\u201d criticise:', opts: ['children\u2019s stories', 'clever but insincere talk', 'printed dictionaries', 'foreign languages'], a: 1, why: 'Impressive words that fail to stir feeling lack sincerity \u2014 that is the criticism.' },
      q5: { q: 'Find a word in the extract which means \u201clarge numbers\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['hosts'] }], why: '\u201cHosts of words\u201d means large numbers of words.' },
      index: 3
    },
    {
      lines: 'The voice that wins its sunny way,\nA lonely home to cheer,\nHath oft the fewest words to say;\nBut, oh! those few, how dear!',
      q1: { q: 'Whose voice can cheer a lonely home, according to the extract?', opts: ['The loudest speaker\u2019s', 'The voice that speaks few but dear words', 'A radio announcer\u2019s', 'A strict judge\u2019s'], a: 1, why: 'The voice with \u201cthe fewest words\u201d \u2014 but those few are \u201chow dear\u201d \u2014 cheers a lonely home.' },
      q2: { q: 'What does \u201ccheer\u201d mean here?', opts: ['to shout at', 'to comfort and make happy', 'to pay for', 'to decorate'], a: 1, why: 'To \u201ccheer\u201d a lonely home is to comfort and gladden it.' },
      q4: { q: 'What does \u201cBut, oh! those few, how dear!\u201d imply about the value of words?', opts: ['Value lies in quantity', 'Value lies in sincerity, not in quantity', 'Dear words are costly to buy', 'Few words are always useless'], a: 1, why: 'The exclamation celebrates the worth of a few sincere words over many hollow ones.' },
      q5: { q: 'Find a word in the extract which means \u201coften\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['oft'] }], why: '\u201cOft\u201d is an archaic form of \u201coften\u201d (\u201cHath oft the fewest words\u201d).' },
      index: 3
    },
    {
      lines: 'I cannot remember my mother\nonly sometimes in the midst of my play\na tune seems to hover over my playthings,\nthe tune of some song that she used to\nhum while rocking my cradle.',
      q1: { q: 'What seems to hover over the poet\u2019s playthings?', opts: ['A butterfly', 'A tune of a song his mother used to hum', 'A dark cloud', 'A temple bell'], a: 1, why: 'The extract says \u201ca tune seems to hover over my playthings\u201d \u2014 the song she hummed at his cradle.' },
      q2: { q: 'What does \u201chover\u201d mean?', opts: ['to fall heavily', 'to remain floating in the air nearby', 'to run fast', 'to hide underground'], a: 1, why: 'To \u201chover\u201d is to linger or float in the air without settling.' },
      q4: { q: 'The memory arriving \u201cin the midst of my play\u201d shows that the mother\u2019s presence:', opts: ['interferes with his games', 'surfaces unexpectedly in ordinary, happy moments', 'was painful for the child', 'exists only in photographs'], a: 1, why: 'The tune visits him mid-play \u2014 the mother returns unasked in daily life.' },
      q5: { q: 'Find a word in the extract which means \u201ca small bed for a baby\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['cradle'] }], why: 'A \u201ccradle\u201d is a baby\u2019s bed (\u201crocking my cradle\u201d).' },
      index: 4
    },
    {
      lines: 'I cannot remember my mother\nonly when from my bedroom window I send\nmy eyes into the blue of the distant sky,\nI feel that the stillness of\nmy mother\u2019s gaze on my face\nhas spread all over the sky.',
      q1: { q: 'Where does the poet send his eyes from his bedroom window?', opts: ['Into the busy street', 'Into the blue of the distant sky', 'Into the garden below', 'At the neighbouring roof'], a: 1, why: 'The extract says he sends his eyes \u201cinto the blue of the distant sky\u201d.' },
      q2: { q: 'What does \u201cstillness\u201d mean?', opts: ['loud noise', 'quiet calm without movement', 'swift motion', 'bright colour'], a: 1, why: '\u201cStillness\u201d is quietness, calm without movement.' },
      q4: { q: 'The feeling that his mother\u2019s gaze \u201chas spread all over the sky\u201d suggests:', opts: ['the sky reminds him of her photograph', 'her loving presence surrounds him everywhere', 'the sky is watching to punish him', 'he is afraid of open spaces'], a: 1, why: 'The whole sky becomes her gaze \u2014 her love envelopes the world he looks at.' },
      q5: { q: 'Find a word in the extract which means \u201ca long, steady look\u201d: <span class="hint">(one word)</span>', parts: [{ a: ['gaze'] }], why: 'A \u201cgaze\u201d is a long, steady look (\u201cmy mother\u2019s gaze\u201d).' },
      index: 4
    }
  ];

  var LETTERS = ['a', 'b', 'c', 'd'];
  var ROMAN = ['i', 'ii', 'iii', 'iv', 'v'];

  var root = document.documentElement;
  try { var savedTheme = localStorage.getItem('c9-lit-q10-theme'); if (savedTheme) root.setAttribute('data-theme', savedTheme); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('c9-lit-q10-theme', next); } catch (e) {}
  });

  var tabsEl = document.getElementById('tabs');
  var extractCard = document.getElementById('extractCard');
  var quiz = document.getElementById('quiz');
  var scorebar = document.getElementById('scorebar');
  var cur = 0;
  var state = EXTRACTS.map(function () { return { sel: {}, text: {}, poemTile: null, poetTile: null, score: null }; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function whyHtml(q) { return q.why ? '<span class="why">' + esc(q.why) + '</span>' : ''; }
  function shuffleDet(arr, seed) {
    var a = arr.slice(); var s = (seed * 2654435761) % 4294967296;
    for (var i = a.length - 1; i > 0; i--) {
      s = (s * 1103515245 + 12345) % 2147483648;
      var j = s % (i + 1); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    var same = a.every(function (v, idx) { return v === arr[idx]; });
    if (same && a.length > 1) a.push(a.shift());
    return a;
  }
  function rotOff(qi) { return ((qi * 2) + cur) % 4; }
  function ansVal(q, qi) { return (q.a + rotOff(qi)) % 4; }

  function renderTabs() {
    tabsEl.innerHTML = EXTRACTS.map(function (p, i) {
      return '<button type="button" class="tab' + (i === cur ? ' active' : '') + '" data-i="' + i + '">Extract ' + (i + 1) + '</button>';
    }).join('');
  }

  function renderExtract() {
    var ex = EXTRACTS[cur];
    var html = '<span class="section-tag">Section C — Literature · Poem Extract</span>';
    html += '<h2>Extract ' + (cur + 1) + ' of 10</h2>';
    html += '<p class="instructions">Read the extract and answer the five questions. The poem and poet are revealed only when you check.</p>';
    html += '<div class="extract">' + esc(ex.lines) + '</div>';
    extractCard.innerHTML = html;
  }

  function mcqHtml(q, qi) {
    var off = rotOff(qi);
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">(' + ROMAN[qi] + ')</span> ' + q.q + '</div>';
    h += '<div class="options">';
    for (var oi = 0; oi < 4; oi++) {
      var src = (oi - off + 4) % 4;
      h += '<button type="button" class="opt" data-val="' + oi + '"><span class="letter">(' + LETTERS[oi] + ')</span><span>' + esc(q.opts[src]) + '</span></button>';
    }
    h += '</div>';
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function vocabHtml(q, qi) {
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">(' + ROMAN[qi] + ')</span> ' + q.q + '</div>';
    q.parts.forEach(function (part, pi) {
      h += '<div class="subpart"><input class="word-input" data-part="' + pi + '" data-key="' + qi + 'p' + pi + '" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type one word"></div>';
    });
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function identifyHtml() {
    var ex = EXTRACTS[cur];
    var poemOrder = shuffleDet(POEMS.map(function (p) { return p.poem; }), cur * 3 + 1);
    var poetOrder = shuffleDet(POEMS.map(function (p) { return p.poet; }).concat(EXTRA_POETS), cur * 5 + 2);
    var h = '<div class="q" data-qi="3" data-identify="1">';
    h += '<div class="qhead"><span class="num">(iii)</span> Identify the poem and the poet. Tap a tile to fill a slot; tap a filled slot to clear it.</div>';
    h += '<div class="identify-box">';
    h += '<div class="slot-row">Poem: <span class="slot" data-kind="poem">tap Poem tile</span></div>';
    h += '<div class="slot-row">Poet: <span class="slot" data-kind="poet">tap Poet tile</span></div>';
    h += '<div class="tiles" data-bank="poem">' + poemOrder.map(function (t) { return '<button type="button" class="tile" data-kind="poem" data-val="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div>';
    h += '<div class="tiles" data-bank="poet">' + poetOrder.map(function (t) { return '<button type="button" class="tile" data-kind="poet" data-val="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div>';
    h += '</div>';
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="reveal"></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function renderQuiz() {
    var ex = EXTRACTS[cur];
    var html = '<p class="instructions"><strong>Five questions per extract:</strong> (i)–(ii) and (iv) tap an option; (iii) identify poem and poet with tiles; (v) type one word from the extract.</p>';
    html += mcqHtml(ex.q1, 0) + mcqHtml(ex.q2, 1) + identifyHtml() + mcqHtml(ex.q4, 3) + vocabHtml(ex.q5, 4);
    html += '<div class="actions"><button class="btn primary" id="checkBtn" type="button">Check answers</button>' +
      '<button class="btn" id="resetBtn" type="button">Reset this extract</button></div>';
    quiz.innerHTML = html;
    restore();
    updateScore();
  }

  function markMcq(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var ans = String(ansVal(q, qi));
    var sel = st.sel[qi];
    qEl.classList.remove('correct', 'wrong');
    qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('correct', 'wrong'); });
    var good = qEl.querySelector('.opt[data-val="' + ans + '"]');
    if (good) good.classList.add('correct');
    if (sel === undefined) {
      if (good) good.classList.remove('correct');
      fb.textContent = 'Not answered yet.';
      fb.className = 'feedback bad';
      return false;
    }
    if (sel !== ans) {
      var bad = qEl.querySelector('.opt[data-val="' + sel + '"]');
      if (bad) { bad.classList.remove('correct'); bad.classList.add('wrong'); }
    }
    var ok = sel === ans;
    fb.innerHTML = esc(ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.') + whyHtml(q);
    fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    qEl.classList.add(ok ? 'correct' : 'wrong');
    return ok;
  }

  function markVocab(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var inp = qEl.querySelector('.word-input');
    var val = (inp.value || '').trim().toLowerCase();
    inp.classList.remove('correct', 'wrong');
    qEl.classList.remove('correct', 'wrong');
    if (!val) {
      fb.textContent = 'Not answered yet (type one word).';
      fb.className = 'feedback bad';
      return false;
    }
    var ok = q.parts[0].a.some(function (x) { return x.toLowerCase() === val; });
    inp.classList.add(ok ? 'correct' : 'wrong');
    var msg = ok ? 'Correct.' : 'Not quite. Correct answer: ' + q.parts[0].a[0] + '.';
    fb.innerHTML = esc(msg) + whyHtml(q);
    fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    qEl.classList.add(ok ? 'correct' : 'wrong');
    return ok;
  }

  function markIdentify() {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="3"]');
    if (!qEl) return false;
    var ex = EXTRACTS[cur];
    var poemEl = qEl.querySelector('.slot[data-kind="poem"]');
    var poetEl = qEl.querySelector('.slot[data-kind="poet"]');
    poemEl.classList.remove('correct', 'wrong');
    poetEl.classList.remove('correct', 'wrong');
    var fb = qEl.querySelector('.feedback');
    var reveal = qEl.querySelector('.reveal');
    reveal.classList.add('shown');
    reveal.textContent = 'This extract is from \u201c' + POEMS[ex.index].poem + '\u201d by ' + POEMS[ex.index].poet + '.';
    if (!st.poemTile || !st.poetTile) {
      poemEl.classList.add(st.poemTile === POEMS[ex.index].poem ? 'correct' : 'wrong');
      poetEl.classList.add(st.poetTile === POEMS[ex.index].poet ? 'correct' : 'wrong');
      if (st.poemTile === POEMS[ex.index].poem) poemEl.classList.remove('wrong');
      if (st.poetTile === POEMS[ex.index].poet) poetEl.classList.remove('wrong');
      fb.textContent = 'Not answered yet (fill both slots).';
      fb.className = 'feedback bad';
      qEl.classList.add('wrong');
      return false;
    }
    var poemOk = st.poemTile === POEMS[ex.index].poem;
    var poetOk = st.poetTile === POEMS[ex.index].poet;
    poemEl.classList.add(poemOk ? 'correct' : 'wrong');
    poetEl.classList.add(poetOk ? 'correct' : 'wrong');
    var msg = poemOk && poetOk ? 'Correct \u2014 poem and poet both right.' :
      poemOk ? 'Poem right, poet wrong.' :
      poetOk ? 'Poet right, poem wrong.' : 'Both wrong.';
    fb.innerHTML = esc(msg) + '<span class="why">' + esc(ex.whyIdentify || 'The imagery and refrain of this stanza belong to this poem.') + '</span>';
    fb.className = 'feedback ' + (poemOk && poetOk ? 'ok' : 'bad');
    qEl.classList.add(poemOk && poetOk ? 'correct' : 'wrong');
    return poemOk && poetOk;
  }

  function showAnswer(q, qi, kind) {
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return;
    var fb = qEl.querySelector('.feedback');
    if (kind === 'vocab') {
      var inp = qEl.querySelector('.word-input');
      inp.value = q.parts[0].a[0];
      state[cur].text[qi] = q.parts[0].a[0];
      fb.innerHTML = esc('Answer: ' + q.parts[0].a[0] + '.') + whyHtml(q);
    } else if (kind === 'identify') {
      var ex = EXTRACTS[cur];
      state[cur].poemTile = POEMS[ex.index].poem;
      state[cur].poetTile = POEMS[ex.index].poet;
      fillIdentify();
      var reveal = qEl.querySelector('.reveal');
      reveal.classList.add('shown');
      reveal.textContent = 'This extract is from \u201c' + POEMS[ex.index].poem + '\u201d by ' + POEMS[ex.index].poet + '.';
      qEl.querySelectorAll('.slot').forEach(function (s) { s.classList.remove('wrong'); s.classList.add('correct'); });
      fb.innerHTML = esc('Answer: ' + POEMS[ex.index].poem + ' \u2014 ' + POEMS[ex.index].poet + '.');
    } else {
      var av = ansVal(q, qi);
      qEl.querySelectorAll('.opt').forEach(function (b) {
        b.classList.toggle('correct', b.getAttribute('data-val') === String(av));
      });
      fb.innerHTML = esc('Answer: (' + LETTERS[av] + ') ' + q.opts[q.a] + '.') + whyHtml(q);
    }
    fb.className = 'feedback info';
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'true'); sb.textContent = 'Hide answer'; }
  }

  function fillIdentify() {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="3"]');
    if (!qEl) return;
    var poemEl = qEl.querySelector('.slot[data-kind="poem"]');
    var poetEl = qEl.querySelector('.slot[data-kind="poet"]');
    poemEl.textContent = st.poemTile || 'tap Poem tile';
    poetEl.textContent = st.poetTile || 'tap Poet tile';
    poemEl.classList.toggle('filled', !!st.poemTile);
    poetEl.classList.toggle('filled', !!st.poetTile);
    qEl.querySelectorAll('.tile').forEach(function (tile) {
      var kind = tile.getAttribute('data-kind');
      var used = (kind === 'poem' ? st.poemTile === tile.getAttribute('data-val') : st.poetTile === tile.getAttribute('data-val'));
      tile.classList.toggle('used', used);
    });
  }

  function restore() {
    var st = state[cur];
    Object.keys(st.sel).forEach(function (qi) {
      var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
      if (!qEl) return;
      var b = qEl.querySelector('.opt[data-val="' + st.sel[qi] + '"]');
      if (b) b.classList.add('selected');
    });
    Object.keys(st.text).forEach(function (qi) {
      var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
      if (!qEl) return;
      var inp = qEl.querySelector('.word-input');
      if (inp) inp.value = st.text[qi];
    });
    fillIdentify();
    if (st.score !== null) {
      var ex = EXTRACTS[cur];
      markMcq(ex.q1, 0); markMcq(ex.q2, 1); markIdentify(); markMcq(ex.q4, 3); markVocab(ex.q5, 4);
    }
  }

  function updateScore() {
    var st = state[cur];
    var checked = state.filter(function (s) { return s.score !== null; });
    var total = checked.reduce(function (a, s) { return a + s.score; }, 0);
    var head = 'Extract ' + (cur + 1) + ': ' + (st.score === null ? '—' : st.score) + ' / 5';
    var note = checked.length
      ? 'Checked so far: ' + checked.length + ' of ' + EXTRACTS.length + ' extracts · ' + total + ' / ' + (checked.length * 5) + ' overall.'
      : 'Tap an option to choose it; you can change it any time before you check.';
    scorebar.innerHTML = head + '<div class="small">' + note + '</div>';
  }

  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tab');
    if (tab) {
      cur = Number(tab.getAttribute('data-i'));
      renderTabs();
      renderExtract();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    if (ev.target.id === 'checkBtn') {
      var ex = EXTRACTS[cur];
      var score = 0;
      if (markMcq(ex.q1, 0)) score++;
      if (markMcq(ex.q2, 1)) score++;
      if (markIdentify()) score++;
      if (markMcq(ex.q4, 3)) score++;
      if (markVocab(ex.q5, 4)) score++;
      state[cur].score = score;
      updateScore();
      return;
    }

    if (ev.target.id === 'resetBtn') {
      state[cur] = { sel: {}, text: {}, poemTile: null, poetTile: null, score: null };
      renderQuiz();
      updateScore();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    var tile = ev.target.closest('.tile');
    if (tile && quiz.contains(tile)) {
      var kind = tile.getAttribute('data-kind');
      var st = state[cur];
      var val = tile.getAttribute('data-val');
      var qEl = tile.closest('.q');
      if (kind === 'poem') st.poemTile = (st.poemTile === val) ? null : val;
      else st.poetTile = (st.poetTile === val) ? null : val;
      st.score = null;
      qEl.classList.remove('correct', 'wrong');
      qEl.querySelectorAll('.slot').forEach(function (s) { s.classList.remove('correct', 'wrong'); });
      var fb2 = qEl.querySelector('.feedback');
      fb2.textContent = '';
      fb2.className = 'feedback';
      fillIdentify();
      updateScore();
      return;
    }

    var sb = ev.target.closest('.show-ans');
    if (sb && quiz.contains(sb)) {
      var qBox = sb.closest('.q');
      var qi = Number(qBox.getAttribute('data-qi'));
      var exx = EXTRACTS[cur];
      if (sb.getAttribute('data-shown') === 'true') {
        var fb3 = qBox.querySelector('.feedback');
        fb3.textContent = '';
        fb3.className = 'feedback';
        qBox.classList.remove('correct', 'wrong');
        qBox.querySelectorAll('.opt').forEach(function (b) {
          b.classList.remove('correct', 'wrong');
          var sel = state[cur].sel[qi];
          if (sel !== undefined && b.getAttribute('data-val') === sel) b.classList.add('selected');
        });
        qBox.querySelectorAll('.slot').forEach(function (s) { s.classList.remove('correct', 'wrong'); });
        var rev = qBox.querySelector('.reveal');
        if (rev) rev.classList.remove('shown');
        sb.setAttribute('data-shown', 'false');
        sb.textContent = 'Show answer';
      } else {
        if (qi === 3) showAnswer(null, 3, 'identify');
        else if (qi === 4) showAnswer(exx.q5, 4, 'vocab');
        else if (qi === 0) showAnswer(exx.q1, 0);
        else if (qi === 1) showAnswer(exx.q2, 1);
        else showAnswer(exx.q4, 3);
      }
      return;
    }

    var opt = ev.target.closest('.opt');
    if (opt && quiz.contains(opt)) {
      var qBox2 = opt.closest('.q');
      var qi2 = Number(qBox2.getAttribute('data-qi'));
      qBox2.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected', 'correct', 'wrong'); });
      opt.classList.add('selected');
      state[cur].sel[qi2] = opt.getAttribute('data-val');
      state[cur].score = null;
      qBox2.classList.remove('correct', 'wrong');
      var fb4 = qBox2.querySelector('.feedback');
      fb4.textContent = '';
      fb4.className = 'feedback';
      var sbx = qBox2.querySelector('.show-ans');
      if (sbx) { sbx.setAttribute('data-shown', 'false'); sbx.textContent = 'Show answer'; }
      updateScore();
    }
  });

  document.addEventListener('input', function (ev) {
    var inp = ev.target.closest ? ev.target.closest('.word-input') : null;
    if (!inp || !quiz.contains(inp)) return;
    var qBox = inp.closest('.q');
    var qi = Number(qBox.getAttribute('data-qi'));
    state[cur].text[qi] = inp.value;
    state[cur].score = null;
    inp.classList.remove('correct', 'wrong');
    qBox.classList.remove('correct', 'wrong');
    var fb = qBox.querySelector('.feedback');
    fb.textContent = '';
    fb.className = 'feedback';
    var sbx = qBox.querySelector('.show-ans');
    if (sbx) { sbx.setAttribute('data-shown', 'false'); sbx.textContent = 'Show answer'; }
    updateScore();
  });

  renderTabs();
  renderExtract();
  renderQuiz();
})();
</script>
</body>
</html>
