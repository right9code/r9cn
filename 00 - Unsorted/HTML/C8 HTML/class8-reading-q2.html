        { t: 'tf', q: 'State whether the following statement is TRUE or FALSE: “The school criticised students for their food choices.”', a: false, why: 'The aim was not to criticise anyone’s food choices, but to help students understand healthier options.' },
        { t: 'mcq', q: 'Complete the sentence: The coordinator said healthy habits grow stronger when students learn ____________.', opts: ['through strict rules alone', 'in a friendly and supportive environment', 'without any guidance', 'only from charts on walls'], a: 1, why: 'Healthy habits grow stronger in a friendly and supportive environment rather than through strict rules alone.' },
        { t: 'text', q: 'Calculate and fill in the blank: The total number of healthy items recorded in the survey was ____________. <span class="hint">(one word)</span>', parts: [{ a: ['180'], num: true }], why: 'The total is 55 + 40 + 35 + 30 + 20 = 180 items.' }
      ]
    }
  ];

  var ROMAN = ['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii', 'viii', 'ix', 'x'];
  var LETTERS = ['a', 'b', 'c', 'd'];

  var root = document.documentElement;
  try { var savedTheme = localStorage.getItem('c8-reading-q2-theme'); if (savedTheme) root.setAttribute('data-theme', savedTheme); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('c8-reading-q2-theme', next); } catch (e) {}
  });

  var tabsEl = document.getElementById('tabs');
  var passageCard = document.getElementById('passageCard');
  var quiz = document.getElementById('quiz');
  var scorebar = document.getElementById('scorebar');
  var cur = 0;
  var state = PASSAGES.map(function () { return { sel: {}, text: {}, res: {}, score: null }; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function norm(s) { return (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' '); }
  function whyHtml(q) { return q.why ? '<span class="why">' + esc(q.why) + '</span>' : ''; }

  function renderTabs() {
    tabsEl.innerHTML = PASSAGES.map(function (p, i) {
      return '<button type="button" class="tab' + (i === cur ? ' active' : '') + '" data-i="' + i + '">Passage ' + (i + 1) + '</button>';
    }).join('');
  }

  function renderPassage() {
    var p = PASSAGES[cur];
    var html = '<span class="section-tag">Section A — Reading Skill</span>';
    html += '<h2>' + (cur + 1) + '. ' + esc(p.title) + '</h2>';
    html += '<div class="passage">' + p.paras.map(function (t) { return '<p>' + t + '</p>'; }).join('');
    if (p.table) {
      var tb = p.table;
      html += '<div class="table-wrap"><table aria-label="' + esc(tb.caption) + '"><thead><tr>' +
        tb.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        tb.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table></div>';
    }
    html += '</div>';
    passageCard.innerHTML = html;
  }

  function questionHtml(q, qi) {
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">(' + ROMAN[qi] + ')</span> ' + q.q + '</div>';
    if (q.t === 'mcq' || q.t === 'tf') {
      var opts = q.t === 'tf' ? ['TRUE', 'FALSE'] : q.opts;
      h += '<div class="options">';
      opts.forEach(function (o, oi) {
        var val = q.t === 'tf' ? (oi === 0 ? 'true' : 'false') : String(oi);
        h += '<button type="button" class="opt" data-val="' + val + '">' +
          (q.t === 'tf' ? '' : '<span class="letter">(' + LETTERS[oi] + ')</span>') +
          '<span>' + esc(o) + '</span></button>';
      });
      h += '</div>';
    } else {
      q.parts.forEach(function (part, pi) {
        var id = 'q' + qi + 'p' + pi;
        h += '<div class="subpart">';
        if (part.label) h += '<label for="' + id + '">' + esc(part.label) + '</label>';
        h += '<input id="' + id + '" class="word-input" data-part="' + pi + '" type="text" inputmode="' +
          (part.num ? 'numeric' : 'text') + '" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type one word">';
        h += '</div>';
      });
    }
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div></div>';
    return h;
  }

  function renderQuiz() {
    var p = PASSAGES[cur];
    var html = '<p class="instructions"><strong>Answer the questions.</strong> Tap an option where choices are given; type <strong>one word</strong> where the answer is one word (capital or small letters both accepted). Use <strong>Check answers</strong> for feedback on all ten, or <strong>Show answer</strong> on a single question to see the model answer and why.</p>';
    html += p.questions.map(questionHtml).join('');
    html += '<div class="actions"><button class="btn primary" id="checkBtn" type="button">Check answers</button><button class="btn" id="resetBtn" type="button">Reset this passage</button></div>';
    quiz.innerHTML = html;
    restore();
    updateScore();
  }

  function resetShow(qEl) { var sb = qEl.querySelector('.show-ans'); if (sb) { sb.setAttribute('data-shown', 'false'); sb.textContent = 'Show answer'; } }

  function mark(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var ok = false;
    qEl.classList.remove('correct', 'wrong');
    if (q.t === 'mcq' || q.t === 'tf') {
      var ans = String(q.a);
      var sel = st.sel[qi];
      qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('correct', 'wrong'); });
      var good = qEl.querySelector('.opt[data-val="' + ans + '"]');
      if (good) good.classList.add('correct');
      if (sel === undefined) { if (good) good.classList.remove('correct'); fb.textContent = 'Not answered yet.'; fb.className = 'feedback bad'; return false; }
      if (sel !== ans) { var bad = qEl.querySelector('.opt[data-val="' + sel + '"]'); if (bad) { bad.classList.remove('correct'); bad.classList.add('wrong'); } }
      ok = sel === ans;
      fb.innerHTML = esc(ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.') + whyHtml(q);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    } else {
      var inputs = qEl.querySelectorAll('.word-input');
      var filled = true, goodCount = 0;
      q.parts.forEach(function (part, pi) {
        var inp = inputs[pi];
        var val = norm((st.text[qi] || [])[pi] || '');
        if (!inp) return;
        inp.classList.remove('correct', 'wrong');
        if (!val) { filled = false; return; }
        if (part.a.some(function (x) { return norm(x) === val; })) { goodCount++; inp.classList.add('correct'); }
        else inp.classList.add('wrong');
      });
      if (!filled) { fb.textContent = q.parts.length > 1 ? 'Not answered yet (fill in both parts, one word each).' : 'Not answered yet (type one word).'; fb.className = 'feedback bad'; return false; }
      ok = goodCount === q.parts.length;
      var msg;
      if (ok) msg = 'Correct.';
      else if (q.parts.length > 1) msg = 'Not quite. Correct answers: ' + q.parts.map(function (part, pi) { return '(' + LETTERS[pi] + ') ' + part.a[0]; }).join(', ') + '.';
      else msg = 'Not quite. Correct answer: ' + q.parts[0].a[0] + '.';
      fb.innerHTML = esc(msg) + whyHtml(q);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    }
    qEl.classList.add(ok ? 'correct' : 'wrong');
    st.res[qi] = ok;
    return ok;
  }

  function showAnswer(q, qi) {
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return;
    var fb = qEl.querySelector('.feedback');
    if (q.t === 'mcq' || q.t === 'tf') {
      var ans = String(q.a);
      qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.toggle('correct', b.getAttribute('data-val') === ans); });
      var label = q.t === 'tf' ? (q.a ? 'TRUE' : 'FALSE') : '(' + LETTERS[q.a] + ') ' + q.opts[q.a];
      fb.innerHTML = esc('Answer: ' + label + '.') + whyHtml(q);
    } else {
      var txt = q.parts.map(function (part, pi) { return q.parts.length > 1 ? '(' + LETTERS[pi] + ') ' + part.a[0] : part.a[0]; }).join('; ');
      fb.innerHTML = esc('Answer: ' + txt + '.') + whyHtml(q);
    }
    fb.className = 'feedback info';
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'true'); sb.textContent = 'Hide answer'; }
  }

  function restore() {
    var st = state[cur];
    PASSAGES[cur].questions.forEach(function (q, qi) {
      var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
      if (!qEl) return;
      if (st.sel[qi] !== undefined) { var b = qEl.querySelector('.opt[data-val="' + st.sel[qi] + '"]'); if (b) b.classList.add('selected'); }
      if (st.text[qi]) { var inputs = qEl.querySelectorAll('.word-input'); st.text[qi].forEach(function (v, pi) { if (inputs[pi]) inputs[pi].value = v; }); }
    });
    if (st.score !== null) { PASSAGES[cur].questions.forEach(function (q, qi) { mark(q, qi); }); }
  }

  function updateScore() {
    var st = state[cur];
    var checked = state.filter(function (s) { return s.score !== null; });
    var total = checked.reduce(function (a, s) { return a + s.score; }, 0);
    var head = 'Passage ' + (cur + 1) + ': ' + (st.score === null ? '—' : st.score) + ' / ' + PASSAGES[cur].questions.length;
    var note = checked.length ? 'Checked so far: ' + checked.length + ' of ' + PASSAGES.length + ' passages · ' + total + ' / ' + (checked.length * PASSAGES[cur].questions.length) + ' correct.' : 'Tap an option to choose it; you can change it any time before you check.';
    scorebar.innerHTML = head + '<div class="small">' + note + '</div>';
  }

  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tab');
    if (tab) { cur = Number(tab.getAttribute('data-i')); renderTabs(); renderPassage(); renderQuiz(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (ev.target.id === 'checkBtn') { var score = 0; PASSAGES[cur].questions.forEach(function (q, qi) { if (mark(q, qi)) score++; }); state[cur].score = score; updateScore(); return; }
    if (ev.target.id === 'resetBtn') { state[cur] = { sel: {}, text: {}, res: {}, score: null }; renderQuiz(); updateScore(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    var sb = ev.target.closest('.show-ans');
    if (sb && quiz.contains(sb)) {
      var qEl = sb.closest('.q'); var qi = Number(qEl.getAttribute('data-qi'));
      if (sb.getAttribute('data-shown') === 'true') {
        var fb = qEl.querySelector('.feedback'); fb.textContent = ''; fb.className = 'feedback';
        qEl.classList.remove('correct', 'wrong');
        qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('correct', 'wrong'); if (state[cur].sel[qi] !== undefined && b.getAttribute('data-val') === state[cur].sel[qi]) b.classList.add('selected'); });
        resetShow(qEl);
      } else { showAnswer(PASSAGES[cur].questions[qi], qi); }
      return;
    }
    var opt = ev.target.closest('.opt');
    if (opt && quiz.contains(opt)) {
      var qBox = opt.closest('.q'); var qi2 = Number(qBox.getAttribute('data-qi'));
      qBox.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected', 'correct', 'wrong'); });
      opt.classList.add('selected'); state[cur].sel[qi2] = opt.getAttribute('data-val');
      delete state[cur].res[qi2]; state[cur].score = null;
      qBox.classList.remove('correct', 'wrong'); var fb2 = qBox.querySelector('.feedback'); fb2.textContent = ''; fb2.className = 'feedback';
      resetShow(qBox); updateScore();
    }
  });

  document.addEventListener('input', function (ev) {
    var inp = ev.target.closest ? ev.target.closest('.word-input') : null;
    if (!inp || !quiz.contains(inp)) return;
    var qBox = inp.closest('.q'); var qi = Number(qBox.getAttribute('data-qi')); var pi = Number(inp.getAttribute('data-part'));
    var st = state[cur]; st.text[qi] = st.text[qi] || []; st.text[qi][pi] = inp.value;
    delete st.res[qi]; st.score = null;
    inp.classList.remove('correct', 'wrong'); qBox.classList.remove('correct', 'wrong');
    var fb = qBox.querySelector('.feedback'); fb.textContent = ''; fb.className = 'feedback';
    resetShow(qBox); updateScore();
  });

  renderTabs(); renderPassage(); renderQuiz();
})();
</script>
</body>
</html>
