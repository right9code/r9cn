        'Long before modern satellites could photograph the earth, a young woman named Naina Rawat was already drawing careful maps of the hills around her home in Uttarakhand. Born in 1942 in a remote mountain village, Naina grew up watching her father guide travellers along narrow forest paths. He was a postman who walked for miles each day, carrying letters across streams and steep slopes, and Naina often followed him on holidays.',
        'As a child, Naina was fascinated by the shapes of rivers, ridges and valleys. She would collect stones, leaves and bits of charcoal, and use them to sketch the land on the ground outside her house. Her teachers at the village school noticed her talent and encouraged her to study geography. Although books were scarce, Naina borrowed whatever she could find and spent her evenings reading by the light of an oil lamp.',
        'After completing her studies in Dehradun, Naina joined a government survey team. At that time, very few women worked in field surveying, and many people doubted whether she could manage the difficult mountain terrain. Naina proved them wrong through determination and patience. She walked long distances, climbed rocky paths and recorded every detail with accuracy.',
        'Over the years, Naina helped prepare maps that were later used to build roads, schools and health centres in remote areas. Her work made it easier for villagers to receive supplies during harsh winters and for rescue teams to reach people during landslides. She believed that a good map was not merely a drawing, but a tool that could save lives.',
        'Even after her retirement, Naina continued to teach young students how to observe nature closely. She reminded them that the land always tells a story, and that those who learn to read it carefully can serve their communities in remarkable ways. Today, many young surveyors in the region still speak of her with respect and gratitude.'

        { t: 'mcq', q: 'What work did Naina’s father do?', opts: ['He was a schoolteacher', 'He was a forest guard', 'He was a postman', 'He was a shopkeeper'], a: 2, why: 'Her father was a postman who walked for miles each day carrying letters.' },

        { t: 'mcq', q: 'How did Naina’s maps help people in remote areas?', opts: ['They helped build roads, schools and health centres and aided rescue teams', 'They were sold as paintings in cities', 'They were used only for school lessons', 'They showed tourists where to shop'], a: 0, why: 'Her maps were used to build roads, schools and health centres and helped rescue teams reach people during landslides.' },

        'It had been raining without pause for three days in the riverside town of Dharapur. The sky remained a dull grey, and the sound of water filled every street. At first, people were not worried because the monsoon often brought heavy showers. But by the evening of the third day, the river began to swell, creeping closer to the rows of small houses along its bank.',
        'Aarav, a Class VIII student, noticed the danger when he saw muddy water slipping into the lane behind his home. He remembered the safety drill his school had conducted earlier that year. Instead of panicking, he urged his family to gather important papers, medicines and a torch, and to move to the community hall on higher ground.',
        'As they stepped out, Aarav saw that some neighbours were still inside their houses, unsure of what to do. He called out to them and explained that the water level was rising quickly. Together with a few older boys, he helped an elderly couple carry their bags and guided two small children through the flooded lane.',
        'By midnight, dozens of families had taken shelter in the hall. Volunteers distributed dry food and blankets, while teachers from the local school kept a list of everyone who had arrived. The rain continued to fall, but there was a sense of calm because people were looking out for one another.',
        'Two days later, the water slowly receded, leaving behind mud and broken fences. Cleaning the town took time and effort, yet the residents felt grateful that no lives had been lost. Aarav realised that courage was not always loud or dramatic; sometimes it was simply the decision to stay alert and help others at the right moment.'

        { t: 'mcq', q: 'What made Aarav realise that the situation was dangerous?', opts: ['He heard thunder in the distance', 'He saw muddy water slipping into the lane behind his home', 'He received a phone call from his teacher', 'He saw the river drying up'], a: 1, why: 'Aarav noticed the danger when he saw muddy water slipping into the lane behind his home.' },
        { t: 'mcq', q: 'Where did Aarav take his family for safety?', opts: ['To the riverbank', 'To the market', 'To the community hall on higher ground', 'To a neighbour’s basement'], a: 2, why: 'He urged his family to move to the community hall on higher ground.' },

    {
      title: 'A Library on Wheels',
      paras: [
        'In several dusty villages of Rajasthan, where the nearest town library is many kilometres away, a bright blue bus arrives every Saturday morning. Painted with pictures of open books and smiling children, the bus is known as the Mobile Pathshala. It carries more than two thousand books, a small computer, and a cheerful librarian named Farida Begum.',
        'Farida started the travelling library in 2015 after noticing that many children in her district loved stories but had very little to read. Her own childhood had been shaped by books borrowed from a neighbour, and she wanted to give other children the same chance. With support from a local education group, she converted an old bus into a moving library.',
        'Inside the bus, shelves are neatly arranged by age and subject. There are picture books for younger children, adventure stories for older readers, and reference books for students preparing for exams. Farida also keeps a box of puzzles and magazines, because she believes that reading should feel joyful rather than forced.',
        'The Mobile Pathshala does more than lend books. Farida reads aloud to small groups, helps children choose books that match their interests, and encourages them to return the following week to share what they have read. For many families, Saturday has become the most eagerly awaited day of the week.',
        'Over the years, the bus has inspired several children to write their own stories and poems. Some have even started small reading corners in their homes. Farida says that a library does not always need tall walls and silent rooms; sometimes, all it needs is wheels and a willing heart.'
      ],
      questions: [

        { t: 'mcq', q: 'Why did Farida Begum start the travelling library?', opts: ['To sell books in distant towns', 'Because many children loved stories but had very little to read', 'To replace all school teachers', 'Because she wanted to travel for fun'], a: 1, why: 'She started it after noticing that many children loved stories but had very little to read.' },
        { t: 'mcq', q: 'How many books does the bus carry?', opts: ['More than five hundred', 'More than one thousand', 'More than two thousand', 'Exactly one hundred'], a: 2, why: 'The bus carries more than two thousand books, a small computer, and a librarian.' },
        { t: 'mcq', q: 'Why does Farida keep puzzles and magazines in the bus?', opts: ['To decorate the shelves', 'Because she believes reading should feel joyful rather than forced', 'Because textbooks are not allowed', 'To give them as prizes only'], a: 1, why: 'She keeps puzzles and magazines because she believes reading should feel joyful rather than forced.' },
        { t: 'mcq', q: 'What has the Mobile Pathshala inspired some children to do?', opts: ['To stop going to school', 'To write their own stories and poems', 'To paint the bus every week', 'To move to the city'], a: 1, why: 'The bus has inspired several children to write their own stories and poems.' },
        { t: 'text', q: 'In which year did Farida start the travelling library? <span class="hint">(one word)</span>', parts: [{ a: ['2015'] }], why: 'Farida started the travelling library in 2015.' },
        { t: 'text', q: 'Find words from the passage which mean the following: <span class="hint">(one word each)</span>', parts: [{ label: '(a) changed the form or purpose of something —', a: ['converted'] }, { label: '(b) waiting for something with excitement —', a: ['eagerly'] }], why: '“Converted” means changed in form or purpose; “eagerly” means with excitement or keen interest.' },

    {
      title: 'The Weaver Who Would Not Give Up',
      paras: [
        'In a small town in Kutch, Gujarat, a young weaver named Salim Hussain learned the craft of handloom weaving from his grandfather. The family had been making traditional shawls and rugs for generations, using patterns passed down through memory and practice. Salim loved the rhythm of the loom and the bright colours of the threads, but by the time he was twenty, machine-made cloth was flooding the market.',
        'Cheap factory products were faster to produce and easier to sell. Many local weavers began to abandon their looms and search for other work. Salim’s income dropped sharply, and some relatives advised him to close the workshop. For a while, he felt discouraged and uncertain about the future of his family’s craft.',
        'Instead of giving up, Salim decided to adapt. He travelled to nearby cities to understand what customers wanted and noticed a growing interest in handmade, eco-friendly products. He began experimenting with natural dyes made from plants and introduced new designs while keeping the traditional patterns alive. Each piece he created carried a small label telling the story of the weaver behind it.',
        'Slowly, his work found new buyers. A craft fair in Ahmedabad brought him his first large order, and later a women’s cooperative helped him sell his products online. Salim also trained a group of young apprentices so that the skill would not disappear from his town.',

      ],
      questions: [

        { t: 'mcq', q: 'Why did many local weavers abandon their looms?', opts: ['Because they disliked bright colours', 'Because cheap machine-made cloth was easier to sell', 'Because weaving was banned in the town', 'Because there was no thread available'], a: 1, why: 'Cheap factory products were faster to produce and easier to sell, so many weavers left the craft.' },
        { t: 'mcq', q: 'What new idea did Salim try while keeping traditional patterns?', opts: ['He stopped weaving completely', 'He used natural dyes and introduced new designs', 'He replaced handlooms with machines', 'He moved to another country'], a: 1, why: 'He experimented with natural dyes and introduced new designs while keeping traditional patterns alive.' },
        { t: 'mcq', q: 'Where did Salim receive his first large order?', opts: ['At a craft fair in Ahmedabad', 'At a market in Delhi', 'At his own house', 'At a school exhibition'], a: 0, why: 'A craft fair in Ahmedabad brought him his first large order.' },
        { t: 'mcq', q: 'What does Salim’s journey show?', opts: ['That old arts cannot survive', 'That perseverance and creativity can give new life to an old art', 'That only machines can make cloth', 'That tradition must never change at all'], a: 1, why: 'His journey shows that perseverance, combined with creativity, can breathe new life into an old art.' },

    {

        'During a summer camp in Coorg, a group of students visited a small bee farm tucked away among coffee plantations. The farm belonged to Mr Joseph, a retired science teacher who had taken up beekeeping as a hobby. At first, the students were nervous about being so close to thousands of buzzing insects, but Mr Joseph’s calm manner soon put them at ease.',
        'Wearing protective nets, the students watched as Mr Joseph gently lifted a wooden frame covered with bees. He explained that every beehive has a clear system of work. The queen bee lays eggs, the worker bees collect nectar and care for the young, and the drones have their own specific role. No bee works for itself alone; the survival of the hive depends on cooperation.',
        'Mr Joseph also showed the students how bees communicate through movements known as the “waggle dance”. By dancing in a particular pattern, a bee can tell others where to find flowers rich in nectar. The students were amazed that such tiny creatures could share information so precisely.',

        { t: 'mcq', q: 'How do bees tell others where to find flowers rich in nectar?', opts: ['By making loud sounds', 'By changing colour', 'Through movements known as the waggle dance', 'By carrying written signs'], a: 2, why: 'Bees communicate through movements known as the “waggle dance”.' },
        { t: 'mcq', q: 'Why did Mr Joseph say bees are important for farming?', opts: ['Because they scare away birds', 'Because they help pollinate many fruits and vegetables', 'Because they make the soil softer', 'Because they bring rain to crops'], a: 1, why: 'He explained that bees help pollinate many of the fruits and vegetables people eat every day.' },
        { t: 'text', q: 'What protective clothing did the students wear during the visit? <span class="hint">(one word)</span>', parts: [{ a: ['nets', 'net'] }], why: 'Wearing protective nets, the students watched Mr Joseph lift a wooden frame.' },
        { t: 'text', q: 'Find words from the passage which mean the following: <span class="hint">(one word each)</span>', parts: [{ label: '(a) sweet liquid collected by bees from flowers —', a: ['nectar'] }, { label: '(b) exactly and correctly —', a: ['precisely'] }], why: '“Nectar” is the sweet liquid from flowers; “precisely” means exactly and correctly.' },
        { t: 'tf', q: 'State whether the following statement is TRUE or FALSE: “Each bee in the hive works only for itself.”', a: false, why: 'No bee works for itself alone; the survival of the hive depends on cooperation.' },
        { t: 'mcq', q: 'Complete the sentence: The beehive taught the students about discipline, teamwork and ____________.', opts: ['fear of insects', 'respect for nature', 'the value of silence', 'the need for speed'], a: 1, why: 'It had shown them how discipline, teamwork and respect for nature could exist together in perfect balance.' },
        { t: 'text', q: 'Fill in the blank: Mr Joseph lifted a wooden ____________ covered with bees. <span class="hint">(one word)</span>', parts: [{ a: ['frame'] }], why: 'Mr Joseph gently lifted a wooden frame covered with bees.' }
      ]
    }
  ];

  var ROMAN = ['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii', 'viii', 'ix', 'x'];
  var LETTERS = ['a', 'b', 'c', 'd'];

  var root = document.documentElement;
  try { var savedTheme = localStorage.getItem('c8-reading-theme'); if (savedTheme) root.setAttribute('data-theme', savedTheme); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('c8-reading-theme', next); } catch (e) {}
  });

  var tabsEl = document.getElementById('tabs');
  var passageCard = document.getElementById('passageCard');
  var quiz = document.getElementById('quiz');
  var scorebar = document.getElementById('scorebar');
  var cur = 0;
  var state = PASSAGES.map(function () { return { sel: {}, text: {}, res: {}, score: null }; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function norm(s) { return (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' '); }
  function whyHtml(q) { return q.why ? '<span class="why">' + esc(q.why) + '</span>' : ''; }

  function renderTabs() {
    tabsEl.innerHTML = PASSAGES.map(function (p, i) {
      return '<button type="button" class="tab' + (i === cur ? ' active' : '') + '" data-i="' + i + '">Passage ' + (i + 1) + '</button>';
    }).join('');
  }

  function renderPassage() {
    var p = PASSAGES[cur];
    var html = '<span class="section-tag">Section A — Reading Skill</span>';
    html += '<h2>' + (cur + 1) + '. ' + esc(p.title) + '</h2>';
    html += '<div class="passage">' + p.paras.map(function (t) { return '<p>' + t + '</p>'; }).join('');
    if (p.table) {
      var tb = p.table;
      html += '<div class="table-wrap"><table aria-label="' + esc(tb.caption) + '"><thead><tr>' +
        tb.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        tb.rows.map(function (r) {
          return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</div>';
    passageCard.innerHTML = html;
  }

  function questionHtml(q, qi) {
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">(' + ROMAN[qi] + ')</span> ' + q.q + '</div>';
    if (q.t === 'mcq' || q.t === 'tf') {
      var opts = q.t === 'tf' ? ['TRUE', 'FALSE'] : q.opts;
      h += '<div class="options">';
      opts.forEach(function (o, oi) {
        var val = q.t === 'tf' ? (oi === 0 ? 'true' : 'false') : String(oi);
        h += '<button type="button" class="opt" data-val="' + val + '">' +
          (q.t === 'tf' ? '' : '<span class="letter">(' + LETTERS[oi] + ')</span>') +
          '<span>' + esc(o) + '</span></button>';
      });
      h += '</div>';
    } else {
      q.parts.forEach(function (part, pi) {
        var id = 'q' + qi + 'p' + pi;
        h += '<div class="subpart">';
        if (part.label) h += '<label for="' + id + '">' + esc(part.label) + '</label>';
        h += '<input id="' + id + '" class="word-input" data-part="' + pi + '" type="text" inputmode="' +
          (part.num ? 'numeric' : 'text') + '" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type one word">';
        h += '</div>';
      });
    }
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function renderQuiz() {
    var p = PASSAGES[cur];
    var html = '<p class="instructions"><strong>Answer the questions.</strong> Tap an option where choices are given; type <strong>one word</strong> where the answer is one word (capital or small letters both accepted). Use <strong>Check answers</strong> for feedback on all ten, or <strong>Show answer</strong> on a single question to see the model answer and why.</p>';
    html += p.questions.map(questionHtml).join('');
    html += '<div class="actions"><button class="btn primary" id="checkBtn" type="button">Check answers</button>' +
      '<button class="btn" id="resetBtn" type="button">Reset this passage</button></div>';
    quiz.innerHTML = html;
    restore();
    updateScore();
  }

  function resetShow(qEl) {
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'false'); sb.textContent = 'Show answer'; }
  }

  function mark(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var ok = false;
    qEl.classList.remove('correct', 'wrong');
    if (q.t === 'mcq' || q.t === 'tf') {
      var ans = q.t === 'tf' ? String(q.a) : String(q.a);
      var sel = st.sel[qi];
      qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('correct', 'wrong'); });
      var good = qEl.querySelector('.opt[data-val="' + ans + '"]');
      if (good) good.classList.add('correct');
      if (sel === undefined) {
        if (good) good.classList.remove('correct');
        fb.textContent = 'Not answered yet.';
        fb.className = 'feedback bad';
        return false;
      }
      if (sel !== ans) {
        var bad = qEl.querySelector('.opt[data-val="' + sel + '"]');
        if (bad) { bad.classList.remove('correct'); bad.classList.add('wrong'); }
      }
      ok = sel === ans;
      fb.innerHTML = esc(ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.') + whyHtml(q);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    } else {
      var inputs = qEl.querySelectorAll('.word-input');
      var filled = true, goodCount = 0;
      q.parts.forEach(function (part, pi) {
        var inp = inputs[pi];
        var val = norm((st.text[qi] || [])[pi] || '');
        if (!inp) return;
        inp.classList.remove('correct', 'wrong');
        if (!val) { filled = false; return; }
        if (part.a.some(function (x) { return norm(x) === val; })) { goodCount++; inp.classList.add('correct'); }
        else inp.classList.add('wrong');
      });
      if (!filled) {
        fb.textContent = q.parts.length > 1 ? 'Not answered yet (fill in both parts, one word each).' : 'Not answered yet (type one word).';
        fb.className = 'feedback bad';
        return false;
      }
      ok = goodCount === q.parts.length;
      var msg;
      if (ok) msg = 'Correct.';
      else if (q.parts.length > 1) msg = 'Not quite. Correct answers: ' + q.parts.map(function (part, pi) { return '(' + LETTERS[pi] + ') ' + part.a[0]; }).join(', ') + '.';
      else msg = 'Not quite. Correct answer: ' + q.parts[0].a[0] + '.';
      fb.innerHTML = esc(msg) + whyHtml(q);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    }
    qEl.classList.add(ok ? 'correct' : 'wrong');
    st.res[qi] = ok;
    return ok;
  }

  function showAnswer(q, qi) {
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return;
    var fb = qEl.querySelector('.feedback');
    if (q.t === 'mcq' || q.t === 'tf') {
      var ans = String(q.a);
      qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.toggle('correct', b.getAttribute('data-val') === ans); });
      var label = q.t === 'tf' ? (q.a ? 'TRUE' : 'FALSE') : '(' + LETTERS[q.a] + ') ' + q.opts[q.a];
      fb.innerHTML = esc('Answer: ' + label + '.') + whyHtml(q);
    } else {
      var txt = q.parts.map(function (part, pi) {
        return q.parts.length > 1 ? '(' + LETTERS[pi] + ') ' + part.a[0] : part.a[0];
      }).join('; ');
      fb.innerHTML = esc('Answer: ' + txt + '.') + whyHtml(q);
    }
    fb.className = 'feedback info';
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'true'); sb.textContent = 'Hide answer'; }
  }

  function restore() {
    var st = state[cur];
    PASSAGES[cur].questions.forEach(function (q, qi) {
      var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
      if (!qEl) return;
      if (st.sel[qi] !== undefined) {
        var b = qEl.querySelector('.opt[data-val="' + st.sel[qi] + '"]');
        if (b) b.classList.add('selected');
      }
      if (st.text[qi]) {
        var inputs = qEl.querySelectorAll('.word-input');
        st.text[qi].forEach(function (v, pi) { if (inputs[pi]) inputs[pi].value = v; });
      }
    });
    if (st.score !== null) {
      PASSAGES[cur].questions.forEach(function (q, qi) { mark(q, qi); });
    }
  }

  function updateScore() {
    var st = state[cur];
    var checked = state.filter(function (s) { return s.score !== null; });
    var total = checked.reduce(function (a, s) { return a + s.score; }, 0);
    var head = 'Passage ' + (cur + 1) + ': ' + (st.score === null ? '—' : st.score) + ' / ' + PASSAGES[cur].questions.length;
    var note = checked.length
      ? 'Checked so far: ' + checked.length + ' of ' + PASSAGES.length + ' passages · ' + total + ' / ' + (checked.length * PASSAGES[cur].questions.length) + ' correct.'
      : 'Tap an option to choose it; you can change it any time before you check.';
    scorebar.innerHTML = head + '<div class="small">' + note + '</div>';
  }

  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tab');
    if (tab) {
      cur = Number(tab.getAttribute('data-i'));
      renderTabs();
      renderPassage();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    if (ev.target.id === 'checkBtn') {
      var score = 0;
      PASSAGES[cur].questions.forEach(function (q, qi) { if (mark(q, qi)) score++; });
      state[cur].score = score;
      updateScore();
      return;
    }

    if (ev.target.id === 'resetBtn') {
      state[cur] = { sel: {}, text: {}, res: {}, score: null };
      renderQuiz();
      updateScore();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    var sb = ev.target.closest('.show-ans');
    if (sb && quiz.contains(sb)) {
      var qEl = sb.closest('.q');
      var qi = Number(qEl.getAttribute('data-qi'));
      if (sb.getAttribute('data-shown') === 'true') {
        var fb = qEl.querySelector('.feedback');
        fb.textContent = '';
        fb.className = 'feedback';
        qEl.classList.remove('correct', 'wrong');
        qEl.querySelectorAll('.opt').forEach(function (b) {
          b.classList.remove('correct', 'wrong');
          if (state[cur].sel[qi] !== undefined && b.getAttribute('data-val') === state[cur].sel[qi]) b.classList.add('selected');
        });
        resetShow(qEl);
      } else {
        showAnswer(PASSAGES[cur].questions[qi], qi);
      }
      return;
    }

    var opt = ev.target.closest('.opt');
    if (opt && quiz.contains(opt)) {
      var qBox = opt.closest('.q');
      var qi2 = Number(qBox.getAttribute('data-qi'));
      qBox.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected', 'correct', 'wrong'); });
      opt.classList.add('selected');
      state[cur].sel[qi2] = opt.getAttribute('data-val');
      delete state[cur].res[qi2];
      state[cur].score = null;
      qBox.classList.remove('correct', 'wrong');
      var fb2 = qBox.querySelector('.feedback');
      fb2.textContent = '';
      fb2.className = 'feedback';
      resetShow(qBox);
      updateScore();
    }
  });

  document.addEventListener('input', function (ev) {
    var inp = ev.target.closest ? ev.target.closest('.word-input') : null;
    if (!inp || !quiz.contains(inp)) return;
    var qBox = inp.closest('.q');
    var qi = Number(qBox.getAttribute('data-qi'));
    var pi = Number(inp.getAttribute('data-part'));
    var st = state[cur];
    st.text[qi] = st.text[qi] || [];
    st.text[qi][pi] = inp.value;
    delete st.res[qi];
    st.score = null;
    inp.classList.remove('correct', 'wrong');
    qBox.classList.remove('correct', 'wrong');
    var fb = qBox.querySelector('.feedback');
    fb.textContent = '';
    fb.className = 'feedback';
    resetShow(qBox);
    updateScore();
  });

  renderTabs();
  renderPassage();
  renderQuiz();
})();
</script>
</body>
</html>
