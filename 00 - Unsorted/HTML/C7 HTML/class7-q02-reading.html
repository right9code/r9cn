        'Water is essential for life, yet fresh water is limited and must be used wisely. Only a tiny share of the water on earth is fit for drinking, and the same supply has to serve farms, factories, hospitals and homes. In many towns, people waste water without realising it, because it arrives so easily from a tap.',

        'Schools and communities can also help by practising rainwater harvesting, a method of collecting and storing rainwater from rooftops for later use. The collected water can be used for gardening and cleaning, which reduces the pressure on the town supply. In 2024, Sunrise Public School began a “Save Every Drop” campaign. Students checked taps for leaks, placed posters around the campus, and recorded how much water different actions saved in one month.',

      paras: [
        'Every October the library at Vidya Niketan runs a reading challenge. The rules are simple: a student who finishes a book writes two lines about it, and the librarian gives a sticker for the class chart. There are no prizes for the fastest reader, because the librarian has always insisted that reading quickly is not the same as reading well.',
        'This year the challenge began with a problem. The library owned 900 books, but fewer than 200 were borrowed in a month. Most students chose the same three popular titles, and the shelves of poetry, biography and travel writing stayed untouched. The librarian added a rule: a sticker counted only if the student had not read that author before.',
        'The result was unexpected. Class VI, which usually borrowed very little, went looking for new authors and finished 84 books. Class VII read 96, mostly mystery and animal stories. Class VIII, busy with a science project, managed only 72. Class IX, whose teacher read aloud for ten minutes at the end of every lesson, reached 108.',
        'The chart on the library wall, however, showed something more useful than totals. The students who read the most were not the ones who read fastest; they were the ones who talked about their books. A short conversation at the issue desk, it turned out, did more for reading than any poster.',
        'In November the librarian extended the challenge for another month, and the principal agreed to buy twenty new titles in the subjects that had been ignored. The library still owns 900 books. What changed is that more of them are being opened.'

        { t: 'text', q: 'In which month is the reading challenge held? <span class="hint">(one word)</span>', parts: [{ a: ['october'] }], why: 'The passage begins: “Every October the library at Vidya Niketan runs a reading challenge.”' },

        'For one week in August, students at Greenfield School did something unusual: instead of emptying the bins, they opened them. Every lunchtime a team of eight weighed the waste from the canteen and the classrooms, sorted it into four materials, and wrote the figures on a chart in the corridor.',
        'The first day was the shock. The bin outside the canteen was heavy with food — whole rotis, unopened packets of biscuits, half-eaten fruit — that had been bought and never finished. The students had expected plastic to be the biggest problem, because that is what most campaigns talk about. Paper came second, mostly worksheets printed on one side. Plastic was third, and glass, which hardly anyone thought about, was the smallest pile.',
        'By Friday the team had 60 kilograms of waste in total. Nobody could say the school was dirty; the bins had simply hidden the truth. The team then asked a different question: what could have been avoided? Almost all the food could have been, if portions had been smaller and packets left unopened. Most of the paper could have been, if both sides had been used. The plastic and the glass could at least have been separated and sold.',
        'The findings were read out at assembly. The canteen now serves smaller portions and keeps a “share table” where unopened packets are left for anyone who wants them. Food waste goes to a compost pit behind the kitchen, the office prints on both sides, and two bins — one for paper and glass, one for everything else — stand at the gate.',
        'The audit cost nothing but a week of lunchtimes. The team’s report ended with a line that the principal has printed on a card above every bin: “We cannot manage what we have never weighed.”'

        { t: 'mcq', q: 'What was the total amount of waste collected in one week?', opts: ['45 kilograms', '50 kilograms', '60 kilograms', '70 kilograms'], a: 2, why: 'The total is 25 + 18 + 12 + 5 = 60 kilograms.' },
        { t: 'mcq', q: 'How much more food waste than plastic waste was collected?', opts: ['7 kilograms', '13 kilograms', '25 kilograms', '37 kilograms'], a: 1, why: 'Food was 25 kilograms and plastic 12, so the difference is 25 − 12 = 13 kilograms.' },
        { t: 'mcq', q: 'If the food, paper and glass were all kept out of the landfill, how much waste would still go to it?', opts: ['5 kilograms', '12 kilograms', '18 kilograms', '48 kilograms'], a: 1, why: 'Food, paper and glass together weigh 25 + 18 + 5 = 48 kilograms, so the 12 kilograms of plastic would still go to the landfill.' },

        { t: 'text', q: 'Find words from the passage which mean the following: <span class="hint">(one word each)</span>', parts: [{ label: '(a) decayed food waste used to enrich soil —', a: ['compost'] }, { label: '(b) the amount of food served to one person —', a: ['portion', 'portions'] }], why: 'Food waste goes to a ‘compost’ pit, and a ‘portion’ is the amount of food served to one person.' },

        'For five days in November, students at Nirmala School were asked to leave the car at home and come by bicycle. The idea came from the science club, which had counted the traffic outside the gate: between 7.40 and 8.00 in the morning, forty-one cars waited at the same crossing, and most carried a single child.',
        'The first morning was chaos. Bicycles arrived from every direction, the racks were too few, and a boy who had not ridden for two years fell at the gate. By Tuesday two teachers were guiding the younger riders in from the corner, and the head boy had drawn a route map on the notice board. On Wednesday a puncture repair kit appeared, donated by a cycle shop down the road.',
        'By Friday the racks were full long before the bell. The club counted the cyclists every morning and wrote the numbers on a chart. Monday’s figure, 120, looked unremarkable. Tuesday’s was 138. Wednesday’s 150 was helped by a clear sky. Thursday dipped to 132 when a shower fell at seven. Friday reached 160, the highest of the week, when the club promised a cricket match for the class with the most riders.',
        'The club then did the arithmetic that made the week worth repeating. Each cyclist lived about three kilometres from school, so the week’s rides covered 2,100 kilometres that would otherwise have been driven. At 120 grams of carbon dioxide per kilometre, that is roughly 252 kilograms of the gas that never entered the air above the school gate.',

        { t: 'mcq', q: 'If every cyclist rode 3 kilometres each day, how far did the week’s rides cover altogether?', opts: ['1,400 kilometres', '2,100 kilometres', '2,400 kilometres', '3,500 kilometres'], a: 1, why: '700 rides of 3 kilometres each cover 700 × 3 = 2,100 kilometres.' },

        'Last term the school nurse asked 300 students one question that turned out to be harder to answer than expected: how much do you sleep? The answers were collected without names, so nobody had to pretend.',

        'The nurse was careful about what the numbers mean. A survey of this kind cannot prove that screens cause short sleep; it may be that students who sleep badly are the ones who reach for a screen. What it can do is point at a habit worth testing. She asked one class to try a two-week experiment: phones charged outside the bedroom, no screens after nine. The class’s reported sleep rose by about forty minutes, and, more surprisingly, the number of students arriving late fell.',

        { t: 'mcq', q: 'How many hours of sleep did the group with more than two hours of screen time report?', opts: ['6.4', '7.2', '8.0', '8.5'], a: 0, why: 'According to the table, the group with more than two hours of screen time reported only 6.4 hours.' },
        { t: 'mcq', q: 'How many students took part in the survey?', opts: ['180', '240', '300', '360'], a: 2, why: 'The four groups are 90 + 120 + 60 + 30 = 300 students.' },
        { t: 'mcq', q: 'How many hours less sleep did the 1–2 hour group get than the no-screen group?', opts: ['0.7 hours', '1.3 hours', '1.5 hours', '2.1 hours'], a: 1, why: '8.5 − 7.2 = 1.3 hours less sleep for the 1–2 hour group.' },
        { t: 'mcq', q: 'How many students used a screen for more than two hours after 9 pm?', opts: ['30', '60', '90', '120'], a: 0, why: 'According to the table, 30 students used a screen for more than two hours.' },
        { t: 'text', q: 'After what time at night was screen time counted? <span class="hint">(one word)</span>', parts: [{ a: ['nine', '9'], num: true }], why: 'Students were grouped by how long they looked at a screen after nine at night.' },
        { t: 'text', q: 'Find words from the passage which mean the following: <span class="hint">(one word each)</span>', parts: [{ label: '(a) without names being given —', a: ['anonymously'] }, { label: '(b) a set of questions used to collect information —', a: ['survey'] }], why: 'The answers were collected ‘anonymously’, and a ‘survey’ is a set of questions used to collect information.' },
        { t: 'tf', q: 'State whether the following statement is TRUE or FALSE: “The survey proves that screens cause short sleep.”', a: false, why: 'The nurse says a survey of this kind cannot prove that screens cause short sleep.' },
        { t: 'mcq', q: 'Complete the sentence: In the two-week experiment, the class’s reported sleep rose by ____________.', opts: ['about ten minutes', 'about twenty minutes', 'about forty minutes', 'about two hours'], a: 2, why: 'The passage says the class’s reported sleep rose by about forty minutes.' },
        { t: 'text', q: 'Where were phones charged during the experiment? <span class="hint">(one word)</span>', parts: [{ a: ['outside'] }], why: 'The experiment asked for phones to be charged outside the bedroom.' }
      ]
    }
  ];

  var ROMAN = ['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii', 'viii', 'ix', 'x'];
  var LETTERS = ['a', 'b', 'c', 'd'];

  var root = document.documentElement;
  try { var savedTheme = localStorage.getItem('c7-reading-theme'); if (savedTheme) root.setAttribute('data-theme', savedTheme); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('c7-reading-theme', next); } catch (e) {}
  });

  var tabsEl = document.getElementById('tabs');
  var passageCard = document.getElementById('passageCard');
  var quiz = document.getElementById('quiz');
  var scorebar = document.getElementById('scorebar');
  var cur = 0;
  var state = PASSAGES.map(function () { return { sel: {}, text: {}, res: {}, score: null }; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function norm(s) { return (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' '); }
  function whyHtml(q) { return q.why ? '<span class="why">' + esc(q.why) + '</span>' : ''; }

  function renderTabs() {
    tabsEl.innerHTML = PASSAGES.map(function (p, i) {
      return '<button type="button" class="tab' + (i === cur ? ' active' : '') + '" data-i="' + i + '">Passage ' + (i + 1) + '</button>';
    }).join('');
  }

  function renderPassage() {
    var p = PASSAGES[cur];
    var html = '<span class="section-tag">Section A — Reading Skill</span>';
    html += '<h2>' + (cur + 1) + '. ' + esc(p.title) + '</h2>';
    html += '<div class="passage">' + p.paras.map(function (t) { return '<p>' + t + '</p>'; }).join('');
    if (p.table) {
      var tb = p.table;
      html += '<div class="table-wrap"><table aria-label="' + esc(tb.caption) + '"><thead><tr>' +
        tb.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        tb.rows.map(function (r) {
          return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</div>';
    passageCard.innerHTML = html;
  }

  function questionHtml(q, qi) {
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">(' + ROMAN[qi] + ')</span> ' + q.q + '</div>';
    if (q.t === 'mcq' || q.t === 'tf') {
      var opts = q.t === 'tf' ? ['TRUE', 'FALSE'] : q.opts;
      h += '<div class="options">';
      opts.forEach(function (o, oi) {
        var val = q.t === 'tf' ? (oi === 0 ? 'true' : 'false') : String(oi);
        h += '<button type="button" class="opt" data-val="' + val + '">' +
          (q.t === 'tf' ? '' : '<span class="letter">(' + LETTERS[oi] + ')</span>') +
          '<span>' + esc(o) + '</span></button>';
      });
      h += '</div>';
    } else {
      q.parts.forEach(function (part, pi) {
        var id = 'q' + qi + 'p' + pi;
        h += '<div class="subpart">';
        if (part.label) h += '<label for="' + id + '">' + esc(part.label) + '</label>';
        h += '<input id="' + id + '" class="word-input" data-part="' + pi + '" type="text" inputmode="' +
          (part.num ? 'numeric' : 'text') + '" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type one word">';
        h += '</div>';
      });
    }
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function renderQuiz() {
    var p = PASSAGES[cur];
    var html = '<p class="instructions"><strong>Answer the questions.</strong> Tap an option where choices are given; type <strong>one word</strong> where the answer is one word (capital or small letters both accepted). Use <strong>Check answers</strong> for feedback on all ten, or <strong>Show answer</strong> on a single question to see the model answer and why.</p>';
    html += p.questions.map(questionHtml).join('');
    html += '<div class="actions"><button class="btn primary" id="checkBtn" type="button">Check answers</button>' +
      '<button class="btn" id="resetBtn" type="button">Reset this passage</button></div>';
    quiz.innerHTML = html;
    restore();
    updateScore();
  }

  function resetShow(qEl) {
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'false'); sb.textContent = 'Show answer'; }
  }

  function mark(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var ok = false;
    qEl.classList.remove('correct', 'wrong');
    if (q.t === 'mcq' || q.t === 'tf') {
      var ans = q.t === 'tf' ? String(q.a) : String(q.a);
      var sel = st.sel[qi];
      qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('correct', 'wrong'); });
      var good = qEl.querySelector('.opt[data-val="' + ans + '"]');
      if (good) good.classList.add('correct');
      if (sel === undefined) {
        if (good) good.classList.remove('correct');
        fb.textContent = 'Not answered yet.';
        fb.className = 'feedback bad';
        return false;
      }
      if (sel !== ans) {
        var bad = qEl.querySelector('.opt[data-val="' + sel + '"]');
        if (bad) { bad.classList.remove('correct'); bad.classList.add('wrong'); }
      }
      ok = sel === ans;
      fb.innerHTML = esc(ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.') + whyHtml(q);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    } else {
      var inputs = qEl.querySelectorAll('.word-input');
      var filled = true, goodCount = 0;
      q.parts.forEach(function (part, pi) {
        var inp = inputs[pi];
        var val = norm((st.text[qi] || [])[pi] || '');
        if (!inp) return;
        inp.classList.remove('correct', 'wrong');
        if (!val) { filled = false; return; }
        if (part.a.some(function (x) { return norm(x) === val; })) { goodCount++; inp.classList.add('correct'); }
        else inp.classList.add('wrong');
      });
      if (!filled) {
        fb.textContent = q.parts.length > 1 ? 'Not answered yet (fill in both parts, one word each).' : 'Not answered yet (type one word).';
        fb.className = 'feedback bad';
        return false;
      }
      ok = goodCount === q.parts.length;
      var msg;
      if (ok) msg = 'Correct.';
      else if (q.parts.length > 1) msg = 'Not quite. Correct answers: ' + q.parts.map(function (part, pi) { return '(' + LETTERS[pi] + ') ' + part.a[0]; }).join(', ') + '.';
      else msg = 'Not quite. Correct answer: ' + q.parts[0].a[0] + '.';
      fb.innerHTML = esc(msg) + whyHtml(q);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    }
    qEl.classList.add(ok ? 'correct' : 'wrong');
    st.res[qi] = ok;
    return ok;
  }

  function showAnswer(q, qi) {
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return;
    var fb = qEl.querySelector('.feedback');
    if (q.t === 'mcq' || q.t === 'tf') {
      var ans = String(q.a);
      qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.toggle('correct', b.getAttribute('data-val') === ans); });
      var label = q.t === 'tf' ? (q.a ? 'TRUE' : 'FALSE') : '(' + LETTERS[q.a] + ') ' + q.opts[q.a];
      fb.innerHTML = esc('Answer: ' + label + '.') + whyHtml(q);
    } else {
      var txt = q.parts.map(function (part, pi) {
        return q.parts.length > 1 ? '(' + LETTERS[pi] + ') ' + part.a[0] : part.a[0];
      }).join('; ');
      fb.innerHTML = esc('Answer: ' + txt + '.') + whyHtml(q);
    }
    fb.className = 'feedback info';
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'true'); sb.textContent = 'Hide answer'; }
  }

  function restore() {
    var st = state[cur];
    PASSAGES[cur].questions.forEach(function (q, qi) {
      var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
      if (!qEl) return;
      if (st.sel[qi] !== undefined) {
        var b = qEl.querySelector('.opt[data-val="' + st.sel[qi] + '"]');
        if (b) b.classList.add('selected');
      }
      if (st.text[qi]) {
        var inputs = qEl.querySelectorAll('.word-input');
        st.text[qi].forEach(function (v, pi) { if (inputs[pi]) inputs[pi].value = v; });
      }
    });
    if (st.score !== null) {
      PASSAGES[cur].questions.forEach(function (q, qi) { mark(q, qi); });
    }
  }

  function updateScore() {
    var st = state[cur];
    var checked = state.filter(function (s) { return s.score !== null; });
    var total = checked.reduce(function (a, s) { return a + s.score; }, 0);
    var head = 'Passage ' + (cur + 1) + ': ' + (st.score === null ? '—' : st.score) + ' / ' + PASSAGES[cur].questions.length;
    var note = checked.length
      ? 'Checked so far: ' + checked.length + ' of ' + PASSAGES.length + ' passages · ' + total + ' / ' + (checked.length * PASSAGES[cur].questions.length) + ' correct.'
      : 'Tap an option to choose it; you can change it any time before you check.';
    scorebar.innerHTML = head + '<div class="small">' + note + '</div>';
  }

  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tab');
    if (tab) {
      cur = Number(tab.getAttribute('data-i'));
      renderTabs();
      renderPassage();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    if (ev.target.id === 'checkBtn') {
      var score = 0;
      PASSAGES[cur].questions.forEach(function (q, qi) { if (mark(q, qi)) score++; });
      state[cur].score = score;
      updateScore();
      return;
    }

    if (ev.target.id === 'resetBtn') {
      state[cur] = { sel: {}, text: {}, res: {}, score: null };
      renderQuiz();
      updateScore();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    var sb = ev.target.closest('.show-ans');
    if (sb && quiz.contains(sb)) {
      var qEl = sb.closest('.q');
      var qi = Number(qEl.getAttribute('data-qi'));
      if (sb.getAttribute('data-shown') === 'true') {
        var fb = qEl.querySelector('.feedback');
        fb.textContent = '';
        fb.className = 'feedback';
        qEl.classList.remove('correct', 'wrong');
        qEl.querySelectorAll('.opt').forEach(function (b) {
          b.classList.remove('correct', 'wrong');
          if (state[cur].sel[qi] !== undefined && b.getAttribute('data-val') === state[cur].sel[qi]) b.classList.add('selected');
        });
        resetShow(qEl);
      } else {
        showAnswer(PASSAGES[cur].questions[qi], qi);
      }
      return;
    }

    var opt = ev.target.closest('.opt');
    if (opt && quiz.contains(opt)) {
      var qBox = opt.closest('.q');
      var qi2 = Number(qBox.getAttribute('data-qi'));
      qBox.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected', 'correct', 'wrong'); });
      opt.classList.add('selected');
      state[cur].sel[qi2] = opt.getAttribute('data-val');
      delete state[cur].res[qi2];
      state[cur].score = null;
      qBox.classList.remove('correct', 'wrong');
      var fb2 = qBox.querySelector('.feedback');
      fb2.textContent = '';
      fb2.className = 'feedback';
      resetShow(qBox);
      updateScore();
    }
  });

  document.addEventListener('input', function (ev) {
    var inp = ev.target.closest ? ev.target.closest('.word-input') : null;
    if (!inp || !quiz.contains(inp)) return;
    var qBox = inp.closest('.q');
    var qi = Number(qBox.getAttribute('data-qi'));
    var pi = Number(inp.getAttribute('data-part'));
    var st = state[cur];
    st.text[qi] = st.text[qi] || [];
    st.text[qi][pi] = inp.value;
    delete st.res[qi];
    st.score = null;
    inp.classList.remove('correct', 'wrong');
    qBox.classList.remove('correct', 'wrong');
    var fb = qBox.querySelector('.feedback');
    fb.textContent = '';
    fb.className = 'feedback';
    resetShow(qBox);
    updateScore();
  });

  renderTabs();
  renderPassage();
  renderQuiz();
})();
</script>
</body>
</html>
