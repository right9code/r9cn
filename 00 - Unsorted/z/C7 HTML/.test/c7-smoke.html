<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 7 English — Annual Exam Revision</title>
<style>
  /* ============ PALETTES ============ */
  [data-scheme="sage"][data-mode="light"] {
    --bg:#F3F6F2; --card:#FFFFFF; --inner:#E8EFE8; --border:#DCE5DB;
    --text:#24312A; --muted:#6E7D72; --accent:#4E8A6E; --accent-strong:#3D6F58; --accent-soft:#DFEDE5;
    --bad:#C25E5E; --bad-soft:#F5E1E1;
    --sec1:#5B7FA6; --sec2:#C99245; --sec3:#4E8A6E; --sec4:#9A7BB0;
  }
  [data-scheme="sage"][data-mode="dark"] {
    --bg:#0E1411; --card:#161D19; --inner:#1D2621; --border:#26302A;
    --text:#E4EAE5; --muted:#8FA094; --accent:#7FBC9B; --accent-strong:#96CDAE; --accent-soft:rgba(127,188,155,0.14);
    --bad:#E08B8B; --bad-soft:rgba(224,139,139,0.14);
    --sec1:#8AAECF; --sec2:#D9B36B; --sec3:#7FBC9B; --sec4:#B79FD0;
  }
  [data-scheme="lavender"][data-mode="light"] {
    --bg:#F5F5FA; --card:#FFFFFF; --inner:#EBEBF5; --border:#DFE0EE;
    --text:#2A2838; --muted:#75738A; --accent:#6675C9; --accent-strong:#525DAE; --accent-soft:#E4E7F8;
    --bad:#C25E6B; --bad-soft:#F5E1E5;
    --sec1:#5B9BB5; --sec2:#C2884E; --sec3:#5FA98A; --sec4:#8A79CC;
  }
  [data-scheme="lavender"][data-mode="dark"] {
    --bg:#111120; --card:#181829; --inner:#202034; --border:#2A2A40;
    --text:#E6E6F0; --muted:#918FA8; --accent:#9BA3F0; --accent-strong:#B3B9F5; --accent-soft:rgba(155,163,240,0.14);
    --bad:#E38B97; --bad-soft:rgba(227,139,151,0.14);
    --sec1:#7FB8CE; --sec2:#D4B37C; --sec3:#85C4A8; --sec4:#AB9FE3;
  }
  [data-scheme="sand"][data-mode="light"] {
    --bg:#F8F4EE; --card:#FFFFFF; --inner:#F0E9DE; --border:#E5DCCE;
    --text:#35302A; --muted:#877E70; --accent:#B07A52; --accent-strong:#96653F; --accent-soft:#F3E7DB;
    --bad:#BC6455; --bad-soft:#F5E5E0;
    --sec1:#6E93AE; --sec2:#B07A52; --sec3:#6FA07E; --sec4:#9780B5;
  }
  [data-scheme="sand"][data-mode="dark"] {
    --bg:#15120E; --card:#1D1914; --inner:#252019; --border:#2F2820;
    --text:#EDE8E0; --muted:#A39887; --accent:#D9A87D; --accent-strong:#E4BC97; --accent-soft:rgba(217,168,125,0.14);
    --bad:#DE9184; --bad-soft:rgba(222,145,132,0.14);
    --sec1:#92B4CB; --sec2:#D9A87D; --sec3:#94C2A4; --sec4:#B4A2CF;
  }

  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { font-size:16px; }
  body { background:var(--bg); color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55; padding-bottom:6rem; transition:background-color .25s,color .25s; }
  .wrap { max-width:480px; margin:0 auto; padding:1rem 1rem 2rem; }
  .pane { display:none; }
  .pane.active { display:block; animation:fade .25s ease; }
  @keyframes fade { from{opacity:0;transform:translateY(5px)} to{opacity:1} }
  button { font-family:inherit; }

  /* header */
  .top { display:flex; align-items:center; gap:.5rem; margin-bottom:1rem; }
  .top h1 { font-size:1.02rem; font-weight:800; flex:1; min-width:0; }
  .ctrl { background:var(--card); border:1.5px solid var(--border); border-radius:12px;
    padding:.4rem .65rem; font-size:.76rem; font-weight:700; cursor:pointer; color:var(--text); white-space:nowrap; }
  .ctrl:active { transform:scale(.94); }

  /* home */
  .hero { background:var(--card); border:1.5px solid var(--border); border-radius:18px; padding:1rem 1.1rem; margin-bottom:1.15rem; }
  .hero h2 { font-size:1.02rem; font-weight:800; }
  .hero p { font-size:.82rem; color:var(--muted); margin-top:.2rem; }
  .path { position:relative; }
  .path-line { position:absolute; left:33px; top:26px; bottom:34px; width:4px; background:var(--inner); border-radius:99px; }
  .node { position:relative; display:flex; gap:1rem; align-items:flex-start; margin-bottom:1.25rem; }
  .node-dot { width:50px; height:50px; border-radius:50%; flex-shrink:0; z-index:2; background:var(--card);
    border:3px solid var(--inner); display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
  .node-body { flex:1; background:var(--card); border:1.5px solid var(--border); border-radius:18px; padding:.85rem 1rem; min-width:0; }
  .node-step { font-size:.64rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .node-name { font-weight:800; font-size:.96rem; margin-top:.1rem; }
  .node-sub { font-size:.74rem; color:var(--muted); margin-top:.15rem; }
  .node-bar { height:7px; background:var(--inner); border-radius:99px; margin-top:.55rem; overflow:hidden; }
  .node-bar-fill { height:100%; border-radius:99px; width:0; transition:width .3s; }
  .node-actions { display:flex; gap:.5rem; margin-top:.65rem; }
  .node-btn { flex:1; padding:.55rem 0; border-radius:11px; border:1.5px solid var(--border);
    background:var(--bg); color:var(--text); font-weight:800; font-size:.8rem; cursor:pointer; }
  .node-btn.practice { background:var(--accent); border-color:var(--accent); color:#fff; }
  .node-btn:active { transform:scale(.97); }
  .finishline { text-align:center; padding:.9rem; background:var(--card); border:2px dashed var(--border);
    border-radius:18px; color:var(--muted); font-weight:700; font-size:.86rem; }

  /* pick */
  .p-head2 { display:flex; align-items:center; gap:.7rem; margin-bottom:1rem; }
  .back { background:var(--card); border:1.5px solid var(--border); border-radius:13px; width:40px; height:40px;
    font-size:1.05rem; cursor:pointer; color:var(--text); font-weight:700; flex-shrink:0; }
  .p-head2 h2 { font-size:1.02rem; font-weight:800; flex:1; min-width:0; }
  .set-card { display:flex; justify-content:space-between; align-items:center; gap:.8rem;
    background:var(--card); border:1.5px solid var(--border); border-radius:15px;
    padding:.85rem 1rem; margin-bottom:.6rem; cursor:pointer; }
  .set-card:active { border-color:var(--accent); }
  .set-name { font-weight:700; font-size:.92rem; }
  .set-sub { font-size:.74rem; color:var(--muted); margin-top:.1rem; }
  .set-stat { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.74rem; color:var(--muted); white-space:nowrap; }
  .reset-btn { background:none; border:1px solid var(--border); color:var(--muted); border-radius:9px;
    width:30px; height:30px; font-size:.85rem; cursor:pointer; flex-shrink:0; }

  /* practice */
  .pr-top { display:flex; align-items:center; gap:.7rem; margin-bottom:.5rem; }
  .pr-mid { text-align:center; flex:1; min-width:0; }
  .pr-sec { font-size:.64rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
  .pr-count { font-size:.78rem; color:var(--muted); }
  .pr-bar { width:100%; height:8px; background:var(--inner); border-radius:99px; margin:.55rem 0 1rem; overflow:hidden; }
  .pr-bar-fill { height:100%; border-radius:99px; transition:width .3s; }
  .q-card { background:var(--card); border:1.5px solid var(--border); border-radius:18px; padding:1.1rem; }
  .chip { display:inline-block; font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    background:var(--inner); color:var(--muted); padding:.2rem .6rem; border-radius:999px; margin-bottom:.65rem; }
  .passage { background:var(--inner); border-radius:12px; padding:.85rem 1rem; font-size:.87rem;
    color:var(--muted); margin-bottom:.9rem; line-height:1.75; max-height:190px; overflow-y:auto; }
  .passage b { color:var(--text); }
  .q-text { font-size:.97rem; font-weight:700; line-height:1.6; margin-bottom:1rem; }
  .q-text .hint { color:var(--muted); font-weight:500; font-size:.85rem; }

  .opt { display:flex; gap:.7rem; align-items:center; border:1.5px solid var(--border); border-radius:14px;
    padding:.7rem .85rem; margin-bottom:.55rem; cursor:pointer; font-weight:600; font-size:.9rem; min-height:46px; }
  .opt-key { width:27px; height:27px; border-radius:8px; flex-shrink:0; background:var(--inner);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.74rem; color:var(--muted); }
  .opt.right { border-color:var(--accent); background:var(--accent-soft); }
  .opt.right .opt-key { background:var(--accent); color:#fff; }
  .opt.miss { border-color:var(--bad); background:var(--bad-soft); }
  .opt.miss .opt-key { background:var(--bad); color:#fff; }
  .opt.off { opacity:.55; pointer-events:none; }

  .fb { display:none; margin-top:.75rem; border-radius:12px; padding:.7rem .9rem; font-size:.84rem; font-weight:600; line-height:1.55; }
  .fb.win { display:block; background:var(--accent-soft); color:var(--accent-strong); }
  .fb.lose { display:block; background:var(--bad-soft); color:var(--bad); }

  .text-in { width:100%; background:var(--bg); border:1.5px solid var(--border); border-radius:12px;
    padding:.6rem .8rem; font-size:.92rem; color:var(--text); font-family:inherit; margin-bottom:.55rem; outline:none; }
  .text-in:focus { border-color:var(--accent); }
  .text-in.right { border-color:var(--accent); background:var(--accent-soft); }
  .text-in.miss { border-color:var(--bad); background:var(--bad-soft); }
  .text-label { font-size:.8rem; color:var(--muted); margin:.4rem 0 .25rem; display:block; }
  .check-btn { width:100%; margin-top:.6rem; padding:.75rem; border:none; border-radius:13px;
    background:var(--accent); color:#fff; font-weight:800; font-size:.9rem; cursor:pointer; }
  .check-btn:disabled { opacity:.4; }

  /* tiles (fill) */
  .part-row { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:.6rem; font-size:.88rem; }
  .part-label { color:var(--muted); font-size:.8rem; }
  .slot { min-width:110px; min-height:36px; border:1.5px dashed var(--border); border-radius:9px;
    background:var(--bg); padding:.3rem .55rem; font-size:.85rem; cursor:pointer; display:inline-flex; align-items:center; }
  .slot.sel { border-color:var(--accent); border-style:solid; }
  .slot.right { border-color:var(--accent); background:var(--accent-soft); border-style:solid; }
  .slot.miss { border-color:var(--bad); background:var(--bad-soft); border-style:solid; }
  .tiles { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.7rem; }
  .tile { border:1.5px solid var(--border); background:var(--inner); color:var(--text); border-radius:9px;
    padding:.4rem .7rem; font-size:.84rem; font-weight:600; cursor:pointer; }
  .tile.used { opacity:.25; pointer-events:none; }

  /* cloze + builder */
  .c-line { font-size:.95rem; line-height:2.1; }
  .cblank { border:none; border-bottom:2px solid var(--border); background:var(--inner); color:var(--text);
    font-size:.86rem; padding:.15rem .5rem; margin:0 .15rem; border-radius:6px 6px 0 0; cursor:pointer;
    font-family:inherit; min-width:70px; }
  .cblank.sel { border-bottom-color:var(--accent); background:var(--accent-soft); }
  .cblank.right { border-bottom-color:var(--accent); background:var(--accent-soft); }
  .cblank.miss { border-bottom-color:var(--bad); background:var(--bad-soft); }
  .bank { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.8rem; padding-top:.7rem; border-top:1.5px dashed var(--border); }
  .w-ttl { font-weight:800; font-size:1rem; text-align:center; margin-bottom:.3rem; }
  .w-center { text-align:center; }
  .w-label { text-align:center; font-weight:800; letter-spacing:.15em; border:1.5px solid var(--border);
    border-radius:8px; padding:.35rem; margin:.5rem 0; font-size:.9rem; }
  .w-fixed { color:var(--muted); font-size:.84rem; }
  .w-line { margin:.45rem 0; }
  .w-right { text-align:right; }
  .scenario { background:var(--inner); border-radius:12px; padding:.8rem .95rem; font-size:.88rem;
    color:var(--muted); line-height:1.7; margin-bottom:.9rem; }
  .scenario b { color:var(--text); }
  hr.w-hr { border:none; border-top:1.5px dashed var(--border); margin:.7rem 0; }

  /* seq */
  .seq-item { display:flex; align-items:center; gap:.6rem; border:1.5px solid var(--border); border-radius:12px;
    padding:.55rem .7rem; margin-bottom:.5rem; font-size:.86rem; }
  .seq-item.right { border-color:var(--accent); background:var(--accent-soft); }
  .seq-item.miss { border-color:var(--bad); background:var(--bad-soft); }
  .seq-num { font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--muted); font-size:.75rem; font-weight:700; flex-shrink:0; }
  .seq-text { flex:1; }
  .seq-btn { border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:8px;
    width:32px; height:28px; font-size:.9rem; cursor:pointer; line-height:1; flex-shrink:0; }

  /* finish */
  .done-card { text-align:center; padding:1.6rem 1.2rem; }
  .done-card .big { font-size:2.4rem; }
  .done-card h2 { font-size:1.15rem; margin:.4rem 0 .3rem; }
  .done-card p { color:var(--muted); font-size:.87rem; }
  .done-score { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:2rem; font-weight:700; color:var(--accent-strong); margin:.6rem 0; }
  .done-actions { display:flex; gap:.6rem; margin-top:1.1rem; }
  .done-actions button { flex:1; padding:.75rem; border-radius:12px; border:1.5px solid var(--border);
    background:var(--bg); color:var(--text); font-weight:700; font-size:.87rem; cursor:pointer; }
  .done-actions .prime { background:var(--accent); border-color:var(--accent); color:#fff; }

  .nextbar { position:fixed; bottom:0; left:0; right:0; display:none; justify-content:center;
    padding:.8rem 1rem 1.05rem; background:linear-gradient(to top, var(--bg) 70%, transparent); z-index:50; }
  .nextbar.show { display:flex; }
  .big-btn { max-width:440px; width:100%; padding:.92rem; border:none; border-radius:16px;
    background:var(--accent); color:#fff; font-weight:800; font-size:.95rem; cursor:pointer; }
  .big-btn:disabled { opacity:.4; }

  /* notes */
  .note-card { background:var(--card); border:1.5px solid var(--border); border-radius:16px; padding:.95rem 1.05rem; margin-bottom:.75rem; }
  .note-card h3 { font-size:.9rem; font-weight:800; margin-bottom:.35rem; }
  .note-card p, .note-card li { font-size:.84rem; color:var(--muted); line-height:1.7; }
  .note-card ul { margin:.3rem 0 0 1.1rem; }
  .note-card ol { margin:.3rem 0 0 1.3rem; }
  .topic-head { font-weight:800; font-size:.86rem; color:var(--accent-strong); margin-bottom:.2rem; }
</style>
</head>
<body data-scheme="sage" data-mode="light">
<div class="wrap">

  <div class="top">
    <h1 id="head-title">Class 7 · English Revision</h1>
    <button class="ctrl" id="scheme-btn" onclick="cycleScheme()">🎨 Sage</button>
    <button class="ctrl" id="mode-btn" onclick="cycleMode()">🌗 Auto</button>
  </div>

  <div class="pane active" id="v-home">
    <div class="hero">
      <h2>Annual exam revision — open &amp; free</h2>
      <p id="hero-sub">Practice one question at a time. Your progress saves on this phone.</p>
    </div>
    <div class="path" id="path"></div>
    <div class="finishline">🏁 Exam ready — best of luck!</div>
  </div>

  <div class="pane" id="v-pick">
    <div class="p-head2">
      <button class="back" onclick="goHome()">←</button>
      <h2 id="pick-title">Choose a set</h2>
    </div>
    <div id="pick-list"></div>
  </div>

  <div class="pane" id="v-practice">
    <div class="pr-top">
      <button class="back" onclick="exitPractice()">←</button>
      <div class="pr-mid">
        <div class="pr-sec" id="pr-sec">Section</div>
        <div class="pr-count" id="pr-count">Question 1 of 5</div>
      </div>
      <button class="back" onclick="openNotes(curSec)" title="Notes">📖</button>
    </div>
    <div class="pr-bar"><div class="pr-bar-fill" id="pr-fill"></div></div>
    <div class="q-card" id="q-card"></div>
  </div>

  <div class="pane" id="v-notes">
    <div class="p-head2">
      <button class="back" onclick="notesBack()">←</button>
      <h2 id="notes-title">Notes</h2>
    </div>
    <div id="notes-body"></div>
  </div>

</div>

<div class="nextbar" id="nextbar">
  <button class="big-btn" id="big-btn" onclick="nextUnit()">Next →</button>
</div>

ssage": {"title": "Save Every Drop", "paras": ["Water is essential for life, yet fresh water is limited and must be used wisely. Only a tiny share of the water on earth is fit for drinking, and the same supply has to serve farms, factories, hospitals and homes. In many towns, people waste water without realising it, because it arrives so easily from a tap.", "A single dripping tap can waste nearly 20 litres of water in a day. That is enough drinking water for a small family. Leaking pipes in bathrooms and gardens often go unnoticed for weeks, quietly draining away a resource that millions of people walk kilometres to collect.", "Simple habits can make a big difference. Turning off the tap while brushing your teeth, fixing leaking pipes, and using a bucket instead of a hose to wash vehicles can save hundreds of litres every month. Taking shorter showers and watering plants in the evening also help, because less water evaporates in the cooler air.", "Schools and communities can also help by practising rainwater harvesting, a method of collecting and storing rainwater from rooftops for later use. The collected water can be used for gardening and cleaning, which reduces the pressure on the town supply. In 2024, Sunrise Public School began a “Save Every Drop” campaign. Students checked taps for leaks, placed posters around the campus, and recorded how much water different actions saved in one month.", "The results showed that small efforts, when done regularly, can stop water from being wasted and protect this precious resource for the future. The school now repeats the campaign every year, and several neighbouring schools have asked the students to explain their method."]}, "why": "The passage suggests turning off the tap while brushing your teeth to save water.", "kind": "text", "q": "Fill in the blank: Turn off the tap while ____________ your teeth. <span class=\"hint\">(one word)<\/span>", "parts": [{"label": "", "a": ["brushing"]}]}, {"passage": {"title": "The Reading Challenge", "paras": ["Every October the library at Vidya Niketan runs a reading challenge. The rules are simple: a student who finishes a book writes two lines about it, and the librarian gives a sticker for the class chart. There are no prizes for the fastest reader, because the librarian has always insisted that reading quickly is not the same as reading well.", "This year the challenge began with a problem. The library owned 900 books, but fewer than 200 were borrowed in a month. Most students chose the same three popular titles, and the shelves of poetry, biography and travel writing stayed untouched. The librarian added a rule: a sticker counted only if the student had not read that author before.", "The result was unexpected. Class VI, which usually borrowed very little, went looking for new authors and finished 84 books. Class VII read 96, mostly mystery and animal stories. Class VIII, busy with a science project, managed only 72. Class IX, whose teacher read aloud for ten minutes at the end of every lesson, reached 108.", "The chart on the library wall, however, showed something more useful than totals. The students who read the most were not the ones who read fastest; they were the ones who talked about their books. A short conversation at the issue desk, it turned out, did more for reading than any poster.", "In November the librarian extended the challenge for another month, and the principal agreed to buy twenty new titles in the subjects that had been ignored. The library still owns 900 books. What changed is that more of them are being opened."]}, "why": "According to the table, Class IX read 108 books, the highest of the four classes.", "kind": "mcq", "q": "How many books did Class IX read in October?", "options": ["72", "84", "96", "108"], "answer": 3, "chip": "Reading · MCQ"}, {"passage": {"title": "The Reading Challenge", "paras": ["Every October the library at Vidya Niketan runs a reading challenge. The rules are simple: a student who finishes ions had been smaller and packets left unopened. Most of the paper could have been, if both sides had been used. The plastic and the glass could at least have been separated and sold.", "The findings were read out at assembly. The canteen now serves smaller portions and keeps a “share table” where unopened packets are left for anyone who wants them. Food waste goes to a compost pit behind the kitchen, the office prints on both sides, and two bins — one for paper and glass, one for everything else — stand at the gate.", "The audit cost nothing but a week of lunchtimes. The team’s report ended with a line that the principal has printed on a card above every bin: “We cannot manage what we have never weighed.”"]}, "why": "According to the table, food waste came to 25 kilograms.", "kind": "mcq", "q": "How much food waste was collected in the week?", "options": ["5 kilograms", "12 kilograms", "25 kilograms", "60 kilograms"], "answer": 2, "chip": "Reading · MCQ"}, {"passage": {"title": "The Waste Audit", "paras": ["For one week in August, students at Greenfield School did something unusual: instead of emptying the bins, they opened them. Every lunchtime a team of eight weighed the waste from the canteen and the classrooms, sorted it into four materials, and wrote the figures on a chart in the corridor.", "The first day was the shock. The bin outside the canteen was heavy with food — whole rotis, unopened packets of biscuits, half-eaten fruit — that had been bought and never finished. The students had expected plastic to be the biggest problem, because that is what most campaigns talk about. Paper came second, mostly worksheets printed on one side. Plastic was third, and glass, which hardly anyone thought about, was the smallest pile.", "By Friday the team had 60 kilograms of waste in total. Nobody could say the school was dirty; the bins had simply hidden the truth. The team then asked a different question: what could have been avoided? Almost all the food could have been, il an old friend", "b7": "belong to their work"}, "src": "The Tunnel", "why": null}, {"kind": "cloze", "q": "Anand’s machines caused more trouble than they solved. Do you think his family should have stopped him? What does the story suggest about encouraging young inventors?", "parts": [{"text": "Anand’s machines caused more trouble than they solved: "}, {"key": "b1", "blank": true}, {"text": ", the water bag caught Boppa, and the house was always full of wires and tools. Even so, the family should not have stopped him. His inventions began with "}, {"key": "b3", "blank": true}, {"text": ", and each failure taught him something about springs, weights and timing. A ban would have taught him only that mistakes are shameful, when mistakes were exactly how he learned. A patient listener was worth more than a tidy room. What he needed was "}, {"key": "b5", "blank": true}, {"text": ", not a ban. The story gently suggests that encouraging a young inventor means "}, {"key": "b7", "blank": true}, {"text": ", some noise and a soaking or two along the way."}], "bank": ["the alarm soaked his father", "the alarm woke the whole colony", "the alarm never rang at all", "a real problem — thefts in the colony", "a wish to trouble his sister", "a school competition", "a safe corner, a few rules and someone to ask him questions", "a locked room and a strict timetable", "new tools and no advice from anyone", "tolerating some mess", "demanding a success every week", "keeping the house perfectly tidy"], "grade": {"b1": "the alarm soaked his father", "b3": "a real problem — thefts in the colony", "b5": "a safe corner, a few rules and someone to ask him questions", "b7": "tolerating some mess"}, "src": "My Brother’s Great Invention", "why": null}, {"kind": "cloze", "q": "Shaana writes postcards in her own voice, one place at a time. How does that form make the places she visits more interesting than a textbook page would?", "parts": [{"text": "Shaana writes postcards "}, {"key": "b1", "blank": true}, {"text": ", one place at a time, and that is what makes them better than a textbook page. A textbook tells us the height of a glacier; Shaana says she never knew such a place existed, and we feel her surprise. Each card is dated and addressed to a friend, so "}, {"key": "b3", "blank": true}, {"text": ". We also hear what she leaves out: the tiredness, the food she did not enjoy, the friend she misses. The details she notices — clothes, food, the way people speak — are "}, {"key": "b5", "blank": true}, {"text": ". Geography becomes "}, {"key": "b7", "blank": true}, {"text": " rather than a set of facts to memorise."}], "bank": ["in her own excited voice", "in the voice of a teacher", "in the style of a news report", "the journey unfolds like a letter from someone we know", "the journey reads like a timetable", "the trip sounds like a history lesson", "the details a child would notice", "the facts an examiner wants", "the figures a geographer collects", "a story of places seen through curious eyes", "a list of dates and distances", "a warning about travelling"], "grade": {"b1": "in her own excited voice", "b3": "the journey unfolds like a letter from someone we know", "b5": "the details a child would notice", "b7": "a story of places seen through curious eyes"}, "src": "North, South, East, West", "why": null}, {"kind": "cloze", "q": "The child in “Paper Boats” writes his name on each boat and floats it down the stream. What does the poem suggest about hope and the wish to be remembered?", "parts": [{"text": "The child in “Paper Boats” "}, {"key": "b1", "blank": true}, {"text": " on each boat and floats them down the stream. He hopes someone in a strange land will find one and know who sent it. The poem is about hope: the boats may sink, yet he keeps launching them, and "}, {"key": "b3", "blank": true}, {"text": ". The stream, the boats and the clouds are all small things, yet the poem makes them carry a very large feeling. It is also about "}, {"key": "b5", <script>

}
function cycleScheme() { scheme = SCHEMES[(SCHEMES.indexOf(scheme) + 1) % SCHEMES.length]; applyTheme(); }

mq.addEventListener('change', function () { if (mode === 'auto') applyTheme(); });

        '<div class="node-bar"><div class="node-bar-fill" style="width:' + pct + '%;background:var(--' + sec.cvar + ')"></div></div>' +
        '<div class="node-actions">' +
          '<button class="node-btn practice" onclick="openPick(\'' + sec.id + '\')">Practice</button>' +
          '<button class="node-btn" onclick="openNotes(\'' + sec.id + '\')">Notes</button>' +
        '</div></div>';
    path.appendChild(node);
  });
  var T = 0, A = 0, O = 0;
  DATA.secs.forEach(function (sec) { sec.sets.forEach(function (set) { var st = setStats(sec.id, set.id, set.units.length); T += st.total; A += st.att; O += st.ok; }); });
  $('hero-sub').textContent = T ? (A + ' of ' + T + ' questions attempted · ' + O + ' correct. Progress saves on this phone.') : 'Practice one question at a time.';
}

/* ---------- pick ---------- */
function openPick(secId) {
  var sec = DATA.secs.filter(function (s) { return s.id === secId; })[0];
  curSec = secId;
  $('head-title').textContent = sec.name;
  $('pick-title').textContent = sec.name + ' — choose a set';
  var list = $('pick-list'); list.innerHTML = '';
  sec.sets.forEach(function (set) {
    var st = setStats(secId, set.id, set.units.length);
    var card = el('div', 'set-card');
    card.innerHTML =
      '<div style="flex:1;min-width:0">' +
        '<div class="set-name">' + esc(set.name) + '</div>' +
        '<div class="set-sub">' + set.units.length + ' questions · ' + esc(set.sub || '') + '</div>' +
      '</div>' +
      '<div class="set-stat">' + (st.att ? (st.att + '/' + st.total + ' · ' + st.ok + ' ✓') : 'start') + '</div>' +
      (st.att ? '<button class="reset-btn" title="Reset this set" onclick="event.stopPropagation();resetSet(\'' + secId + '\',\'' + set.id + '\')">↺</button>' : '');
    card.onclick = function () { startSet(secId, set.id); };
    list.appendChild(card);
  });
  show('v-pick');
}
function resetSet(secId, setId) {
  if (!confirm('Reset progress for this set?')) return;
  var sec = DATA.secs.filter(function (s) { return s.id === secId; })[0];
  var set = sec.sets.filter(function (s) { return s.id === setId; })[0];
  for (var i = 0; i < set.units.length; i++) delete progress[unitKey(secId, setId, i)];
  saveProgress(); openPick(secId);
}

/* ---------- practice ---------- */
function startSet(secId, setId) {
  var sec = DATA.secs.filter(function (s) { return s.id === secId; })[0];
  var set = sec.sets.filter(function (s) { return s.id === setId; })[0];
  curSec = secId; curSet = set; curI = 0;
  for (var i = 0; i < set.units.length; i++) { if (progress[unitKey(secId, setId, i)] === undefined) { curI = i; break; } }
  $('head-title').textContent = set.name;
  $('pr-sec').textContent = sec.name + ' · ' + set.name;
  $('pr-sec').style.color = 'var(--' + sec.cvar + ')';
  $('pr-fill').style.background = 'var(--' + sec.cvar + ')';
  show('v-practice'); dock.classList.add('show');
  renderUnit();
}
function exitPractice() {
  if (curSet) openPick(curSec); else goHome();
}
function nextUnit() {
  if (!answered) return;
  if (curI < curSet.units.length - 1) { curI++; renderUnit(); }
  else renderDone();
}
function renderUnit() {
  answered = false;
  var sec = DATA.secs.filter(function (s) { return s.id === curSec; })[0];
  var u = curSet.units[curI];
  $('pr-count').textContent = 'Question ' + (curI + 1) + ' of ' + curSet.units.length;
  $('pr-fill').style.width = ((curI) / curSet.units.length * 100) + '%';
  var st = setStats(curSec, curSet.id, curSet.units.length);
  $('pr-count').textContent = 'Question ' + (curI + 1) + ' of ' + curSet.units.length + ' · ' + st.ok + ' ✓';
  $('big-btn').textContent = curI === curSet.units.length - 1 ? 'Finish ✓' : 'Next →';
  $('big-btn').disabled = true;
  var card = $('q-card'); card.innerHTML = '';
  var r = RENDERERS[u.kind];
  r(card, u, sec);
  card.scrollIntoView({ block: 'start' });
}

/* finish card */
function renderDone() {
  var st = setStats(curSec, curSet.id, curSet.units.length);
  var card = $('q-card');
  card.innerHTML =
    '<div class="done-card">' +
      '<div class="big">' + (st.ok === st.total ? '🏆' : st.ok >= st.total * 0.7 ? '🎉' : '💪') + '</div>' +
      '<h2>Set complete</h2>' +
      '<div class="done-score">' + st.ok + ' / ' + st.total + '</div>' +
      '<p>' + (st.ok === st.total ? 'Perfect — this set is exam-ready.' : 'Redo any time; a fresh attempt replaces the old score.') + '</p>' +
      '<div class="done-actions">' +
        '<button onclick="startSet(\'' + curSec + '\',\'' + curSet.id + '\')">Practice again</button>' +
        '<button class="prime" onclick="openPick(\'' + curSec + '\')">More sets</button>' +
      '</div></div>';
  $('pr-count').textContent = 'Done';
  $('pr-fill').style.width = '100%';
  $('big-btn').disabled = true;
}

/* ================= QUESTION RENDERERS ================= */
var RENDERERS = {};

function addFb(card, ok, why) {
  var fb = el('div', 'fb ' + (ok ? 'win' : 'lose'));
  fb.innerHTML = (ok ? '✓ Correct. ' : '✗ ') + (why ? esc(why) : '');
  card.appendChild(fb);
}

/* MCQ + True/False */
RENDERERS.mcq = function (card, u) {
  if (u.passage) addPassage(card, u.passage);
  card.appendChild(el('div', 'chip', u.chip || 'MCQ'));
  card.appendChild(el('div', 'q-text', u.q));
  var wrap = el('div');
  u.options.forEach(function (optText, i) {
    var o = el('div', 'opt');
    o.innerHTML = '<div class="opt-key">' + 'ABCD'[i] + '</div><div>' + optText + '</div>';
    o.onclick = function () {
      if (answered) return; answered = true;
      var kids = wrap.children;
      for (var j = 0; j < kids.length; j++) {
        kids[j].classList.add('off');
        if (j === u.answer) kids[j].className = 'opt right';
      }
      o.classList.remove('off');
      if (i === u.answer) { o.className = 'opt right'; addFb(card, true, u.why); }
      else { o.className = 'opt miss'; addFb(card, false, u.why); }
      markUnit(unitKey(curSec, curSet.id, curI), i === u.answer ? 1 : 0);
      $('big-btn').disabled = false;
    };
    wrap.appendChild(o);
  });
  card.appendChild(wrap);
};

/* typed answer(s) */
RENDERERS.text = function (card, u) {
  if (u.passage) addPassage(card, u.passage);
  card.appendChild(el('div', 'chip', 'Type the answer'));
  card.appendChild(el('div', 'q-text', u.q));
  var parts = u.parts || [{ label: '', a: [].concat(u.answers || u.answer) }];
  var inputs = [];
  parts.forEach(function (p) {
    if (p.label) card.appendChild(el('span', 'text-label', esc(p.label)));
    var inp = el('input', 'text-in');
    inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
    card.appendChild(inp); inputs.push(inp);
  });
  var btn = el('button', 'check-btn', 'Check');
  btn.onclick = function () {
    if (answered) return;
    var allOk = true, anyFilled = false;
    inputs.forEach(function (inp, i) {
      var v = inp.value.trim();
      if (v) anyFilled = true;
      var ok = false;
      var acc = parts[i].a || String(parts[i].answer || '').split('|');
      for (var k = 0; k < acc.length; k++) if (norm(v) === norm(acc[k])) ok = true;
      inp.classList.add(ok ? 'right' : 'miss');
      inp.disabled = true;
      if (!ok) allOk = false;
    });
    if (!anyFilled) return;
    answered = true;
    addFb(card, allOk, u.why);
    markUnit(unitKey(curSec, curSet.id, curI), allOk ? 1 : 0);
    btn.disabled = true;
    $('big-btn').disabled = false;
  };
  card.appendChild(btn);
};

/* passage / extract box */
function addPassage(card, p) {
  var box = el('div', 'passage');
  var h = p.title ? '<b>' + esc(p.title) + '</b><br>' : '';
  box.innerHTML = h + p.paras.map(function (t) { return '<p style="margin:.35rem 0">' + t + '</p>'; }).join('');
  card.appendChild(box);
}

/* tiles fill (literature identify) */
RENDERERS.fill = function (card, u) {
  if (u.passage) addPassage(card, u.passage);
  card.appendChild(el('div', 'chip', 'Tap tiles to fill'));
  card.appendChild(el('div', 'q-text', u.q));
  var slots = [], state = [];
  var slotWrap = el('div');
  u.parts.forEach(function (p, pi) {
    state.push(null);
    var row = el('div', 'part-row');
    row.innerHTML = '<span class="part-label">' + esc(p.label) + '</span>';
    var s = el('button', 'slot', '&nbsp;');
    s.onclick = function () {
      if (answered) return;
      if (state[pi] !== null) { /* clear: return tile */ used[state[pi]] = false; tiles[state[pi]].classList.remove('used'); state[pi] = null; s.innerHTML = '&nbsp;'; }
      else { if (selSlot) selSlot.classList.remove('sel'); selSlot = s; s.classList.add('sel'); }
    };
    slots.push(s); row.appendChild(s); slotWrap.appendChild(row);
  });
  var selSlot = null;
  var tileTexts = []; u.parts.forEach(function (p) { p.tiles.forEach(function (t) { tileTexts.push(t); }); });
  var pool = shuffle(tileTexts);
  var used = pool.map(function () { return false; });
  var tiles = [];
  var tileWrap = el('div', 'tiles');
  pool.forEach(function (t, ti) {
    var b = el('button', 'tile', esc(t));
    b.onclick = function () {
      if (answered) return;
      var target = -1;
      if (selSlot) { for (var i = 0; i < slots.length; i++) if (slots[i] === selSlot) target = i; selSlot.classList.remove('sel'); selSlot = null; }
      else { for (var i = 0; i < state.length; i++) if (state[i] === null) { target = i; break; } }
      if (target === -1) return;
      if (state[target] !== null) { used[state[target]] = false; tiles[state[target]].classList.remove('used'); }
      state[target] = ti; used[ti] = true; tiles[ti].classList.add('used');
      slots[target].textContent = t;
    };
    tiles.push(b); tileWrap.appendChild(b);
  });
  var btn = el('button', 'check-btn', 'Check');
  btn.onclick = function () {
    if (answered) return;
    var allOk = true;
    u.parts.forEach(function (p, pi) {
      if (state[pi] === null) { allOk = false; slots[pi].classList.add('miss'); return; }
      var ok = norm(pool[state[pi]]) === norm(p.answer);
      slots[pi].classList.add(ok ? 'right' : 'miss');
      if (!ok) allOk = false;
    });
    answered = true;
    addFb(card, allOk, u.why);
    markUnit(unitKey(curSec, curSet.id, curI), allOk ? 1 : 0);
    btn.disabled = true; $('big-btn').disabled = false;
  };
  card.appendChild(slotWrap); card.appendChild(tileWrap); card.appendChild(btn);
};

/* cloze (tap blank, tap option) & writing builder share this engine */
function makeBlankEngine(card, cfg) {
  /* cfg: { lines: [{html}] or custom, blanks: {key:{answer, label?}}, bank: [strings], grade: map key->answerText, onGrade } */
  var blanks = {};       /* key -> button */
  var values = {};       /* key -> chosen text */
  var selKey = null;
  var wrap = el('div');

  function blankBtn(key, hint) {
    var b = el('button', 'cblank', '&nbsp;______&nbsp;');
    b.dataset.key = key;
    b.onclick = function () {
      if (cfg.locked) return;
      if (values[key]) { /* clear */ cfg.bankUsed(values[key], false); delete values[key]; b.innerHTML = '&nbsp;______&nbsp;'; b.classList.remove('right','miss'); }
      else { if (selKey && blanks[selKey]) blanks[selKey].classList.remove('sel'); selKey = key; b.classList.add('sel'); }
    };
    blanks[key] = b; return b;
  }

  var bankWrap = null;
  if (cfg.bank && cfg.bank.length) {
    bankWrap = el('div', 'bank');
    var usedMap = {};
    cfg.bank.forEach(function (item) {
      var chip = el('button', 'tile', esc(item));
      chip.onclick = function () {
        if (cfg.locked) return;
        var key = selKey;
        if (!key) { for (var k in blanks) if (!values[k]) { key = k; break; } }
        if (!key) return;
        if (values[key]) cfg.bankUsed(values[key], false);
        values[key] = item; usedMap[item] = true;
        blanks[key].textContent = item; blanks[key].classList.remove('sel'); blanks[key].classList.remove('right','miss');
        selKey = null;
        cfg.bankUsed(item, true);
      };
      chip.dataset.item = item;
      bankWrap.appendChild(chip);
    });
  }
  cfg.bankUsed = function (item, isUsed) {
    var chips = bankWrap ? bankWrap.children : [];
    for (var i = 0; i < chips.length; i++) if (chips[i].dataset.item === item) chips[i].classList.toggle('used', isUsed);
  };

  cfg.build(wrap, blankBtn);   /* renderer fills lines using blankBtn(key) */

  var btn = null;
  if (cfg.check) {
    btn = el('button', 'check-btn', 'Check');
    btn.onclick = function () {
      if (answered || cfg.locked) return;
      var allOk = true, anyEmpty = false;
      for (var k in blanks) {
        if (!values[k]) { anyEmpty = true; blanks[k].classList.add('miss'); continue; }
        var ok = norm(values[k]) === norm(cfg.grade[k]);
        blanks[k].classList.add(ok ? 'right' : 'miss');
        if (!ok) allOk = false;
      }
      if (anyEmpty) { /* allow check anyway but fail empties */ }
      answered = true; cfg.locked = true;
      addFb(card, allOk, cfg.why);
      markUnit(unitKey(curSec, curSet.id, curI), allOk ? 1 : 0);
      btn.disabled = true; $('big-btn').disabled = false;
    };
  }
  card.appendChild(wrap);
  if (bankWrap) card.appendChild(bankWrap);
  if (btn) card.appendChild(btn);
}

/* cloze literature (Q10 / Q11-12) */
RENDERERS.cloze = function (card, u) {
  card.appendChild(el('div', 'chip', esc(u.src ? u.src + ' · fill the blanks' : 'Fill the blanks')));
  card.appendChild(el('div', 'q-text', u.q));
  makeBlankEngine(card, {
    bank: u.bank,
    grade: u.grade,
    why: u.why,
    check: true,
    build: function (wrap, blankBtn) {
      var line = el('div', 'c-line');
      u.parts.forEach(function (p) {
        if (p.text !== undefined) line.appendChild(document.createTextNode(p.text));
        else line.appendChild(blankBtn(p.key));
      });
      wrap.appendChild(line);
    }
  });
};

/* writing builder (Q4–Q7) */
RENDERERS.builder = function (card, u) {
  card.appendChild(el('div', 'chip', 'Writing task · tap & fill'));
  var sc = el('div', 'scenario', '<b>Scenario:</b> ' + esc(u.scenario));
  card.appendChild(sc);
  makeBlankEngine(card, {
    bank: u.bank,
    grade: u.grade,
    check: true,
    build: function (wrap, blankBtn) {
      u.template.forEach(function (t) {
        if (t.hr) { wrap.appendChild(el('hr', 'w-hr')); return; }
        if (t.cls === 'ttl') {
          var line = el('div', 'w-ttl');
          t.parts.forEach(function (f) { if (typeof f === 'string') line.appendChild(document.createTextNode(f)); else if (f.k) line.appendChild(blankBtn(f.k)); });
          wrap.appendChild(line); return;
        }
        var div = el('div', 'w-line');
        if (t.type) {
          if (t.type === 'label') { div.className = 'w-line w-label'; div.textContent = 'NOTICE'; }
          else if (t.type === 'contact') { div.className = 'w-line w-fixed'; div.textContent = 'For further details, contact the undersigned.'; }
          else if (t.type === 'sign') { div.className = 'w-line w-right w-fixed'; div.textContent = '(Signature)'; }
          else if (t.type === 'inst') { div.className = 'w-line w-center'; div.appendChild(blankBtn(t.key)); }
          else if (t.type === 'date') { div.className = 'w-line w-fixed'; div.appendChild(document.createTextNode('Date: ')); div.appendChild(blankBtn(t.key)); }
          else if (t.type === 'heading') { div.className = 'w-line w-center'; div.appendChild(blankBtn(t.key)); }
          else if (t.type === 'name') { div.className = 'w-line w-right'; div.appendChild(document.createTextNode('Name: ')); div.appendChild(blankBtn(t.key)); }
          else if (t.type === 'desig') { div.className = 'w-line w-right'; div.appendChild(document.createTextNode('Designation: ')); div.appendChild(blankBtn(t.key)); }
          else if (t.type === 'body' && t.parts) {
            t.parts.forEach(function (f) {
              if (typeof f === 'string') div.appendChild(document.createTextNode(f));
              else if (f.k) div.appendChild(blankBtn(f.k));
            });
          }
        } else if (t.parts) {
          t.parts.forEach(function (f) {
            if (typeof f === 'string') div.appendChild(document.createTextNode(f));
            else if (f.k) div.appendChild(blankBtn(f.k));
          });
          if (t.tag === 'p') div.classList.add('w-line');
        }
        wrap.appendChild(div);
      });
    }
  });
};

/* sequence (notice format) */
RENDERERS.seq = function (card, u) {
  card.appendChild(el('div', 'chip', 'Arrange in correct order'));
  card.appendChild(el('div', 'q-text', esc(u.q)));
  var order = shuffle(u.items.map(function (_, i) { return i; }));
  var list = el('div');
  function render() {
    list.innerHTML = '';
    order.forEach(function (itemIdx, pos) {
      var row = el('div', 'seq-item');
      row.innerHTML = '<span class="seq-num">' + (pos + 1) + '.</span><span class="seq-text">' + esc(u.items[itemIdx]) + '</span>';
      var up = el('button', 'seq-btn', '▲'); up.onclick = function () { if (pos > 0 && !answered) { var t = order[pos - 1]; order[pos - 1] = order[pos]; order[pos] = t; render(); } };
      var dn = el('button', 'seq-btn', '▼'); dn.onclick = function () { if (pos < order.length - 1 && !answered) { var t = order[pos + 1]; order[pos + 1] = order[pos]; order[pos] = t; render(); } };
      row.appendChild(up); row.appendChild(dn);
      list.appendChild(row);
    });
  }
  render();
  var btn = el('button', 'check-btn', 'Check');
  btn.onclick = function () {
    if (answered) return;
    answered = true;
    var allOk = true;
    order.forEach(function (itemIdx, pos) {
      var ok = itemIdx === pos;
      list.children[pos].classList.add(ok ? 'right' : 'miss');
      if (!ok) allOk = false;
    });
    addFb(card, allOk, u.why);
    markUnit(unitKey(curSec, curSet.id, curI), allOk ? 1 : 0);
    btn.disabled = true; $('big-btn').disabled = false;
  };
  card.appendChild(list); card.appendChild(btn);
};

/* ================= NOTES ================= */
function openNotes(secId) {
  var prevPane = document.querySelector('.pane.active').id;
  var sec = DATA.secs.filter(function (s) { return s.id === secId; })[0];
  $('head-title').textContent = sec.name + ' · Notes';
  $('notes-title').textContent = sec.name + ' — Notes';
  var body = $('notes-body'); body.innerHTML = '';
  DATA.notes[secId].forEach(function (n) {
    var c = el('div', 'note-card');
    var h = '<h3>' + esc(n.title) + '</h3>';
    if (n.lines) h += '<ul>' + n.lines.map(function (l) { return '<li>' + l + '</li>'; }).join('') + '</ul>';
    if (n.text) h += '<p>' + n.text + '</p>';
    c.innerHTML = h; body.appendChild(c);
  });
  notesReturn = prevPane === 'v-practice' ? 'practice' : (prevPane === 'v-pick' ? 'pick' : 'home');
  show('v-notes');
}
var notesReturn = 'home';
function notesBack() {
  if (notesReturn === 'practice' && curSet) { show('v-practice'); }
  else if (notesReturn === 'pick' && curSec) { openPick(curSec); }
  else goHome();
}

/* ================= INIT ================= */
goHome();
</script>

<script>
window.onerror = function(m){ document.title = 'JSERR: ' + m; };
setTimeout(function(){
  var log = [];
  try {
    // find first text-kind unit anywhere
    var found=null;
    DATA.secs.forEach(function(s){ s.sets.forEach(function(t){ t.units.forEach(function(u,i){ if(!found && u.kind==='text') found={sec:s.id,set:t.id,i:i,u:u}; }); }); });
    startSet(found.sec, found.set); curI = found.i; renderUnit();
    var tin = document.querySelector('#q-card .text-in');
    log.push('text-render=' + (tin?'yes':'no'));
    // wrong answer first
    tin.value = 'definitely-wrong-xyz';
    document.querySelector('#q-card .check-btn').click();
    log.push('wrong-fb=' + document.querySelector('#q-card .fb').className + ' input-class=' + tin.className);
    // theme toggles
    cycleScheme(); cycleScheme(); cycleMode(); cycleMode();
    log.push('scheme=' + document.body.dataset.scheme + ' mode=' + document.body.dataset.mode);
    log.push('theme-store=' + (localStorage.getItem('c7-theme')?'saved':'missing'));
    // resume behavior: startSet should jump to first unanswered
    startSet(found.sec, found.set);
    log.push('resume-q=' + document.getElementById('pr-count').textContent);
  } catch(e) { log.push('THROW: ' + e.message); }
  var pre = document.createElement('pre'); pre.id='TESTOUT'; pre.textContent='RESULT: '+log.join(' | ');
  document.body.appendChild(pre);
}, 300);
