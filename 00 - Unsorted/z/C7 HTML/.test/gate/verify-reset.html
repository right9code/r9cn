eferences to the train's whistle?<br />\nAnswer: The repeated references emphasize how the sound of the train whistle constantly captures the speaker's attention, inspiring her urge to travel.  <\/p>\n<\/li>\n<li>\n<p>What does the line 'no matter where it's going' reveal about the speaker's attitude towards travel?<br />\nAnswer: It reveals that the speaker loves travel for its own sake and is eager to explore new places regardless of the destination.  <\/p>\n<\/li>\n<li>\n<p>Do you think the poet actually sees and hears the train? Why or why not?<br />\nAnswer: No, the poet does not necessarily see or hear a real train at all times, because she mentions that the railroad track is miles away. Instead, she experiences the train vividly in her imagination due to her deep love for travel.  <\/p>\n<\/li>\n<\/ol>\n<h2>Let us write<\/h2>\n<h3>I. Write a diamante poem that connects 'reading' and 'adventure'.<\/h3>\n<p>Reading<br />\nQuiet, peaceful<br />\nLearning, imagining, discovering<br />\nBooks open new worlds<br />\nExploring, climbing, daring<br />\nBold, exciting<br />\nAdventure  <\/p>\n<h3>II. Describe an interesting character met while travelling.<\/h3>\n<p>During a train trip to Jaipur last winter, I met an elderly gentleman named Mr. Sharma. He had silvery white hair, kind eyes behind round wire-rimmed glasses, and wore a neat brown waistcoat. Throughout the journey, he sat across from me painting watercolor landscapes of the countryside passing by outside the window. He was a warm, gentle, and story-telling person who generously shared his paintbrushes and taught me how to shade mountains. My favorite moment was when he smiled and said, \"Every journey gives you a new color for your canvas.\" His creative spirit and joyful nature made the long train ride unforgettable.  <\/p>"}, {"title": "My Dear Soldiers", "html": "<p>Oh! Defenders of borders<br />\nYou are great sons of my land<br />\nWhen we are all asleep<br />\nYou still hold on to your deed<br />\nWindy season or snowy days<br />\nOr scorching sun's sweltering rays<br />\nYou are there guarding all the time awake<br />\nTreading the lonely expanses as yogis<br />\nClimbing the heights or striding the valleys<br />\nDefending the deserts or guarding the marshes<br />\nSurveillance in seas and by securing the air<br />\nPrime of your youth given to the nation!!<br />\nWind chimes of my land vibrate your feat<br />\nWe pray for you brave men!!<br />\nMay the Lord bless you all!!  <\/p>\n<p><strong>A.P.J. ABDUL KALAM<\/strong>  <\/p>\n<hr />\n<h2>Summary<\/h2>\n<p>The poem is a heartfelt tribute to the soldiers who defend India's borders in all conditions — wind, snow, and scorching heat. Dr. Kalam highlights their tireless commitment as they guard mountains, valleys, deserts, marshes, seas, and air, sacrificing the prime of their youth for the nation. The soldiers are compared to yogis for their disciplined, selfless lives in lonely expanses. The poem concludes with a prayer and blessing for the brave soldiers, expressing the nation's deep gratitude and admiration.  <\/p>\n<h2>Poetic Devices<\/h2>\n<ul>\n<li>\n<p><strong>Simile<\/strong> — \"Treading the lonely expanses as yogis\" compares soldiers to yogis, emphasizing their discipline and self-sacrifice.<\/p>\n<\/li>\n<li>\n<p><strong>Metaphor<\/strong> — \"Wind chimes of my land vibrate your feat\" uses wind chimes as a metaphor for nature celebrating the soldiers' achievements.<\/p>\n<\/li>\n<li>\n<p><strong>Personification<\/strong> — The wind chimes are given the ability to \"vibrate\" in honor of the soldiers.<\/p>\n<\/li>\n<li>\n<p><strong>Repetition<\/strong> — \"You\" and \"we\" are repeated throughout to contrast the soldiers who protect and the citizens who sleep safely.<\/p>\n<\/li>\n<li>\n<p><strong>Alliteration<\/strong> — \"season or snowy,\" \"scorching sun's sweltering\" create rhythmic emphasis on harsh conditions.<\/p>\n<\/li>\n<li>\n<p><strong>Imagery<\/strong> — \"Windy season or snowy days / Or scorching sun's sweltering rays,\" \"Climbing the heights or striding the valleys\" paint vivid pictures of diverse terrains and weather.<\/p>\n<\/li>\n<li>\n<p><strong>Hyperbole<\/strong> — \"Prime of your youth given to the nation!!\" amplifies the scale of sacrifice.<\/p>\n<\/li>\n<li>\n<p><strong>Anaphora<\/strong> — \"You\" is repeated at the start of multiple lines (\"You are great sons,\" \"You still hold on,\" \"You are there guarding\"), creating a direct, hymn-like address.<\/p>\n<\/li>\n<li>\n<p><strong>Asyndeton<\/strong> — The listing of terrains without conjunctions (\"Climbing the heights or striding the valleys / Defending the deserts or guarding the marshes\") emphasizes the vast range of the soldiers' duty.<\/p>\n<\/li>\n<li>\n<p><strong>Apostrophe<\/strong> — The poem directly addresses the soldiers (\"Oh! Defenders of borders\"), creating an intimate, emotional connection.<\/p>\n<\/li>\n<li>\n<p><strong>Antithesis<\/strong> — \"When we are all asleep / You still hold on to your deed\" contrasts citizens' rest with soldiers' vigilance.<\/p>\n<\/li>\n<li>\n<p><strong>Exclamation<\/strong> — Multiple exclamation marks (\"given to the nation!!\", \"We pray for you brave men!!\") convey intense emotion and reverence.<\/p>\n<\/li>\n<li>\n<p><strong>Tone:<\/strong> Admiring, respectful, grateful, and prayerful.<\/p>\n<\/li>\n<\/ul>\n<h2>Rhyme Scheme<\/h2>\n<p>Free verse — the poem does not follow a strict rhyme scheme but uses rhythmic lines and exclamatory endings for emotional impact.<\/p>\n<hr />\n<table>\n<thead>\n<tr>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>When the poet mentions 'great sons' he is actually referring to all the soldiers (men and women) serving the nation.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Let us discuss<\/h4>\n<p><strong>I. Complete the summary with an exact word from the poem. An example has been done for you. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<p>The poem is a tribute to the soldiers of the 1. <strong>land<\/strong> who defend the 2. <code>_________<\/code> of their country. It highlights their untiring commitment and sacrifices as they guard the nation. The soldiers remain vigilant and dedicated, whether it's windy, snowy, or 3. <code>_________<\/code> hot. They walk on 4. <code>_________<\/code> stretches of land like the yogis. Their duty takes them to different terrains, including mountains, valleys, 5. <code>_________<\/code>, and marshes. The poet acknowledges that they have given a major part of their 6. <code>_________<\/code> to protect the nation. The poet says the wind chimes show their respect to the soldiers' 7. <code>_________<\/code>. The poet concludes with prayers for their well-being and blessings.  <\/p>\n<p><strong>II. Select the correct option for the following questions.<\/strong>  <\/p>\n<ol>\n<li>The theme of the poem is <code>_________<\/code>.  <ul>\n<li>(i) patriotism and sacrifice<\/li>\n<li>(ii) heroism and awareness<\/li>\n<li>(iii) nature and hardship<\/li>\n<li>(iv) seasons and terrains<\/li>\n<\/ul>\n<\/li>\n<li>The tone of the poem is <code>_________<\/code>.  <ul>\n<li>(i) admiring <\/li>\n<li>(ii) sad <\/li>\n<li>(iii) respectful<\/li>\n<li>(iv) grateful <\/li>\n<li>(v) prayerful  <\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<ul>\n<li>A. Only (v)  <\/li>\n<li>B. (i) and (iii)  <\/li>\n<li>C. (ii), (iii) and (v)  <\/li>\n<li>D. (i), (iii), (iv) and (v)  <\/li>\n<\/ul>\n<p><strong>III. Complete the following sentences by explaining why the poet has used the following poetic devices.<\/strong>  <\/p>\n<ol>\n<li><strong>Imagery<\/strong> because <code>_________<\/code>.  <\/li>\n<li><strong>Simile<\/strong> because the soldiers are likened to <code>_________<\/code>.  <\/li>\n<li><strong>Metaphor<\/strong> because the poet uses wind chimes <code>_________<\/code>.  <\/li>\n<li><strong>Repetition<\/strong> of the words 'you' and 'we' because <code>_________<\/code>.  <\/li>\n<li><strong>Alliteration<\/strong> such as 'season or snowy' and <code>_________<\/code> to create <code>_________<\/code>.  <\/li>\n<\/ol>\n<h4>Let us think and reflect<\/h4>\n<p><strong>I. Read the extract given below and answer the questions that follow.<\/strong>  <\/p>\n<p><em>When we are all asleep<\/em><br />\n<em>You still hold on to your deed<\/em><br />\n<em>Windy season or snowy days<\/em><br />\n<em>Or scorching sun's sweltering rays<\/em><br />\n<em>You are there guarding all the time awake<\/em><br />\n<em>Treading the lonely expanses as yogis<\/em>  <\/p>\n<ol>\n<li>Identify a set of opposite words from the extract.  <\/li>\n<li>\n<p>Complete the sentence appropriately.<br />\n<em>The phrase 'still hold on to your deed' refers to the soldier's attitude of <code>____________<\/code>.<\/em>  <\/p>\n<\/li>\n<li>\n<p>Identify whether the following statement is <strong>true<\/strong> or <strong>false<\/strong>.<br />\n<em>The soldiers walk across the deserted stretches of land.<\/em>  <\/p>\n<\/li>\n<li>\n<p>Give evidence from the extract to show that soldiers face harsh weather conditions.  <\/p>\n<\/li>\n<li>Which quality of the soldiers is highlighted in this extract?  <ul>\n<li>(i) modesty <\/li>\n<li>(ii) optimism <\/li>\n<li>(iii) simplicity <\/li>\n<li>(iv) dedication  <\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>Who is the speaker of this poem? How can you say so?  <\/li>\n<li>How is the theme of the poem conveyed through imagery? Support your answer with examples from the poem.  <\/li>\n<li>How does the poet highlight the commitment of the soldiers? Provide examples from the poem to support your answer.  <\/li>\n<li>What is the significance of the line 'Prime of your youth given to the nation!!' with reference to sacrifice and service?  <\/li>\n<li>The poem ends with a prayer for the soldiers' well-being and blessings. Why is it important for each one of us to pray for the well-being of soldiers?  <\/li>\n<\/ol>\n<h4>Let us write<\/h4>\n<p><strong>I. An <em>acrostic poem<\/em> is the one in which the first letter of each line spells out a word, name or phrase when read vertically. Read the example given below and compose your own acrostic poem.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Letter<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Proud of motherland<\/td>\n<td>S<code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>Always alert I stand<\/td>\n<td>O<code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>Time, my concern never<\/td>\n<td>L<code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>Respect to her, forever<\/td>\n<td>D<code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>In worse times or better<\/td>\n<td>I<code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>Our love has no end<\/td>\n<td>E<code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>To me, my country is my friend.<\/td>\n<td>R<code>_______<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>II. We cannot thank our soldiers enough. To express your admiration, draft a note of gratitude for their selfless service to the nation. (Word limit: 50 words)<\/strong><br />\nYou may begin this way:  <\/p>\n<p><em>Dear Bravehearts,<\/em><br />\n<em>I would like to...<\/em>  <\/p>\n<hr />\n<hr />\n<h1>Answers – My Dear Soldiers<\/h1>\n<h2>Let us discuss<\/h2>\n<p><strong>I. Complete the summary with an exact word from the poem.<\/strong>  <\/p>\n<p>The poem is a tribute to the soldiers of the 1. <strong>land<\/strong> who defend the 2. <strong>borders<\/strong> of their country. It highlights their untiring commitment and sacrifices as they guard the nation. The soldiers remain vigilant and dedicated, whether it's windy, snowy, or 3. <strong>scorching<\/strong> hot. They walk on 4. <strong>lonely<\/strong> stretches of land like the yogis. Their duty takes them to different terrains, including mountains, valleys, 5. <strong>deserts<\/strong>, and marshes. The poet acknowledges that they have given a major part of their 6. <strong>youth<\/strong> to protect the nation. The poet says the wind chimes show their respect to the soldiers' 7. <strong>feat<\/strong>. The poet concludes with prayers for their well-being and blessings.  <\/p>\n<p><strong>II. Select the correct option for the following questions.<\/strong>  <\/p>\n<ol>\n<li>The theme of the poem is <strong>(i) patriotism and sacrifice<\/strong>.  <\/li>\n<li>The tone of the poem is <strong>D. (i), (iii), (iv) and (v)<\/strong> [admiring, respectful, grateful, prayerful].  <\/li>\n<\/ol>\n<p><strong>III. Complete the following sentences by explaining why the poet has used the following poetic devices.<\/strong>  <\/p>\n<ol>\n<li><strong>Imagery<\/strong> because it creates vivid mental pictures of soldiers guarding the nation in extreme weather, high mountains, deep valleys, and vast deserts.  <\/li>\n<li><strong>Simile<\/strong> because the soldiers are likened to yogis who live disciplined, selfless lives in quiet and lonely expanses.  <\/li>\n<li><strong>Metaphor<\/strong> because the poet uses wind chimes to represent nature celebrating and echoing the brave achievements of the soldiers.  <\/li>\n<li><strong>Repetition<\/strong> of the words 'you' and 'we' because it highlights the contrast between the soldiers who protect the borders and the citizens who sleep safely at home.  <\/li>\n<li><strong>Alliteration<\/strong> such as 'season or snowy' and 'scorching sun's sweltering' to create a rhythmic sound and emphasize the harsh weather conditions faced by soldiers.  <\/li>\n<\/ol>\n<h2>Let us think and reflect<\/h2>\n<p><strong>I. Read the extract given below and answer the questions that follow.<\/strong>  <\/p>\n<ol>\n<li>\n<p>Identify a set of opposite words from the extract.<br />\n<code>asleep<\/code> and <code>awake<\/code>  <\/p>\n<\/li>\n<li>\n<p>Complete the sentence appropriately.<br />\n<em>The phrase 'still hold on to your deed' refers to the soldier's attitude of unwavering commitment and devotion to duty.<\/em>  <\/p>\n<\/li>\n<li>\n<p>Identify whether the following statement is <strong>true<\/strong> or <strong>false<\/strong>.<br />\n<em>The soldiers walk across the deserted stretches of land.<\/em><br />\nTrue.  <\/p>\n<\/li>\n<li>\n<p>Give evidence from the extract to show that soldiers face harsh weather conditions.<br />\nThe lines <em>\"Windy season or snowy days / Or scorching sun's sweltering rays\"<\/em> show that soldiers guard the nation in severe cold, strong winds, and extreme heat.  <\/p>\n<\/li>\n<li>\n<p>Which quality of the soldiers is highlighted in this extract?<br />\n<strong>(iv) dedication<\/strong>  <\/p>\n<\/li>\n<\/ol>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>\n<p><strong>Who is the speaker of this poem? How can you say so?<\/strong><br />\nThe speaker of the poem is Dr. A.P.J. Abdul Kalam. His name is written at the end of the poem, and he expresses gratitude to soldiers on behalf of all citizens.  <\/p>\n<\/li>\n<li>\n<p><strong>How is the theme of the poem conveyed through imagery? Support your answer with examples from the poem.<\/strong><br />\nThe theme of patriotism and sacrifice is conveyed through vivid imagery of difficult terrains and weather. Examples such as \"snowy days\", \"scorching sun's sweltering rays\", \"climbing the heights\", and \"surveillance in seas\" create clear mental pictures of the hard conditions soldiers endure.  <\/p>\n<\/li>\n<li>\n<p><strong>How does the poet highlight the commitment of the soldiers? Provide examples from the poem to support your answer.<\/strong><br />\nThe poet highlights their commitment by showing that soldiers stay alert and guard the country day and night while citizens sleep. They defend mountains, valleys, deserts, marshes, seas, and air continuously.  <\/p>\n<\/li>\n<li>\n<p><strong>What is the significance of the line 'Prime of your youth given to the nation!!' with reference to sacrifice and service?<\/strong><br />\nThis line signifies that soldiers dedicate the best and most energetic years of their lives to serving the nation, choosing national protection over personal comforts.  <\/p>\n<\/li>\n<li>\n<p><strong>The poem ends with a prayer for the soldiers' well-being and blessings. Why is it important for each one of us to pray for the well-being of soldiers?<\/strong><br />\nIt is important to pray for soldiers because they risk their lives every day in dangerous environments to keep us safe. Praying for them shows our respect, gratitude, and moral support for their sacrifices.  <\/p>\n<\/li>\n<\/ol>\n<h2>Let us write<\/h2>\n<p><strong>I. Compose your own acrostic poem for SOLDIER:<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Letter<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Proud of motherland<\/td>\n<td><strong>S<\/strong>afeguarding our land<\/td>\n<\/tr>\n<tr>\n<td>Always alert I stand<\/td>\n<td><strong>O<\/strong>n guard day and night<\/td>\n<\/tr>\n<tr>\n<td>Time, my concern never<\/td>\n<td><strong>L<\/strong>oving the nation forever<\/td>\n<\/tr>\n<tr>\n<td>Respect to her, forever<\/td>\n<td><strong>D<\/strong>edicated to duty<\/td>\n<\/tr>\n<tr>\n<td>In worse times or better<\/td>\n<td><strong>I<\/strong>n every harsh terrain<\/td>\n<\/tr>\n<tr>\n<td>Our love has no end<\/td>\n<td><strong>E<\/strong>ver brave and true<\/td>\n<\/tr>\n<tr>\n<td>To me, my country is my friend.<\/td>\n<td><strong>R<\/strong>eady to sacrifice<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>II. Draft a note of gratitude for their selfless service to the nation (within 50 words):<\/strong>  <\/p>\n<p><em>Dear Bravehearts,<\/em><br />\n<em>I would like to express my deepest gratitude for your selfless service. You sacrifice your comfort and youth to guard our borders in extreme weather so we can live in peace. Thank you for your immense courage and dedication. India is safe and proud because of you.<\/em>  <\/p>"}, {"title": "Rani Abbakka", "html": "<h4>Let us read<\/h4>\n<h4>Let us discuss<\/h4>\n<p><strong>I. Match the words in Column 1 with their meanings in Column 2. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Column 1<\/th>\n<th>Column 2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. vassal (n)<\/td>\n<td>(i) extreme anger<\/td>\n<\/tr>\n<tr>\n<td>2. coronation (n)<\/td>\n<td>(ii) take hold of suddenly or forcibly<\/td>\n<\/tr>\n<tr>\n<td>3. successor (n)<\/td>\n<td>(iii) happen in a violent way<\/td>\n<\/tr>\n<tr>\n<td>4. rash (adj.)<\/td>\n<td>(iv) acting or doing something without thinking about the consequences<\/td>\n<\/tr>\n<tr>\n<td>5. sovereign country (n)<\/td>\n<td>(v) association or partnership<\/td>\n<\/tr>\n<tr>\n<td>6. league (n)<\/td>\n<td>(vi) a ceremony at which a person is made king or queen<\/td>\n<\/tr>\n<tr>\n<td>7. wrath (n)<\/td>\n<td>(vii) fearless<\/td>\n<\/tr>\n<tr>\n<td>8. seize (v)<\/td>\n<td>(viii) capture<\/td>\n<\/tr>\n<tr>\n<td>9. resolve (n)<\/td>\n<td>(ix) a country with a government having complete authority<\/td>\n<\/tr>\n<tr>\n<td>10. raged (v)<\/td>\n<td>(x) a country/ state that is controlled by a more powerful country and has to pay money when needed<\/td>\n<\/tr>\n<tr>\n<td>11. decisive (adj.)<\/td>\n<td>(xi) a person who succeeds another<\/td>\n<\/tr>\n<tr>\n<td>12. apprehended (v)<\/td>\n<td>(xii) take revenge for<\/td>\n<\/tr>\n<tr>\n<td>13. dauntless (adj)<\/td>\n<td>(xiii) showing the ability to make decisions effectively<\/td>\n<\/tr>\n<tr>\n<td>14. avenge (v)<\/td>\n<td>(xiv) determination<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>II Complete the table given below based on your understanding of the story. An example has been done for you. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Cause<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Ullal had been captured by the Portuguese.<\/td>\n<td>(i) Ullal had to pay a tribute to the colonial power.<\/td>\n<\/tr>\n<tr>\n<td>2.<\/td>\n<td>(ii) Rani Abbakka's husband Veera Narsimha felt it was a hasty decision.<\/td>\n<\/tr>\n<tr>\n<td>3. Veera Narsimha ordered the soldiers to stop Rani Abbakka when she said she would not be frightened by the Portuguese.<\/td>\n<td>(iii)<\/td>\n<\/tr>\n<tr>\n<td>4. Rani Abbakka addressed a meeting of rajas for their support, who felt they would be no match for the Portuguese army and their power.<\/td>\n<td>(iv)<\/td>\n<\/tr>\n<tr>\n<td>5.<\/td>\n<td>(v) Rani Abbakka in turn attacked the Portuguese Fort.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Let us think and reflect<\/h4>\n<p><strong>I. Read the extract given below and answer the questions that follow.<\/strong>  <\/p>\n<p><em>Portuguese envoy: Our Governor has sent me to remind you that the annual tribute from Ullal is long overdue and...<\/em>  <\/p>\n<p><em>Rani Abbakka: We are a sovereign country. We don't pay tribute to Portugal. And we don't take orders from the Portuguese!<\/em>  <\/p>\n<p><em>Portuguese envoy: Your Majesty, you will regret your stand.<\/em>  <\/p>\n<p><em>Abbakka ordered merchant ships to be built and in alliance with the Zamorin of Kozhikode, she defied the Portuguese and established a hugely profitable trading relation with Arabia.<\/em>  <\/p>\n<ol>\n<li>What does the word 'tribute' mean in this context?  <\/li>\n<li>\n<p>Complete the sentence with a suitable reason.<br />\n<em>Rani Abbakka says, \"We are a sovereign country\" because <code>________<\/code>.<\/em>  <\/p>\n<\/li>\n<li>\n<p>Identify whether the following statement is <strong>true<\/strong> or <strong>false<\/strong>.<br />\n<em>The Portuguese envoy threatened Rani Abbakka.<\/em>  <\/p>\n<\/li>\n<li>\n<p>Choose a word given in brackets to replace the underlined word.<br />\n<em>\"... she defied the Portuguese and established a hugely profitable trading relation with Arabia.\" (defeated/disobeyed)<\/em>  <\/p>\n<\/li>\n<li>\n<p>Choose the option that lists the qualities of Rani Abbakka, based on this extract.<br />\n- (i) bold<br />\n- (ii) thoughtful<br />\n- (iii) capable<br />\n- (iv) generous<br />\n- (v) determined  <\/p>\n<\/li>\n<\/ol>\n<ul>\n<li>A. (i), (ii), and (v)  <\/li>\n<li>B. (ii), (iii), and (iv)  <\/li>\n<li>C. (i), (iii), and (v)  <\/li>\n<li>D. (ii), (iv), and (v)  <\/li>\n<\/ul>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>Rani Abbakka spoke to her mother on her deathbed. How might these words have made her mother feel?  <\/li>\n<li>What does the support of the people of Ullal and the soldiers for Rani Abbakka suggest about their mindset?  <\/li>\n<li>How might the people of Ullal have felt when the mighty Portuguese were defeated?  <\/li>\n<li>Why do you think Rani Abbakka's victory against the Portuguese would have inspired other rulers to go against a foreign power?  <\/li>\n<\/ol>\n<h4>Let us write<\/h4>\n<p>India's past was heroic, and at present, the pace of her development is inspiring. Women play a significant role in it. These women are around us, inspiring us all the time.  <\/p>\n<p>With these thoughts, write a conversation between two students, Pratap and Tarana, discussing the role played by women in forming India's identity as a strong nation.  <\/p>\n<p>You may begin like this:  <\/p>\n<p><strong>Pratap<\/strong> : Tarana, I have a lot of respect for women like...<br />\n<strong>Tarana<\/strong> : I believe in the capabilities of women. Did you...?  <\/p>\n<p>Complete the conversation in about six to eight sentences for each of them and share your answers with your classmates and the teacher.  <\/p>\n<hr />\n<h1>Answers – Rani Abbakka<\/h1>\n<h2>Let us discuss<\/h2>\n<p><strong>I. Match the words in Column 1 with their meanings in Column 2.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Column 1<\/th>\n<th>Column 2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. vassal (n)<\/td>\n<td>(x) a country/ state that is controlled by a more powerful country and has to pay money when needed<\/td>\n<\/tr>\n<tr>\n<td>2. coronation (n)<\/td>\n<td>(vi) a ceremony at which a person is made king or queen<\/td>\n<\/tr>\n<tr>\n<td>3. successor (n)<\/td>\n<td>(xi) a person who succeeds another<\/td>\n<\/tr>\n<tr>\n<td>4. rash (adj.)<\/td>\n<td>(iv) acting or doing something without thinking about the consequences<\/td>\n<\/tr>\n<tr>\n<td>5. sovereign country (n)<\/td>\n<td>(ix) a country with a government having complete authority<\/td>\n<\/tr>\n<tr>\n<td>6. league (n)<\/td>\n<td>(v) association or partnership<\/td>\n<\/tr>\n<tr>\n<td>7. wrath (n)<\/td>\n<td>(i) extreme anger<\/td>\n<\/tr>\n<tr>\n<td>8. seize (v)<\/td>\n<td>(ii) take hold of suddenly or forcibly<\/td>\n<\/tr>\n<tr>\n<td>9. resolve (n)<\/td>\n<td>(xiv) determination<\/td>\n<\/tr>\n<tr>\n<td>10. raged (v)<\/td>\n<td>(iii) happen in a violent way<\/td>\n<\/tr>\n<tr>\n<td>11. decisive (adj.)<\/td>\n<td>(xiii) showing the ability to make decisions effectively<\/td>\n<\/tr>\n<tr>\n<td>12. apprehended (v)<\/td>\n<td>(viii) capture<\/td>\n<\/tr>\n<tr>\n<td>13. dauntless (adj)<\/td>\n<td>(vii) fearless<\/td>\n<\/tr>\n<tr>\n<td>14. avenge (v)<\/td>\n<td>(xii) take revenge for<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>II. Complete the table given below based on your understanding of the story.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Cause<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Ullal had been captured by the Portuguese.<\/td>\n<td>(i) Ullal had to pay a tribute to the colonial power.<\/td>\n<\/tr>\n<tr>\n<td>2. Rani Abbakka stopped paying tribute to the Portuguese and formed trading relations with Arabia.<\/td>\n<td>(ii) Rani Abbakka's husband Veera Narsimha felt it was a hasty decision.<\/td>\n<\/tr>\n<tr>\n<td>3. Veera Narsimha ordered the soldiers to stop Rani Abbakka when she said she would not be frightened by the Portuguese.<\/td>\n<td>(iii) Rani Abbakka left her husband's palace and returned to Ullal to rule independently.<\/td>\n<\/tr>\n<tr>\n<td>4. Rani Abbakka addressed a meeting of rajas for their support, who felt they would be no match for the Portuguese army and their power.<\/td>\n<td>(iv) Rani Abbakka decided to fight the Portuguese with her own brave soldiers and army of Ullal.<\/td>\n<\/tr>\n<tr>\n<td>5. The Portuguese launched a surprise attack on Ullal at night.<\/td>\n<td>(v) Rani Abbakka in turn attacked the Portuguese Fort.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Let us think and reflect<\/h2>\n<p><strong>I. Read the extract given below and answer the questions that follow.<\/strong>  <\/p>\n<ol>\n<li>\n<p>What does the word 'tribute' mean in this context?<br />\nIn this context, 'tribute' means a regular payment made by one ruler or state to a dominant power to show submission or secure protection.  <\/p>\n<\/li>\n<li>\n<p>Complete the sentence with a suitable reason.<br />\n<em>Rani Abbakka says, \"We are a sovereign country\" because her state has full power to govern itself without taking orders from foreign rulers.<\/em>  <\/p>\n<\/li>\n<li>\n<p>Identify whether the following statement is <strong>true<\/strong> or <strong>false<\/strong>.<br />\n<em>The Portuguese envoy threatened Rani Abbakka.<\/em><br />\nTrue.  <\/p>\n<\/li>\n<li>\n<p>Choose a word given in brackets to replace the underlined word.<br />\n<em>\"... she defied the Portuguese and established a hugely profitable trading relation with Arabia.\" (defeated/disobeyed)<\/em><br />\ndisobeyed  <\/p>\n<\/li>\n<li>\n<p>Choose the option that lists the qualities of Rani Abbakka, based on this extract.<br />\n<strong>C. (i), (iii), and (v)<\/strong> [bold, capable, and determined]  <\/p>\n<\/li>\n<\/ol>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>\n<p><strong>Rani Abbakka spoke to her mother on her deathbed. How might these words have made her mother feel?<\/strong><br />\nRani Abbakka's promise to protect Ullal's freedom and never surrender to the Portuguese would have made her mother feel proud, peaceful, and confident that the kingdom was in capable hands.  <\/p>\n<\/li>\n<li>\n<p><strong>What does the support of the people of Ullal and the soldiers for Rani Abbakka suggest about their mindset?<\/strong><br />\nIt suggests that the people and soldiers were deeply patriotic, loyal to their queen, and valued their freedom and dignity over living under foreign control.  <\/p>\n<\/li>\n<li>\n<p><strong>How might the people of Ullal have felt when the mighty Portuguese were defeated?<\/strong><br />\nThe people of Ullal would have felt immense joy, pride, relief, and strong faith in Rani Abbakka's leadership when the Portuguese were defeated.  <\/p>\n<\/li>\n<li>\n<p><strong>Why do you think Rani Abbakka's victory against the Portuguese would have inspired other rulers to go against a foreign power?<\/strong><br />\nHer victory showed other rulers that even a small kingdom could defeat a powerful colonial force through courage, unity, and strong determination.  <\/p>\n<\/li>\n<\/ol>\n<h2>Let us write<\/h2>\n<p><strong>Conversation between Pratap and Tarana on the role of women in building India's identity:<\/strong>  <\/p>\n<p><strong>Pratap<\/strong> : Tarana, I have a lot of respect for women like Rani Abbakka, who fought fearlessly against foreign invaders to protect our motherland.<br />\n<strong>Tarana<\/strong> : I believe in the capabilities of women. Did you know that women in modern India are leading major achievements in defense, space research, and science?<br />\n<strong>Pratap<\/strong> : Yes, absolutely! Women officers are serving in all branches of the Armed Forces and guarding our borders with great courage.<br />\n<strong>Tarana<\/strong> : True, and female scientists played a crucial role in India's Moon and Mars missions, making our nation proud globally.<br />\n<strong>Pratap<\/strong> : Women are also excelling in sports, winning international medals and raising India's flag high at the Olympics.<br />\n<strong>Tarana<\/strong> : In education, healthcare, and governance, women are leading positive changes in society every day.<br />\n<strong>Pratap<\/strong> : Their dedication and hard work prove that women are equal partners in building a strong and progressive India.<br />\n<strong>Tarana<\/strong> : Exactly, Pratap! By honoring their contributions, we inspire future generations to work for the nation's success.  <\/p>"}]}};

<script>
try {
  localStorage.setItem('c7-student', 'OldName');
  localStorage.setItem('c7-progress-v1', JSON.stringify({'grammar|grammar-nouns|0':1}));
} catch(e) {}
/* ================= THEME ENGINE ================= */
var SCHEMES = ['sage','lavender','sand'];
var NAMES = { sage:'Sage', lavender:'Lavender', sand:'Sandstone' };
var scheme = 'sage', mode = 'auto';
var mq = window.matchMedia('(prefers-color-scheme: light)');
function applyTheme() {
  document.body.dataset.scheme = scheme;
  document.body.dataset.mode = mode === 'auto' ? (mq.matches ? 'light' : 'dark') : mode;
  document.getElementById('scheme-btn').textContent = '🎨 ' + NAMES[scheme];
  document.getElementById('mode-btn').textContent =
    mode === 'auto' ? '🌗 Auto' : mode === 'light' ? '☀️ Light' : '🌙 Dark';
  try { localStorage.setItem('c7-theme', JSON.stringify({ scheme: scheme, mode: mode })); } catch (e) {}
}
function cycleScheme() { scheme = SCHEMES[(SCHEMES.indexOf(scheme) + 1) % SCHEMES.length]; applyTheme(); }
function cycleMode() { mode = mode === 'auto' ? 'light' : mode === 'light' ? 'dark' : 'auto'; applyTheme(); }
mq.addEventListener('change', function () { if (mode === 'auto') applyTheme(); });
try { var th = JSON.parse(localStorage.getItem('c7-theme') || 'null'); if (th && SCHEMES.indexOf(th.scheme) >= 0) { scheme = th.scheme; mode = th.mode || 'auto'; } } catch (e) {}
applyTheme();

/* ================= HELPERS ================= */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g,' '); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function shuffle(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }

/* ================= PROGRESS STORE ================= */
var STORE_KEY = 'c7-progress-v1';
var progress = {};
try { progress = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { progress = {}; }
function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} }
function markUnit(key, correct) { progress[key] = correct ? 1 : 0; saveProgress(); }
function unitKey(sec, setId, i) { return sec + '|' + setId + '|' + i; }
function setStats(sec, setId, total) {
  var att = 0, ok = 0;
  for (var i = 0; i < total; i++) { var v = progress[unitKey(sec, setId, i)]; if (v !== undefined) { att++; if (v === 1) ok++; } }
  return { att: att, ok: ok, total: total };
}

/* ================= STUDENT NAME ================= */
var STUDENT_KEY = 'c7-student';
var student = '';
try { student = String(localStorage.getItem(STUDENT_KEY) || '').trim(); } catch (e) {}
var nameGate = false;   /* true only while the first-launch hard gate is up */

function openNameModal(first) {
  nameGate = !!first;
  $('name-title').textContent = first ? "What's your name?" : 'Your name';
  $('name-hint').textContent = first
    ? 'Your name shows on your progress line and your score cards. It is saved only on this device.'
    : 'Tap your name on the home screen any time to change it. Your scores are never touched.';
  $('name-input').value = student;
  $('name-reset').style.display = first ? 'none' : '';
  $('name-modal').style.display = 'flex';
  setTimeout(function () { $('name-input').focus(); }, 60);
}
function closeNameModal() { if (nameGate) return; $('name-modal').style.display = 'none'; }
function saveName() {
  var v = $('name-input').value.trim().replace(/\s+/g, ' ').slice(0, 24);
  if (!v) { $('name-input').focus(); return; }
  student = v;
  try { localStorage.setItem(STUDENT_KEY, v); } catch (e) {}
  nameGate = false;
  $('name-modal').style.display = 'none';
  renderHome();
}
function resetMyScore() {
  if (!confirm('Reset ALL of your scores? Your name will be kept.')) return;
  progress = {}; saveProgress();
  nameGate = false;
  $('name-modal').style.display = 'none';
  renderHome();
}
function resetEverything() {
  if (!confirm('Reset everything? All of your scores AND your name will be erased, then you will type your name again.')) return;
  progress = {}; saveProgress();
  try { localStorage.removeItem(STUDENT_KEY); } catch (e) {}
  student = '';
  renderHome();
  openNameModal(true);   /* hard gate again — type your name */
}

/* ================= VIEWS ================= */
var curSec = null, curSet = null, curI = 0, answered = false;
var dock = $('nextbar');

function show(id) {
  var p = document.querySelectorAll('.pane');
  for (var i = 0; i < p.length; i++) p[i].classList.remove('active');
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}
function goHome() {
  $('head-title').textContent = 'Class 7 · English Revision';
  dock.classList.remove('show');
  renderHome(); show('v-home');
}
function renderHome() {
  var path = $('path'); path.innerHTML = '';
  DATA.secs.forEach(function (sec, si) {
    var total = 0, att = 0, ok = 0;
    sec.sets.forEach(function (set) { var st = setStats(sec.id, set.id, set.units.length); total += st.total; att += st.att; ok += st.ok; });
    var pct = total ? Math.round(att / total * 100) : 0;
    var node = el('div', 'node');
    node.innerHTML =
      '<div class="node-dot" style="border-color:var(--' + sec.cvar + ')">' + sec.icon + '</div>' +
      '<div class="node-body">' +
        '<div class="node-step">' + sec.step + '</div>' +
        '<div class="node-name">' + esc(sec.name) + '</div>' +
        '<div class="node-sub">' + sec.sub + '</div>' +
        '<div class="node-bar"><div class="node-bar-fill" style="width:' + pct + '%;background:var(--' + sec.cvar + ')"></div></div>' +
        '<div class="node-actions">' +
          '<button class="node-btn practice" onclick="openPick(\'' + sec.id + '\')">Practice</button>' +
          '<button class="node-btn" onclick="openNotes(\'' + sec.id + '\')">Notes</button>' +
        '</div></div>';
    path.appendChild(node);
  });
  var T = 0, A = 0, O = 0;
  DATA.secs.forEach(function (sec) { sec.sets.forEach(function (set) { var st = setStats(sec.id, set.id, set.units.length); T += st.total; A += st.att; O += st.ok; }); });
  var hi = $('hero-hi');
  if (student) {
    hi.innerHTML = esc('Hi ' + student + ' — ' + A + ' of ' + T + ' attempted') +
      ' <span class="rename-hint" title="Tap to rename">✎</span>';
  } else {
    hi.innerHTML = 'Annual exam revision — open &amp; free';
  }
  hi.onclick = function () { openNameModal(false); };
  $('hero-sub').textContent = T ? (O + ' correct so far · Progress saves on this phone.')
                               : 'Practice one question at a time. Your progress saves on this phone.';
}

/* ---------- pick ---------- */
function openPick(secId) {
  var sec = DATA.secs.filter(function (s) { return s.id === secId; })[0];
  curSec = secId;
  $('head-title').textContent = sec.name;
  $('pick-title').textContent = sec.name + ' — choose a set';
  var list = $('pick-list'); list.innerHTML = '';
  var group = null, num = 0;
  sec.sets.forEach(function (set) {
    if (set.group !== group) {
      group = set.group; num = 0;
      if (group) list.appendChild(el('div', 'pick-group', esc(group)));
    }
    num++;
    var st = setStats(secId, set.id, set.units.length);
    var pct = st.total ? Math.round(st.att / st.total * 100) : 0;
    var card = el('div', 'set-card');
    card.innerHTML =
      '<div class="set-num">' + num + '</div>' +
      '<div class="set-body">' +
        '<div class="set-name">' + esc(set.name) + '</div>' +
        '<div class="set-sub">' + esc(set.sub || (set.units.length + ' questions')) + '</div>' +
        '<div class="set-bar"><div class="set-bar-fill" style="width:' + pct + '%;background:var(--' + sec.cvar + ')"></div></div>' +
      '</div>' +
      '<div class="set-stat">' + (st.att ? (st.att + '/' + st.total + ' · ' + st.ok + ' ✓') : 'start') + '</div>' +
      (st.att ? '<button class="reset-btn" title="Reset this set" onclick="event.stopPropagation();resetSet(\'' + secId + '\',\'' + set.id + '\')">↺</button>' : '');
    card.onclick = function () { startSet(secId, set.id); };
    list.appendChild(card);
  });
  show('v-pick');
}
function resetSet(secId, setId) {
  if (!confirm('Reset progress for this set?')) return;
  var sec = DATA.secs.filter(function (s) { return s.id === secId; })[0];
  var set = sec.sets.filter(function (s) { return s.id === setId; })[0];
  for (var i = 0; i < set.units.length; i++) delete progress[unitKey(secId, setId, i)];
  saveProgress(); openPick(secId);
}

/* ---------- practice ---------- */
function startSet(secId, setId) {
  var sec = DATA.secs.filter(function (s) { return s.id === secId; })[0];
  var set = sec.sets.filter(function (s) { return s.id === setId; })[0];
  curSec = secId; curSet = set; curI = 0;
  for (var i = 0; i < set.units.length; i++) { if (progress[unitKey(secId, setId, i)] === undefined) { curI = i; break; } }
  $('head-title').textContent = set.name;
  $('pr-sec').textContent = sec.name + ' · ' + set.name;
  $('pr-sec').style.color = 'var(--' + sec.cvar + ')';
  $('pr-fill').style.background = 'var(--' + sec.cvar + ')';
  show('v-practice'); dock.classList.add('show');
  renderUnit();
}
function exitPractice() {
  if (curSet) openPick(curSec); else goHome();
}
function nextUnit() {
  if (!answered) return;
  if (curI < curSet.units.length - 1) { curI++; renderUnit(); }
  else renderDone();
}
function renderUnit() {
  answered = false;
  var sec = DATA.secs.filter(function (s) { return s.id === curSec; })[0];
  var u = curSet.units[curI];
  $('pr-count').textContent = 'Question ' + (curI + 1) + ' of ' + curSet.units.length;
  $('pr-fill').style.width = ((curI) / curSet.units.length * 100) + '%';
  var st = setStats(curSec, curSet.id, curSet.units.length);
  $('pr-count').textContent = 'Question ' + (curI + 1) + ' of ' + curSet.units.length + ' · ' + st.ok + ' ✓';
  $('big-btn').textContent = curI === curSet.units.length - 1 ? 'Finish ✓' : 'Next →';
  $('big-btn').disabled = true;
  var card = $('q-card'); card.innerHTML = '';
  var r = RENDERERS[u.kind];
  r(card, u, sec);
  card.scrollIntoView({ block: 'start' });
}

/* finish card */
function renderDone() {
  var st = setStats(curSec, curSet.id, curSet.units.length);
  var card = $('q-card');
  card.innerHTML =
    '<div class="done-card">' +
      '<div class="big">' + (st.ok === st.total ? '🏆' : st.ok >= st.total * 0.7 ? '🎉' : '💪') + '</div>' +
      '<h2>' + esc(student || 'You') + ' scored ' + st.ok + '/' + st.total + '</h2>' +
      '<div class="done-score">' + (st.total ? Math.round(st.ok / st.total * 100) : 0) + '%</div>' +
      '<p>' + (st.ok === st.total ? 'Perfect — this set is exam-ready.' : 'Redo any time; a fresh attempt replaces the old score.') + '</p>' +
      '<div class="done-actions">' +
        '<button onclick="startSet(\'' + curSec + '\',\'' + curSet.id + '\')">Practice again</button>' +
        '<button class="prime" onclick="openPick(\'' + curSec + '\')">More sets</button>' +
      '</div></div>';
  $('pr-count').textContent = 'Done';
  $('pr-fill').style.width = '100%';
  $('big-btn').disabled = true;
}

/* ================= QUESTION RENDERERS ================= */
var RENDERERS = {};

function addFb(card, ok, why) {
  var fb = el('div', 'fb ' + (ok ? 'win' : 'lose'));
  fb.innerHTML = (ok ? '✓ Correct. ' : '✗ ') + (why ? esc(why) : '');
  card.appendChild(fb);
}

/* MCQ + True/False */
RENDERERS.mcq = function (card, u) {
  if (u.passage) addPassage(card, u.passage);
  card.appendChild(el('div', 'chip', u.chip || 'MCQ'));
  card.appendChild(el('div', 'q-text', u.q));
  var wrap = el('div');
  u.options.forEach(function (optText, i) {
    var o = el('div', 'opt');
    o.innerHTML = '<div class="opt-key">' + 'ABCD'[i] + '</div><div>' + optText + '</div>';
    o.onclick = function () {
      if (answered) return; answered = true;
      var kids = wrap.children;
      for (var j = 0; j < kids.length; j++) {
        kids[j].classList.add('off');
        if (j === u.answer) kids[j].className = 'opt right';
      }
      o.classList.remove('off');
      if (i === u.answer) { o.className = 'opt right'; addFb(card, true, u.why); }
      else { o.className = 'opt miss'; addFb(card, false, u.why); }
      markUnit(unitKey(curSec, curSet.id, curI), i === u.answer ? 1 : 0);
      $('big-btn').disabled = false;
    };
    wrap.appendChild(o);
  });
  card.appendChild(wrap);
};

/* typed answer(s) */
RENDERERS.text = function (card, u) {
  if (u.passage) addPassage(card, u.passage);
  card.appendChild(el('div', 'chip', 'Type the answer'));
  card.appendChild(el('div', 'q-text', u.q));
  var parts = u.parts || [{ label: '', a: [].concat(u.answers || u.answer) }];
  var inputs = [];
  parts.forEach(function (p) {
    if (p.label) card.appendChild(el('span', 'text-label', esc(p.label)));
    var inp = el('input', 'text-in');
    inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
    card.appendChild(inp); inputs.push(inp);
  });
  var btn = el('button', 'check-btn', 'Check');
  btn.onclick = function () {
    if (answered) return;
    var allOk = true, anyFilled = false;
    inputs.forEach(function (inp, i) {
      var v = inp.value.trim();
      if (v) anyFilled = true;
      var ok = false;
      var acc = parts[i].a || String(parts[i].answer || '').split('|');
      for (var k = 0; k < acc.length; k++) if (norm(v) === norm(acc[k])) ok = true;
      inp.classList.add(ok ? 'right' : 'miss');
      inp.disabled = true;
      if (!ok) allOk = false;
    });
    if (!anyFilled) return;
    answered = true;
    addFb(card, allOk, u.why);
    markUnit(unitKey(curSec, curSet.id, curI), allOk ? 1 : 0);
    btn.disabled = true;
    $('big-btn').disabled = false;
  };
  card.appendChild(btn);
};

/* passage / extract box */
function addPassage(card, p) {
  var box = el('div', 'passage');
  var h = p.title ? '<b>' + esc(p.title) + '</b><br>' : '';
  box.innerHTML = h + p.paras.map(function (t) { return '<p style="margin:.35rem 0">' + t + '</p>'; }).join('');
  if (p.table && p.table.head) {
    var wrap = el('div', 'ptable-wrap');
    var tb = el('table', 'ptable');
    tb.innerHTML =
      (p.table.caption ? '<caption>' + esc(p.table.caption) + '</caption>' : '') +
      '<thead><tr>' + p.table.head.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead>' +
      '<tbody>' + p.table.rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody>';
    wrap.appendChild(tb); box.appendChild(wrap);
  }
  card.appendChild(box);
}

/* tiles fill (literature identify) */
RENDERERS.fill = function (card, u) {
  if (u.passage) addPassage(card, u.passage);
  card.appendChild(el('div', 'chip', 'Tap tiles to fill'));
  card.appendChild(el('div', 'q-text', u.q));
  var slots = [], state = [];
  var slotWrap = el('div');
  u.parts.forEach(function (p, pi) {
    state.push(null);
    var row = el('div', 'part-row');
    row.innerHTML = '<span class="part-label">' + esc(p.label) + '</span>';
    var s = el('button', 'slot', '&nbsp;');
    s.onclick = function () {
      if (answered) return;
      if (state[pi] !== null) { /* clear: return tile */ used[state[pi]] = false; tiles[state[pi]].classList.remove('used'); state[pi] = null; s.innerHTML = '&nbsp;'; }
      else { if (selSlot) selSlot.classList.remove('sel'); selSlot = s; s.classList.add('sel'); }
    };
    slots.push(s); row.appendChild(s); slotWrap.appendChild(row);
  });
  var selSlot = null;
  var tileTexts = []; u.parts.forEach(function (p) { p.tiles.forEach(function (t) { tileTexts.push(t); }); });
  var pool = shuffle(tileTexts);
  var used = pool.map(function () { return false; });
  var tiles = [];
  var tileWrap = el('div', 'tiles');
  pool.forEach(function (t, ti) {
    var b = el('button', 'tile', esc(t));
    b.onclick = function () {
      if (answered) return;
      var target = -1;
      if (selSlot) { for (var i = 0; i < slots.length; i++) if (slots[i] === selSlot) target = i; selSlot.classList.remove('sel'); selSlot = null; }
      else { for (var i = 0; i < state.length; i++) if (state[i] === null) { target = i; break; } }
      if (target === -1) return;
      if (state[target] !== null) { used[state[target]] = false; tiles[state[target]].classList.remove('used'); }
      state[target] = ti; used[ti] = true; tiles[ti].classList.add('used');
      slots[target].textContent = t;
    };
    tiles.push(b); tileWrap.appendChild(b);
  });
  var btn = el('button', 'check-btn', 'Check');
  btn.onclick = function () {
    if (answered) return;
    var allOk = true;
    u.parts.forEach(function (p, pi) {
      if (state[pi] === null) { allOk = false; slots[pi].classList.add('miss'); return; }
      var ok = norm(pool[state[pi]]) === norm(p.answer);
      slots[pi].classList.add(ok ? 'right' : 'miss');
      if (!ok) allOk = false;
    });
    answered = true;
    addFb(card, allOk, u.why);
    markUnit(unitKey(curSec, curSet.id, curI), allOk ? 1 : 0);
    btn.disabled = true; $('big-btn').disabled = false;
  };
  card.appendChild(slotWrap); card.appendChild(tileWrap); card.appendChild(btn);
};

/* cloze (tap blank, tap option) & writing builder share this engine */
function makeBlankEngine(card, cfg) {
  /* cfg: { lines: [{html}] or custom, blanks: {key:{answer, label?}}, bank: [strings], grade: map key->answerText, onGrade } */
  var blanks = {};       /* key -> button */
  var values = {};       /* key -> chosen text */
  var selKey = null;
  var wrap = el('div');

  function blankBtn(key, hint) {
    var b = el('button', 'cblank', '&nbsp;______&nbsp;');
    b.dataset.key = key;
    b.onclick = function () {
      if (cfg.locked) return;
      if (values[key]) { /* clear */ cfg.bankUsed(values[key], false); delete values[key]; b.innerHTML = '&nbsp;______&nbsp;'; b.classList.remove('right','miss'); }
      else { if (selKey && blanks[selKey]) blanks[selKey].classList.remove('sel'); selKey = key; b.classList.add('sel'); }
    };
    blanks[key] = b; return b;
  }

  var bankWrap = null;
  if (cfg.bank && cfg.bank.length) {
    bankWrap = el('div', 'bank');
    var usedMap = {};
    cfg.bank.forEach(function (item) {
      var chip = el('button', 'tile', esc(item));
      chip.onclick = function () {
        if (cfg.locked) return;
        var key = selKey;
        if (!key) { for (var k in blanks) if (!values[k]) { key = k; break; } }
        if (!key) return;
        if (values[key]) cfg.bankUsed(values[key], false);
        values[key] = item; usedMap[item] = true;
        blanks[key].textContent = item; blanks[key].classList.remove('sel'); blanks[key].classList.remove('right','miss');
        selKey = null;
        cfg.bankUsed(item, true);
      };
      chip.dataset.item = item;
      bankWrap.appendChild(chip);
    });
  }
  cfg.bankUsed = function (item, isUsed) {
    var chips = bankWrap ? bankWrap.children : [];
    for (var i = 0; i < chips.length; i++) if (chips[i].dataset.item === item) chips[i].classList.toggle('used', isUsed);
  };

  cfg.build(wrap, blankBtn);   /* renderer fills lines using blankBtn(key) */

  var btn = null;
  if (cfg.check) {
    btn = el('button', 'check-btn', 'Check');
    btn.onclick = function () {
      if (answered || cfg.locked) return;
      var allOk = true, anyEmpty = false;
      for (var k in blanks) {
        if (!values[k]) { anyEmpty = true; blanks[k].classList.add('miss'); continue; }
        var ok = norm(values[k]) === norm(cfg.grade[k]);
        blanks[k].classList.add(ok ? 'right' : 'miss');
        if (!ok) allOk = false;
      }
      if (anyEmpty) { /* allow check anyway but fail empties */ }
      answered = true; cfg.locked = true;
      addFb(card, allOk, cfg.why);
      markUnit(unitKey(curSec, curSet.id, curI), allOk ? 1 : 0);
      btn.disabled = true; $('big-btn').disabled = false;
    };
  }
  card.appendChild(wrap);
  if (bankWrap) card.appendChild(bankWrap);
  if (btn) card.appendChild(btn);
}

/* cloze literature (Q10 / Q11-12) */
RENDERERS.cloze = function (card, u) {
  card.appendChild(el('div', 'chip', esc(u.src ? u.src + ' · fill the blanks' : 'Fill the blanks')));
  card.appendChild(el('div', 'q-text', u.q));
  makeBlankEngine(card, {
    bank: u.bank,
    grade: u.grade,
    why: u.why,
    check: true,
    build: function (wrap, blankBtn) {
      var line = el('div', 'c-line');
      u.parts.forEach(function (p) {
        if (p.text !== undefined) line.appendChild(document.createTextNode(p.text));
        else line.appendChild(blankBtn(p.key));
      });
      wrap.appendChild(line);
    }
  });
};

/* writing builder (Q4–Q7) */
RENDERERS.builder = function (card, u) {
  card.appendChild(el('div', 'chip', 'Writing task · tap & fill'));
  var sc = el('div', 'scenario', '<b>Scenario:</b> ' + esc(u.scenario));
  card.appendChild(sc);
  makeBlankEngine(card, {
    bank: u.bank,
    grade: u.grade,
    check: true,
    build: function (wrap, blankBtn) {
      u.template.forEach(function (t) {
        if (t.hr) { wrap.appendChild(el('hr', 'w-hr')); return; }
        if (t.cls === 'ttl') {
          var line = el('div', 'w-ttl');
          t.parts.forEach(function (f) { if (typeof f === 'string') line.appendChild(document.createTextNode(f)); else if (f.k) line.appendChild(blankBtn(f.k)); });
          wrap.appendChild(line); return;
        }
        var div = el('div', 'w-line');
        if (t.type) {
          if (t.type === 'label') { div.className = 'w-line w-label'; div.textContent = 'NOTICE'; }
          else if (t.type === 'contact') { div.className = 'w-line w-fixed'; div.textContent = 'For further details, contact the undersigned.'; }
          else if (t.type === 'sign') { div.className = 'w-line w-right w-fixed'; div.textContent = '(Signature)'; }
          else if (t.type === 'inst') { div.className = 'w-line w-center'; div.appendChild(blankBtn(t.key)); }
          else if (t.type === 'date') { div.className = 'w-line w-fixed'; div.appendChild(document.createTextNode('Date: ')); div.appendChild(blankBtn(t.key)); }
          else if (t.type === 'heading') { div.className = 'w-line w-center'; div.appendChild(blankBtn(t.key)); }
          else if (t.type === 'name') { div.className = 'w-line w-right'; div.appendChild(document.createTextNode('Name: ')); div.appendChild(blankBtn(t.key)); }
          else if (t.type === 'desig') { div.className = 'w-line w-right'; div.appendChild(document.createTextNode('Designation: ')); div.appendChild(blankBtn(t.key)); }
          else if (t.type === 'body' && t.parts) {
            t.parts.forEach(function (f) {
              if (typeof f === 'string') div.appendChild(document.createTextNode(f));
              else if (f.k) div.appendChild(blankBtn(f.k));
            });
          }
        } else if (t.parts) {
          t.parts.forEach(function (f) {
            if (typeof f === 'string') div.appendChild(document.createTextNode(f));
            else if (f.k) div.appendChild(blankBtn(f.k));
          });
          if (t.tag === 'p') div.classList.add('w-line');
        }
        wrap.appendChild(div);
      });
    }
  });
};

/* sequence (notice format) */
RENDERERS.seq = function (card, u) {
  card.appendChild(el('div', 'chip', 'Arrange in correct order'));
  card.appendChild(el('div', 'q-text', esc(u.q)));
  var order = shuffle(u.items.map(function (_, i) { return i; }));
  var list = el('div');
  function render() {
    list.innerHTML = '';
    order.forEach(function (itemIdx, pos) {
      var row = el('div', 'seq-item');
      row.innerHTML = '<span class="seq-num">' + (pos + 1) + '.</span><span class="seq-text">' + esc(u.items[itemIdx]) + '</span>';
      var up = el('button', 'seq-btn', '▲'); up.onclick = function () { if (pos > 0 && !answered) { var t = order[pos - 1]; order[pos - 1] = order[pos]; order[pos] = t; render(); } };
      var dn = el('button', 'seq-btn', '▼'); dn.onclick = function () { if (pos < order.length - 1 && !answered) { var t = order[pos + 1]; order[pos + 1] = order[pos]; order[pos] = t; render(); } };
      row.appendChild(up); row.appendChild(dn);
      list.appendChild(row);
    });
  }
  render();
  var btn = el('button', 'check-btn', 'Check');
  btn.onclick = function () {
    if (answered) return;
    answered = true;
    var allOk = true;
    order.forEach(function (itemIdx, pos) {
      var ok = itemIdx === pos;
      list.children[pos].classList.add(ok ? 'right' : 'miss');
      if (!ok) allOk = false;
    });
    addFb(card, allOk, u.why);
    markUnit(unitKey(curSec, curSet.id, curI), allOk ? 1 : 0);
    btn.disabled = true; $('big-btn').disabled = false;
  };
  card.appendChild(list); card.appendChild(btn);
};

/* ================= NOTES ================= */
function openNotes(secId) {
  var prevPane = document.querySelector('.pane.active').id;
  var sec = DATA.secs.filter(function (s) { return s.id === secId; })[0];
  $('head-title').textContent = sec.name + ' · Notes';
  $('notes-title').textContent = sec.name + ' — Notes';
  var body = $('notes-body'); body.innerHTML = '';
  DATA.notes[secId].forEach(function (n) {
    if (n.html) {
      /* rich markdown card — collapsible since chapters are long */
      var d = el('details', 'note-card');
      d.innerHTML = '<summary>' + esc(n.title) + '</summary><div class="note-rich">' + n.html + '</div>';
      body.appendChild(d);
      return;
    }
    var c = el('div', 'note-card');
    var h = '<h3>' + esc(n.title) + '</h3>';
    if (n.lines) h += '<ul>' + n.lines.map(function (l) { return '<li>' + l + '</li>'; }).join('') + '</ul>';
    if (n.text) h += '<p>' + n.text + '</p>';
    c.innerHTML = h; body.appendChild(c);
  });
  notesReturn = prevPane === 'v-practice' ? 'practice' : (prevPane === 'v-pick' ? 'pick' : 'home');
  show('v-notes');
}
var notesReturn = 'home';
function notesBack() {
  if (notesReturn === 'practice' && curSet) { show('v-practice'); }
  else if (notesReturn === 'pick' && curSec) { openPick(curSec); }
  else goHome();
}

/* ================= INIT ================= */
goHome();
if (!student) openNameModal(true);   /* hard gate: no name, no app */
</script>
