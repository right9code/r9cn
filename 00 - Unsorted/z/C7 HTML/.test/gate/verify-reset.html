.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Older<\/strong> and <strong>oldest<\/strong> indicate age and are used to compare people or things. <strong>Elder<\/strong> and <strong>eldest<\/strong> are used with reference to family members. For example,  <ul>\n<li>My <strong>eldest<\/strong> brother will arrive today.<\/li>\n<li>Jagriti is <strong>older<\/strong> than Mahesh.<\/li>\n<li>This is the <strong>oldest<\/strong> house in the colony.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Later<\/strong> and <strong>latest<\/strong> denote time and <strong>latter<\/strong> and <strong>last<\/strong> denote position.  <ul>\n<li>I am rather busy now and will see you <strong>later<\/strong>.<\/li>\n<li>Which is the <strong>latest<\/strong> magazine?<\/li>\n<li>Go and sit on the <strong>last<\/strong> bench.<\/li>\n<li>Jaya and Rajeev are both good swimmers, but the <strong>latter<\/strong> is a more sporting loser.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Nearest<\/strong> denotes distance and <strong>next<\/strong> denotes position.  <ul>\n<li>How far is the <strong>nearest<\/strong> bus stop?<\/li>\n<li>Sita's house is <strong>next<\/strong> to mine.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>A. Fill in the blanks with the correct alternative.<\/strong>  <\/p>\n<ol>\n<li><code>____<\/code> men are shy. (<strong>many/much<\/strong>)  <\/li>\n<li>I like <code>____<\/code> sweets. (<strong>Turk/Turkish<\/strong>)  <\/li>\n<li>He has <code>____<\/code> money. (<strong>enough/much<\/strong>)  <\/li>\n<li>He ate <code>____<\/code> biscuits. (<strong>few/a few/little<\/strong>)  <\/li>\n<li><code>____<\/code> citizen must vote. (<strong>all/every<\/strong>)  <\/li>\n<li>Bring me <code>____<\/code> chair. (<strong>these/that<\/strong>)  <\/li>\n<li>Mr Roy is a man of <code>____<\/code> words. (<strong>few/a few<\/strong>)  <\/li>\n<li>It was a <code>____<\/code> opportunity. (<strong>terrific/terrifying<\/strong>)  <\/li>\n<li>The plan was an <code>____<\/code> failure. (<strong>total/absolute<\/strong>)  <\/li>\n<li>He is <code>____<\/code> to me by a few years. (<strong>senior/superior<\/strong>)  <\/li>\n<li>He is the <code>____<\/code> man in command. (<strong>one/second<\/strong>)  <\/li>\n<li>This building is <code>____<\/code> than the one we live in. (<strong>older/elder<\/strong>)  <\/li>\n<li>What is the <code>____<\/code> news? (<strong>later/latest<\/strong>)  <\/li>\n<li>You can take <code>____<\/code> of the four toys. (<strong>either/one<\/strong>)  <\/li>\n<li>I have warned the boy <code>____<\/code> times. (<strong>some/several<\/strong>)  <\/li>\n<\/ol>\n<p><strong>Participal Adjectives<\/strong>  <\/p>\n<p>Look at these sentences.  <\/p>\n<ul>\n<li>We stood in front of a <strong>running<\/strong> stream.  <\/li>\n<li>We heard the <strong>interesting<\/strong> news.<br />\nThe highlighted words are <strong>present participles (verb + -ing form)<\/strong>.  <\/li>\n<\/ul>\n<p>Now, read these sentences.  <\/p>\n<ul>\n<li>People say that this is a haunted house.  <\/li>\n<li>The burnt cottage was razed to the ground.<br />\nThe highlighted words are <strong>past participles (verb + -ed/-t/-n form)<\/strong>.  <\/li>\n<\/ul>\n<p>You will notice that in these sentences, the present participles and the past participles have been used as adjectives.  <\/p>\n<p>Present participles and past participles, when used as adjectives, are called <strong>participial adjectives<\/strong>.  <\/p>\n<p><strong>B. Underline the adjectives in this paragraph. Identify the participial adjectives.<\/strong><br />\nI reached the forbidding building on Park Avenue in a black car. I knocked on the closed door and a short bald man opened the door. I entered a bright room lit with glowing candles. By the fireplace, there was a big easy chair with a shining tea table and a smaller chair beside it. A girl in a pretty dress and a cheerful smile appeared from nowhere. I felt shy. On the other side of the barred window, the glorious sun was setting the evening sky aflame. Suddenly, I noticed a sombre man sitting on an upholstered divan with a Persian rug over his knees. Behind him was a spectacular painting by Van Gogh. The crimson flowers and the golden cornfields had been painted with passion. I was impressed by the interesting décor of the room. However, the reigning silence was somewhat disturbing.  <\/p>\n<p><strong>C. Pick out the participial adjectives from these sentences. Not all sentences will have them.<\/strong>  <\/p>\n<ol>\n<li>I had watered the plants yesterday.  <\/li>\n<li>The injured students got off the bus.  <\/li>\n<li>Ashwini played the winning stroke.  <\/li>\n<li>The tiger was seriously wounded.  <\/li>\n<li>She is an experienced teacher.  <\/li>\n<li>The frightened rabbits ran away.  <\/li>\n<li>The hungry children ate up all the sandwiches.  <\/li>\n<li>Why do you have a worried look?  <\/li>\n<li>She is wearing a gold ring.  <\/li>\n<li>You should not read in a moving bus.  <\/li>\n<li>People walked over the frozen lake.  <\/li>\n<li>Today is a cold day.  <\/li>\n<li>The man must provide supporting evidence.  <\/li>\n<li>The man knocked on the door that was closed.  <\/li>\n<li>The pressing need of the hour is a roof over our heads.  <\/li>\n<li>I escaped through the broken window of the ruined house.  <\/li>\n<li>The wounded deer escaped from the clutches of the leopard.  <\/li>\n<li>The erupting volcano poured out large quantities of lava.  <\/li>\n<li>Mt Everest is the highest peak on Earth.  <\/li>\n<li>He is the richest man in the village.  <\/li>\n<li>The kitten was playing with the falling leaves.  <\/li>\n<li>The police caught the prisoner who had escaped.  <\/li>\n<li>It was such a long and boring flight.  <\/li>\n<li>I am very frightened of lizards.  <\/li>\n<li>What a frightening film!  <\/li>\n<\/ol>\n<p><strong>Degrees of Comparison<\/strong>  <\/p>\n<p>You have learnt that adjectives have three degrees of comparison—positive, comparative and superlative. Let us revise what we know.  <\/p>\n<p>Read these sentences.  <\/p>\n<ul>\n<li>This is a good violin.  <\/li>\n<li>My violin is better than the one you bought.  <\/li>\n<li>Bobby's violin is the best of all our violins.  <\/li>\n<\/ul>\n<p>The adjective <strong>good<\/strong> is used when we talk about one person or thing. It is said to be in the <strong>positive degree<\/strong>.  <\/p>\n<p>The <strong>positive degree<\/strong> is used when no comparison is made.  <\/p>\n<p>The adjective <strong>better<\/strong> is used to compare two things. It conveys a higher degree of quality than that of the positive. The adjective <strong>better<\/strong> is said to be in the <strong>comparative degree<\/strong>.  <\/p>\n<p>The <strong>comparative degree<\/strong> is used to compare two people or things.  <\/p>\n<p>The adjective <strong>best<\/strong> is used to compare more than two things. The adjective best is said to be in the <strong>superlative degree<\/strong>.  <\/p>\n<p>The <strong>superlative degree<\/strong> can be used to compare more than two things. It denotes the highest degree of quality.  <\/p>\n<p><strong>NOTE<\/strong>:<br />\nWhen we use the comparative degree, we always use the word than to compare and contrast two things.<br />\nThe superlative degree, on the other hand, is always preceded by the word the.  <\/p>\n<p><strong>D. Fill in the blanks with the correct forms of the adjectives given in the brackets.<\/strong>  <\/p>\n<ol>\n<li>He is the <code>____<\/code> student in the class. <strong>(bold)<\/strong>  <\/li>\n<li>My fever is <code>____<\/code> than what it was yesterday. <strong>(bad)<\/strong>  <\/li>\n<li>It was certainly the <code>____<\/code> moment of his life. <strong>(proud)<\/strong>  <\/li>\n<li>It is surely <code>____<\/code> to preach than to practise. <strong>(easy)<\/strong>  <\/li>\n<li>The <code>____<\/code> proposal came from a little child. <strong>(good)<\/strong>  <\/li>\n<li>Very few people have been as <code>____<\/code> as he. <strong>(lucky)<\/strong>  <\/li>\n<li>He believes he is <code>____<\/code> than his sister. <strong>(smart)<\/strong>  <\/li>\n<li>Sandy is the <code>____<\/code> member of his family. <strong>(young)<\/strong>  <\/li>\n<li>This is the <code>____<\/code> church in India. <strong>(old)<\/strong>  <\/li>\n<li>She looked <code>____<\/code> in the evening gown. <strong>(lovely)<\/strong>  <\/li>\n<li>This machine is <code>____<\/code> than that. <strong>(heavy)<\/strong>  <\/li>\n<li>My sister is <code>____<\/code> than my mother. <strong>(tall)<\/strong>  <\/li>\n<\/ol>\n<p><strong>Interchange of Degrees of Comparison<\/strong>  <\/p>\n<p>Degrees of comparison of adjectives in sentences can be changed without any change in the meaning of the sentence. For example,  <\/p>\n<ul>\n<li><strong>No other<\/strong> boy in the class is <strong>as intelligent as<\/strong> Gitesh. (<strong>positive<\/strong>)  <\/li>\n<li>Gitesh is <strong>more intelligent than<\/strong> any other boy in the class. (<strong>comparative<\/strong>)  <\/li>\n<li>Gitesh is the most intelligent boy in the class. (<strong>superlative<\/strong>)  <\/li>\n<\/ul>\n<p><strong>E. Now, change the degrees of comparison according to the instructions.<\/strong>  <\/p>\n<ol>\n<li>Shakespeare is greater than all other English dramatists. (<strong>superlative<\/strong>)  <\/li>\n<li>Sita is more popular than all other girls in the school. (<strong>superlative<\/strong>)  <\/li>\n<li>The Taj Mahal is the most beautiful monument of our country. (<strong>comparative<\/strong>)  <\/li>\n<li>Shimla is cooler than Delhi. (<strong>positive<\/strong>)  <\/li>\n<li>Kolkata is one of the biggest cities in India. (<strong>positive<\/strong>)  <\/li>\n<li>Gita is the best student in this group. (<strong>comparative<\/strong>)  <\/li>\n<li>He is cleverer than his sister. (<strong>positive<\/strong>)  <\/li>\n<li>The ostrich is the biggest bird. (<strong>comparative<\/strong>)  <\/li>\n<li>Lead is the heaviest metal. (<strong>comparative<\/strong>)  <\/li>\n<li>Gautam is not as tall as his brother. (<strong>comparative<\/strong>)  <\/li>\n<\/ol>\n<p><strong>F. Each of the following sentences contains an error in the use of positive, comparative and superlative adjectives. Rewrite the sentences correctly.<\/strong>  <\/p>\n<ol>\n<li>This is the tallest of the two buildings.  <\/li>\n<li>My assignment is most prestigious than yours.  <\/li>\n<li>The wind grew strongest as the day progressed.  <\/li>\n<li>Who is the older? Rima, Sima or Rita?  <\/li>\n<li>This poem is not as best as the one you published last month.  <\/li>\n<li>I have two aunts. The youngest is a teacher.  <\/li>\n<li>This is definitely the hotter day of the season.  <\/li>\n<li>It seemed dark than it actually was.  <\/li>\n<li>We live in the taller building of the area.  <\/li>\n<li>She is the most lively of the two sisters.  <\/li>\n<\/ol>\n<hr />\n<hr />\n<h1>Answers – Adjectives<\/h1>\n<p><strong>A. Fill in the blanks with the correct alternative.<\/strong>  <\/p>\n<ol>\n<li>Many  <\/li>\n<li>Turkish  <\/li>\n<li>enough  <\/li>\n<li>a few  <\/li>\n<li>Every  <\/li>\n<li>that  <\/li>\n<li>few  <\/li>\n<li>terrific  <\/li>\n<li>absolute  <\/li>\n<li>senior  <\/li>\n<li>second  <\/li>\n<li>older  <\/li>\n<li>latest  <\/li>\n<li>one  <\/li>\n<li>several  <\/li>\n<\/ol>\n<p><strong>B. Underline the adjectives in this paragraph. Identify the participial adjectives.<\/strong><br />\nAll Adjectives: forbidding, black, closed, short, bald, bright, glowing, big, easy, shining, smaller, pretty, cheerful, shy, barred, glorious, evening, sombre, upholstered, Persian, spectacular, crimson, golden, impressed, interesting, reigning, disturbing.<br />\nParticipial Adjectives: forbidding (present), closed (past), glowing (present), shining (present), barred (past), upholstered (past), interesting (present), reigning (present), disturbing (present).  <\/p>\n<p><strong>C. Pick out the participial adjectives from these sentences.<\/strong>  <\/p>\n<ol>\n<li>None  <\/li>\n<li>injured  <\/li>\n<li>winning  <\/li>\n<li>wounded  <\/li>\n<li>experienced  <\/li>\n<li>frightened  <\/li>\n<li>None  <\/li>\n<li>worried  <\/li>\n<li>None  <\/li>\n<li>moving  <\/li>\n<li>frozen  <\/li>\n<li>None  <\/li>\n<li>supporting  <\/li>\n<li>None  <\/li>\n<li>pressing  <\/li>\n<li>broken, ruined  <\/li>\n<li>wounded  <\/li>\n<li>erupting  <\/li>\n<li>None  <\/li>\n<li>None  <\/li>\n<li>falling  <\/li>\n<li>None  <\/li>\n<li>boring  <\/li>\n<li>frightened  <\/li>\n<li>frightening  <\/li>\n<\/ol>\n<p><strong>D. Fill in the blanks with the correct forms of the adjectives given in the brackets.<\/strong>  <\/p>\n<ol>\n<li>boldest  <\/li>\n<li>worse  <\/li>\n<li>proudest  <\/li>\n<li>easier  <\/li>\n<li>best  <\/li>\n<li>lucky  <\/li>\n<li>smarter  <\/li>\n<li>youngest  <\/li>\n<li>oldest  <\/li>\n<li>lovely  <\/li>\n<li>heavier  <\/li>\n<li>taller  <\/li>\n<\/ol>\n<p><strong>E. Change the degrees of comparison according to the instructions.<\/strong>  <\/p>\n<ol>\n<li>Shakespeare is the greatest English dramatist.  <\/li>\n<li>Sita is the most popular girl in the school.  <\/li>\n<li>The Taj Mahal is more beautiful than any other monument of our country.  <\/li>\n<li>Delhi is not as cool as Shimla.  <\/li>\n<li>Very few cities in India are as big as Kolkata.  <\/li>\n<li>Gita is better than any other student in this group.  <\/li>\n<li>His sister is not as clever as he.  <\/li>\n<li>The ostrich is bigger than any other bird.  <\/li>\n<li>Lead is heavier than any other metal.  <\/li>\n<li>Gautam's brother is taller than Gautam.  <\/li>\n<\/ol>\n<p><strong>F. Rewrite the sentences correctly.<\/strong>  <\/p>\n<ol>\n<li>This is the taller of the two buildings.  <\/li>\n<li>My assignment is more prestigious than yours.  <\/li>\n<li>The wind grew stronger as the day progressed.  <\/li>\n<li>Who is the oldest? Rima, Sima or Rita?  <\/li>\n<li>This poem is not as good as the one you published last month.  <\/li>\n<li>I have two aunts. The younger is a teacher.  <\/li>\n<li>This is definitely the hottest day of the season.  <\/li>\n<li>It seemed darker than it actually was.  <\/li>\n<li>We live in the tallest building of the area.  <\/li>\n<li>She is the livelier of the two sisters.  <\/li>\n<\/ol>\n<hr />"}, {"title": "Adverbs", "html": "<p>You have learnt that an <strong>adverb<\/strong> is a word which modifies the meaning of a <strong>verb<\/strong>, an <strong>adjective<\/strong> or another <strong>adverb<\/strong>.  <\/p>\n<p><strong>Kinds of Adverbs<\/strong>  <\/p>\n<p>There are six kinds of adverbs.  <\/p>\n<p><strong>Adverbs of time<\/strong> show us the time at which an action takes place.  <\/p>\n<p>For example,  <\/p>\n<ul>\n<li>I have met Neha before.  <\/li>\n<li>The principal will meet you today.  <\/li>\n<\/ul>\n<p><strong>Adverbs of frequency<\/strong> show us how often something happens.  <\/p>\n<p>For example,  <\/p>\n<ul>\n<li>He visits us regularly.  <\/li>\n<li>My father exercises every day.  <\/li>\n<\/ul>\n<p><strong>Adverbs of place<\/strong> show us where something happens.  <\/p>\n<p>For example,  <\/p>\n<ul>\n<li>Sam went downstairs.  <\/li>\n<li>The man has gone out.  <\/li>\n<\/ul>\n<p><strong>Adverbs of manner<\/strong> show us how something happens.  <\/p>\n<p>For example,  <\/p>\n<ul>\n<li>Rahim writes neatly.  <\/li>\n<li>The students worked diligently.  <\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nSometimes, an adverb can modify an entire sentence. For example,  <\/p>\n<ul>\n<li><strong>Luckily<\/strong>, she was not seriously injured.  <\/li>\n<\/ul>\n<p><strong>Adverbs of degree<\/strong> show the intensity or the degree of an action or a quality.  <\/p>\n<p>For example,  <\/p>\n<ul>\n<li>I am so satisfied!  <\/li>\n<li>What you have heard is absolutely true.  <\/li>\n<\/ul>\n<p><strong>Interrogative adverbs<\/strong> are adverbs which are used at the beginning of a sentence to ask questions.  <\/p>\n<p>For example,  <\/p>\n<ul>\n<li>When are you reaching Kolkata? <strong>(time)<\/strong>  <\/li>\n<li>Where can I meet you? <strong>(place)<\/strong>  <\/li>\n<li>How did you get here? <strong>(manner)<\/strong>  <\/li>\n<li>Why are you sad? <strong>(reason)<\/strong>  <\/li>\n<\/ul>\n<p><strong>A. Fill in the blanks with the kind of adverbs mentioned in the brackets.<\/strong>  <\/p>\n<ol>\n<li>She arrived <code>____<\/code> for the class. (adverb of time)  <\/li>\n<li>This mango is <code>____<\/code> ripe. (adverb of degree)  <\/li>\n<li>We walked <code>____<\/code> in the direction of the school. (adverb of manner)  <\/li>\n<li>The grains were scattered <code>____<\/code>. (adverb of place)  <\/li>\n<li>She will return <code>____<\/code> from Delhi. (adverb of time)  <\/li>\n<li>I cannot read the notes. He writes <code>____<\/code>. (adverb of manner)  <\/li>\n<li>The child wept <code>____<\/code>. (adverb of manner)  <\/li>\n<li>Rajiv <code>____<\/code> spoke ill of others. (adverb of frequency)  <\/li>\n<li>Breakfast is <code>____<\/code> ready. (adverb of degree)  <\/li>\n<li>He <code>____<\/code> visits us in May. (adverb of frequency)  <\/li>\n<li>He will get a job <code>____<\/code>. (adverb of place)  <\/li>\n<li>She <code>____<\/code> travels by bus. (adverb of frequency)  <\/li>\n<li><code>____<\/code> do you usually come home? (interrogative adverb of time)  <\/li>\n<li>She is <code>____<\/code> ill to go to work. (adverb of degree)  <\/li>\n<li>The father looked <code>____<\/code> at the baby. (adverb of manner)  <\/li>\n<\/ol>\n<p><strong>Formation of Adverbs<\/strong><br />\nMost adverbs of manner are formed from adjectives in the following ways.  <\/p>\n<ul>\n<li>Most adjectives can be changed to adverbs by adding <strong>-ly<\/strong>. For example, warm—warmly, sincere—sincerely, quiet—quietly.  <\/li>\n<li>When the adjective ends in <strong>-y<\/strong> preceded by a consonant, <strong>-y<\/strong> is changed to <strong>-i<\/strong> and <strong>-ly<\/strong> is added. For example, pretty—prettily, steady—steadily, lucky—luckily.  <\/li>\n<li>When the adjective ends in <strong>-le<\/strong>, the <strong>-le<\/strong> is changed to <strong>-ly<\/strong>. For example, possible—possibly, able—ably, gentle—gently.  <\/li>\n<li>When the adjective ends in <strong>-ic<\/strong>, we add <strong>-ally<\/strong>. For example, basic—basically, scientific—scientifically.  <\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nSome adverbs and adjectives have the same form, but are used differently.  <\/p>\n<ul>\n<li>We need fast bowlers. (adjective)  <\/li>\n<li>He bowls fast. (adverb)  <\/li>\n<li>We must be quick. (adverb)  <\/li>\n<li>The smart child gave a quick reply. (adjective)  <\/li>\n<\/ul>\n<p><strong>B. State whether the highlighted words are adverbs or adjectives.<\/strong>  <\/p>\n<ol>\n<li>The teacher dictated the notes in a <strong>loud<\/strong> voice.  <\/li>\n<li>There is <strong>enough<\/strong> milk in the pot.  <\/li>\n<li>He visits his mother <strong>daily<\/strong>.  <\/li>\n<li>I have worked <strong>enough<\/strong> for a day.  <\/li>\n<li>The <strong>early<\/strong> riser enjoys a longer day!  <\/li>\n<li>Work <strong>hard<\/strong> if you wish to do well.  <\/li>\n<li>The politician spoke <strong>loudly<\/strong>.  <\/li>\n<li>Exercise should be a part of your <strong>daily<\/strong> routine.  <\/li>\n<li><strong>Late<\/strong> arrivals were sent back home.  <\/li>\n<li>He arrived <strong>early<\/strong>.  <\/li>\n<li>The children sang <strong>merrily<\/strong>.  <\/li>\n<li>He reached the station <strong>late<\/strong>.  <\/li>\n<li>This truly is a <strong>hard<\/strong> nut!  <\/li>\n<li>This will be a <strong>long<\/strong> wait.  <\/li>\n<li>She hit him <strong>hard<\/strong>.  <\/li>\n<\/ol>\n<p><strong>Position of Adverbs<\/strong>  <\/p>\n<ul>\n<li><strong>Adverbs of manner<\/strong>, which answer the question <strong>How?<\/strong>, are generally placed after the verb. If the verb has a direct object, then the adverb is placed after the direct object. For example,  <ul>\n<li>The actor is singing <strong>loudly<\/strong>.<\/li>\n<li>He plays the flute <strong>well<\/strong>.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:  <\/p>\n<ul>\n<li>The <strong>direct object<\/strong> is the person or thing that receives the action of the verb. The direct object follows the verb. We can identify the direct object by asking the question <strong>Whom?<\/strong> or <strong>What?<\/strong> after the verb. For example:  <\/li>\n<li>The boy recited a poem. (What did the boy recite?)<\/li>\n<li>\n<p>Sudha is biting her nails. (What is Sudha biting?)  <\/p>\n<\/li>\n<li>\n<p><strong>Adverbs of place<\/strong> and <strong>adverbs of time<\/strong> are also placed after the verb. If the sentence has a direct object, then the adverb is placed after the direct object. For example:  <\/p>\n<ul>\n<li>It snowed <strong>yesterday<\/strong>.<\/li>\n<li>Put the chairs <strong>there<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>When there are two or more adverbs after a verb, the normal order is adverb of manner followed by adverb of place and then adverb of time.  <\/p>\n<ul>\n<li>Rima will come <strong>here next month<\/strong>.  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Adverbs of frequency<\/strong>, <strong>adverbs of degree<\/strong> and sometimes <strong>adverbs of manner<\/strong> are normally put between the subject and the verb if the verb consists of only one word. For example:  <\/p>\n<ul>\n<li>I quite like these shoes.<\/li>\n<li>I always tell him to exercise.<\/li>\n<li>She happily accepted the suggestion.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:  <\/p>\n<ul>\n<li>If the verb consists of more than one word, then the adverb comes after the first verb. For example:  <ul>\n<li>The man had just entered the auditorium.<\/li>\n<\/ul>\n<\/li>\n<li>If the verb is <strong>am/are/is/was<\/strong>, the adverbs are placed after the verb. For example:  <ul>\n<li>They are <strong>always<\/strong> late.<\/li>\n<li>The rice is <strong>just<\/strong> right.<\/li>\n<\/ul>\n<\/li>\n<li>When an adverb modifies an adjective or another adverb, the adverb usually comes before it. For example:  <ul>\n<li>He lifted the stone <strong>quite<\/strong> easily.<\/li>\n<li>It is a <strong>rather<\/strong> warm day.<\/li>\n<\/ul>\n<\/li>\n<li>The adverb <strong>enough<\/strong> is always placed after the word which it modifies. For example:  <ul>\n<li>Is this good <strong>enough<\/strong> for you?<\/li>\n<li>Is the box large <strong>enough<\/strong> for all your books?<\/li>\n<\/ul>\n<\/li>\n<li>The word <strong>only<\/strong> should be placed before the word it modifies. For example:  <ul>\n<li>I <strong>only<\/strong> have four bags right now.<\/li>\n<\/ul>\n<\/li>\n<li>For emphasis, adverbs of time may also be placed at the beginning of the sentence. For example:  <ul>\n<li><strong>Tomorrow<\/strong>, we shall meet.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>C. Insert the adverbs given in the brackets in their correct positions.<\/strong>  <\/p>\n<ol>\n<li>I am often late for school. <strong>(often)<\/strong>  <\/li>\n<li>Sam readily agreed to the plan. <strong>(readily)<\/strong>  <\/li>\n<li>He has almost finished the work. <strong>(almost)<\/strong>  <\/li>\n<li>He seldom disagrees with me. <strong>(seldom)<\/strong>  <\/li>\n<li>She usually cycles to school. <strong>(usually)<\/strong>  <\/li>\n<li>He did fairly well in the exam. <strong>(fairly)<\/strong>  <\/li>\n<li>I only asked for a glass of milk. <strong>(only)<\/strong>  <\/li>\n<li>We shall certainly meet you soon. <strong>(certainly)<\/strong>  <\/li>\n<li>I rather like the book that I bought yesterday. <strong>(rather)<\/strong>  <\/li>\n<li>He was brave enough to challenge the authorities. <strong>(enough)<\/strong>  <\/li>\n<\/ol>\n<p><strong>Use of Simple Adverbs<\/strong><br />\n<strong>NOTE<\/strong>: the use of these common adverbs.  <\/p>\n<ul>\n<li><strong>Very<\/strong> is intensively used with an adjective or another adverb in the positive degree. For example,  <ul>\n<li>He is a <strong>very<\/strong> nice person.<\/li>\n<li>I typed <strong>very<\/strong> carefully.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Very<\/strong> with a superlative is used to indicate the highest degree. For example,  <ul>\n<li>The coffee is of the <strong>very<\/strong> best quality.<\/li>\n<li>I can reach by 7 a.m. at the <strong>very<\/strong> earliest.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Too<\/strong> is used to mean more than required or excess. For example,  <ul>\n<li>I am <strong>too<\/strong> tired to play now.<\/li>\n<li>It is <strong>too<\/strong> cold to go for a walk in the woods.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Much<\/strong> is used with an adverb or an adjective in the comparative degree. For example,  <ul>\n<li>Things are <strong>much<\/strong> better in the city.<\/li>\n<li>You are <strong>much<\/strong> stronger than I thought you would be.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nWe say, It is <strong>very<\/strong> hot today.<br />\nWe do not say, It is <strong>too<\/strong> hot today.  <\/p>\n<p>We say, It is <strong>too<\/strong> hot to go cycling.<br />\nWe do not say, It is <strong>very<\/strong> hot to go cycling.  <\/p>\n<p><strong>D. Fill in the blanks with very, too or much as required.<\/strong>  <\/p>\n<ol>\n<li>Mayank is <code>____<\/code> young to go for a swim alone.  <\/li>\n<li>I am <code>____<\/code> glad to see you.  <\/li>\n<li>Ishaan plays tennis <code>____<\/code> well.  <\/li>\n<li>I am <code>____<\/code> sleepy to go for a jog tonight.  <\/li>\n<li>Her handwriting is <code>____<\/code> worse than mine.  <\/li>\n<li>The movie was <code>____<\/code> better than I expected.  <\/li>\n<li>You have to be <code>____<\/code> careful when you go to the beach in the rainy season.  <\/li>\n<li>The watch wasn't <code>____<\/code> expensive, so I bought it  <\/li>\n<li>When we went to Goa, the weather was <code>____<\/code> nice.  <\/li>\n<li>The eagle swooped upon the rabbit <code>____<\/code> quickly.  <\/li>\n<li>It's <code>_____<\/code> dark outside.  <\/li>\n<li>That was a <code>____<\/code> good answer.  <\/li>\n<\/ol>\n<p><strong>One Word for Several Words<\/strong><br />\nWe often use an adverb in place of a group of words. So adverbs are useful when we wish to express something concisely. For example,  <\/p>\n<ul>\n<li>I reminded Ravi <strong>again and again<\/strong> that he had to pick up his sister from school.  <\/li>\n<li>I reminded Ravi <strong>repeatedly<\/strong> that he had to pick up his sister from school.  <\/li>\n<\/ul>\n<p><strong>E.<\/strong> <strong>Rewrite the following sentences replacing the highlighted words with adverbs from the box given below.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>independently<\/th>\n<th>politely<\/th>\n<th>manually<\/th>\n<th>abnormally<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>finally<\/td>\n<td>beautifully<\/td>\n<td>unusually<\/td>\n<td>immediately<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol>\n<li>I agreed to accept his offer <strong>without any delay<\/strong>.  <\/li>\n<li><strong>At the end<\/strong>, after some discussion, we signed the agreement.  <\/li>\n<li>I want to start something <strong>on my own<\/strong>.  <\/li>\n<li>He spoke to me in <strong>a polite manner<\/strong>.  <\/li>\n<li>Suman operated the heavy machinery <strong>by hand<\/strong>.  <\/li>\n<li>The interior designer has decorated my flat in <strong>a beautiful manner<\/strong>.  <\/li>\n<li>The water of the river has risen <strong>beyond the usual limit<\/strong> for summer.  <\/li>\n<li>Scientists believe that bacteria often behave <strong>in an uncharacteristic manner<\/strong>.  <\/li>\n<\/ol>\n<hr />\n<hr />\n<h1>Answers – Adverbs<\/h1>\n<p><strong>A. Fill in the blanks with the kind of adverbs mentioned in the brackets.<\/strong>  <\/p>\n<ol>\n<li>late  <\/li>\n<li>quite  <\/li>\n<li>briskly  <\/li>\n<li>everywhere  <\/li>\n<li>tomorrow  <\/li>\n<li>illegibly  <\/li>\n<li>bitterly  <\/li>\n<li>never  <\/li>\n<li>almost  <\/li>\n<li>often  <\/li>\n<li>somewhere  <\/li>\n<li>frequently  <\/li>\n<li>When  <\/li>\n<li>too  <\/li>\n<li>lovingly  <\/li>\n<\/ol>\n<p><strong>B. State whether the highlighted words are adverbs or adjectives.<\/strong>  <\/p>\n<ol>\n<li>Adjective  <\/li>\n<li>Adjective  <\/li>\n<li>Adverb  <\/li>\n<li>Adverb  <\/li>\n<li>Adjective  <\/li>\n<li>Adverb  <\/li>\n<li>Adverb  <\/li>\n<li>Adjective  <\/li>\n<li>Adjective  <\/li>\n<li>Adverb  <\/li>\n<li>Adverb  <\/li>\n<li>Adverb  <\/li>\n<li>Adjective  <\/li>\n<li>Adjective  <\/li>\n<li>Adverb  <\/li>\n<\/ol>\n<p><strong>C. Insert the adverbs given in the brackets in their correct positions.<\/strong>  <\/p>\n<ol>\n<li>I am often late for school.  <\/li>\n<li>Sam readily agreed to the plan.  <\/li>\n<li>He has almost finished the work.  <\/li>\n<li>He seldom disagrees with me.  <\/li>\n<li>She usually cycles to school.  <\/li>\n<li>He did fairly well in the exam.  <\/li>\n<li>I only asked for a glass of milk.  <\/li>\n<li>We shall certainly meet you soon.  <\/li>\n<li>I rather like the book that I bought yesterday.  <\/li>\n<li>He was brave enough to challenge the authorities.  <\/li>\n<\/ol>\n<p><strong>D. Fill in the blanks with very, too or much as required.<\/strong>  <\/p>\n<ol>\n<li>too  <\/li>\n<li>very  <\/li>\n<li>very  <\/li>\n<li>too  <\/li>\n<li>much  <\/li>\n<li>much  <\/li>\n<li>very  <\/li>\n<li>very  <\/li>\n<li>very  <\/li>\n<li>very  <\/li>\n<li>very  <\/li>\n<li>very  <\/li>\n<\/ol>\n<p><strong>E. Rewrite the following sentences replacing the highlighted words with adverbs from the box given below.<\/strong>  <\/p>\n<ol>\n<li>I agreed to accept his offer immediately.  <\/li>\n<li>Finally, after some discussion, we signed the agreement.  <\/li>\n<li>I want to start something independently.  <\/li>\n<li>He spoke to me politely.  <\/li>\n<li>Suman operated the heavy machinery manually.  <\/li>\n<li>The interior designer has decorated my flat beautifully.  <\/li>\n<li>The water of the river has risen abnormally for summer.  <\/li>\n<li>Scientists believe that bacteria often behave unusually.<\/li>\n<\/ol>"}, {"title": "Articles", "html": "<p>You have learnt that there are three articles—<strong>a, an<\/strong> and <strong>the<\/strong>.  <\/p>\n<p><strong>Indefinite Articles<\/strong><br />\nThe articles a and an are called <strong>indefinite articles<\/strong> because they do not point to a particular person or thing. Let us look at the uses of the indefinite articles.  <\/p>\n<ul>\n<li>We use <strong>a<\/strong> and <strong>an<\/strong> before countable nouns in the singular number. For example,  <ul>\n<li>a desk<\/li>\n<li>an orange  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nWe do not say a milk or a lemonade because they are uncountable nouns. However, we can say a cup of milk or a glass of lemonade.  <\/p>\n<ul>\n<li>\n<p>We use <strong>a<\/strong> before words that begin with a <strong>consonant sound<\/strong>. We use an before words that begin with a <strong>vowel sound<\/strong>. For example,  <\/p>\n<ul>\n<li><strong>a<\/strong> thirsty crow<\/li>\n<li><strong>a<\/strong> good friend<\/li>\n<li><strong>an<\/strong> empty bottle<\/li>\n<li><strong>an<\/strong> independent state  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>We use <strong>a<\/strong> before words that begin with <strong>e<\/strong> and <strong>u<\/strong> because they have an initial '<strong>y<\/strong>' sound. For example,  <\/p>\n<ul>\n<li><strong>a<\/strong> <strong>u<\/strong>niversity<\/li>\n<li><strong>a<\/strong> <strong>E<\/strong>uropean  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>We use <strong>a<\/strong> before words that begin with o but sound like '<strong>w<\/strong>'. For example,  <\/p>\n<ul>\n<li><strong>a<\/strong> <strong>o<\/strong>ne-storey building  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>We use <strong>an<\/strong> before words that begin with a silent <strong>h<\/strong>. For example,  <\/p>\n<ul>\n<li><strong>an<\/strong> <strong>h<\/strong>eir<\/li>\n<li><strong>an<\/strong> <strong>h<\/strong>onest politician  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>We use <strong>an<\/strong> before abbreviations, if consonants begin with a vowel sound. For example,  <\/p>\n<ul>\n<li><strong>an<\/strong> <strong>MA<\/strong><\/li>\n<li><strong>an<\/strong> <strong>MP<\/strong>  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>We use <strong>a<\/strong> or <strong>an<\/strong> before a singular countable noun which is used to represent a class of things. For example,  <\/p>\n<ul>\n<li><strong>A<\/strong> cow is a useful animal.  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>We use <strong>a<\/strong> or <strong>an<\/strong> to indicate one. For example,  <\/p>\n<ul>\n<li>Not <strong>a<\/strong> bird could be heard.  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>We use <strong>a<\/strong> or <strong>an<\/strong> to make a common noun of a proper noun. For example,  <\/p>\n<ul>\n<li>We have <strong>a<\/strong> Daniel in our midst!  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>We use <strong>a<\/strong> or <strong>an<\/strong> when we speak of a profession. For example,  <\/p>\n<ul>\n<li>He is <strong>a<\/strong> doctor.  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>We use a before words like <strong>dozen, quarter, thousand, few, little<\/strong> and <strong>lot of<\/strong>. For example,  <\/p>\n<ul>\n<li>Can you give me <strong>a<\/strong> little sugar?<\/li>\n<li>He bought <strong>a<\/strong> few mangoes.<\/li>\n<li>It is a quarter of <strong>a<\/strong> kilometre to the school.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>A. Insert a/an where required.<\/strong>  <\/p>\n<ol>\n<li>What <code>____<\/code> shame! He cannot make it to the reunion.  <\/li>\n<li>He is <code>____<\/code> honourable man but has been largely misunderstood.  <\/li>\n<li>I met <code>____<\/code> Assamese gentleman while travelling from Agra to <code>____<\/code> hill station.  <\/li>\n<li>He has <code>____<\/code> headache and needs to take rest.  <\/li>\n<li>The workers formed <code>____<\/code> union in order to discuss their problems.  <\/li>\n<li>Can you give me <code>____<\/code> one-rupee note?  <\/li>\n<li><code>____<\/code> honest person will never lie.  <\/li>\n<li>She wants to buy <code>____<\/code> South Indian saree.  <\/li>\n<li><code>____<\/code> aunt of mine, who lives in Egypt, will visit us in summer.  <\/li>\n<li>Our train is late by <code>____<\/code> hour. We may have to change our plans.  <\/li>\n<li>Could you add <code>____<\/code> little salt to the salad?  <\/li>\n<li>I need <code>____<\/code> lot of money to fulfil my dreams.  <\/li>\n<\/ol>\n<p><strong>Definite Articles<\/strong><br />\nThe is called the definite article because it points to a particular person or a specific thing. Let us learn the uses of the definite article.  <\/p>\n<p>We use the when we speak of a particular person or thing, or one that has already been referred to. For example,  <\/p>\n<ul>\n<li>A thirsty crow found a pitcher that contained some water. The clever crow picked up some pebbles in his beak and dropped them one by one into the pitcher.  <\/li>\n<\/ul>\n<p>We use the when a singular common noun is used to indicate a whole class. For example,  <\/p>\n<ul>\n<li>The lion is the king of the jungle.  <\/li>\n<\/ul>\n<p>We use the with superlatives. For example,  <\/p>\n<ul>\n<li>Sachin is one of the most popular sportsmen in the world.  <\/li>\n<\/ul>\n<p>We use the with objects that are unique. For example,  <\/p>\n<ul>\n<li>the sun  <\/li>\n<li>the moon  <\/li>\n<\/ul>\n<p>We use the before phrases like first, last, only, next, following and previous. For example,  <\/p>\n<ul>\n<li>She is sitting in the last row.  <\/li>\n<\/ul>\n<p>We use the before ordinals. For example,  <\/p>\n<ul>\n<li>Her examination starts on the third of March.  <\/li>\n<\/ul>\n<p>We use the when we speak of the population of a nation. For example,  <\/p>\n<ul>\n<li>The Japanese are warm-hearted people.  <\/li>\n<\/ul>\n<p>We use the before the names of trains, planes and ships. For example,  <\/p>\n<ul>\n<li>the Titanic  <\/li>\n<li>the Golden Temple Express  <\/li>\n<\/ul>\n<p>We use the before the names of well-known buildings and institutions. For example,  <\/p>\n<ul>\n<li>the Parliament House  <\/li>\n<li>the Red Fort  <\/li>\n<\/ul>\n<p>We use the before the names of newspapers and magazines. For example,  <\/p>\n<ul>\n<li>the Deccan Herald  <\/li>\n<li>the Hindu  <\/li>\n<\/ul>\n<p>We use the with adjectives, when we use them to refer to a whole group of people. For example,  <\/p>\n<ul>\n<li>We should help the poor. (poor people)  <\/li>\n<\/ul>\n<p>We use the with the names of rivers, seas, oceans, mountains and deserts. For example,  <\/p>\n<ul>\n<li>the Ganges  <\/li>\n<li>the Indian Ocean  <\/li>\n<li>the Arabian Sea  <\/li>\n<li>the Sahara Desert  <\/li>\n<\/ul>\n<p>We use the before points of the compass that are used as geographic areas. For example,  <\/p>\n<ul>\n<li>the Middle East  <\/li>\n<li>the West  <\/li>\n<\/ul>\n<p>We use the before points on the globe. For example,  <\/p>\n<ul>\n<li>the equator  <\/li>\n<li>the south pole  <\/li>\n<\/ul>\n<p><strong>Omission of Articles<\/strong><br />\nWe do not use articles—  <\/p>\n<ul>\n<li>before expressions like last night, last week, last year, next week and next month.  <\/li>\n<li>before proper nouns. For example,  <\/li>\n<li>I am going to Australia.<\/li>\n<li>Have you spoken to Hema?<\/li>\n<li>before names of languages. For example,  <\/li>\n<li>They speak German quite well.<\/li>\n<li>before plural countable nouns that refer to the entire class. For example,  <\/li>\n<li>I do not like bananas.<\/li>\n<li>before material nouns. For example,  <\/li>\n<li>Platinum is an expensive metal.<\/li>\n<li>before abstract nouns when used in a general way. For example,  <\/li>\n<li>Honesty is a virtue.<\/li>\n<li>before the names of games and sports. For example,  <\/li>\n<li>Golf is gaining in popularity in India of late.<\/li>\n<li>Rakesh loves playing hockey.<\/li>\n<li>before the names of meals. For example,  <\/li>\n<li>I ate breakfast quite late today.<\/li>\n<li>before expressions such as all day, all night, by air and by sea. For example,  <\/li>\n<li>The contingent for the Asian Games will travel by air.  <\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nIn certain cases, there is a need to repeat an article to make the meaning clear. Look at these sentences carefully.  <\/p>\n<ul>\n<li>The Trustee and Secretary arrived.  <\/li>\n<li>The Trustee and the Secretary arrived.  <\/li>\n<\/ul>\n<p>The first sentence implies that only one person who was both Trustee and Secretary arrived.<br />\nThe second sentence states that two persons arrived—the Trustee and the Secretary.  <\/p>\n<p><strong>B. Insert, omit or change articles where necessary.<\/strong>  <\/p>\n<ol>\n<li>French is not a easy language.  <\/li>\n<li>Moon is shining in the sky.  <\/li>\n<li>Don't play fool.  <\/li>\n<li>This is a best of the lot!  <\/li>\n<li>Kindness that he showed was truly touching.  <\/li>\n<li>The privileged of community should help poor.  <\/li>\n<li>I hope to be the actor.  <\/li>\n<li>I met a Austrian at an university in the Germany.  <\/li>\n<li>He thinks he is the Tagore!  <\/li>\n<li>My father admires the truth and honesty in men.  <\/li>\n<li>The aeroplanes can fly at unbelievable speed.  <\/li>\n<li>I play the football.  <\/li>\n<li>We enjoyed meal that you cooked.  <\/li>\n<li>Govind is better swimmer than golfer.  <\/li>\n<li>America is richest country in the world.  <\/li>\n<\/ol>\n<p><strong>C. There is an article missing in each line. Mark the space where the article should be inserted and write it down in the space provided.<\/strong><br />\nSam and I were playing in sand pit in our backyard.<br />\nWe were building sand castle. We lined it with bricks<br />\nand bits of grass. We left some space in middle<br />\nin order to pour in bucket of sand. I decided<br />\nto go to beach first. Sam was the creative artist.<br />\nHe was designer in our group. He had once made<br />\na model of unicorn for a school exhibition.<br />\nIt became centre piece that year. Suddenly, two dogs<br />\nappeared. They could destroy our artwork in jiffy.<br />\nOur friends, who were in vicinity, rushed to our aid.<br />\nFoundation of our grand castle had to be saved!<br />\nThen, Sam rose. He let out loud scream.<br />\nDogs ran as fast as their legs could carry them.<br />\nMoment of crises was over. That day, we learnt that<br />\nhell hath no fury as artist scorned.  <\/p>\n<hr />\n<h1>Answers – Articles<\/h1>\n<p><strong>A. Insert a/an where required.<\/strong>  <\/p>\n<ol>\n<li>What <strong>a<\/strong> shame! He cannot make it to the reunion.  <\/li>\n<li>He is <strong>an<\/strong> honourable man but has been largely misunderstood.  <\/li>\n<li>I met <strong>an<\/strong> Assamese gentleman while travelling from Agra to <strong>a<\/strong> hill station.  <\/li>\n<li>He has <strong>a<\/strong> headache and needs to take rest.  <\/li>\n<li>The workers formed <strong>a<\/strong> union in order to discuss their problems.  <\/li>\n<li>Can you give me <strong>a<\/strong> one-rupee note?  <\/li>\n<li><strong>An<\/strong> honest person will never lie.  <\/li>\n<li>She wants to buy <strong>a<\/strong> South Indian saree.  <\/li>\n<li><strong>An<\/strong> aunt of mine, who lives in Egypt, will visit us in summer.  <\/li>\n<li>Our train is late by <strong>an<\/strong> hour. We may have to change our plans.  <\/li>\n<li>Could you add <strong>a<\/strong> little salt to the salad?  <\/li>\n<li>I need <strong>a<\/strong> lot of money to fulfil my dreams.  <\/li>\n<\/ol>\n<p><strong>B. Insert, omit or change articles where necessary.<\/strong>  <\/p>\n<ol>\n<li>French is not an easy language.  <\/li>\n<li>The moon is shining in the sky.  <\/li>\n<li>Don't play the fool.  <\/li>\n<li>This is the best of the lot!  <\/li>\n<li>The kindness that he showed was truly touching.  <\/li>\n<li>The privileged of the community should help the poor.  <\/li>  action has already been completed. The word perfect means completed.  <\/p>\n<p>The <strong>present perfect tense<\/strong> tells us that an action is complete with respect to the present. For example,  <\/p>\n<ul>\n<li>I <strong>have seen<\/strong> this movie twice this week. (And the week isn't over yet.)  <\/li>\n<\/ul>\n<p>The <strong>past perfect tense<\/strong> tells us that an action took place before another action in the past. For example,  <\/p>\n<ul>\n<li>Mala <strong>had left<\/strong> before I reached the office.  <\/li>\n<\/ul>\n<p>The <strong>future perfect tense<\/strong> talks about an action that will occur in the future before some other action. For example,  <\/p>\n<ul>\n<li>I <strong>will have arrived<\/strong> before you come home.  <\/li>\n<\/ul>\n<p><strong>Present Perfect Tense<\/strong><br />\nThe present perfect is used—  <\/p>\n<ul>\n<li>to indicate that an action has been completed just now or a little while ago. For example,  <ul>\n<li>He <strong>has just finished<\/strong> correcting answer scripts.<\/li>\n<li>The sun <strong>has risen<\/strong> a while ago.<\/li>\n<\/ul>\n<\/li>\n<li>to express an action whose time is not given and is not definite. For example,  <ul>\n<li>We <strong>have known<\/strong> her to be very helpful.<\/li>\n<\/ul>\n<\/li>\n<li>to describe a past event when we think more about its effect on the present. For example,  <ul>\n<li>I <strong>have broken<\/strong> my glasses. (So, I cannot see properly.)<\/li>\n<\/ul>\n<\/li>\n<li>to denote an action that started some time ago and is continuing till the time of speaking. For example,  <ul>\n<li>We <strong>have known<\/strong> the family for many years.<\/li>\n<li>Manju <strong>has been<\/strong> ill since Sunday.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nBoth the simple past tense and the present perfect tense express an action completed in the past. But the simple past tense expresses an action completed in the past, but not linked to the present. The present perfect tense, however, denotes an action that is completed but connected to the present.<br />\nThe present perfect tense is never used with adverbs or phrases of past time like <strong>yesterday<\/strong>, <strong>last month<\/strong>, etc.<br />\nWe do not say, He has <strong>gone<\/strong> to the museum yesterday.<br />\nWe say, He <strong>went<\/strong> to the museum yesterday.  <\/p>\n<p><strong>Past Perfect Tense<\/strong><br />\nWe use the past perfect tense to denote—  <\/p>\n<ul>\n<li>an action completed before a given point of time. This moment or point of time may be indicated or may be understood.  <ul>\n<li>When I reached the station, the train <strong>had left<\/strong>.<\/li>\n<li>I <strong>had completed<\/strong> my training by noon.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nIf two actions occurred in the past, with one action taking place earlier than the other, the past perfect is used for the earlier action and the simple past for the later action. Thus, we say,  <\/p>\n<ul>\n<li>The exam had started when I <strong>reached<\/strong> school.  <\/li>\n<\/ul>\n<p>The past perfect tense is used with such verbs as hope, expect, think to indicate that a past hope or desire remained unfulfilled.  <\/p>\n<ul>\n<li>I had believed that I would win the tournament but I did not.  <\/li>\n<\/ul>\n<p><strong>Future Perfect Tense<\/strong><br />\nThe future perfect tense is used—  <\/p>\n<ul>\n<li>to refer to the completion of an action by a certain time in the future. The tense is normally used with a time expression beginning with by, such as, by that time, by then or by next week.  <ul>\n<li>The Minister will have announced his decision by next week.<\/li>\n<li>They will have completed the assignment by next summer.<\/li>\n<li>The jury will have given its verdict by noon tomorrow.<\/li>\n<li>By next week, we shall have reached an agreement regarding the factory.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>A. A verb is highlighted in each of these sentences and its tense is mentioned in the brackets. State whether the tenses mentioned are correct. If not, correct them.<\/strong>  <\/p>\n<ol>\n<li>When I arrived, the members <strong>were eating<\/strong>. <strong>(simple past)<\/strong>  <\/li>\n<li>He <strong>failed<\/strong> last year. <strong>(simple past)<\/strong>  <\/li>\n<li>I <strong>shall have done<\/strong> this exercise by 9 a.m. <strong>(future perfect)<\/strong>  <\/li>\n<li>They <strong>are going<\/strong> to the zoo. <strong>(present continuous)<\/strong>  <\/li>\n<li>Rima <strong>was working<\/strong> in the office. <strong>(past continuous)<\/strong>  <\/li>\n<li>Kolkata <strong>stands<\/strong> on the Hooghly River. <strong>(simple present)<\/strong>  <\/li>\n<li>The show commenced after we <strong>had reached<\/strong>. <strong>(past perfect)<\/strong>  <\/li>\n<li>When I reach home, father <strong>will be cooking<\/strong>. <strong>(future continuous)<\/strong>  <\/li>\n<li>Dr Sen <strong>has taught<\/strong> many children in this area. <strong>(present perfect)<\/strong>  <\/li>\n<li>Rahul <strong>was driving<\/strong> his bike when it started to rain. <strong>(past continuous)<\/strong>  <\/li>\n<li>She <strong>has been<\/strong> a social activist for many years. <strong>(present perfect)<\/strong>  <\/li>\n<li>The tennis tournament <strong>commences<\/strong> next week. <strong>(simple present)<\/strong>  <\/li>\n<li>I <strong>have finished<\/strong> this canvas just now. <strong>(present perfect)<\/strong>  <\/li>\n<li>I <strong>was cycling<\/strong> the whole morning. <strong>(past continuous)<\/strong>  <\/li>\n<li>The criminals <strong>had fled<\/strong> before the security guards arrived. <strong>(past perfect)<\/strong>  <\/li>\n<\/ol>\n<p><strong>B. Fill in the blanks according to the instructions in the brackets.<\/strong>  <\/p>\n<ol>\n<li>We <code>____<\/code> in Delhi for ten years. <strong>(present perfect tense of live)<\/strong>  <\/li>\n<li>The plumber <code>____<\/code> repairing the damaged pipe when it started to rain. <strong>(past perfect tense of finish)<\/strong>  <\/li>\n<li>Before you reach the station, the train <code>____<\/code>. <strong>(future perfect tense of leave)<\/strong>  <\/li>\n<li>You <code>____<\/code> the task by the time your guests arrive. <strong>(future perfect tense of complete)<\/strong>  <\/li>\n<li>Ravi <code>____<\/code> for Mumbai. <strong>(present perfect tense of depart)<\/strong>  <\/li>\n<li>Sarah <code>____<\/code> a brilliant article for the science magazine, but it wasn't published. <strong>(past perfect tense of write)<\/strong>  <\/li>\n<li>He <code>____<\/code> never <code>____<\/code> such a wonderful sight. <strong>(past perfect tense of see)<\/strong>  <\/li>\n<li>Villagers <code>____<\/code> the breach in the embankment by then. <strong>(future perfect tense of notice)<\/strong>  <\/li>\n<li>Heera said, 'I <code>____<\/code> my homework.' <strong>(present perfect tense of do)<\/strong>  <\/li>\n<li>You <code>____<\/code> the news by then. <strong>(future perfect tense of hear)<\/strong>  <\/li>\n<li>The yacht <code>____<\/code> before the rescue team arrived. <strong>(past perfect tense of sink)<\/strong>  <\/li>\n<li>We <code>____<\/code> him to be a generous man. <strong>(present perfect tense of know)<\/strong>  <\/li>\n<\/ol>\n<p><strong>C. Rewrite these sentences using the tense specified within the brackets. At least one verb will have to be changed. Make other necessary changes.<\/strong>  <\/p>\n<ol>\n<li>The play <strong>will begin<\/strong> when you reach the theatre. <strong>(simple future)<\/strong>  <\/li>\n<li>The boss <strong>arrived<\/strong> before the employees came. <strong>(simple past)<\/strong>  <\/li>\n<li>The politician <strong>had arrived<\/strong> just for the meeting. <strong>(past perfect)<\/strong>  <\/li>\n<li>We <strong>had known<\/strong> him for a while. <strong>(past perfect)<\/strong>  <\/li>\n<li>We <strong>shall be reaching<\/strong> the station around then. <strong>(future continuous)<\/strong>  <\/li>\n<li>I <strong>had been working<\/strong> for two hours when he arrived. <strong>(past perfect continuous)<\/strong>  <\/li>\n<li>You <strong>will see<\/strong> me before you leave. <strong>(simple future)<\/strong>  <\/li>\n<li>The Town Hall <strong>had been closed<\/strong> when we reached. <strong>(past perfect)<\/strong>  <\/li>\n<\/ol>\n<p><strong>D. Join these pairs of sentences using the past perfect tense and making changes where necessary.<\/strong>  <\/p>\n<ol>\n<li>She finished sweeping the floor. The telephone rang.  <\/li>\n<li>The students left. It began to rain.  <\/li>\n<li>The thieves wiped the place clean. We reached home.  <\/li>\n<li>Ratul submitted an application form. He left for college.  <\/li>\n<li>The cat jumped upon the table. I did not have time to react.  <\/li>\n<li>I made up my mind. My parents arrived to discuss the matter.  <\/li>\n<li>I reached the station. Usha reached before me.  <\/li>\n<li>I planned it. I executed it successfully.  <\/li>\n<\/ol>\n<p><strong>E. Change the following sentences as directed.<\/strong>  <\/p>\n<ol>\n<li>The doctor has just left the clinic. <strong>(present continuous tense)<\/strong>  <\/li>\n<li>We leave for London this evening. <strong>(simple past tense)<\/strong>  <\/li>\n<li>We leave for London this evening. <strong>(future perfect continuous)<\/strong>  <\/li>\n<li>They have been trying to contact you. <strong>(past perfect tense)<\/strong>  <\/li>\n<li>Grandmother went for a walk every morning. <strong>(simple future tense)<\/strong>  <\/li>\n<li>I walk to school every day. <strong>(simple future tense)<\/strong>  <\/li>\n<li>I have cleared the cupboard. <strong>(past perfect tense)<\/strong>  <\/li>\n<li>They have finished their work. <strong>(future perfect tense)<\/strong>  <\/li>\n<li>Rakesh was waiting at Nirula's for his friend. <strong>(future continuous tense)<\/strong>  <\/li>\n<li>We are watching a movie. <strong>(past continuous tense)<\/strong>  <\/li>\n<li>He speaks rudely. <strong>(present perfect tense)<\/strong>  <\/li>\n<li>I will have been living in Delhi for many years. <strong>(past perfect continuous)<\/strong>  <\/li>\n<li>When does your school reopen? <strong>(simple present tense)<\/strong>  <\/li>\n<li>My grandmother exercises regularly. <strong>(simple present tense)<\/strong>  <\/li>\n<li>The river is flowing under the bridge. <strong>(simple present tense)<\/strong>  <\/li>\n<li>The police are looking for clues. <strong>(past continuous tense)<\/strong>  <\/li>\n<li>I am listening to the president's speech. <strong>(past continuous tense)<\/strong>  <\/li>\n<li>The children are going to school. <strong>(past continuous tense)<\/strong>  <\/li>\n<li>I want to go home. <strong>(simple past tense)<\/strong>  <\/li>\n<li>Reema will go to the library after school. <strong>(simple present tense)<\/strong>  <\/li>\n<li>My mother is making dinner and my father is working in the garage. <strong>(future tense)<\/strong>  <\/li>\n<\/ol>\n<p><strong>F. Choose the correct verb from those in the brackets.<\/strong>  <\/p>\n<ol>\n<li>I <code>____<\/code> in Delhi for many years. <strong>(have been living / am living)<\/strong>  <\/li>\n<li>The dogs <code>____<\/code> all night. <strong>(are barking / have been barking)<\/strong>  <\/li>\n<li>I <code>____<\/code> him since we left school last year. <strong>(haven't seen / didn't see)<\/strong>  <\/li>\n<li>Our school <code>____<\/code> on the first of July. <strong>(reopens / will reopen)<\/strong>  <\/li>\n<li>We <code>____<\/code> for London this evening. <strong>(are leaving / leave)<\/strong>  <\/li>\n<li>I <code>____<\/code> a phone call from him yesterday. <strong>(had received / received)<\/strong>  <\/li>\n<li>I <code>____<\/code> when the phone rang. <strong>(had been sleeping / was sleeping)<\/strong>  <\/li>\n<li>It <code>____<\/code> for two hours. <strong>(is raining / has been raining)<\/strong>  <\/li>\n<\/ol>\n<hr />\n<hr />\n<h1>Answers – Perfect Tenses<\/h1>\n<p><strong>A. A verb is highlighted in each of these sentences and its tense is mentioned in the brackets. State whether the tenses mentioned are correct. If not, correct them.<\/strong>  <\/p>\n<ol>\n<li>Incorrect; correct tense is <strong>past continuous<\/strong>.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<li>Correct.  <\/li>\n<\/ol>\n<p><strong>B. Fill in the blanks according to the instructions in the brackets.<\/strong>  <\/p>\n<ol>\n<li>We <strong>have lived<\/strong> in Delhi for ten years.  <\/li>\n<li>The plumber <strong>had finished<\/strong> repairing the damaged pipe when it started to rain.  <\/li>\n<li>Before you reach the station, the train <strong>will have left<\/strong>.  <\/li>\n<li>You <strong>will have completed<\/strong> the task by the time your guests arrive.  <\/li>\n<li>Ravi <strong>has departed<\/strong> for Mumbai.  <\/li>\n<li>Sarah <strong>had written<\/strong> a brilliant article for the science magazine, but it wasn't published.  <\/li>\n<li>He <strong>had<\/strong> never <strong>seen<\/strong> such a wonderful sight.  <\/li>\n<li>Villagers <strong>will have noticed<\/strong> the breach in the embankment by then.  <\/li>\n<li>Heera said, 'I <strong>have done<\/strong> my homework.'  <\/li>\n<li>You <strong>will have heard<\/strong> the news by then.  <\/li>\n<li>The yacht <strong>had sunk<\/strong> before the rescue team arrived.  <\/li>\n<li>We <strong>have known<\/strong> him to be a generous man.  <\/li>\n<\/ol>\n<p><strong>C. Rewrite these sentences using the tense specified within the brackets. At least one verb will have to be changed. Make other necessary changes.<\/strong>  <\/p>\n<ol>\n<li>The play will begin when you reach the theatre.  <\/li>\n<li>The boss arrived before the employees came.  <\/li>\n<li>The politician had arrived just for the meeting.  <\/li>\n<li>We had known him for a while.  <\/li>\n<li>We shall be reaching the station around then.  <\/li>\n<li>I had been working for two hours when he arrived.  <\/li>\n<li>You will see me before you leave.  <\/li>\n<li>The Town Hall had been closed when we reached.  <\/li>\n<\/ol>\n<p><strong>D. Join these pairs of sentences using the past perfect tense and making changes where necessary.<\/strong>  <\/p>\n<ol>\n<li>She had finished sweeping the floor when the telephone rang.  <\/li>\n<li>The students had left before it began to rain.  <\/li>\n<li>The thieves had wiped the place clean before we reached home.  <\/li>\n<li>Ratul had submitted an application form before he left for college.  <\/li>\n<li>The cat had jumped upon the table before I had time to react.  <\/li>\n<li>I had made up my mind before my parents arrived to discuss the matter.  <\/li>\n<li>Usha had reached the station before I reached.  <\/li>\n<li>After I had planned it, I executed it successfully.  <\/li>\n<\/ol>\n<p><strong>E. Change the following sentences as directed.<\/strong>  <\/p>\n<ol>\n<li>The doctor is leaving the clinic.  <\/li>\n<li>We left for London this evening.  <\/li>\n<li>We shall have been leaving for London this evening.  <\/li>\n<li>They had tried to contact you.  <\/li>\n<li>Grandmother will go for a walk every morning.  <\/li>\n<li>I shall walk to school every day.  <\/li>\n<li>I had cleared the cupboard.  <\/li>\n<li>They will have finished their work.  <\/li>\n<li>Rakesh will be waiting at Nirula's for his friend.  <\/li>\n<li>We were watching a movie.  <\/li>\n<li>He has spoken rudely.  <\/li>\n<li>I had been living in Delhi for many years.  <\/li>\n<li>When does your school reopen?  <\/li>\n<li>My grandmother exercises regularly.  <\/li>\n<li>The river flows under the bridge.  <\/li>\n<li>The police were looking for clues.  <\/li>\n<li>I was listening to the president's speech.  <\/li>\n<li>The children were going to school.  <\/li>\n<li>I wanted to go home.  <\/li>\n<li>Reema goes to the library after school.  <\/li>\n<li>My mother will make dinner and my father will work in the garage.  <\/li>\n<\/ol>\n<p><strong>F. Choose the correct verb from those in the brackets.<\/strong>  <\/p>\n<ol>\n<li>I <strong>have been living<\/strong> in Delhi for many years.  <\/li>\n<li>The dogs <strong>have been barking<\/strong> all night.  <\/li>\n<li>I <strong>haven't seen<\/strong> him since we left school last year.  <\/li>\n<li>Our school <strong>reopens<\/strong> on the first of July.  <\/li>\n<li>We <strong>are leaving<\/strong> for London this evening.  <\/li>\n<li>I <strong>received<\/strong> a phone call from him yesterday.  <\/li>\n<li>I <strong>was sleeping<\/strong> when the phone rang.  <\/li>\n<li>It <strong>has been raining<\/strong> for two hours.<\/li>\n<\/ol>"}, {"title": "Modals and Auxiliaries", "html": "<p>An auxiliary is a helping verb. In a sentence, an auxiliary is always used with another verb. There are two types of auxiliary verbs.  <\/p>\n<ul>\n<li><strong>primary auxiliaries:<\/strong> The words be, have and do are called primary auxiliaries. The forms of be are <strong>is, am, are, was and were<\/strong>. The forms of have are <strong>have, has and had<\/strong>. The forms of do are <strong>do, does and did<\/strong>.  <\/li>\n<li><strong>modal auxiliaries:<\/strong> The words <strong>can, could, may, might, shall, should, must, will, would, used, need, dare, ought<\/strong> express attitudes like permission, possibility, etc. Modal auxiliaries are also called modals. They do not change their forms.  <\/li>\n<\/ul>\n<p><strong>Primary Auxiliaries<\/strong>  <\/p>\n<p><strong>Be<\/strong>  <\/p>\n<ul>\n<li>It is used in the formation of continuous tenses. For example,  <ul>\n<li>Mother <strong>is knitting<\/strong> a sweater.<\/li>\n<\/ul>\n<\/li>\n<li>It is used to show that the action is more important than the doer. For example,  <ul>\n<li>The cupboard <strong>was<\/strong> opened by Kirti.<\/li>\n<\/ul>\n<\/li>\n<li>When followed by an infinitive, it is used to indicate a plan or an arrangement. For example,  <ul>\n<li>We <strong>are<\/strong> to finish the work in a month.<\/li>\n<\/ul>\n<\/li>\n<li>It is also used to denote a command. For example,  <ul>\n<li>You <strong>are<\/strong> to pick it up right now.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Have<\/strong>  <\/p>\n<ul>\n<li>This is used to form the perfect tenses. For example,  <ul>\n<li>The artists <strong>have painted<\/strong> beautifully.<\/li>\n<\/ul>\n<\/li>\n<li>It is used with the infinitive to indicate some kind of obligation. For example,  <ul>\n<li>They <strong>have<\/strong> to return immediately.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Do<\/strong>  <\/p>\n<ul>\n<li>It is used to form negative statements and interrogative sentences. For example,  <\/li>\n<li>He <strong>doesn't<\/strong> agree with me.<\/li>\n<li><strong>Did<\/strong> you manage to finish the assignment?<\/li>\n<li>In imperative sentences, it is used to make the statement more forceful. For example,  <\/li>\n<li><strong>Do<\/strong> be quiet.  <\/li>\n<\/ul>\n<p><strong>Modal Auxiliaries<\/strong>  <\/p>\n<p><strong>Can and Could<\/strong>  <\/p>\n<ul>\n<li><strong>Can<\/strong> usually suggests potential or ability. For example,  <ul>\n<li>Ram <strong>can<\/strong> take you to the airport.<\/li>\n<li><strong>Can<\/strong> you lift this?<\/li>\n<\/ul>\n<\/li>\n<li><strong>Can<\/strong> is also used to indicate permission. For example,  <ul>\n<li>You <strong>can<\/strong> join from tomorrow.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Could<\/strong> is used to ask a polite question. For example,  <ul>\n<li><strong>Could<\/strong> you help me solve the sum?<\/li>\n<\/ul>\n<\/li>\n<li><strong>Could<\/strong> is used as the past tense of can in indirect speech. For example,  <ul>\n<li>Toto said, 'I <strong>can<\/strong> help you.'<\/li>\n<li>Toto said that he <strong>could<\/strong> help me.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Could<\/strong> is used to indicate ability in the past. For example,  <ul>\n<li>He <strong>could<\/strong> sing well once upon a time.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>May and Might<\/strong>  <\/p>\n<ul>\n<li><strong>May<\/strong> is usually used to request permission formally. For example,  <ul>\n<li><strong>May<\/strong> I use your eraser?<\/li>\n<\/ul>\n<\/li>\n<li><strong>May<\/strong> is also used to express a wish. For example,  <ul>\n<li><strong>May<\/strong> you always enjoy good luck!<\/li>\n<\/ul>\n<\/li>\n<li><strong>May<\/strong> is used to indicate possibility. For example,  <ul>\n<li>There <strong>may<\/strong> be some rain this evening.<\/li>\n<\/ul>\n<\/li>\n<li><strong>May<\/strong> suggests a weak possibility and <strong>might<\/strong> suggests a very weak possibility in the future. For example,  <ul>\n<li>The match schedule <strong>may<\/strong> be announced next Monday.<\/li>\n<li>We <strong>might<\/strong> return sooner than expected.<\/li>\n<li>She <strong>might<\/strong> arrive tomorrow.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Shall, Should, Will and Would<\/strong>  <\/p>\n<ul>\n<li><strong>Shall<\/strong> is usually used in the first person and will in the second and third person. For example,  <ul>\n<li>I <strong>shall<\/strong> be pleased to visit you.<\/li>\n<li>You <strong>will<\/strong> agree with me.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Shall<\/strong> is used in the second and third person to express a command, a promise or even a threat. For example,  <ul>\n<li>He <strong>shall<\/strong> not work here again. (threat)<\/li>\n<li>You <strong>shall<\/strong> certainly be rewarded. (promise)<\/li>\n<\/ul>\n<\/li>\n<li><strong>Shall<\/strong> is used in interrogative sentences with the first person to indicate an offer or a suggestion. For example,  <ul>\n<li><strong>Shall<\/strong> I carry these books for you?<\/li>\n<\/ul>\n<\/li>\n<li><strong>Will<\/strong> is used to express a decision or a choice. For example,  <ul>\n<li>I <strong>will<\/strong> do the cooking today.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Will<\/strong> is used to indicate a habit. For example,  <ul>\n<li>He <strong>will<\/strong> go swimming as usual.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Will<\/strong> is used in interrogative sentences to suggest an invitation. For example,  <ul>\n<li><strong>Will<\/strong> you go on a holiday with us?<\/li>\n<\/ul>\n<\/li>\n<li>In clauses starting with <em>if<\/em>, <strong>should<\/strong> is used to express a supposition that may not be true. For example,  <ul>\n<li>If it <strong>should<\/strong> rain, the match will be called off.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Must and Ought<\/strong>  <\/p>\n<ul>\n<li><strong>Must<\/strong> expresses necessity or obligation. For example,  <ul>\n<li>We <strong>must<\/strong> remember this.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Must<\/strong> can express fixed determination. For example,  <ul>\n<li>I <strong>must<\/strong> have an opportunity to do what I wish.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Must<\/strong> and <strong>ought<\/strong> also express certainty or strong possibility. For example,  <ul>\n<li>He <strong>must<\/strong> have forgotten about the invitation.<\/li>\n<li>We <strong>ought<\/strong> to strike this deal.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Ought<\/strong> expresses moral obligation or desirability. For example,  <ul>\n<li>We <strong>ought<\/strong> to try hard.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Used<\/strong>  <\/p>\n<ul>\n<li>It is used to indicate a discontinued habit. For example,  <\/li>\n<li>She <strong>used<\/strong> to learn ballet.  <\/li>\n<\/ul>\n<p><strong>Need<\/strong>  <\/p>\n<ul>\n<li>It denotes necessity or obligation. It is commonly used in negatives and interrogatives. For example,  <ul>\n<li>He <strong>need<\/strong> not give up tennis.<\/li>\n<li><strong>Need<\/strong> I help him?<\/li>\n<\/ul>\n<\/li>\n<li><strong>Need<\/strong> can also be used to denote requirement or desire. For example,  <ul>\n<li>I do not <strong>need<\/strong> your help.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Dare<\/strong><br />\n<strong>Dare<\/strong> as modal auxiliary means 'be bold enough to'.  <\/p>\n<ul>\n<li>It is commonly used in interrogative and negative sentences.  <ul>\n<li>How <strong>dare<\/strong> she say this?<\/li>\n<\/ul>\n<\/li>\n<li><strong>Dare<\/strong> can also be used to indicate a challenge. For example,  <ul>\n<li>I <strong>dare<\/strong> you to eat all the food on the table.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>A. Choose the correct alternatives.<\/strong>  <\/p>\n<ol>\n<li>You <code>____<\/code> not lie. <strong>(should/can)<\/strong>  <\/li>\n<li>She <code>____<\/code> be ashamed of herself. <strong>(could/should)<\/strong>  <\/li>\n<li>We <code>____<\/code> to help those in distress. <strong>(need/ought)<\/strong>  <\/li>\n<li><code>____<\/code> you please lend me this book? <strong>(will/shall)<\/strong>  <\/li>\n<li>I am glad she <code>____<\/code> come yesterday. <strong>(would/could)<\/strong>  <\/li>\n<li><code>____<\/code> I come to meet you tomorrow, ma'am? <strong>(May/can)<\/strong>  <\/li>\n<li>You <code>____<\/code> plan your future in advance. <strong>(shall/should)<\/strong>  <\/li>\n<li>I am late for office. I <code>____<\/code> take a cab. <strong>(may/must)<\/strong>  <\/li>\n<li>You could wait a while. You <code>____<\/code> not go to the doctor immediately. <strong>(need/ought)<\/strong>  <\/li>\n<li>We <code>____<\/code> buy this music compact disc. We have a copy at home. <strong>(might not/must not)<\/strong>  <\/li>\n<li>One <code>____<\/code> eat dinner too late. <strong>(should not/need not)<\/strong>  <\/li>\n<li>I don't think I <code>____<\/code> be able to reach on time. <strong>(should/ shall)<\/strong>  <\/li>\n<li>She was afraid that if she requested him again, he <code>____<\/code> refuse. <strong>(can/might)<\/strong>  <\/li>\n<li>If you are unruly, you <code>____<\/code> be kept back after school. <strong>(can/shall)<\/strong>  <\/li>\n<\/ol>\n<p><strong>B. Fill in the blanks using appropriate modals.<\/strong>  <\/p>\n<ol>\n<li><code>____<\/code> you please tell me the direction to the hotel?  <\/li>\n<li>You <code>____<\/code> pay in cash. They do not accept credit cards.  <\/li>\n<li>I <code>____<\/code> come home from the office today.  <\/li>\n<li><code>____<\/code> I help you?  <\/li>\n<li>You <code>____<\/code> clean your room.  <\/li>\n<li>We <code>____<\/code> keep the lights and fans switched off when they are not in use.  <\/li>\n<li>We <code>____<\/code> improve the existing education system.  <\/li>\n<li><code>____<\/code> you have a wonderful day!  <\/li>\n<li>I <code>____<\/code> go to see the movie. The reviews are good.  <\/li>\n<li>I <code>____<\/code> definitely be at the airport to receive you.  <\/li>\n<li>She <code>____<\/code> take her meals regularly.  <\/li>\n<li>'You <code>____<\/code> reach home before eleven,' she said.  <\/li>\n<li><code>____<\/code> we go for a walk?  <\/li>\n<li>The soldiers in the army <code>____<\/code> wear a uniform.  <\/li>\n<li>There is one more point I <code>____<\/code> refer to.  <\/li>\n<li>You have worked hard. You <code>____<\/code> pass.  <\/li>\n<li>It is very cloudy. It <code>____<\/code> rain.  <\/li>\n<li>You <code>____<\/code> be properly dressed when you come to office.  <\/li>\n<li><code>____<\/code> you like to come to the party tomorrow?  <\/li>\n<li>People <code>____<\/code> not tell lies.  <\/li>\n<\/ol>\n<p><strong>C. Fill in the blanks with the appropriate modals in accordance with the instructions given in the brackets.<\/strong>  <\/p>\n<ol>\n<li>I <code>____<\/code> attend the concert. <strong>(weak possibility)<\/strong>  <\/li>\n<li><code>____<\/code> you pass on this message to my family? <strong>(polite request)<\/strong>  <\/li>\n<li>Do not worry. You <code>____<\/code> receive a scholarship. <strong>(promise)<\/strong>  <\/li>\n<li><code>____<\/code> I take your leave? <strong>(asking for permission)<\/strong>  <\/li>\n<li>You <code>____<\/code> apologise immediately. <strong>(threat)<\/strong>  <\/li>\n<li>The child <code>____<\/code> play the piano. <strong>(expressing ability)<\/strong>  <\/li>\n<li>The school buses <code>____<\/code> not be driven rashly. <strong>(prohibition)<\/strong>  <\/li>\n<li><code>____<\/code> you like to have a cup of tea? <strong>(request)<\/strong>  <\/li>\n<li>We <code>____<\/code> obey the laws of the land. <strong>(duty or obligation)<\/strong>  <\/li>\n<li><code>____<\/code> this be true? <strong>(possibility)<\/strong>  <\/li>\n<li>He <code>____<\/code> to enjoy watching Hindi films. <strong>(indicate past habit)<\/strong>  <\/li>\n<li>I <code>____<\/code> finish the work before he comes. <strong>(determination)<\/strong>  <\/li>\n<li>The highway <code>____<\/code> be blocked due to a recent landslide. <strong>(possibility)<\/strong>  <\/li>\n<li><code>____<\/code> you earn fame and fortune! <strong>(to express a wish)<\/strong>  <\/li>\n<li>She <code>____<\/code> speak eight languages. <strong>(ability)<\/strong>  <\/li>\n<li>You <code>____<\/code> complete your homework before going to play. <strong>(necessity)<\/strong>  <\/li>\n<\/ol>\n<p><strong>D. The following passage has not been edited. There are errors in the usage of modals. Write the incorrect word and the correct word in the space provided. Put x if there are no errors in a line.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Incorrect<\/th>\n<th>Correct<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The label can be removed before cooking.<\/td>\n<td><code>_________<\/code><\/td>\n<td><code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>Then, the cookware could be rinsed in<\/td>\n<td><code>_________<\/code><\/td>\n<td><code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>warm soapy water. It is advisable to keep<\/td>\n<td><code>_________<\/code><\/td>\n<td><code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>to low heat. The cookware would never<\/td>\n<td><code>_________<\/code><\/td>\n<td><code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>be used on high heat. Very high<\/td>\n<td><code>_________<\/code><\/td>\n<td><code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>temperatures would cause sticking.<\/td>\n<td><code>_________<\/code><\/td>\n<td><code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>The handles used to also loosen.<\/td>\n<td><code>_________<\/code><\/td>\n<td><code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>However, one should not worry about the<\/td>\n<td><code>_________<\/code><\/td>\n<td><code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>maintenance as it is quite easy.<\/td>\n<td><code>_________<\/code><\/td>\n<td><code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>The vessel might be cleaned with a liquid<\/td>\n<td><code>_________<\/code><\/td>\n<td><code>_______<\/code><\/td>\n<\/tr>\n<tr>\n<td>detergent. One cannot use sharp detergent.<\/td>\n<td><code>_________<\/code><\/td>\n<td><code>_______<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<hr />\n<h1>Answers – Modals and Auxiliaries<\/h1>\n<p><strong>A. Choose the correct alternatives.<\/strong>  <\/p>\n<ol>\n<li>You <strong>should<\/strong> not lie.  <\/li>\n<li>She <strong>should<\/strong> be ashamed of herself.  <\/li>\n<li>We <strong>ought<\/strong> to help those in distress.  <\/li>\n<li><strong>Will<\/strong> you please lend me this book?  <\/li>\n<li>I am glad she <strong>could<\/strong> come yesterday.  <\/li>\n<li><strong>May<\/strong> I come to meet you tomorrow, ma'am?  <\/li>\n<li>You <strong>should<\/strong> plan your future in advance.  <\/li>\n<li>I am late for office. I <strong>must<\/strong> take a cab.  <\/li>\n<li>You could wait a while. You <strong>need<\/strong> not go to the doctor immediately.  <\/li>\n<li>We <strong>might not<\/strong> buy this music compact disc. We have a copy at home.  <\/li>\n<li>One <strong>should not<\/strong> eat dinner too late.  <\/li>\n<li>I don't think I <strong>shall<\/strong> be able to reach on time.  <\/li>\n<li>She was afraid that if she requested him again, he <strong>might<\/strong> refuse.  <\/li>\n<li>If you are unruly, you <strong>shall<\/strong> be kept back after school.  <\/li>\n<\/ol>\n<p><strong>B. Fill in the blanks using appropriate modals.<\/strong>  <\/p>\n<ol>\n<li><strong>Could<\/strong> you please tell me the direction to the hotel?  <\/li>\n<li>You <strong>must<\/strong> pay in cash. They do not accept credit cards.  <\/li>\n<li>I <strong>may<\/strong> come home from the office today.  <\/li>\n<li><strong>May<\/strong> I help you?  <\/li>\n<li>You <strong>should<\/strong> clean your room.  <\/li>\n<li>We <strong>should<\/strong> keep the lights and fans switched off when they are not in use.  <\/li>\n<li>We <strong>must<\/strong> improve the existing education system.  <\/li>\n<li><strong>May<\/strong> you have a wonderful day!  <\/li>\n<li>I <strong>may<\/strong> go to see the movie. The reviews are good.  <\/li>\n<li>I <strong>will<\/strong> definitely be at the airport to receive you.  <\/li>\n<li>She <strong>should<\/strong> take her meals regularly.  <\/li>\n<li>'You <strong>must<\/strong> reach home before eleven,' she said.  <\/li>\n<li><strong>Shall<\/strong> we go for a walk?  <\/li>\n<li>The soldiers in the army <strong>must<\/strong> wear a uniform.  <\/li>\n<li>There is one more point I <strong>must<\/strong> refer to.  <\/li>\n<li>You have worked hard. You <strong>will<\/strong> pass.  <\/li>\n<li>It is very cloudy. It <strong>may<\/strong> rain.  <\/li>\n<li>You <strong>must<\/strong> be properly dressed when you come to office.  <\/li>\n<li><strong>Would<\/strong> you like to come to the party tomorrow?  <\/li>\n<li>People <strong>should<\/strong> not tell lies.  <\/li>\n<\/ol>\n<p><strong>C. Fill in the blanks with the appropriate modals in accordance with the instructions given in the brackets.<\/strong>  <\/p>\n<ol>\n<li>I <strong>might<\/strong> attend the concert.  <\/li>\n<li><strong>Could<\/strong> you pass on this message to my family?  <\/li>\n<li>Do not worry. You <strong>shall<\/strong> receive a scholarship.  <\/li>\n<li><strong>May<\/strong> I take your leave?  <\/li>\n<li>You <strong>shall<\/strong> apologise immediately.  <\/li>\n<li>The child <strong>can<\/strong> play the piano.  <\/li>\n<li>The school buses <strong>must<\/strong> not be driven rashly.  <\/li>\n<li><strong>Would<\/strong> you like to have a cup of tea?  <\/li>\n<li>We <strong>must<\/strong> obey the laws of the land.  <\/li>\n<li><strong>Can<\/strong> this be true?  <\/li>\n<li>He <strong>used<\/strong> to enjoy watching Hindi films.  <\/li>\n<li>I <strong>will<\/strong> finish the work before he comes.  <\/li>\n<li>The highway <strong>may<\/strong> be blocked due to a recent landslide.  <\/li>\n<li><strong>May<\/strong> you earn fame and fortune!  <\/li>\n<li>She <strong>can<\/strong> speak eight languages.  <\/li>\n<li>You <strong>must<\/strong> complete your homework before going to play.  <\/li>\n<\/ol>\n<p><strong>D. The following passage has not been edited. There are errors in the usage of modals. Write the incorrect word and the correct word in the space provided. Put x if there are no errors in a line.<\/strong>  <\/p>\n<ol>\n<li>The label can be removed before cooking. — Incorrect: <strong>can<\/strong>, Correct: <strong>should<\/strong>  <\/li>\n<li>Then, the cookware could be rinsed in — Incorrect: <strong>could<\/strong>, Correct: <strong>should<\/strong>  <\/li>\n<li>warm soapy water. It is advisable to keep — Incorrect: <strong>x<\/strong>, Correct: <strong>x<\/strong>  <\/li>\n<li>to low heat. The cookware would never — Incorrect: <strong>would<\/strong>, Correct: <strong>should<\/strong>  <\/li>\n<li>be used on high heat. Very high — Incorrect: <strong>x<\/strong>, Correct: <strong>x<\/strong>  <\/li>\n<li>temperatures would cause sticking. — Incorrect: <strong>would<\/strong>, Correct: <strong>may<\/strong>  <\/li>\n<li>The handles used to also loosen. — Incorrect: <strong>used to<\/strong>, Correct: <strong>may<\/strong>  <\/li>\n<li>However, one should not worry about the — Incorrect: <strong>x<\/strong>, Correct: <strong>x<\/strong>  <\/li>\n<li>maintenance as it is quite easy. — Incorrect: <strong>x<\/strong>, Correct: <strong>x<\/strong>  <\/li>\n<li>The vessel might be cleaned with a liquid — Incorrect: <strong>might<\/strong>, Correct: <strong>can<\/strong>  <\/li>\n<li>detergent. One cannot use sharp detergent. — Incorrect: <strong>cannot<\/strong>, Correct: <strong>must not<\/strong><\/li>\n<\/ol>"}, {"title": "Answers – Non-finite Verbs", "html": "<p># Non-finite Verbs  <\/p>\n<p>Read these sets of sentences. What do you notice about the highlighted words and the underlined words?  <\/p>\n<ul>\n<li>I want <strong>to go<\/strong> home.  <ul>\n<li>Lathika wants <strong>to go<\/strong> home.<\/li>\n<li>They want <strong>to go<\/strong> home.<\/li>\n<\/ul>\n<\/li>\n<li>I am <strong>swimming<\/strong>.  <ul>\n<li>Mansi is <strong>swimming<\/strong>.<\/li>\n<li>They are <strong>swimming<\/strong>.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p>In a sentence, the verb usually changes its form according to the person and number of the subject. However, in the above sentences, the underlined words remain the same even when the subject changes.  <\/p>\n<p>When the verb in the sentence indicates the tense and changes according to the subject, we call it the <strong>finite verb<\/strong>. A finite verb has a subject.  <\/p>\n<p>The verb in a sentence that has no subject, person or number is called a <strong>non-finite verb<\/strong>.  <\/p>\n<p>In these sentences, the highlighted verbs are finite verbs that change with the subject, while the underlined verbs are non-finite verbs.  <\/p>\n<ul>\n<li>I go to the market every day <strong>to fetch<\/strong> milk.  <\/li>\n<li>He goes to the market every day <strong
