 with—'It was a stormy night. The rain was pouring down heavily and the wind was so strong that many trees were uprooted. I was returning home after visiting Vivek when...'  <\/li>\n<li>End with—'I shall always cherish that memory.'  <\/li>\n<li>Begin with—'The water was cold, I took a deep breath and jumped...'  <\/li>\n<li>End with—'...where there is a will, there is always a way.'  <\/li>\n<\/ol>\n<p><strong>B. Write original short stories using these guidelines.<\/strong>  <\/p>\n<ol>\n<li>in which a briefcase, a camera and a policeman play a significant part  <\/li>\n<li>in which one of the following plays a significant part—  <ul>\n<li>a birthday<\/li>\n<li>a family argument<\/li>\n<li>a power cut<\/li>\n<\/ul>\n<\/li>\n<li>You are being followed; you manage to get away or were caught by your pursuers.  <\/li>\n<li>'When the door of happiness closes, another opens; but often we look so long at the closed door that we do not see the one which has opened for us.'—Helen Keller. Write a short story using the above quotation as its theme.  <\/li>\n<li>to bring out clearly the meaning of this proverb—'Honesty is the best policy.'  <\/li>\n<\/ol>\n<hr />\n<h1>Answers – Narrative Writing<\/h1>\n<p><strong>A.<\/strong>  <\/p>\n<ol>\n<li>It was a stormy night. The rain was pouring down heavily and the wind was so strong that many trees were uprooted. I was returning home after visiting Vivek when my bicycle chain suddenly snapped near the desolate stretch beside the old city lake. Darkness engulfed the road as streetlights flickered and died due to power failure.  <\/li>\n<\/ol>\n<p>Standing under a leaking bus shelter, I heard a faint whimpering sound coming from a muddy ditch. Shining my phone flashlight, I discovered a tiny puppy trapped beneath a fallen tree branch, shivering in the freezing rain. Without hesitation, I waded through the mud, lifted the heavy branch with all my strength, and wrapped the frightened puppy in my raincoat. Carrying the little creature safely in my arms, I walked the remaining two miles home. The puppy survived and became my loyal companion, reminding me that even the stormiest nights can bring unexpected blessings.  <\/p>\n<ol start=\"2\">\n<li>The sun was setting behind the snow-capped Himalayan peaks, painting the sky in brilliant shades of crimson and gold. We had spent five arduous hours trekking through dense pine forests to reach the scenic high-altitude meadow of Dayara Bugyal. Our legs were exhausted, but the panoramic beauty unfolding before our eyes erased every bit of fatigue.  <\/li>\n<\/ol>\n<p>Our trekking guide pitched our tents beside a crystal-clear mountain stream, while we gathered around a small campfire to share hot tea and stories. As night descended, millions of bright stars glittered across the clear night sky, creating a breathtaking canopy above us. Sitting quietly under that vast cosmic expanse, surrounded by trusted friends and peaceful silence, I felt a deep sense of serenity and gratitude. I shall always cherish that memory.  <\/p>\n<ol start=\"3\">\n<li>The water was cold, I took a deep breath and jumped into the rushing river. The sudden shock of icy mountain water surged through my body, sending a sharp shiver down my spine. But there was no time to panic; my young cousin had accidentally lost his footing on the slippery riverbank and was being carried downstream by the swift current.  <\/li>\n<\/ol>\n<p>Kicking hard against the powerful swirl of the current, I swam vigorously toward the bright yellow jacket floating near the bend. Reaching him just before the river tumbled into a rocky rapid, I grabbed his collar securely with one arm and pulled his head above water. Using my remaining energy, I kicked toward a calm eddy along the left bank, where helpful bystanders pulled us both onto solid ground. Gasping for air on the grassy bank, I held my coughing cousin tightly, relieved that my decisive leap had saved his life.  <\/p>\n<ol start=\"4\">\n<li>When Rohan lost his right arm in a tragic train accident at the age of twelve, everyone believed his passion for painting was permanently destroyed. His canvas easel sat abandoned in his room, covered in dust, while he struggled with deep sadness for months. However, watching a documentary about adaptive artists reignited a spark of determination within his heart.  <\/li>\n<\/ol>\n<p>He began practicing patiently every single day, training his left hand to hold brushes, mix oil paints, and execute delicate strokes. Initial attempts resulted in smudges and frustrating failures, but Rohan refused to give up. After three years of relentless practice, he submitted his artwork to the National Youth Art Exhibition. To everyone's astonishment, his painting won the first prize for extraordinary technique and emotional depth. Standing proudly on stage to receive his trophy, Rohan proved to the world that where there is a will, there is always a way.  <\/p>\n<p><strong>B.<\/strong>  <\/p>\n<ol>\n<li><strong>The Missing Briefcase<\/strong><br />\nInspector Sharma was standing near the central fountain of the crowded botanical garden when a frantic tourist approached him. The tourist explained that while taking photographs with his vintage camera, he had placed a black leather briefcase containing important property documents on a nearby bench. When he turned back moments later, the briefcase had vanished.  <\/li>\n<\/ol>\n<p>Inspector Sharma asked the photographer to show him the pictures he had taken over the last ten minutes. Carefully reviewing the high-resolution images on the camera screen, the policeman noticed a man in a red jacket picking up the briefcase in the background of a floral landscape photo. Inspector Sharma quickly alerted the park exit gates with the visual description. Within fifteen minutes, security guards intercepted the suspect attempting to board a taxi. The briefcase was recovered intact, proving that the camera and the quick-thinking policeman were instrumental in solving the crime.  <\/p>\n<ol start=\"2\">\n<li><strong>Light in the Darkness<\/strong><br />\nThe Roy family was preparing for dinner on a hot summer evening when an unexpected power cut plunged the entire apartment complex into total darkness. Sweltering heat quickly filled the rooms, making everyone irritable. Rohan and his elder sister began complaining bitterly, interrupting their mother's attempts to light emergency candles.  <\/li>\n<\/ol>\n<p>Seeing the mood souring, their grandfather smiled and suggested a traditional story session on the open balcony. As gentle night breezes blew, he recounted fascinating tales from his youth, filled with humor, adventure, and wisdom. The children listened spellbound, forgetting their discomfort and putting aside their electronic gadgets. When the electricity was finally restored two hours later, no one wanted the magical evening to end. The sudden power cut had unexpectedly brought the family closer together.  <\/p>\n<ol start=\"3\">\n<li><strong>Escaping the Shadow<\/strong><br />\nWalking back home through the quiet alleyways of Old Town at dusk, Sameer noticed a tall figure in a dark trench coat keeping pace behind him. Every time Sameer accelerated his steps, the footsteps behind him quickened as well. Panic seized his mind as he realized he was being pursued through the dimly lit streets.  <\/li>\n<\/ol>\n<p>Knowing the geography of his neighborhood well, Sameer pretended to walk toward a dead-end alley. Just as his pursuer turned the corner behind him, Sameer ducked swiftly behind a heavy wooden gate and slipped into the back courtyard of a busy bakery. Slipping out through the bakery's bright front entrance onto the main crowded boulevard, he flagged down a passing police patrol car and reported the suspicious tracker. Safe among the crowd, Sameer took a deep sigh of relief, thankful for his quick wits.  <\/p>\n<ol start=\"4\">\n<li><strong>Opening New Doors<\/strong><br />\nWhen Priya failed to clear the final interview for her dream medical college admission, she felt utterly heartbroken. For weeks she stayed indoors, mourning the closed door of her ambition and ignoring all words of comfort from family and friends. She could not stop brooding over what she had lost.  <\/li>\n<\/ol>\n<p>Encouraged by her high school biology teacher, Priya reluctantly enrolled in a degree program in Environmental Biotechnology. To her surprise, she discovered a deep passion for bio-remediation research and sustainable ecology. Within two years, she led an innovative research project that developed low-cost water purification filters for rural villages, earning an international scholarship. Looking back, Priya smiled, realizing how true Helen Keller's words were: when the door of her medical career closed, a far more fulfilling door of scientific discovery had opened for her.  <\/p>\n<ol start=\"5\">\n<li><strong>Honesty is the Best Policy<\/strong><br />\nRaghav, a poor college student working part-time as a delivery boy, found a heavy leather wallet dropped near a park bench late one evening. Opening it to check for identification, he was stunned to find fifty thousand rupees in cash along with credit cards and an ID card belonging to a prominent businessman, Mr. Singhania.  <\/li>\n<\/ol>\n<p>Though Raghav desperately needed money to pay his upcoming semester fees, his conscience refused to let him keep what was not his. He immediately rode his bicycle to Mr. Singhania's residence and handed over the wallet intact. Deeply moved by Raghav's integrity, Mr. Singhania offered to sponsor his complete higher education and hired him as a management intern in his company. Raghav's truthfulness changed his life forever, proving that honesty is indeed the best policy.<\/p>"}, {"title": "Formal Email Writing", "html": "<h2>📌 What is a Formal Email?<\/h2>\n<p>A <strong>formal email<\/strong> is the electronic equivalent of a formal letter. It is used for official communication with school principals, teachers, business managers, or authorities. Because emails are read quickly, the language must be extremely concise, clear, and professional.  <\/p>\n<h2>📝 Format / Structure (Word Limit: 100-120 words)<\/h2>\n<p>The format is enclosed in a <strong>BOX<\/strong> to simulate a computer screen/email client:  <\/p>\n<pre><code class=\"language-text\">+-----------------------------------------------------------------------------+\n| Date    : 24 May 2026                                                       |\n| From    : student.name@email.com                                            |\n| To      : principal.school@email.com                                        |\n| Cc      : principal.school@email.com                                        |\n| Bcc     : principal.school@email.com                                        |\n| Subject : Request for extension of project submission deadline.             |\n|-----------------------------------------------------------------------------|\n| Respected Sir/Madam,                                                        |\n|                                                                             |\n| Paragraph 1: State the purpose of the email directly.                       |\n| Paragraph 2: Provide brief, necessary details or reasons.                   |\n| Paragraph 3: State the action required and conclude politely.               |\n|                                                                             |\n| Regards,                                                                    |\n| Name                                                                        |\n| Designation/Class                                                           |\n+-----------------------------------------------------------------------------+\n<\/code><\/pre>\n<p><em>(Note: Some formats also include 'Cc' (Carbon Copy) and 'Bcc' (Blind Carbon Copy) below the 'To' field. Include them if your teacher specifically asks, but Date, From, To, and Subject are the essential headers.)<\/em>  <\/p>\n<h2>⚖️ CBSE Marking Scheme (Typically 5 Marks)<\/h2>\n<ul>\n<li><strong>Format<\/strong>: 1 Mark (Box, headers, salutation, sign-off)<\/li>\n<li><strong>Content<\/strong>: 2 Marks (Clarity of purpose, relevant details)<\/li>\n<li><strong>Expression<\/strong>: 2 Marks (Polite tone, grammar, brevity)  <\/li>\n<\/ul>\n<h2>💡 Language Tips &amp; Key Rules<\/h2>\n<ul>\n<li><strong>Subject Line<\/strong>: This is the most important part of an email. It must be a short phrase summarizing the email (e.g., <em>Application for sick leave<\/em>). Do not write a full sentence in the subject line.<\/li>\n<li><strong>Brevity<\/strong>: Do not write long, winding stories. Get straight to the point in the first sentence.<\/li>\n<li><strong>Tone<\/strong>: Formal and polite. Never use text slang (like 'u', 'pls', 'thx').  <\/li>\n<\/ul>\n<h2>⚠️ Common Mistakes to Avoid<\/h2>\n<ul>\n<li>Leaving the subject line blank or writing \"Hi\" as the subject.<\/li>\n<li>Forgetting to draw the box around the email.<\/li>\n<li>Using informal sign-offs like \"Lots of love\" or \"Yours lovingly\". Always use \"Regards,\" or \"Sincerely,\".  <\/li>\n<\/ul>\n<hr />\n<h2>🌟 Model Example<\/h2>\n<p><strong>Q: You are Amit/Amita, the Secretary of the IT Club of your school. Write an email to the Principal of a neighboring school inviting their students to participate in an Inter-School Coding Competition organized by your club.<\/strong>  <\/p>\n<pre><code class=\"language-text\">+-----------------------------------------------------------------------------+\n| Date    : 10 October 2026                                                   |\n| From    : itclub.dps@email.com                                              |\n| To      : principal.modernschool@email.com                                  |\n| Cc      : principal.school@email.com                                        |\n| Bcc     : principal.school@email.com                                        |\n| Subject : Invitation for Inter-School Coding Competition 2026               |\n|-----------------------------------------------------------------------------|\n| Respected Sir/Madam,                                                        |\n|                                                                             |\n| I am writing on behalf of the IT Club of Delhi Public School to formally    |\n| invite your students to participate in our annual Inter-School Coding       |\n| Competition, 'Code-Fest 2026'.                                              |\n|                                                                             |\n| The event is scheduled to be held on 25th October 2026 in our school        |\n| computer labs from 9:00 AM to 2:00 PM. The competition is open to students  |\n| of Classes IX and X. We believe this platform will provide a great          |\n| opportunity for young tech enthusiasts to showcase their programming skills.|\n|                                                                             |\n| We have attached the detailed brochure and registration forms with this     |\n| email. We kindly request you to forward this to your Computer Science       |\n| department. The last date for registration is 18th October.                 |\n|                                                                             |\n| We look forward to enthusiastic participation from your esteemed school.    |\n|                                                                             |\n| Regards,                                                                    |\n| Amit Sharma                                                                 |\n| Secretary, IT Club, DPS                                                     |\n+-----------------------------------------------------------------------------+\n<\/code><\/pre>\n<hr />\n<h2>✍️ Practice Prompts<\/h2>\n<ol>\n<li>Write a formal email to the Manager of an electronics store inquiring about the bulk pricing of 20 tablets for your school's digital library.<\/li>\n<li>Write an email to your class teacher submitting your Science project online and apologizing for a one-day delay due to internet issues at home.<\/li>\n<\/ol>"}, {"title": "Informal Letter", "html": "<h2>📌 What is an Informal Letter?<\/h2>\n<p>An <strong>informal letter<\/strong> is a personal letter written to friends, family members, or relatives to share personal news, express feelings, ask for advice, or describe an experience. At the Class IX level, the letter should display emotional depth, mature vocabulary, and well-structured paragraphs despite the casual tone.  <\/p>\n<h2>📝 Format / Structure (Word Limit: 120-150 words)<\/h2>\n<p>The format follows a left-aligned layout:  <\/p>\n<ol>\n<li><strong>Sender’s Address<\/strong>: Top left corner.<\/li>\n<li><strong>Date<\/strong>: Below the address (e.g., <em>24 May 2026<\/em>).<\/li>\n<li><strong>Salutation<\/strong>: E.g., <em>Dear Rahul, Dear Mom,<\/em><\/li>\n<li><strong>Body of the Letter<\/strong>:<br />\n   - <strong>Paragraph 1 (Introduction)<\/strong>: Inquire about their health and state the reason for writing the letter.<br />\n   - <strong>Paragraph 2 (Main Content)<\/strong>: Expand on the topic. Give vivid details of the experience, problem, or news you are sharing. Show your feelings.<br />\n   - <strong>Paragraph 3 (Conclusion)<\/strong>: Concluding remarks, hopes for a reply, and sending love to other family members.<\/li>\n<li><strong>Subscription<\/strong>: <em>Yours lovingly, / Yours affectionately,<\/em><\/li>\n<li><strong>Name<\/strong>: First name only.  <\/li>\n<\/ol>\n<h2>⚖️ CBSE Marking Scheme (Typically 5-8 Marks)<\/h2>\n<ul>\n<li><strong>Format<\/strong>: 1-2 Marks (Address, Date, Salutation, Closing)<\/li>\n<li><strong>Content<\/strong>: 3-4 Marks (Relevance, ideas, elaboration)<\/li>\n<li><strong>Expression<\/strong>: 2 Marks (Grammar, vocabulary, friendly but mature tone)  <\/li>\n<\/ul>\n<h2>💡 Language Tips &amp; Key Phrases<\/h2>\n<ul>\n<li><strong>Opening<\/strong>: <\/li>\n<li><em>\"I was delighted to read your last letter...\"<\/em><\/li>\n<li><em>\"I hope this letter finds you in the pink of health.\"<\/em><\/li>\n<li><strong>Tone<\/strong>: Conversational and warm. You can use contractions (<em>I've, couldn't, haven't<\/em>).<\/li>\n<li><strong>Elaboration<\/strong>: Don't just state facts. If you went on a trip, describe how it made you <em>feel<\/em>.  <\/li>\n<\/ul>\n<h2>⚠️ Common Mistakes to Avoid<\/h2>\n<ul>\n<li><strong>Using formal sign-offs<\/strong>: Never use \"Yours faithfully\" or \"Yours sincerely\" in an informal letter.<\/li>\n<li><strong>Missing the Date<\/strong>: Ensure the date is written in the correct format (15 May 2026, not 15/05/26).  <\/li>\n<\/ul>\n<hr />\n<h2>🌟 Model Example<\/h2>\n<p><strong>Q: You are Sneha/Sumit studying in a boarding school in Dehradun. Write a letter to your mother telling her about your experience of participating in a grueling 3-day adventure camp organized by the school.<\/strong>  <\/p>\n<p>Room No. 42, Ganga Hostel<br />\nDoon Public School<br />\nDehradun  <\/p>\n<p>12 October 2026  <\/p>\n<p>Dear Mom,  <\/p>\n<p>I hope you and dad are doing wonderful back home. I am writing this letter to share my thrilling experience at the 3-day adventure camp our school organized in Rishikesh last weekend.  <\/p>\n<p>Honestly, mom, when I first saw the itinerary, I was terrified. The camp included rock climbing, valley crossing, and white-water rafting. On the first day during the rock climbing session, my hands were shaking, and I almost gave up halfway. However, our instructor and my friends cheered me on, and when I finally reached the top, the feeling of accomplishment was indescribable! The river rafting the next day was the highlight—the freezing water splashing against our faces was both scary and exhilarating.  <\/p>\n<p>This trip pushed me out of my comfort zone and taught me that I am much stronger than I thought. I can't wait to show you all the photographs during the winter break.  <\/p>\n<p>Give my love to dad and little Rohan. Miss you all!  <\/p>\n<p>Yours lovingly,<br />\nSneha  <\/p>\n<hr />\n<h2>✍️ Practice Prompts<\/h2>\n<ol>\n<li>Write a letter to your friend apologizing for your rude behavior during an argument last week, and asking for their forgiveness.<\/li>\n<li>You recently read a highly inspiring book. Write a letter to your cousin recommending the book to them and explaining why you liked it so much.<\/li>\n<\/ol>"}, {"title": "Informal Invitation Letter", "html": "<h2>📌 What is an Informal Invitation Letter?<\/h2>\n<p>An <strong>informal invitation letter<\/strong> is written to invite friends, relatives, or close acquaintances to personal events such as a birthday party, an anniversary, a housewarming, or a casual get-together. The tone is warm, personal, and friendly, completely avoiding official jargon.  <\/p>\n<h2>📝 Format / Structure (Word Limit: 50-100 words)<\/h2>\n<p>The format is similar to a regular informal letter but is usually shorter and more direct.  <\/p>\n<ol>\n<li><strong>Sender’s Address<\/strong>: Top left corner.<\/li>\n<li><strong>Date<\/strong>: Below the address (e.g., <em>24 May 2026<\/em>).<\/li>\n<li><strong>Salutation<\/strong>: <em>Dear [First Name],<\/em><\/li>\n<li><strong>Body of the Letter<\/strong>:<br />\n   - <strong>The Invite<\/strong>: Clearly state what the occasion is and explicitly invite the person.<br />\n   - <strong>The Details<\/strong>: Mention the <strong>Date<\/strong>, <strong>Time<\/strong>, and <strong>Venue<\/strong> of the event clearly.<br />\n   - <strong>Personal Touch<\/strong>: Add a line about how much their presence would mean to you or what fun activities are planned.<\/li>\n<li><strong>Subscription (Closing)<\/strong>: <em>Yours lovingly,<\/em> / <em>Yours affectionately,<\/em><\/li>\n<li><strong>Sender’s Name<\/strong>: First name only.  <\/li>\n<\/ol>\n<h2>⚖️ CBSE Marking Scheme (Typically 3-4 Marks)<\/h2>\n<ul>\n<li><strong>Format<\/strong>: 1 Mark<\/li>\n<li><strong>Content (Occasion, Date, Time, Venue)<\/strong>: 1-2 Marks<\/li>\n<li><strong>Expression (Friendly tone, grammar)<\/strong>: 1 Mark  <\/li>\n<\/ul>\n<h2>💡 Language Tips &amp; Useful Phrases<\/h2>\n<ul>\n<li><strong>Opening phrases<\/strong>:<\/li>\n<li><em>\"I am thrilled to invite you to...\"<\/em><\/li>\n<li><em>\"You will be glad to know that...\"<\/em><\/li>\n<li><em>\"It gives me immense pleasure to invite you and your family to...\"<\/em><\/li>\n<li><strong>Adding warmth<\/strong>:<\/li>\n<li><em>\"The party won't be the same without you.\"<\/em><\/li>\n<li><em>\"Looking forward to celebrating together.\"<\/em>  <\/li>\n<\/ul>\n<h2>⚠️ Common Mistakes to Avoid<\/h2>\n<ul>\n<li><strong>Forgetting Event Details<\/strong>: An invitation is useless if you forget to mention <em>when<\/em> and <em>where<\/em> it is happening.<\/li>\n<li><strong>Using formal language<\/strong>: Do not use \"Respected\" or \"Yours faithfully.\"<\/li>\n<li><strong>Writing too much<\/strong>: Unlike a regular informal letter where you discuss life and health at length, an invitation should get straight to the point.  <\/li>\n<\/ul>\n<hr />\n<h2>🌟 Model Example<\/h2>\n<p><strong>Q: You are Ankit/Ankita. You are organizing a surprise 50th birthday party for your father. Write an informal letter inviting your uncle, who lives in Chandigarh, to the party.<\/strong>  <\/p>\n<p>14, Green Park<br />\nNew Delhi  <\/p>\n<p>15 October 2026  <\/p>\n<p>Dear Uncle Suresh,  <\/p>\n<p>I hope you and Aunt are doing well. You will be glad to know that dad is turning 50 next week. To celebrate this milestone, mom and I are organizing a surprise birthday party for him.  <\/p>\n<p>It gives me immense pleasure to invite you and Aunt to the celebration. The party will be held at our residence on Sunday, 25th October 2026, starting at 7:00 PM. We have arranged for dad's favorite live music band and a wonderful dinner.  <\/p>\n<p>Since it is a surprise, please do not mention it to dad when you speak to him! The celebration will be incomplete without your presence. We are eagerly waiting to see you.  <\/p>\n<p>Yours lovingly,<br />\nAnkit  <\/p>\n<hr />\n<h2>✍️ Practice Prompts<\/h2>\n<ol>\n<li>Write an informal letter to your best friend inviting them to your house for a weekend pajama party to celebrate the end of your final exams. Mention the date and activities planned.<\/li>\n<li>Your family has just moved into a new apartment. Write an informal letter to your cousin inviting them to the housewarming ceremony.<\/li>\n<\/ol>"}, {"title": "Essay Writing", "html": "<p>An essay, or a composition, can be an expression of your opinions, feelings, or experiences. It is not, however, a rambling piece of writing, but a very structured form. An essay is usually divided into paragraphs. The first paragraph is called the introduction and the final paragraph is called the conclusion. The paragraphs in between the introduction and the conclusion constitute the body of the composition. These paragraphs help to develop the thoughts and ideas of the composition.  <\/p>\n<p>What are the qualities of a good composition?  <\/p>\n<ul>\n<li><strong>Unity of thought<\/strong>: The composition must develop one theme with a definite purpose.  <\/li>\n<li><strong>Order<\/strong>: The composition must follow a certain ordered line of thought and come to a definite conclusion. It must not consist of haphazard reflections put down anyhow. Therefore it is of utmost importance to plan out a line of thought before beginning to write.  <\/li>\n<li><strong>Brevity<\/strong>: A composition should not be very long. What is important is whether the composition is well written or not. Though there can be no strict rule regarding the length of a composition, one can say that it ought to be roughly around three hundred words.  <\/li>\n<li><strong>Style<\/strong>: A composition should be written in simple and correct English. The sentence construction should be simple, direct and natural. The secret of clear writing is clear thinking. Slang, colloquial terms and free and easy constructions ought to be avoided. A composition which ‘moves’ the reader is supposed to be a good piece of writing. The words chosen ought to be justified and necessary.  <\/li>\n<li><strong>Personal touch<\/strong>: A composition must reveal the personal feelings and opinions of the writer. Without the personal touch, the composition becomes devoid of individuality.  <\/li>\n<\/ul>\n<p>How do we write a good composition?  <\/p>\n<ul>\n<li><strong>Step 1:<\/strong> Think about the topic. What does it mean?  <\/li>\n<li><strong>Step 2:<\/strong> Write down the thoughts and questions that arise in your mind after seeing the topic.  <\/li>\n<li><strong>Step 3:<\/strong> Arrange the thoughts and questions in a logical sequence, so that one may lead to the other.  <\/li>\n<li><strong>Step 4:<\/strong> Once the facts have been organised one can concentrate on the style. How do we make the facts appear attractive? This can be done in several ways.  <\/li>\n<li>Start the composition with the help of a <strong>creative and arresting introduction<\/strong> by using one of the various methods:<ul>\n<li>by <strong>setting the scene<\/strong> of the story<\/li>\n<li>by <strong>plunging straight into action<\/strong><\/li>\n<li>by an <strong>arresting or unusual detail<\/strong><\/li>\n<li>by a <strong>dialogue<\/strong><\/li>\n<\/ul>\n<\/li>\n<li>The style of writing also includes a <strong>meaningful conclusion<\/strong>. Remember—<ul>\n<li>you should <strong>round off<\/strong> your narration<\/li>\n<li>you could aim for a <strong>surprise ending<\/strong><\/li>\n<li>you must avoid ending your composition with sentences such as, 'In conclusion...', 'It can be seen that...' or 'Summing up, I'd like to state...'<\/li>\n<\/ul>\n<\/li>\n<li><strong>Step 5:<\/strong> Keep in mind the <strong>length of the composition<\/strong>. An ideal composition would be about <strong>five paragraphs of 60 words each<\/strong>. A little more or less does not make much of a difference. Remember, it is not how much you say but <strong>what you say and how you say it<\/strong>—that is what creates an impact!  <\/li>\n<li><strong>Step 6:<\/strong> Do not forget the <strong>personal touch<\/strong>. Remember what you are writing is a composition and not an impersonal report. Therefore <strong>your opinion and views<\/strong> are most important.  <\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nAt this point, one has to understand the difference between a descriptive composition and a narrative composition. Certain topics like 'A Village Fair' may seem a little confusing. The confusion arises in whether the composition ought to be written in the first person or in the third person. 'A Village Fair' may be written in the first person. However, the description of the fair is more important than the narrator's experience of it, which may come in as part of the conclusion! If the topic reads, 'How You Spent a Day in a Village Fair', then the narrator's experience becomes as important as the description of the fair. Remember that descriptions are a part of a narrative essay and descriptive essays may or may not be written in the first person.  <\/p>\n<p>Write a composition (300–350 words) on these topics with the help of the given guidelines.  <\/p>\n<ol>\n<li>\n<p><strong>Pandemonium at the Picnic<\/strong><br />\n   (A picnic or an excursion is an enjoyable experience if shared, especially if something exciting takes place. Describe such an occasion.)<\/p>\n<\/li>\n<li>\n<p><strong>Going to the Market<\/strong><br />\n   (Write a description of a market scene in your area.)<\/p>\n<\/li>\n<li>\n<p><strong>An Old Favourite<\/strong><br />\n   (Write about a book or a television programme that you have enjoyed and try to analyse what particular features gave you pleasure.)<\/p>\n<\/li>\n<li>\n<p><strong>A Wedding in the Family<\/strong><br />\n   (You have recently attended your cousin's marriage. Describe the event, the customs and what you liked/disliked about it.)<\/p>\n<\/li>\n<li>\n<p><strong>My Favourite Extra-curricular Activities<\/strong><br />\n   (What do you enjoy doing in your spare time? How do you feel these activities contribute to the development of your character?)  <\/p>\n<\/li>\n<\/ol>\n<hr />\n<hr />\n<h1>Answers – Essay Writing<\/h1>\n<p><strong>1. Pandemonium at the Picnic<\/strong>  <\/p>\n<p>The winter morning was bright and crisp when our class set out for an annual picnic to a scenic lakeside resort located near the foothills. Everyone was in high spirits, singing songs on the bus ride and anticipating a peaceful day of outdoor games, delicious food, and relaxed conversation under the shaded canopy of pine trees.  <\/p>\n<p>Upon arrival, we quickly set up our picnic mats, spread out our lunch boxes, and began an energetic game of badminton. However, our tranquil morning was suddenly interrupted by an unexpected visitor. A troupe of curious wild monkeys descended from the surrounding trees, attracted by the aroma of freshly cooked snacks. Within seconds, utter pandemonium broke out across the picnic grounds.  <\/p>\n<p>One daring monkey snatched a container of samosas right off our table, while another grabbed our teacher's brightly colored handbag and scurried up a tall banyan tree. Students scattered in all directions, screaming in excitement and surprise, while our frantic class monitor attempted to rescue the remaining lunch baskets by covering them with picnic mats.  <\/p>\n<p>Realizing that panic would only agitate the creatures, our teacher calmly suggested that we leave a tray of fruits at the base of a nearby tree. The clever tactic worked like magic; the monkeys descended to feast on the apples and bananas, dropping the stolen handbag safely onto the soft grass below. We watched from a safe distance, chuckling at the comical turn of events.  <\/p>\n<p>Once the uninvited guests returned to the forest, we gathered together to tidy up the area and share whatever food remained. What began as a routine day in nature turned into an unforgettable adventure filled with laughter and excitement. Looking back, that chaotic picnic remains one of my fondest school memories, proving that unexpected surprises often make for the best stories.  <\/p>\n<p><strong>2. Going to the Market<\/strong>  <\/p>\n<p>The central market in our city is a vibrant, bustling hub of activity that truly comes alive during the late afternoon hours. As one approaches the main entrance, a symphony of sounds greets the senses—hawkers shouting out enticing prices, honking rickshaws navigating narrow lanes, and the steady hum of bargaining shoppers filling the air.  <\/p>\n<p>Brightly lit shops and canvas stalls line both sides of the crowded street, displaying a stunning variety of goods. Vegetable vendors arrange fresh, green produce in neat pyramids, sprinkling water over leafy spinach and crisp cucumbers to keep them looking fresh. Adjacent to them, fruit sellers showcase rows of golden mangoes, red apples, and sweet oranges, enticing passersby with their rich fragrance.  <\/p>\n<p>Further down the lane, the market turns into a burst of color with textile merchants displaying traditional fabrics, sparkling bangles, and stylish garments. Shoppers move slowly from one stall to another, carefully inspecting goods and negotiating prices with seasoned shopkeepers. The atmosphere is energetic and lively, reflecting the rich cultural diversity of our local community.  <\/p>\n<p>The food section of the market is particularly captivating, sending irresistible aromas of freshly fried jalebis, spicy chaat, and roasted nuts through the cool air. Families and groups of friends gather around street food carts, enjoying warm delicacies and sharing lighthearted conversations amidst the ongoing bustle of the market.  <\/p>\n<p>Visiting the local market is far more than just a routine shopping trip; it is a sensory experience that captures the beating heart of our city. The dynamic energy, vibrant colors, and friendly human interactions make it a place I love to visit time and again.  <\/p>\n<p><strong>3. An Old Favourite<\/strong>  <\/p>\n<p>Among the many books I have read over the years, <em>The Adventures of Tom Sawyer<\/em> by Mark Twain remains my absolute favourite. I first discovered this classic novel during a summer vacation, and its charm has stayed with me ever since. The story revolves around young Tom Sawyer, an imaginative and mischievous boy growing up along the banks of the Mississippi River in the nineteenth century.  <\/p>\n<p>What gives me immense pleasure while reading this book is Twain's brilliant depiction of childhood innocence and adventure. Tom's clever antics—such as tricking his friends into whitewashing a fence for him by convincing them it was a privilege—are written with marvelous humor and wit. The author captures the spirit of youth so accurately that every reader can relate to Tom's desires, fears, and triumphs.  <\/p>\n<p>Another feature that makes the novel so engaging is its rich background setting and memorable characters. From Tom's loyal companion Huckleberry Finn to the kind-hearted Aunt Polly, each character is portrayed with depth and authentic regional dialogue. The exciting plot moves seamlessly from lighthearted schoolroom pranks to thrilling midnight adventures in mysterious graveyards and dark caves.  <\/p>\n<p>Furthermore, the book carries subtle lessons about honesty, friendship, and moral courage without ever feeling preachy. Tom's willingness to stand up for justice during critical moments shows his underlying goodness, making him a deeply endearing protagonist.  <\/p>\n<p>In conclusion, <em>The Adventures of Tom Sawyer<\/em> is a timeless masterpiece that offers laughter, excitement, and nostalgia in equal measure. Every time I reopen its pages, I am transported back to a world of endless imagination and joyful discovery.  <\/p>\n<p><strong>4. A Wedding in the Family<\/strong>  <\/p>\n<p>Last week, our entire family gathered in Jaipur to celebrate the wedding of my elder cousin, Radhika. The venue was a magnificently decorated heritage hall adorned with marigold garlands, fairy lights, and elegant silk drapes. The air was filled with festive excitement as relatives from distant cities arrived to participate in the traditional ceremonies.  <\/p>\n<p>The wedding festivities spanned three memorable days, beginning with the lively Mehendi and Sangeet functions. Family members of all ages performed traditional dances and sang folk songs, creating a joyful environment. On the main wedding day, the groom arrived in a grand procession accompanied by lively brass band music and dancing guests. The central wedding ritual took place around a sacred fire under a beautifully decorated mandap, where solemn vows were recited by the couple.  <\/p>\n<p>What I liked most about the event was the warm sense of togetherness that brought our extended family close. Reconnecting with cousins, sharing old stories, and participating in rich cultural rituals made the occasion truly special. Additionally, the grand wedding feast—featuring a magnificent spread of traditional Rajasthani dishes and sweets—was an absolute delight for everyone present.  <\/p>\n<p>However, there were a few aspects of the event that I found slightly unpleasant. The continuous use of loud sound systems late into the night was exhausting, especially for senior family members. Furthermore, I observed a considerable amount of food wastage at the buffet counters, which could have been avoided with better management.  <\/p>\n<p>Despite these minor drawbacks, my cousin's wedding was a beautiful celebration of love, culture, and family bonds. The vibrant memories of colorful attire, joyous laughter, and solemn customs will remain etched in my heart for years to come.  <\/p>\n<p><strong>5. My Favourite Extra-curricular Activities<\/strong>  <\/p>\n<p>In today's fast-paced academic environment, extra-curricular activities provide a vital outlet for creativity and self-expression. In my spare time, I love engaging in two main activities: playing classical violin and participating in school debate competitions. Both pursuits bring immense joy to my life while shaping my personality in unique ways.  <\/p>\n<p>Practicing the violin requires patience, discipline, and consistent effort. Learning to read musical notation and controlling the bow to produce sweet melodies demands hours of focused concentration. When I play music, I feel a sense of inner calm and emotional freedom that helps me recharge after long hours of study. Music has taught me that mastery over any skill requires steady perseverance and dedication.  <\/p>\n<p>On the other hand, participating in debate competitions challenges me to think critically and express my ideas with clarity and confidence. Preparing arguments on complex contemporary issues sharpens my analytical skills and encourages me to view problems from multiple perspectives. Standing on stage before a large audience has helped me overcome stage fright and develop strong public speaking skills.  <\/p>\n<p>Together, these extra-curricular pursuits contribute significantly to my overall character development. Music nurtures my emotional intelligence and instills patience, while debating fosters mental agility, confidence, and articulate communication. They have taught me how to balance discipline with creativity and work gracefully both individually and in team settings.  <\/p>\n<p>In conclusion, extra-curricular activities are essential for holistic personal growth. They enrich our school life, build essential life skills, and help us discover our true passions beyond textbooks and examinations.<\/p>"}, {"title": "Article Writing", "html": "<h2>📌 What is an Article?<\/h2>\n<p>An <strong>article<\/strong> is a comprehensive piece of writing published in newspapers or school magazines. In Class IX, an article expects a mature analysis of a topic—usually a social issue, environmental concern, or a teenage-centric problem. It must present a balanced view, including causes, effects, and pragmatic solutions.  <\/p>\n<h2>📝 Format / Structure (Word Limit: 120-150 words)<\/h2>\n<ol>\n<li><strong>Title/Heading<\/strong>: Centered, catchy, and relevant. (Capitalize main words).<\/li>\n<li><strong>Byline<\/strong>: Just below the title on the right (e.g., <em>By Amit, Class IX-A<\/em>).<\/li>\n<li><strong>Paragraph 1 (Introduction - The Hook)<\/strong>: <br />\n   - Start with a striking fact, a quote, or a rhetorical question.<br />\n   - Introduce the topic and its current relevance.<\/li>\n<li><strong>Paragraph 2 (Body - Analysis)<\/strong>: <br />\n   - <strong>Causes<\/strong>: Why is this issue happening?<br />\n   - <strong>Effects<\/strong>: How does it impact society, students, or the environment?<br />\n   - Include statistics or real-life examples to strengthen your point.<\/li>\n<li><strong>Paragraph 3 (Conclusion - The Solution)<\/strong>:<br />\n   - Suggest practical, actionable solutions.<br />\n   - Conclude with a strong, thought-provoking sentence or a call to action.  <\/li>\n<\/ol>\n<h2>⚖️ CBSE Marking Scheme (Typically 5-8 Marks)<\/h2>\n<ul>\n<li><strong>Format (Title + Byline)<\/strong>: 1 Mark<\/li>\n<li><strong>Content (Ideas, logic, relevance)<\/strong>: 3-4 Marks<\/li>\n<li><strong>Expression (Grammatical accuracy, mature vocabulary, cohesion)<\/strong>: 2-3 Marks  <\/li>\n<\/ul>\n<h2>💡 Language Tips &amp; Key Rules<\/h2>\n<ul>\n<li><strong>Formal Tone<\/strong>: Do not use slang, abbreviations, or conversational language.<\/li>\n<li><strong>Linkers / Connectors<\/strong>: Use words like <em>Furthermore, consequently, paradoxically, inevitably, therefore<\/em> to connect your sentences smoothly.<\/li>\n<li><strong>Third Person Perspective<\/strong>: Generally, use the third person (\"It is evident that...\"). You can use \"we\" in the conclusion when calling for collective action.  <\/li>\n<\/ul>\n<h2>⚠️ Common Mistakes to Avoid<\/h2>\n<ul>\n<li>Writing the article without paragraphs. It MUST be broken into Intro, Body, and Conclusion.<\/li>\n<li>Providing problems without suggesting any solutions at the end.<\/li>\n<li>Straying away from the given topic.  <\/li>\n<\/ul>\n<hr />\n<h2>🌟 Model Example<\/h2>\n<p><strong>Q: You are Rohan/Riya. Write an article for your school magazine on the topic: \"The Menace of Cyberbullying Among Teenagers.\"<\/strong>  <\/p>\n<p><strong>The Menace of Cyberbullying Among Teenagers<\/strong><br />\n<em>By Riya<\/em>  <\/p>\n<p>The digital age has brought the world to our fingertips, but it has also unleashed a silent, invisible monster: cyberbullying. With the exponential rise in the use of social media among teenagers, the internet has unfortunately become a breeding ground for harassment and intimidation.  <\/p>\n<p>Unlike traditional bullying, cyberbullying does not stop at the school gates; it follows the victim home. Hiding behind the veil of anonymity, bullies use fake profiles to post derogatory comments, spread malicious rumors, or share embarrassing photographs. The consequences are devastating. Victims often suffer from severe anxiety, depression, and a steep decline in academic performance. In extreme cases, it leads to tragic outcomes like self-harm.  <\/p>\n<p>Eradicating this menace requires a collective effort. Parents and teachers must cultivate an environment where teenagers feel safe discussing their online experiences without fear of losing their internet privileges. Furthermore, schools should conduct regular awareness workshops on cyber ethics. As responsible netizens, teenagers must learn to block and report toxic behavior, ensuring the internet remains a space for learning, not torment.  <\/p>\n<hr />\n<h2>✍️ Practice Prompts<\/h2>\n<ol>\n<li>Write an article on <strong>\"The Importance of Mental Health Awareness in Schools.\"<\/strong> Highlight how academic pressure affects students and what can be done.<\/li>\n<li>Write an article on <strong>\"Water Scarcity: The Looming Crisis.\"<\/strong> Detail the causes and the urgent need for water conservation.<\/li>\n<\/ol>"}], "literature": [{"title": "Poems to know (Q8)", "lines": ["Paper Boats — Rabindranath Tagore", "A Funny Man — Natalie Joan", "Travel — Edna St. Vincent Millay", "My Dear Soldiers — A.P.J. Abdul Kalam"]}, {"title": "Prose chapters to know (Q9)", "lines": []}, {"title": "How extract questions work", "text": "Each extract card shows the poem/prose lines first, then its questions. True/False, MCQ, and identify-the-poet items are all taken from your Q8–Q9 files."}, {"title": "Short & long answers (Q10–Q12)", "text": "These build the full model answer blank by blank — after you check, the correct wording is highlighted. The finished sentence is exactly what an examiner wants to read."}, {"title": "The Day the River Spoke", "html": "<h4>Let us read<\/h4>\n<p><strong>I<\/strong>.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Splashed<\/strong><\/td>\n<td>Fell in drops, making a sound<\/td>\n<\/tr>\n<tr>\n<td><strong>Slithered<\/strong><\/td>\n<td>Moved by sliding from side to side<\/td>\n<\/tr>\n<tr>\n<td><strong>Murmuring<\/strong><\/td>\n<td>Speaking in a low voice<\/td>\n<\/tr>\n<tr>\n<td><strong>Startled<\/strong><\/td>\n<td>Surprised<\/td>\n<\/tr>\n<tr>\n<td><strong>Thicket<\/strong><\/td>\n<td>A dense group of bushes and trees<\/td>\n<\/tr>\n<tr>\n<td><strong>Shrieked<\/strong><\/td>\n<td>Made a high-pitched sound<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A big bright tear <strong>splashed<\/strong> down her nose. And another. A kingfisher swept down, its wings an arrow of blue in the sunlight. And a green lizard <strong>slithered<\/strong> down to the river's edge to bask in the sun.  <\/p>\n<p>\"Dear, dear!\" said a sleepy, <strong>murmuring<\/strong> voice, \"What's the matter?\"  <\/p>\n<p>Jahnavi was <strong>startled<\/strong>, because she was sure she had been quite alone. It couldn't have been the lizard. And the kingfisher was up in the <strong>thicket<\/strong> of bamboo eating the fish it had caught. It couldn't be the parrots, because parrots <strong>shrieked<\/strong> and this was such a sleepy voice. She looked around her. There wasn't a soul in sight. She was rather scared and wanted to run away.  <\/p>\n<p>\"You shouldn't cry, you know,\" the voice went on. \"And you really shouldn't be scared, when you have been coming here to see me every day, well, almost every day.\"  <\/p>\n<p>She was puzzled. It was such a voice, like the river. It couldn't be the river!  <\/p>\n<p>\"Well, tell me all about it,\" said the River, for it was the River. \"I've got to hurry to reach the sea, you know.\"  <\/p>\n<p>\"They won't let me go to school,\" said Jahnavi. \"I asked my mother, 'Why can't I go to school like Ettan and Meena?' And Mother had replied, 'You are too small, baby. Maybe later.'\" But when she was five, little Ramu was born and Mother still said, \"Maybe next year. Jahnavi, mind your little brother while I go to the fields.\" Now, she was nearly ten and minding Little Appu, who was the smallest. \"They don't want me. They only...\"—she stopped with a sob...  <\/p>\n<p>\"I am scared to go to school. And I'm so old now, they'll never let me go. But I want to go. I want to learn to read like Ettan and Meena.\" Jahnavi called her brother 'Ettan'. Ettan means 'Elder brother', but his real name was Gopi. \"I want to know why spiders are yellow in yellow flowers, why bamboo trees rustle, why the moon always comes from behind the hills, never the other way, why the baby fish in the field water become frogs, why...\"  <\/p>\n<p>\"Stop!\" said the River. \"You make me breathless. So many whys! I can tell you where the moon goes,\" the River said conspiratorially. \"It goes down towards the sea. I've seen; it always takes the same way—over the mountains and down to the sea, like me!\"  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>rustle<\/td>\n<td>light sound made by leaves rubbing against each other<\/td>\n<\/tr>\n<tr>\n<td>conspiratorially<\/td>\n<td>secretly<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Let us discuss<\/h4>\n<ol>\n<li>What was Jahnavi's dream? Was it important to her? Why?  <\/li>\n<li>Do you think the river can help her in fulfilling her dream? How?  <\/li>\n<\/ol>\n<p><strong>II<\/strong>.  <\/p>\n<table>\n<thead>\n<tr>\n<th><strong>Word<\/strong><\/th>\n<th><strong>Meaning<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>clump<\/strong><\/td>\n<td>a small group of trees growing together<\/td>\n<\/tr>\n<tr>\n<td><strong>rattling<\/strong><\/td>\n<td>noise made by shaking things<\/td>\n<\/tr>\n<tr>\n<td><strong>catamaran<\/strong><\/td>\n<td>a kind of boat<\/td>\n<\/tr>\n<tr>\n<td><strong>wailed<\/strong><\/td>\n<td>(here) complained in a loud voice<\/td>\n<\/tr>\n<tr>\n<td>\"Even little Ramu goes to school,\" said Jahnavi, \"pity, the school isn't by the sea,\" said the River. \"Then I could take you along, you know. But, I suppose I couldn't really. You'd get your feet wet. And that would never do! I'm afraid there's only one thing you can do.\"<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>\"Can I do something?\" asked Jahnavi. \"Well, it's up to you,\" said the River. \"Seems to me little girls can do as much as little boys—they swim as fast as little boys. You just slip along one morning and sit there in the school and listen to what's going on, and maybe the teacher will let you stay.\"  <\/p>\n<p>\"I couldn't,\" gasped Jahnavi. \"I couldn't! They'd scare me! They'd chase me out.\"  <\/p>\n<p>The River laughed. \"You? Scared?\" the River said, \"when you're not afraid of the green lizard, or of the snake in the bamboo clump, (Jahnavi startled) or the big trains rattling past that bridge.\" \"Trains are noisy; I prefer ships,\" said the River.  <\/p>\n<p>Jahnavi never knew the snake lived in the bamboo clump.  <\/p>\n<p>\"What are ships?\" she asked.  <\/p>\n<p>\"Big boats,\" said the River, \"so big that they can take hundreds of people, and they sail along the sea with lights that shine all night.\"  <\/p>\n<p>Jahnavi held her breath. \"Will they come here?\" she asked.  <\/p>\n<p>\"I'm afraid not,\" said the River. \"Too large, you know. Chandu's catamaran is good enough for me. Chandu can take you to see a ship, someday.\"  <\/p>\n<p>\"They'd never let me!\" wailed Jahnavi.  <\/p>\n<p>\"Try going to school first,\" said the River. \"Remember—it's up to you!\"  <\/p>\n<p>Jahnavi gathered courage. The next day she reached the school, panting and out of breath and stood by the door listening while the teacher read out the lesson. It was a story about a prince called Ašhoka, who became a great king. Little Appu had fallen asleep on her shoulder. She crept nearer and nearer till she was in the back row, squatting with the others on the earthen floor. Little Appu made no noise and she listened.  <\/p>\n<p>\"Where did you spring from, little girl?\" asked the teacher. \"And what is your name? You're new in my class.\"  <\/p>\n<p>\"She's Gopi's sister, Gopi is in the next class,\" said one of the boys. \"It's Jahnavi,\" said another. \"So, you're Gopi's little sister? Nice lad, Gopi.\"  <\/p>\n<p>\"If you really, really want to come to my school, Jahnavi,\" the teacher had said, \"we'll talk to your father about it. Don't you worry. We'll find a way.\"  <\/p>\n<p>Jahnavi saw the teacher walking up the steps to their gate the next evening when she was lighting the lamp. She could see her father scratching his cheek the way he did when he was worried and the teacher was nodding and saying something she couldn't make out. And Mother said, \"Little Jahnavi, I shall miss you when you go to school. Girls should learn as much as they want. When I was your age, I wanted to go to school, but your grandmother said 'No', but now, I am glad the teacher came to talk to your father.\"  <\/p>\n<p>And Jahnavi said, \"Mother, when I grow up, I'll be a teacher and I'll go from house to house in our village and ask all the little girls to come to my school. And I'll teach them all that I'm going to learn.\"  <\/p>\n<p>And she went down the path between the fields the next morning before school began, to meet the River. \"I did it!\" she told the River. \"I was scared, but I did it! And they're letting me go. I'm going to learn to write my name and do sums and find out why our little fishes in the rice fields turn into frogs.\" She heard the river's sleepy chuckle, \"Come again, little girl, and I'll tell you all about the ships that sail the sea.\"  <\/p>\n<p><strong>KAMALA NAIR<\/strong>  <\/p>\n<p>(An extract adapted from <em>The Day the River Spoke<\/em>)  <\/p>\n<h4>Let us think and reflect<\/h4>\n<p><strong>I. Read the extracts given below and answer the questions that follow.<\/strong>  <\/p>\n<ol>\n<li><em>\"You shouldn't cry, you know,\" the voice went on. \"And you really shouldn't be scared, when you have been coming here to see me every day, well, almost every day.\" She was puzzled. It was such a voice, like the river. It couldn't be the river! \"Well, tell me all about it,\" said the River, for it was the River. \"I've got to hurry to reach the sea, you know.\"<\/em>  <\/li>\n<\/ol>\n<p>(i) Complete the sentence with the correct option from those given in the brackets.<br />\n<em>The tone of the River in the given extract is <code>____________<\/code>.<\/em><br />\n<em>(assuring/sympathising)<\/em><br />\n(ii) Select a phrase from the extract which shows that Jahnavi was a frequent visitor to the spot.<br />\n(iii) Choose the correct option to complete the sentence.<br />\n<em>The use of an exclamation mark at the end of the line, 'It couldn't be the river!' expresses <code>____________<\/code>.<\/em><br />\n    A. excitement B. hesitation C. irritation D. disbelief<br />\n(iv) Choose three qualities of the River highlighted in the extract from the words in the box given below.  <\/p>\n<table>\n<thead>\n<tr>\n<th>affectionate<\/th>\n<th>forgiving<\/th>\n<th>thoughtful<\/th>\n<th>impatient<\/th>\n<th>kind-hearted<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol start=\"2\">\n<li><em>\"Can I do something?\" asked Jahnavi. \"Well, it's up to you,\" said the River. \"Seems to me little girls can do as much as little boys—they swim as fast as little boys. You just slip along one morning and sit there in the school and listen to what's going on, and maybe the teacher will let you stay.\"<\/em><br />\n<em>\"I couldn't,\" gasped Jahnavi. \"I couldn't! They'd scare me! They'd chase me out.\"<\/em>  <\/li>\n<\/ol>\n<p>(i) Complete the sentence with an appropriate reason.<br />\n<em>According to the River, there was no difference between girls and boys because <code>___________<\/code>.<\/em><br />\n(ii) Identify whether the following statement is true or false.<br />\n<em>The River encourages Jahnavi to have faith in herself and fulfill her desire to go to school.<\/em><br />\n(iii) Choose the correct option to complete the sentence.<br />\n<em>When the River suggests that Jahnavi should 'slip along', it means that she should move <code>___________<\/code>.<\/em>  <\/p>\n<ul>\n<li>A. quickly  <\/li>\n<li>B. casually  <\/li>\n<li>C. quietly  <\/li>\n<li>D. confidently<br />\n(iv) What does the repetition of the phrase <em>I couldn't<\/em>, tell us?  <\/li>\n<\/ul>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>Why does the writer describe different aspects of nature in great detail at the beginning of the story? Why do you think the writer does this?  <\/li>\n<li>How did the River know so much about Jahnavi?  <\/li>\n<li>Jahnavi says, \"And I'm so old now, they'll never let me go.\" What can you infer about Jahnavi and the school from this line?  <\/li>\n<li>Why did the River laugh when Jahnavi said she would be scared at school?  <\/li>\n<li>Why should Jahnavi follow the River's advice?  <\/li>\n<li>How does the conversation between Jahnavi and the River make the story more appealing?  <\/li>\n<li>What is the main message that the writer intends to convey?  <\/li>\n<\/ol>\n<h4>Let us write<\/h4>\n<p><strong>OBSERVING NATURE<\/strong>  <\/p>\n<p>Take some time to observe the world around you. Over the next few days, pay attention to the colours, shapes, patterns, and textures found in nature. Look closely at the plants, trees, flowers, birds, and even the sky. Make detailed notes of what you observe, focusing on textures, movements, and how light plays with these elements. Record your observations in detail and the features that draw your attention the most—whether it's the soft ripple of water, the vibrant flutter of a butterfly or the colour of the birds or flowers.  <\/p>\n<p>Now, write a descriptive paragraph based on what you've observed. Highlight the colours, shapes, textures, and unique details that made an impression on you.  <\/p>\n<p>Give a title to your paragraph.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Ideas<\/th>\n<th>Prompts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>• What do you observe?<\/td>\n<td>• Every day, I see... • I find it very interesting that...<\/td>\n<\/tr>\n<tr>\n<td>• How do you feel? Why?<\/td>\n<td>• I like... because... • I feel... as...<\/td>\n<\/tr>\n<tr>\n<td>• What is your message to everyone around you?<\/td>\n<td>• I want to tell you that... • My advice to all is...<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h1>Answers – THE DAY THE RIVER SPOKE<\/h1>\n<h2>Let us discuss<\/h2>\n<ol>\n<li>Jahnavi's dream was to go to school and learn to read, write, and find answers to her many curious questions about nature. Yes, it was very important to her because she had a strong desire to learn just like her elder brother and sister, instead of only staying home to look after her younger siblings.  <\/li>\n<li>Yes, the River helped her by giving her courage and good advice. The River told Jahnavi that girls can do as much as boys and encouraged her to quietly go to the school and listen to the teacher, which finally gave her the confidence to take the first step.  <\/li>\n<\/ol>\n<h2>Let us think and reflect<\/h2>\n<h3>I. Read the extracts given below and answer the questions that follow.<\/h3>\n<h4>1.<\/h4>\n<p>(i) assuring<br />\n(ii) \"coming here to see me every day, well, almost every day\"<br />\n(iii) D. disbelief<br />\n(iv) affectionate, thoughtful, kind-hearted  <\/p>\n<h4>2.<\/h4>\n<p>(i) girls can do as much as boys and swim as fast as boys.<br />\n(ii) True<br />\n(iii) C. quietly<br />\n(iv) The repetition of the phrase \"I couldn't\" shows Jahnavi's extreme fear, lack of confidence, and hesitation to go to school.  <\/p>\n<h3>II. Answer the following questions.<\/h3>\n<ol>\n<li>The writer describes different aspects of nature in detail to create a peaceful, vivid background and to show how closely connected Jahnavi is to her surroundings. This sets a calm mood and prepares the reader for the magical moment when the river speaks to her.  <\/li>\n<li>The River knew so much about Jahnavi because she visited the riverbank almost every day, sitting there, crying, and thinking about her life, allowing the River to observe her closely over time.  <\/li>\n<li>We can infer that Jahnavi felt she was past the usual starting age for primary school, as she was nearly ten years old. It also suggests that schools traditionally enrolled younger children, making her feel self-conscious and doubtful about being accepted.  <\/li>\n<li>The River laughed because Jahnavi was brave enough to stay near wild creatures like green lizards and snakes, and loud trains, yet she felt scared of friendly people at school.  <\/li>\n<li>Jahnavi should follow the River's advice because the River gave her wise, encouraging, and practical guidance that helped her overcome her fear and take charge of her own future.  <\/li>\n<li>The conversation makes the story appealing by introducing a magical element of personification, turning a natural feature into a wise friend and making Jahnavi's thoughts and emotions come alive through dialogue.  <\/li>\n<li>The main message is that every child, especially girls, deserves the right to education, and with courage, self-belief, and determination, one can overcome obstacles to fulfill one's dreams.  <\/li>\n<\/ol>\n<h2>Let us write<\/h2>\n<p><strong>The Beauty of the Garden Riverbank<\/strong><br />\nEvery day, I see the gentle stream flowing quietly past the green garden. I find it very interesting that the morning light makes the water sparkle like diamonds, while colourful butterflies flutter softly around bright red hibiscus flowers. I like sitting under the tall neem tree because its cool leaves rustle in the breeze, filling the air with a fresh scent. I feel peaceful and happy as I watch a tiny yellow bird sing merrily on a delicate branch. I want to tell you that nature holds endless wonder if we only take time to pause and look. My advice to all is to protect our green spaces so that every morning remains full of life and beauty.  <\/p>"}, {"title": "Animals, Birds, and Dr. Dolittle", "html": "<h4>Let us read<\/h4>\n<p><strong>I<\/strong>.  <\/p>\n<p>Doctor Dolittle was sitting in his kitchen talking with the Cat's-food-Man who had come to see him with a stomach-ache.  <\/p>\n<p>\"Why don't you give up being a people's doctor, and be an animal doctor?\" asked the Cat's-food-Man.  <\/p>\n<p>The parrot, Polynesia, was sitting in the window looking out at the rain and singing a sailor song to herself. She stopped singing and started to listen.  <\/p>\n<p>Doctor,\" the Cat's-food-Man went on, \"you know all about animals—much more than what these vets here do. That book you wrote—about cats, why, it's wonderful! I can't read or write myself—my wife, Theodosia, is a scholar, and she read your book to me. You might have been a cat yourself. You know the way they think.\"  <\/p>\n<p>When the Cat's-food-Man had gone the parrot flew off the window on to the Doctor's table and said, \"That man's got sense. That's what you ought to do. Be an animal doctor. Give the silly people up—if they haven't brains enough to see you're the best doctor in the world. Take care of animals instead—they'll soon find it out. Be an animal doctor.\"  <\/p>\n<p>\"Oh, there are plenty of animal doctors,\" said John Dolittle, putting the flowerpots outside on the windowsill to get the rain.  <\/p>\n<p>\"Yes, there are plenty,\" said Polynesia. \"But none of them are any good at all. Now listen, Doctor, and I'll tell you something. Did you know that animals can talk?\"  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>scholar<\/strong><\/td>\n<td>a learned person<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>\"I knew that parrots can talk,\" said the Doctor.  <\/p>\n<p>\"Oh, we parrots can talk in two languages—people's language and bird language,\" said Polynesia proudly. \"If I say, 'Polly wants a cracker', you understand me. But hear this: Ka-ka oi-ee, fee-fee?\"  <\/p>\n<p>\"Good Gracious!\" cried the Doctor. \"What does that mean?\"  <\/p>\n<p>\"That means, 'Is the porridge hot yet?'—in bird language.\"  <\/p>\n<p>\"My! You don't say so!\" said the Doctor. \"You never talked that way to me before.\"  <\/p>\n<p>\"What would have been the good?\" said Polynesia, dusting some cracker crumbs off her left wing. \"You wouldn't have understood me if I had.\"  <\/p>\n<p>\"Tell me some more,\" said the Doctor, all excited; and he rushed over to the drawer and came back with a book and a pencil. \"Now don't go too fast—and I'll write it down. This is interesting—very interesting—something quite new. Give me the Birds' A.B.C. first—slowly now.\"  <\/p>\n<p>So that was the way the Doctor came to know that animals had a language of their own and could talk to one another. And all that afternoon, while it was raining, Polynesia sat on the kitchen table giving him bird words to put down in the book.  <\/p>\n<p>At teatime, when the dog, Jip, came in, the parrot said to the Doctor, \"See, he's talking to you.\"  <\/p>\n<p>\"Looks to me as though he were scratching his ear,\" said the Doctor.  <\/p>\n<p>\"But animals don't always speak with their mouths,\" said the parrot in a high voice, raising her eyebrows. \"They talk with their ears, with their feet, with their tails—with everything. Sometimes they don't want to make a noise. Do you see now the way he's twitching up one side of his nose?\"  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>cracker<\/strong><\/td>\n<td>a thin, dry biscuit usually eaten with cheese<\/td>\n<\/tr>\n<tr>\n<td><strong>Birds' A.B.C.<\/strong><\/td>\n<td>(here) the language that birds speak<\/td>\n<\/tr>\n<tr>\n<td>\"What's that mean?\" asked the Doctor.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>\"That means, 'Can't you see that it has stopped raining?'\" Polynesia answered. \"He is asking you a question. Dogs nearly always use their noses for asking questions.\"  <\/p>\n<p>After a while, with the parrot's help, the Doctor got to learn the language of the animals so well that he could talk to them himself and understand everything they said. Then he gave up being a people's doctor altogether.  <\/p>\n<h4>Let us discuss<\/h4>\n<p><strong>I. Complete the following sentence by selecting a suitable reason.<\/strong><br />\n<em>The Cat's-food-Man suggests to Doctor Dolittle that he should become an animal doctor because he believes that Dolittle <code>__________________<\/code><\/em>  <\/p>\n<ol>\n<li>earns less fee by treating human patients  <\/li>\n<li>enjoys the company of animals as they speak less  <\/li>\n<li>dislikes spending time with human patients  <\/li>\n<li>knows more about animals than the local veterinarians<br />\n<strong>II. Fill in the blanks by choosing the suitable option given in the brackets.<\/strong><br />\n<em>Doctor Dolittle reacts to Polynesia's information about animal languages with both excitement and <code>_________<\/code> (certainty/curiosity). He rushes to <code>_________<\/code> (write/memorise) the bird words she provides and is interested in learning more.<\/em><br />\n<strong>III. Do you think Doctor Dolittle would be famous as an animal doctor? If yes, why? If not, why not?<\/strong>  <\/li>\n<\/ol>\n<p><strong>II<\/strong>.  <\/p>\n<p>As soon as the Cat's-food-Man had told everyone that John Dolittle was going to become an animal doctor, old ladies began to bring him their pet pugs and poodles who had eaten too much cake; and farmers came many miles to show him sick cows and sheep.  <\/p>\n<p>One day a plough horse was brought to him; and the poor thing was terribly glad to find a man who could talk in horse language.  <\/p>\n<p>\"You know, Doctor,\" said the horse, \"that vet over the hill knows nothing at all. He has been treating me six weeks now—for something or the other. What I need is spectacles. I am going blind in one eye. There's no reason why horses shouldn't wear glasses, the same as people. But that stupid man over the hill never even looked at my eyes. He kept on giving me big pills. I tried to tell him, but he couldn't understand a word of horse language. What I need is spectacles.\"  <\/p>\n<p>\"Of course—of course,\" said the Doctor. \"I'll get you some at once.\"  <\/p>\n<p>\"I would like a pair like yours,\" said the horse—\"only green. They'll keep the Sun out of my eyes while I'm ploughing the field.\"  <\/p>\n<p>\"Certainly,\" said the Doctor. \"Green ones you shall have.\"  <\/p>\n<p>\"You know, the trouble is, Sir,\" said the plough horse as the Doctor opened the front door to let him out—\"the trouble is that anybody thinks he can doctor animals—just because the animals don't complain. As a matter of fact, it takes a much cleverer man to be a really good animal doctor than it does to be a good people's doctor.\"  <\/p>\n<p>\"Well, well!\" said the Doctor.  <\/p>\n<p>\"When will my glasses be ready?\"  <\/p>\n<p>\"I'll have them for you next week,\" said the Doctor.<br />\n\"Come in again Tuesday—Good morning!\"  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>countryside<\/strong><\/td>\n<td>rural area<\/td>\n<\/tr>\n<tr>\n<td>Then John Dolittle got a fine, big pair of green spectacles; and the plough horse stopped going blind in one eye and could see as well as ever.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>And soon it became a common sight to see farm animals wearing glasses in the countryside, round Puddleby; and a blind horse was a thing unknown.  <\/p>\n<p>And so it was with all the other animals that were brought to him. As soon as they found that he could talk their language, they told him where the pain was and how they felt, and of course it was easy for him to cure them.  <\/p>\n<p>Now all these animals went back and told their brothers and friends that there was a doctor in the little house with the big garden who really was a doctor. And whenever any creatures got sick—not only horses and cows and dogs—but all the little things of the fields, like harvest mice, badgers, and bats, all came at once to his house on the edge of the town, so that his big garden was nearly always crowded with animals trying to get in to see him.  <\/p>\n<p>There were so many that came that he had to have special doors made for the different kinds. He wrote 'HORSES' over the front door, 'COWS' over the side door, and 'SHEEP' on the kitchen door. Each kind of animal had a separate door—even the mice had a tiny tunnel made for them into the cellar, where they waited patiently in rows for the Doctor to come round to them.  <\/p>\n<p>And so, in a few years' time, every living thing for miles and miles got to know about John Dolittle, M.D. And the birds who flew to other countries in the winter told the animals in foreign lands about Dolittle who could understand their talk and help them in their troubles. In this way he became famous among the animals—all over the world. He was happy and liked his life very much.  <\/p>\n<p><strong>HUGH LOFTING<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>cellar<\/strong><\/td>\n<td>a room below ground level often used for storage<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Let us discuss<\/h4>\n<p><strong>I. What became a common sight in Puddleby after Doctor Dolittle started treating animals?<\/strong>  <\/p>\n<ol>\n<li>Humans talking to farm animals  <\/li>\n<li>Farm animals wearing glasses  <\/li>\n<li>Farm animals learning bird language  <\/li>\n<li>Birds riding atop farm animals  <\/li>\n<\/ol>\n<p><strong>II. What challenges do you think Doctor Dolittle might face if more and more animals come to him for help?<\/strong>  <\/p>\n<ol>\n<li>How might he overcome these challenges to ensure that he provides good treatment?  <\/li>\n<\/ol>\n<p><strong>III. Arrange the following events in correct order according to the story. Two have been done for you. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>1. Doctor Dolittle decides to stop being a doctor for people and becomes a doctor for animals.<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2. Animals from near and far come to Doctor Dolittle for help, crowding his garden.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3. A man with a stomach-ache visits Doctor Dolittle and suggests he should treat animals instead of people.<\/td>\n<td>(i)<\/td>\n<\/tr>\n<tr>\n<td>4. Polynesia teaches Doctor Dolittle animal languages, and he starts understanding and communicating with animals.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5. A plough horse with vision problems visits Doctor Dolittle, who prescribes green spectacles, to improve the horse's eyesight.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6. The parrot, Polynesia, encourages Doctor Dolittle to become an animal doctor, revealing that animals can talk.<\/td>\n<td>(ii)<\/td>\n<\/tr>\n<tr>\n<td>7. Doctor Dolittle installs special doors for different animals to enter his house for treatment.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>8. Doctor Dolittle's ability to communicate with animals helps him diagnose and treat their illnesses effectively.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>9. Doctor Dolittle gains fame among animals worldwide, and they come to him from various places for his help.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>10. Word spreads, and people start bringing their sick pets and farm animals to Doctor Dolittle for treatment.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Let us think and reflect<\/h4>\n<p>I Read the extracts given below and answer the questions that follow.  <\/p>\n<ol>\n<li><em>\"If I say, 'Polly wants a cracker', you understand me. But hear this: Ka-ka oi-ee, fee-fee?\"<\/em><br />\n<em>\"Good Gracious!\" cried the Doctor. \"What does that mean?\"<\/em><br />\n<em>\"That means, 'Is the porridge hot yet?'—in bird language.\"<\/em><br />\n<em>\"My! You don't say so!\" said the Doctor. \"You never talked that way to me before.\"<\/em><br />\n<em>\"What would have been the good?\" said Polynesia, dusting some cracker crumbs off her left wing. \"You wouldn't have understood me if I had.\"<\/em>  <\/li>\n<\/ol>\n<p>(i) Complete the sentence by choosing the correct option.<br />\n<em>In the line, \"Good Gracious!\" cried the Doctor, the expression 'Good Gracious' can be replaced by <code>__________<\/code>!<\/em>  <\/p>\n<ul>\n<li>A. bravo  <\/li>\n<li>B. gosh  <\/li>\n<li>C. alas  <\/li>\n<li>\n<p>D. hurray<br />\n(ii) Why had Polynesia never used bird language with the Doctor earlier?<br />\n(iii) Identify whether the following statement is true or false.<br />\n<em>Polynesia had been munching on a food item while talking to Doctor Dolittle.<\/em><br />\n(iv) How did Doctor Dolittle feel according to the extract?  <\/p>\n<\/li>\n<li>\n<p>A. anxious  <\/p>\n<\/li>\n<li>B. surprised  <\/li>\n<li>C. angry  <\/li>\n<li>D. relaxed  <\/li>\n<\/ul>\n<ol start=\"2\">\n<li><em>\"I would like a pair like yours,\" said the horse—\"only green. They'll keep the Sun out of my eyes while I'm ploughing the field.\"<\/em>  <\/li>\n<\/ol>\n<p><em>\"Certainly,\" said the Doctor. \"Green ones you shall have.\"<\/em>  <\/p>\n<p><em>\"You know, the trouble is, Sir,\" said the plough horse as the Doctor opened the front door to let him out—\"the trouble is that anybody thinks he can doctor animals—just because the animals don't complain. As a matter of fact, it takes a much cleverer man to be a really good animal doctor than it does to be a good people's doctor.\"<\/em>  <\/p>\n<p>(i) Choose a word from the extract to complete the analogy.<br />\n<em>digging: flower bed:: <code>__________<\/code>: field<\/em>  <\/p>\n<p>(ii) Choose the correct word to complete the sentence.<br />\n<em>Doctor Dolittle's attitude in the extract is <code>__________<\/code>.<\/em>  <\/p>\n<ul>\n<li>A. respectful  <\/li>\n<li>B. sentimental  <\/li>\n<li>C. understanding  <\/li>\n<li>D. careful  <\/li>\n<\/ul>\n<p>(iii) Complete the sentence with an appropriate reason.<br />\n<em>Based on the extract, we can conclude that doctors take animals for granted because <code>__________<\/code>.<\/em>  <\/p>\n<p>(iv) Do you agree with the concluding sentence of the extract? Why/why not?  <\/p>\n<p><strong>II Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>How can we say that Polynesia was a good trainer of animal language?  <\/li>\n<li>Explain how Doctor Dolittle gave equal and individual attention to each animal who came to him for treatment.  <\/li>\n<li>How does Doctor Dolittle's readiness to follow the parrot's advice highlight the importance of listening to different viewpoints?  <\/li>\n<li>Which qualities of Doctor Dolittle made him famous among the animals? Explain with evidence from the text.  <\/li>\n<li>What changes do you think would happen in the world if people suddenly gained the ability like Doctor Dolittle, to understand and communicate with animals?  <\/li>\n<\/ol>\n<h4>Let us write<\/h4>\n<p>A <strong>notice<\/strong> is a means of formal communication for a particular group of persons. It informs them about some important event, such as an invitation to a meeting, an announcement, to give instructions, make appeals, etc.  <\/p>\n<p>Write a notice in about 50 words about the Annual Health Check-up for students of Grades 6–8. Remind students to collect their health check-up cards from the class teacher. Include all other necessary details about date, time, and venue.  <\/p>\n<p>Complete the draft of the notice by using the words and phrases given in the box below.  <\/p>\n<table>\n<thead>\n<tr>\n<th>inform<\/th>\n<th>queries<\/th>\n<th>health card<\/th>\n<th>health check-up<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>assembly hall<\/td>\n<td><\/td>\n<td>Grades 6–8<\/td>\n<td>please contact<\/td>\n<\/tr>\n<tr>\n<td>Thursday and Friday<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Name of the School<\/em>  <\/p>\n<p><em>NOTICE<\/em>  <\/p>\n<p><em>12 July 20XX<\/em>  <\/p>\n<p><em>Mention Heading<\/em>  <\/p>\n<p><em>This is to <code>______<\/code> all the students of Grades 6–8 about the Annual Health Check-up.<\/em><br />\n<em>Date: <code>______<\/code>, 27 and 28 July 20XX<\/em><br />\n<em>Time: 9:00 a.m. to 12:15 p.m.<\/em><br />\n<em>Venue: <code>______<\/code><\/em><br />\n<em>All students are requested to bring their <code>______<\/code> for the check-up.<\/em><br />\n<em>For <code>______<\/code> or further details <code>______<\/code> the undersigned.<\/em>  <\/p>\n<p><strong><em>Asma<\/em><\/strong><br />\n<em>Asma<\/em><br />\n<em>In-charge<\/em>  <\/p>\n<p><strong>Remember to<\/strong>:  <\/p>\n<ul>\n<li>use formal language in third person.  <\/li>\n<li>mention the reason for writing the notice and any other relevant information. For example, whom to contact, when and where, etc.  <\/li>\n<li>write the notice in a box.  <\/li>\n<\/ul>\n<hr />\n<h1>Answers – ANIMALS, BIRDS, AND DR. DOLITTLE<\/h1>\n<h2>Let us discuss<\/h2>\n<h3>Part I<\/h3>\n<p><strong>I. Complete the following sentence by selecting a suitable reason.<\/strong><br />\nThe Cat's-food-Man suggests to Doctor Dolittle that he should become an animal doctor because he believes that Dolittle <strong>4. knows more about animals than the local veterinarians<\/strong>.  <\/p>\n<p><strong>II. Fill in the blanks by choosing the suitable option given in the brackets.<\/strong><br />\nDoctor Dolittle reacts to Polynesia's information about animal languages with both excitement and <strong>curiosity<\/strong>. He rushes to <strong>write<\/strong> the bird words she provides and is interested in learning more.  <\/p>\n<p><strong>III. Do you think Doctor Dolittle would be famous as an animal doctor? If yes, why? If not, why not?<\/strong><br />\nYes, Doctor Dolittle would be famous as an animal doctor because he can understand animal languages, talk directly to them, find out their exact problems, and treat them effectively.  <\/p>\n<h3>Part II<\/h3>\n<p><strong>I. What became a common sight in Puddleby after Doctor Dolittle started treating animals?<\/strong>  <\/p>\n<ol start=\"2\">\n<li>Farm animals wearing glasses  <\/li>\n<\/ol>\n<p><strong>II. What challenges do you think Doctor Dolittle might face if more and more animals come to him for help?<\/strong><br />\nDoctor Dolittle might face challenges such as an overcrowded house and garden, lack of time to treat every animal quickly, and difficulty in managing
