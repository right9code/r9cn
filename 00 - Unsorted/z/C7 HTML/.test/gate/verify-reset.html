<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 7 English — Annual Exam Revision</title>
<style>
  /* ============ PALETTES ============ */
  [data-scheme="sage"][data-mode="light"] {
    --bg:#F3F6F2; --card:#FFFFFF; --inner:#E8EFE8; --border:#DCE5DB;
    --text:#24312A; --muted:#6E7D72; --accent:#4E8A6E; --accent-strong:#3D6F58; --accent-soft:#DFEDE5;
    --bad:#C25E5E; --bad-soft:#F5E1E1;
    --sec1:#5B7FA6; --sec2:#C99245; --sec3:#4E8A6E; --sec4:#9A7BB0;
  }
  [data-scheme="sage"][data-mode="dark"] {
    --bg:#0E1411; --card:#161D19; --inner:#1D2621; --border:#26302A;
    --text:#E4EAE5; --muted:#8FA094; --accent:#7FBC9B; --accent-strong:#96CDAE; --accent-soft:rgba(127,188,155,0.14);
    --bad:#E08B8B; --bad-soft:rgba(224,139,139,0.14);
    --sec1:#8AAECF; --sec2:#D9B36B; --sec3:#7FBC9B; --sec4:#B79FD0;
  }
  [data-scheme="lavender"][data-mode="light"] {
    --bg:#F5F5FA; --card:#FFFFFF; --inner:#EBEBF5; --border:#DFE0EE;
    --text:#2A2838; --muted:#75738A; --accent:#6675C9; --accent-strong:#525DAE; --accent-soft:#E4E7F8;
    --bad:#C25E6B; --bad-soft:#F5E1E5;
    --sec1:#5B9BB5; --sec2:#C2884E; --sec3:#5FA98A; --sec4:#8A79CC;
  }
  [data-scheme="lavender"][data-mode="dark"] {
    --bg:#111120; --card:#181829; --inner:#202034; --border:#2A2A40;
    --text:#E6E6F0; --muted:#918FA8; --accent:#9BA3F0; --accent-strong:#B3B9F5; --accent-soft:rgba(155,163,240,0.14);
    --bad:#E38B97; --bad-soft:rgba(227,139,151,0.14);
    --sec1:#7FB8CE; --sec2:#D4B37C; --sec3:#85C4A8; --sec4:#AB9FE3;
  }
  [data-scheme="sand"][data-mode="light"] {
    --bg:#F8F4EE; --card:#FFFFFF; --inner:#F0E9DE; --border:#E5DCCE;
    --text:#35302A; --muted:#877E70; --accent:#B07A52; --accent-strong:#96653F; --accent-soft:#F3E7DB;
    --bad:#BC6455; --bad-soft:#F5E5E0;
    --sec1:#6E93AE; --sec2:#B07A52; --sec3:#6FA07E; --sec4:#9780B5;
  }
  [data-scheme="sand"][data-mode="dark"] {
    --bg:#15120E; --card:#1D1914; --inner:#252019; --border:#2F2820;
    --text:#EDE8E0; --muted:#A39887; --accent:#D9A87D; --accent-strong:#E4BC97; --accent-soft:rgba(217,168,125,0.14);
    --bad:#DE9184; --bad-soft:rgba(222,145,132,0.14);
    --sec1:#92B4CB; --sec2:#D9A87D; --sec3:#94C2A4; --sec4:#B4A2CF;
  }

  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { font-size:16px; }
  body { background:var(--bg); color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55; padding-bottom:6rem; transition:background-color .25s,color .25s; }
  .wrap { max-width:480px; margin:0 auto; padding:1rem 1rem 2rem; }
  .pane { display:none; }
  .pane.active { display:block; animation:fade .25s ease; }
  @keyframes fade { from{opacity:0;transform:translateY(5px)} to{opacity:1} }
  button { font-family:inherit; }

  /* header */
  .top { display:flex; align-items:center; gap:.5rem; margin-bottom:1rem; }
  .top h1 { font-size:1.02rem; font-weight:800; flex:1; min-width:0; }
  .ctrl { background:var(--card); border:1.5px solid var(--border); border-radius:12px;
    padding:.4rem .65rem; font-size:.76rem; font-weight:700; cursor:pointer; color:var(--text); white-space:nowrap; }
  .ctrl:active { transform:scale(.94); }

  /* home */
  .hero { background:var(--card); border:1.5px solid var(--border); border-radius:18px; padding:1rem 1.1rem; margin-bottom:1.15rem; }
  .hero h2 { font-size:1.02rem; font-weight:800; }
  .hero p { font-size:.82rem; color:var(--muted); margin-top:.2rem; }
  .path { position:relative; }
  .path-line { position:absolute; left:33px; top:26px; bottom:34px; width:4px; background:var(--inner); border-radius:99px; }
  .node { position:relative; display:flex; gap:1rem; align-items:flex-start; margin-bottom:1.25rem; }
  .node-dot { width:50px; height:50px; border-radius:50%; flex-shrink:0; z-index:2; background:var(--card);
    border:3px solid var(--inner); display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
  .node-body { flex:1; background:var(--card); border:1.5px solid var(--border); border-radius:18px; padding:.85rem 1rem; min-width:0; }
  .node-step { font-size:.64rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .node-name { font-weight:800; font-size:.96rem; margin-top:.1rem; }
  .node-sub { font-size:.74rem; color:var(--muted); margin-top:.15rem; }
  .node-bar { height:7px; background:var(--inner); border-radius:99px; margin-top:.55rem; overflow:hidden; }
  .node-bar-fill { height:100%; border-radius:99px; width:0; transition:width .3s; }
  .node-actions { display:flex; gap:.5rem; margin-top:.65rem; }
  .node-btn { flex:1; padding:.55rem 0; border-radius:11px; border:1.5px solid var(--border);
    background:var(--bg); color:var(--text); font-weight:800; font-size:.8rem; cursor:pointer; }
  .node-btn.practice { background:var(--accent); border-color:var(--accent); color:#fff; }
  .node-btn:active { transform:scale(.97); }
  .finishline { text-align:center; padding:.9rem; background:var(--card); border:2px dashed var(--border);
    border-radius:18px; color:var(--muted); font-weight:700; font-size:.86rem; }
  .reset-all { display:block; width:100%; margin:.8rem 0 0; padding:.6rem; background:none;
    border:1.5px dashed var(--border); color:var(--muted); border-radius:12px;
    font-weight:700; font-size:.78rem; cursor:pointer; }
  .reset-all:active { transform:scale(.98); }

  /* pick */
  .p-head2 { display:flex; align-items:center; gap:.7rem; margin-bottom:1rem; }
  .back { background:var(--card); border:1.5px solid var(--border); border-radius:13px; width:40px; height:40px;
    font-size:1.05rem; cursor:pointer; color:var(--text); font-weight:700; flex-shrink:0; }
  .p-head2 h2 { font-size:1.02rem; font-weight:800; flex:1; min-width:0; }
  .set-card { display:flex; justify-content:space-between; align-items:center; gap:.8rem;
    background:var(--card); border:1.5px solid var(--border); border-radius:15px;
    padding:.85rem 1rem; margin-bottom:.6rem; cursor:pointer; }
  .set-card:active { border-color:var(--accent); }
  .set-name { font-weight:700; font-size:.92rem; }
  .set-sub { font-size:.74rem; color:var(--muted); margin-top:.1rem; }
  .set-stat { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.74rem; color:var(--muted); white-space:nowrap; }
  .reset-btn { background:none; border:1px solid var(--border); color:var(--muted); border-radius:9px;
    width:30px; height:30px; font-size:.85rem; cursor:pointer; flex-shrink:0; }
  .set-body { flex:1; min-width:0; }
  .set-num { width:26px; height:26px; border-radius:8px; flex-shrink:0; background:var(--inner);
    color:var(--muted); font-weight:800; font-size:.74rem; display:flex; align-items:center; justify-content:center; }
  .set-bar { height:5px; background:var(--inner); border-radius:99px; margin-top:.5rem; overflow:hidden; }
  .set-bar-fill { height:100%; border-radius:99px; width:0; transition:width .3s; }
  .pick-group { font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted); margin:1.15rem 0 .55rem; }
  .pick-group:first-child { margin-top:0; }

  /* student name */
  #hero-hi { cursor:pointer; }
  .rename-hint { color:var(--muted); font-size:.78rem; font-weight:600; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:center; justify-content:center; padding:1.2rem; z-index:200; }
  .modal-card { background:var(--card); border:1.5px solid var(--border); border-radius:20px;
    padding:1.5rem 1.25rem 1.3rem; width:100%; max-width:360px; text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.35); }
  .modal-card .m-emoji { font-size:2rem; line-height:1; }
  .modal-card h3 { font-size:1.05rem; font-weight:800; margin:.55rem 0 .3rem; }
  .modal-card p { font-size:.8rem; color:var(--muted); margin-bottom:.95rem; line-height:1.6; }
  .modal-card .text-in { text-align:center; font-size:1rem; font-weight:700; }
  .modal-reset { margin-top:.7rem; width:100%; background:none; border:1px solid var(--border);
    color:var(--muted); border-radius:12px; padding:.6rem; font-weight:700; font-size:.82rem; cursor:pointer; }

  /* practice */
  .pr-top { display:flex; align-items:center; gap:.7rem; margin-bottom:.5rem; }
  .pr-mid { text-align:center; flex:1; min-width:0; }
  .pr-sec { font-size:.64rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
  .pr-count { font-size:.78rem; color:var(--muted); }
  .pr-bar { width:100%; height:8px; background:var(--inner); border-radius:99px; margin:.55rem 0 1rem; overflow:hidden; }
  .pr-bar-fill { height:100%; border-radius:99px; transition:width .3s; }
  .q-card { background:var(--card); border:1.5px solid var(--border); border-radius:18px; padding:1.1rem; }
  .chip { display:inline-block; font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    background:var(--inner); color:var(--muted); padding:.2rem .6rem; border-radius:999px; margin-bottom:.65rem; }
  .passage { background:var(--inner); border-radius:12px; padding:.85rem 1rem; font-size:.87rem;
    color:var(--muted); margin-bottom:.9rem; line-height:1.75; max-height:190px; overflow-y:auto; }
  .passage b { color:var(--text); }
  .ptable-wrap { overflow-x:auto; margin:.55rem 0 .2rem; }
  .passage .ptable { border-collapse:collapse; width:100%; font-size:.76rem; }
  .passage .ptable caption { caption-side:top; text-align:left; font-size:.72rem; font-weight:800;
    color:var(--text); padding-bottom:.32rem; }
  .passage .ptable th, .passage .ptable td { border:1.5px solid var(--border); padding:.32rem .5rem; text-align:left; }
  .passage .ptable th { background:var(--card); color:var(--text); font-weight:800; font-size:.72rem; }
  .passage .ptable td { color:var(--muted); font-weight:600; }
  .q-text { font-size:.97rem; font-weight:700; line-height:1.6; margin-bottom:1rem; }
  .q-text .hint { color:var(--muted); font-weight:500; font-size:.85rem; }

  .opt { display:flex; gap:.7rem; align-items:center; border:1.5px solid var(--border); border-radius:14px;
    padding:.7rem .85rem; margin-bottom:.55rem; cursor:pointer; font-weight:600; font-size:.9rem; min-height:46px; }
  .opt-key { width:27px; height:27px; border-radius:8px; flex-shrink:0; background:var(--inner);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.74rem; color:var(--muted); }
  .opt.right { border-color:var(--accent); background:var(--accent-soft); }
  .opt.right .opt-key { background:var(--accent); color:#fff; }
  .opt.miss { border-color:var(--bad); background:var(--bad-soft); }
  .opt.miss .opt-key { background:var(--bad); color:#fff; }
  .opt.off { opacity:.55; pointer-events:none; }

  .fb { display:none; margin-top:.75rem; border-radius:12px; padding:.7rem .9rem; font-size:.84rem; font-weight:600; line-height:1.55; }
  .fb.win { display:block; background:var(--accent-soft); color:var(--accent-strong); }
  .fb.lose { display:block; background:var(--bad-soft); color:var(--bad); }

  .text-in { width:100%; background:var(--bg); border:1.5px solid var(--border); border-radius:12px;
    padding:.6rem .8rem; font-size:.92rem; color:var(--text); font-family:inherit; margin-bottom:.55rem; outline:none; }
  .text-in:focus { border-color:var(--accent); }
  .text-in.right { border-color:var(--accent); background:var(--accent-soft); }
  .text-in.miss { border-color:var(--bad); background:var(--bad-soft); }
  .text-label { font-size:.8rem; color:var(--muted); margin:.4rem 0 .25rem; display:block; }
  .check-btn { width:100%; margin-top:.6rem; padding:.75rem; border:none; border-radius:13px;
    background:var(--accent); color:#fff; font-weight:800; font-size:.9rem; cursor:pointer; }
  .check-btn:disabled { opacity:.4; }

  /* tiles (fill) */
  .part-row { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:.6rem; font-size:.88rem; }
  .part-label { color:var(--muted); font-size:.8rem; }
  .slot { min-width:110px; min-height:36px; border:1.5px dashed var(--border); border-radius:9px;
    background:var(--bg); padding:.3rem .55rem; font-size:.85rem; cursor:pointer; display:inline-flex; align-items:center; }
  .slot.sel { border-color:var(--accent); border-style:solid; }
  .slot.right { border-color:var(--accent); background:var(--accent-soft); border-style:solid; }
  .slot.miss { border-color:var(--bad); background:var(--bad-soft); border-style:solid; }
  .tiles { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.7rem; }
  .tile { border:1.5px solid var(--border); background:var(--inner); color:var(--text); border-radius:9px;
    padding:.4rem .7rem; font-size:.84rem; font-weight:600; cursor:pointer; }
  .tile.used { opacity:.25; pointer-events:none; }

  /* cloze + builder */
  .c-line { font-size:.95rem; line-height:2.1; }
  .cblank { border:none; border-bottom:2px solid var(--border); background:var(--inner); color:var(--text);
    font-size:.86rem; padding:.15rem .5rem; margin:0 .15rem; border-radius:6px 6px 0 0; cursor:pointer;
    font-family:inherit; min-width:70px; }
  .cblank.sel { border-bottom-color:var(--accent); background:var(--accent-soft); }
  .cblank.right { border-bottom-color:var(--accent); background:var(--accent-soft); }
  .cblank.miss { border-bottom-color:var(--bad); background:var(--bad-soft); }
  .bank { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.8rem; padding-top:.7rem; border-top:1.5px dashed var(--border); }
  .w-ttl { font-weight:800; font-size:1rem; text-align:center; margin-bottom:.3rem; }
  .w-center { text-align:center; }
  .w-label { text-align:center; font-weight:800; letter-spacing:.15em; border:1.5px solid var(--border);
    border-radius:8px; padding:.35rem; margin:.5rem 0; font-size:.9rem; }
  .w-fixed { color:var(--muted); font-size:.84rem; }
  .w-line { margin:.45rem 0; }
  .w-right { text-align:right; }
  .scenario { background:var(--inner); border-radius:12px; padding:.8rem .95rem; font-size:.88rem;
    color:var(--muted); line-height:1.7; margin-bottom:.9rem; }
  .scenario b { color:var(--text); }
  hr.w-hr { border:none; border-top:1.5px dashed var(--border); margin:.7rem 0; }

  /* seq */
  .seq-item { display:flex; align-items:center; gap:.6rem; border:1.5px solid var(--border); border-radius:12px;
    padding:.55rem .7rem; margin-bottom:.5rem; font-size:.86rem; }
  .seq-item.right { border-color:var(--accent); background:var(--accent-soft); }
  .seq-item.miss { border-color:var(--bad); background:var(--bad-soft); }
  .seq-num { font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--muted); font-size:.75rem; font-weight:700; flex-shrink:0; }
  .seq-text { flex:1; }
  .seq-btn { border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:8px;
    width:32px; height:28px; font-size:.9rem; cursor:pointer; line-height:1; flex-shrink:0; }

  /* finish */
  .done-card { text-align:center; padding:1.6rem 1.2rem; }
  .done-card .big { font-size:2.4rem; }
  .done-card h2 { font-size:1.15rem; margin:.4rem 0 .3rem; }
  .done-card p { color:var(--muted); font-size:.87rem; }
  .done-score { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:2rem; font-weight:700; color:var(--accent-strong); margin:.6rem 0; }
  .done-actions { display:flex; gap:.6rem; margin-top:1.1rem; }
  .done-actions button { flex:1; padding:.75rem; border-radius:12px; border:1.5px solid var(--border);
    background:var(--bg); color:var(--text); font-weight:700; font-size:.87rem; cursor:pointer; }
  .done-actions .prime { background:var(--accent); border-color:var(--accent); color:#fff; }

  .nextbar { position:fixed; bottom:0; left:0; right:0; display:none; justify-content:center;
    padding:.8rem 1rem 1.05rem; background:linear-gradient(to top, var(--bg) 70%, transparent); z-index:50; }
  .nextbar.show { display:flex; }
  .big-btn { max-width:440px; width:100%; padding:.92rem; border:none; border-radius:16px;
    background:var(--accent); color:#fff; font-weight:800; font-size:.95rem; cursor:pointer; }
  .big-btn:disabled { opacity:.4; }

  /* notes */
  .note-card { background:var(--card); border:1.5px solid var(--border); border-radius:16px; padding:.95rem 1.05rem; margin-bottom:.75rem; }
  .note-card h3 { font-size:.9rem; font-weight:800; margin-bottom:.35rem; }
  .note-card p, .note-card li { font-size:.84rem; color:var(--muted); line-height:1.7; }
  .note-card ul { margin:.3rem 0 0 1.1rem; }
  .note-card ol { margin:.3rem 0 0 1.3rem; }
  .topic-head { font-weight:800; font-size:.86rem; color:var(--accent-strong); margin-bottom:.2rem; }

  /* rich markdown notes */
  details.note-card { padding:0; overflow:hidden; }
  details.note-card > summary { list-style:none; cursor:pointer; padding:.9rem 1.05rem; font-weight:800; font-size:.9rem;
    display:flex; align-items:center; gap:.55rem; min-height:48px; }
  details.note-card > summary::-webkit-details-marker { display:none; }
  details.note-card > summary::after { content:'▾'; margin-left:auto; color:var(--muted); font-size:.8rem; transition:transform .2s; }
  details.note-card[open] > summary::after { transform:rotate(180deg); }
  details.note-card[open] > summary { border-bottom:1.5px solid var(--border); background:var(--inner); }
  .note-rich { padding:.15rem 1.05rem 1rem; }
  .note-rich h1 { font-size:1rem; font-weight:800; margin:.9rem 0 .4rem; color:var(--accent-strong); }
  .note-rich h2 { font-size:.92rem; font-weight:800; margin:.9rem 0 .35rem; }
  .note-rich h3, .note-rich h4 { font-size:.87rem; font-weight:800; margin:.75rem 0 .3rem; color:var(--accent-strong); }
  .note-rich p { font-size:.84rem; color:var(--muted); line-height:1.75; margin:.4rem 0; }
  .note-rich ul, .note-rich ol { margin:.35rem 0 .5rem 1.15rem; }
  .note-rich li { font-size:.84rem; color:var(--muted); line-height:1.7; margin:.22rem 0; }
  .note-rich li b, .note-rich li strong, .note-rich p b, .note-rich p strong { color:var(--text); }
  .note-rich table { border-collapse:collapse; width:100%; margin:.6rem 0; font-size:.8rem; display:block; overflow-x:auto; }
  .note-rich th, .note-rich td { border:1.5px solid var(--border); padding:.4rem .55rem; text-align:left; color:var(--muted); }
  .note-rich th { background:var(--inner); font-weight:800; color:var(--text); }
  .note-rich pre { background:var(--inner); border:1.5px solid var(--border); border-radius:10px; padding:.7rem .8rem;
    overflow-x:auto; font-size:.68rem; line-height:1.45; margin:.6rem 0; }
  .note-rich code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.78rem; background:var(--inner);
    padding:.05rem .3rem; border-radius:5px; color:var(--text); }
  .note-rich pre code { background:none; padding:0; }
  .note-rich blockquote { border-left:3px solid var(--accent); margin:.6rem 0; padding:.2rem 0 .2rem .7rem; color:var(--muted); font-size:.84rem; }
  .note-rich hr { border:none; border-top:1.5px dashed var(--border); margin:.8rem 0; }
  .note-rich a { color:var(--accent-strong); text-decoration:none; }
</style>
</head>
<body data-scheme="sage" data-mode="light">
<div class="wrap">

  <div class="top">
    <h1 id="head-title">Class 7 · English Revision</h1>
    <button class="ctrl" id="scheme-btn" onclick="cycleScheme()">🎨 Sage</button>
    <button class="ctrl" id="mode-btn" onclick="cycleMode()">🌗 Auto</button>
  </div>

  <div class="pane active" id="v-home">
    <div class="hero">
      <h2 id="hero-hi">Annual exam revision — open &amp; free</h2>
      <p id="hero-sub">Practice one question at a time. Your progress saves on this phone.</p>
      <button class="reset-all" onclick="resetEverything()">↺ Reset everything — name &amp; scores</button>
    </div>
    <div class="path" id="path"></div>
    <div class="finishline">🏁 Exam ready — best of luck!</div>
  </div>

  <div class="pane" id="v-pick">
    <div class="p-head2">
      <button class="back" onclick="goHome()">←</button>
      <h2 id="pick-title">Choose a set</h2>
    </div>
    <div id="pick-list"></div>
  </div>

  <div class="pane" id="v-practice">
    <div class="pr-top">
      <button class="back" onclick="exitPractice()">←</button>
      <div class="pr-mid">
        <div class="pr-sec" id="pr-sec">Section</div>
        <div class="pr-count" id="pr-count">Question 1 of 5</div>
      </div>

 voice, “What’s the matter?”", "Jahnavi was startled, because she was sure she had been quite alone. It couldn’t have been the lizard. And the kingfisher was up in the thicket of bamboo eating the fish it had caught. It couldn’t be the parrots, because parrots shrieked and this was such a sleepy voice. She looked around her. There wasn’t a soul in sight. She was rather scared and wanted to run away."]}, "kind": "mcq", "q": "State whether the following statement is true or false: Jahnavi believed she was alone by the river before she heard the voice.", "options": ["True", "False"], "answer": 0, "why": "“Jahnavi was startled, because she was sure she had been quite alone.” The voice took her by surprise.", "chip": "Extract · MCQ"}, {"passage": {"title": "", "paras": ["A big bright tear splashed down her nose. And another. A kingfisher swept down, its wings an arrow of blue in the sunlight. And a green lizard slithered down to the river’s edge to bask in the sun.", "“Dear, dear!” said a sleepy, murmuring voice, “What’s the matter?”", "Jahnavi was startled, because she was sure she had been quite alone. It couldn’t have been the lizard. And the kingfisher was up in the thicket of bamboo eating the fish it had caught. It couldn’t be the parrots, because parrots shrieked and this was such a sleepy voice. She looked around her. There wasn’t a soul in sight. She was rather scared and wanted to run away."]}, "kind": "mcq", "q": "What swept down over the river, described as “an arrow of blue”?", "options": ["A parrot", "A kingfisher", "A green lizard", "A dragonfly"], "answer": 1, "why": "“A kingfisher swept down, its wings an arrow of blue in the sunlight” — the blue wings are the arrow.", "chip": "Extract · MCQ"}, {"passage": {"title": "", "paras": ["A big bright tear splashed down her nose. And another. A kingfisher swept down, its wings an arrow of blue in the sunlight. And a green lizard slithered down to the river’s edge to bask in the sun.", "“Dear, dear!” said a sleep asure and a success by his own. The story suggests that success is not only money: "}, {"key": "b7", "blank": true}, {"text": " is worth more, even if the people around you laugh at the choice."}], "bank": ["animal medicine", "teaching at a school", "selling medicines to sailors", "ask each creature what is wrong", "guess what is wrong with each creature", "read about animals in books", "happier", "richer", "famous in the town", "work that uses your curiosity and helps others", "work that pays well and keeps you busy", "work that everyone approves of"], "grade": {"b1": "animal medicine", "b3": "ask each creature what is wrong", "b5": "happier", "b7": "work that uses your curiosity and helps others"}, "src": "Animals, Birds, and Dr. Dolittle", "why": null}]}, {"id": "lit-q11-c3", "name": "The Tunnel", "group": "Q11–Q12 · Long Answers", "sub": "1 long-answer question", "units": [{"kind": "cloze", "q": "Sunder Singh calls the tunnel “mine” although the Government owns it. What does this tell us about the pleasure people take in work they care for?", "parts": [{"text": "Sunder Singh calls the tunnel “mine” even though the Government owns it, because he walks through it every night, "}, {"key": "b1", "blank": true}, {"text": ", and keeps it safe for the trains. His words show that "}, {"key": "b3", "blank": true}, {"text": ": it grows from care. Suraj feels this at once, and it is why he stops being afraid of the dark. The same pride appears when the watchman calls "}, {"key": "b5", "blank": true}, {"text": " and says the forest is safer than the town. His work is lonely and poorly paid, but it gives him dignity. The chapter suggests that people who are trusted with responsibility, and who love what they do, "}, {"key": "b7", "blank": true}, {"text": " as much as it belongs to them."}], "bank": ["knows every crack and stone", "has painted it blue", "has never been inside it", "ownership is not only a matter of papers", "the Government should sell the tunnel", "only owners can love a place", "the night mail an old friend", "the night mail a nuisance", "the station master his enemy", "belong to their work", "are owned by their work", "escape from their work"], "grade": {"b1": "knows every crack and stone", "b3": "ownership is not only a matter of papers", "b5": "the night mail an old friend", "b7": "belong to their work"}, "src": "The Tunnel", "why": null}]}, {"id": "lit-q11-c4", "name": "My Brother’s Great Invention", "group": "Q11–Q12 · Long Answers", "sub": "1 long-answer question", "units": [{"kind": "cloze", "q": "Anand’s machines caused more trouble than they solved. Do you think his family should have stopped him? What does the story suggest about encouraging young inventors?", "parts": [{"text": "Anand’s machines caused more trouble than they solved: "}, {"key": "b1", "blank": true}, {"text": ", the water bag caught Boppa, and the house was always full of wires and tools. Even so, the family should not have stopped him. His inventions began with "}, {"key": "b3", "blank": true}, {"text": ", and each failure taught him something about springs, weights and timing. A ban would have taught him only that mistakes are shameful, when mistakes were exactly how he learned. A patient listener was worth more than a tidy room. What he needed was "}, {"key": "b5", "blank": true}, {"text": ", not a ban. The story gently suggests that encouraging a young inventor means "}, {"key": "b7", "blank": true}, {"text": ", some noise and a soaking or two along the way."}], "bank": ["the alarm soaked his father", "the alarm woke the whole colony", "the alarm never rang at all", "a real problem — thefts in the colony", "a wish to trouble his sister", "a school competition", "a safe corner, a few rules and someone to ask him questions", "a locked room and a strict timetable", "new tools and no advice from anyone", "tolerating some mess", "demanding a success every week", "keeping the house perfectly tidy"], "grade": {"b1": "the alarm soaked his father", "b3": "a real problem — thefts in the colony", "b5": "a safe corner, a few rules and someone to ask him questions", "b7": "tolerating some mess"}, "src": "My Brother’s Great Invention", "why": null}]}, {"id": "lit-q11-c5", "name": "North, South, East, West", "group": "Q11–Q12 · Long Answers", "sub": "1 long-answer question", "units": [{"kind": "cloze", "q": "Shaana writes postcards in her own voice, one place at a time. How does that form make the places she visits more interesting than a textbook page would?", "parts": [{"text": "Shaana writes postcards "}, {"key": "b1", "blank": true}, {"text": ", one place at a time, and that is what makes them better than a textbook page. A textbook tells us the height of a glacier; Shaana says she never knew such a place existed, and we feel her surprise. Each card is dated and addressed to a friend, so "}, {"key": "b3", "blank": true}, {"text": ". We also hear what she leaves out: the tiredness, the food she did not enjoy, the friend she misses. The details she notices — clothes, food, the way people speak — are "}, {"key": "b5", "blank": true}, {"text": ". Geography becomes "}, {"key": "b7", "blank": true}, {"text": " rather than a set of facts to memorise."}], "bank": ["in her own excited voice", "in the voice of a teacher", "in the style of a news report", "the journey unfolds like a letter from someone we know", "the journey reads like a timetable", "the trip sounds like a history lesson", "the details a child would notice", "the facts an examiner wants", "the figures a geographer collects", "a story of places seen through curious eyes", "a list of dates and distances", "a warning about travelling"], "grade": {"b1": "in her own excited voice", "b3": "the journey unfolds like a letter from someone we know", "b5": "the details a child would notice", "b7": "a story of places seen through curious eyes"}, "src": "North, South, East, West", "why": null}]}, {"id": "lit-q11-c6", "name": "Paper Boats", "group": "Q11–Q12 · Long Answers", "sub": "1 long-answer question", "units": [{"kind": "cloze", "q": "The child in “Paper Boats” writes his name on each boat and floats it down the stream. What does the poem suggest about hope and the wish to be remembered?", "parts": [{"text": "The child in “Paper Boats” "}, {"key": "b1", "blank": true}, {"text": " on each boat and floats them down the stream. He hopes someone in a strange land will find one and know who sent it. The poem is about hope: the boats may sink, yet he keeps launching them, and "}, {"key": "b3", "blank": true}, {"text": ". The stream, the boats and the clouds are all small things, yet the poem makes them carry a very large feeling. It is also about "}, {"key": "b5", "blank": true}, {"text": ", the small human desire to leave a mark somewhere far away. Tagore turns a game into a quiet prayer that "}, {"key": "b7", "blank": true}, {"text": ". Each boat is a small hello to a stranger."}], "bank": ["writes his name and the name of his village", "writes only the date", "writes a message to his mother", "the big clouds seem to sail with him", "the stream carries them back to him", "the villagers help him build them", "the wish to be remembered", "the wish to win a race", "the fear of deep water", "the world will notice us, and answer kindly", "the world will leave us alone", "the boats will return home safely"], "grade": {"b1": "writes his name and the name of his village", "b3": "the big clouds seem to sail with him", "b5": "the wish to be remembered", "b7": "the world will notice us, and answer kindly"}, "src": "Paper Boats", "why": null}]}, {"id": "lit-q11-c7", "name": "A Funny Man", "group": "Q11–Q12 · Long Answers", "sub": "1 long-answer question", "units": [{"kind": "cloze", "q": "Is the funny man in the poem foolish or wise? Give examples and explain what the poet wants us to feel about him.", "parts": [{"text": "The funny man in the poem is foolish in the everyday sense: he wears "}, {"key": "b1", "blank": true}, {"text": ", puts hats on his feet and offers a bun instead of a rose. Yet the poet does not laugh at him cruelly, and that is the point. He is polite and harmless, and his odd behaviour makes "}, {"key": "b3", "blank": true}, {"text": ". His politeness is the strangest thing about him, and also the most likeable. He is not trying to impress anyone, and that is part of his charm. In a way he is wise, because he is "}, {"key": "b5", "blank": true}, {"text": " and he gives pleasure freely. The speaker’s amused, affectionate tone suggests that "}, {"key": "b7", "blank": true}, {"text": ", and that we should enjoy what we cannot fully understand."}], "bank": ["a shoe on his head", "a hat on his head", "a coat on his shoulders", "a dull street cheerful", "the neighbours angry", "the children frightened", "not afraid of what neighbours think", "sure that everyone admires him", "careful to follow every rule", "harmless silliness is human", "silly people should be pitied", "only clever people are happy"], "grade": {"b1": "a shoe on his head", "b3": "a dull street cheerful", "b5": "not afraid of what neighbours think", "b7": "harmless silliness is human"}, "src": "A Funny Man", "why": null}]}, {"id": "lit-q11-c8", "name": "Travel", "group": "Q11–Q12 · Long Answers", "sub": "1 long-answer question", "units": [{"kind": "cloze", "q": "In “Travel” the speaker watches trains but never boards one. How does the poet make the journey feel exciting even so?", "parts": [{"text": "The speaker in “Travel” never boards a train. She watches from a hill as trains cross the landscape, and the poem makes each journey exciting through sound and colour: "}, {"key": "b1", "blank": true}, {"text": ", the “cinders red on the sky” that turn the night engine into "}, {"key": "b3", "blank": true}, {"text": ". Because she stays still, the trains seem to "}, {"key": "b5", "blank": true}, {"text": " with them. Night after night she returns to the same hill, and the poem never once sounds impatient. The distance is what makes the train beautiful, and she knows it. She does not care where they are going, only that they go. The poem shows that the wish to travel can be as strong as travel itself, and that "}, {"key": "b7", "blank": true}, {"text": "."}], "bank": ["the whistle, the rushing wind", "the chatter of passengers", "the smell of the engine", "a streak of fire", "a grey cloud", "a line of lamps", "carry all her longing", "bring her letters home", "return the same way", "watching can be a kind of journey", "only real journeys matter", "waiting is a waste of time"], "grade": {"b1": "the whistle, the rushing wind", "b3": "a streak of fire", "b5": "carry all her longing", "b7": "watching can be a kind of journey"}, "src": "Travel", "why": null}]}, {"id": "lit-q11-c9", "name": "My Dear Soldiers", "group": "Q11–Q12 · Long Answers", "sub": "1 long-answer question", "units": [{"kind": "cloze", "q": "How does the poet use images of weather and landscape to show what the soldiers endure?", "parts": [{"text": "The poet shows what soldiers endure by placing them in "}, {"key": "b1", "blank": true}, {"text": ". They stay awake while others sleep, “in wind, in snow, in scorching heat”, and they move "}, {"key": "b3", "blank": true}, {"text": ". The list of landscapes makes their duty seem endless, and the phrase “prime of your youth” reminds us that they give "}, {"key": "b5", "blank": true}, {"text": ". There is no boasting in the poem, only a plain account of what is done for us while we are unaware. Its steady rhythm and simple words sound like a soldier’s own voice, calm and uncomplaining. It asks us to notice "}, {"key": "b7", "blank": true}, {"text": ". That watch is repeated night after night, and that is what makes it heroic."}], "bank": ["the worst weather the country has", "a peaceful valley in spring", "a parade ground in the morning", "through mountains, valleys, deserts, marshes, seas and air", "from one city to the next", "only along the northern border", "the best years of their lives", "their holidays and their pay", "a few months of service", "quiet endurance rather than dramatic battles", "bravery only on the battlefield", "the uniforms more than the men"], "grade": {"b1": "the worst weather the country has", "b3": "through mountains, valleys, deserts, marshes, seas and air", "b5": "the best years of their lives", "b7": "quiet endurance rather than dramatic battles"}, "src": "My Dear Soldiers", "why": null}]}, {"id": "lit-q11-c10", "name": "Your literature reader", "group": "Q11–Q12 · Long Answers", "sub": "1 long-answer question", "units": [{"kind": "cloze", "q": "Which poem in your reader speaks most directly to you, and why? Support your answer with lines and details from the poem.", "parts": [{"text": "I would choose “My Dear Soldiers”, because it "}, {"key": "b1", "blank": true}, {"text": " and never becomes a speech. The soldier’s world is drawn in a few firm images — snow, heat, marshes, the night sky — and the repeated idea of "}, {"key": "b3", "blank": true}, {"text": " gives the poem its quiet power. Other poems in the reader are cleverer or funnier, but none is so quietly honest. That, I think, is the test I would apply to any poem I choose. Unlike a story, it has no plot to hide behind, so every line is about "}, {"key": "b5", "blank": true}, {"text": ". Reading it makes me notice the people who guard ordinary mornings for the rest of us, and it reminds me that "}, {"key": "b7", "blank": true}, {"text": "."}], "bank": ["speaks directly to the reader in a calm, grateful voice", "tells an exciting story with a twist", "uses difficult words and long lines", "staying awake", "marching in step", "coming home", "duty and sacrifice", "travel and adventure", "family and friends", "gratitude should be shown in small, steady ways", "soldiers should be praised once a year", "war is the only kind of courage"], "grade": {"b1": "speaks directly to the reader in a calm, grateful voice", "b3": "staying awake", "b5": "duty and sacrifice", "b7": "gratitude should be shown in small, steady ways"}, "src": "Your literature reader", "why": null}]}]}], "notes": {"reading": [{"title": "Passages in Q1", "lines": ["The Garden Called Sukoon", "The School That Opens After Sunset", "Why a City Needs Old Trees", "The Boy Who Kept a Rain Diary", "The Shop of Imperfect Things"]}, {"title": "Passages in Q2", "lines": ["Save Every Drop", "The Reading Challenge", "The Waste Audit", "Cycle to School Week", "Sleep, Screens and School"]}, {"title": "How reading questions work", "text": "Every card shows its passage first (scroll inside the box). MCQs, True/False and one-word answers all come with the line from the passage that justifies the answer — read it after every check."}], "grammar": [{"title": "Nouns", "html": "<p>You have learnt that a noun is a word that names a person, place, animal, action, thing, quality or feeling.  <\/p>\n<p><strong>Kinds of Nouns<\/strong><br />\nNouns are usually classified into four kinds.  <\/p>\n<ul>\n<li>A <strong>proper noun<\/strong> denotes a particular person, place or thing. For example, <strong>Italy, Mount Everest, Mohit, Taj Mahal<\/strong>.  <\/li>\n<li>A <strong>common noun<\/strong> denotes a person, place or thing in general. For example, <strong>city, mountain, boy, monument<\/strong>.  <\/li>\n<li>A <strong>collective noun<\/strong> denotes a collection of people, animals or things. For example, <strong>army, herd, bunch<\/strong>.  <\/li>\n<li>An <strong>abstract noun<\/strong> denotes a quality, an action or a state of being. For example, <strong>wisdom, honesty, wickedness<\/strong>.  <\/li>\n<\/ul>\n<p>There is a fifth kind of noun which names the material of which things are made.  <\/p>\n<p>A <strong>material noun<\/strong> denotes the matter or substance of which things are made. For example, <strong>jute, copper, paper<\/strong>.  <\/p>\n<p><strong>NOTE<\/strong>:<br />\nProper nouns, collective nouns, abstract nouns and material nouns can also be used as common nouns. They are then used in the plural number or have an article placed before them.  <\/p>\n<ul>\n<li><strong>Mother Teresa<\/strong> served the poor of India. (<strong>proper noun<\/strong>)  <ul>\n<li>She is <strong>the Mother Teresa<\/strong> of my country. (common noun)<\/li>\n<\/ul>\n<\/li>\n<li><strong>Death<\/strong> is a great leveller. (abstract noun)  <ul>\n<li>The media reported many <strong>deaths<\/strong>. (common noun)  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>A. Pick out the nouns in the passage and classify them. Place the nouns under the categories given below.<\/strong><br />\nI visited Nainital when I was eight years old. We put up at a hotel by the lake. The beauty of the surrounding hills left a lasting impression on me. I distinctly remember the tiny boats that used to ply tourists and the shops selling delicious pastries. The Indian army had a camp nearby and every evening, officers in smart uniforms could be seen strolling about.<br />\nEvery evening, young ladies draped in saris from Kancheepuram and children wrapped in woollens would come and sit on the benches that lined the lakeside. A batch of students from a nearby residential college was often spotted. My mother purchased a bangle from a silversmith and a few bronze statuettes. The kindness of the local people and the beauty of nature made the trip to Nainital memorable.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Proper<\/th>\n<th>Common<\/th>\n<th>Collective<\/th>\n<th>Abstract<\/th>\n<th>Material<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>You have learnt that abstract nouns can be formed from adjectives and verbs as well as from common nouns by adding suffixes. For example,  <\/p>\n<ul>\n<li>sweet—sweetness (from an <strong>adjective<\/strong>)  <\/li>\n<li>move—movement (from a <strong>verb<\/strong>)  <\/li>\n<li>boy—boyhood (from a <strong>common noun<\/strong>)  <\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nSome other suffixes that are used to form abstract nouns are <strong>-sion<\/strong>, <strong>-al<\/strong>, <strong>-ship<\/strong>, <strong>-dom<\/strong>, <strong>-th<\/strong>, <strong>-tion<\/strong> and <strong>-cy<\/strong>.  <\/p>\n<p><strong>B. Now, form abstract nouns from these words.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Word<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>captain<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>deep<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>idiot<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>bore<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>high<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>false<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>child<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>deceive<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>dismiss<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>cheap<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>king<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>friend<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>You know that a collective noun is used to denote several persons or things regarded as one group. Sometimes, collective nouns can be considered as singular or plural, depending on the context. For example,  <\/p>\n<ul>\n<li>The <strong>jury agrees<\/strong> that the accused is guilty. (Jury acts as a unit here.)  <\/li>\n<li>The <strong>jury disagree<\/strong> that the accused is guilty. (Jury acts as a unit, but the people in the jury are acting as individuals.)  <\/li>\n<\/ul>\n<p><strong>C. What do these collective nouns describe?<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Word<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>pack<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>shoal<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>sheaf<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>bevy<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>gang<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>mob<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>stack<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>suite<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>clump<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>congregation<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>den<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>colony<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>D. Fill in the blanks with suitable collective nouns. Choose from those provided within brackets.<\/strong>  <\/p>\n<ol>\n<li>An <code>____<\/code> of poems by Rilke is on display. (<strong>library, anthology, auction<\/strong>)  <\/li>\n<li>A <code>____<\/code> of policemen entered the premises. (<strong>panel, posse, band<\/strong>)  <\/li>\n<li>The <code>____<\/code> sang beautifully during the Sunday mass at the Church. (<strong>company, coterie, choir<\/strong>)  <\/li>\n<li>The <code>____<\/code> were unwilling to leave port as the ship needed repairs. (<strong>captain, crew, convoy<\/strong>)  <\/li>\n<li>The <code>____<\/code> waited expectantly for the performer to arrive. (<strong>society, audience, horde<\/strong>)  <\/li>\n<li>The <code>____<\/code> of trees at that corner will have to be cut down. (<strong>clutch, clump, truss<\/strong>)  <\/li>\n<li>The <code>____<\/code> gave its verdict and the criminal was sent to jail. (<strong>judge, jury, board<\/strong>)  <\/li>\n<li>A <code>____<\/code> of musicians arrived for the show. (<strong>band, troop, soiree<\/strong>)  <\/li>\n<li>A <code>____<\/code> of robbers attacked them on the highway. (<strong>group, gang, galaxy<\/strong>)  <\/li>\n<li>Place the <code>____<\/code> of eggs in this basket. (<strong>cluster, clutch, brood<\/strong>)  <\/li>\n<\/ol>\n<p><strong>Gender<\/strong>  <\/p>\n<p>Nouns may be in the <strong>masculine<\/strong>, <strong>feminine<\/strong>, <strong>neuter<\/strong> or <strong>common<\/strong> gender.  <\/p>\n<p>A noun is said to be in the <strong>masculine gender<\/strong> if it refers to a male. For example, <strong>man, tiger, uncle<\/strong>.  <\/p>\n<p>A noun is said to be in the <strong>feminine gender<\/strong> if it refers to a female. For example, <strong>woman, tigress, aunt<\/strong>.  <\/p>\n<p>A noun is said to be in the <strong>neuter gender<\/strong> if it refers to things that are neither male nor female. Nouns referring to non-living things are of the neuter gender. For example, <strong>stone, grass, sand<\/strong>.  <\/p>\n<p>A noun is said to be in the <strong>common gender<\/strong> if what it refers to can be a male or a female. For example, <strong>student, orphan, baby<\/strong>.  <\/p>\n<p><strong>NOTE<\/strong>:<br />\nObjects associated with strength and power are sometimes regarded as male. For example, Sun, Death. Objects associated with beauty and gentleness are usually regarded as female. For example, <strong>Nature, Earth<\/strong>.  <\/p>\n<p><strong>E. Identify the gender of the highlighted nouns. In case the noun is masculine or feminine, name its opposite too.<\/strong>  <\/p>\n<ol>\n<li>The <strong>jury<\/strong> declared its verdict and the <strong>criminal<\/strong> was sent to jail.  <\/li>\n<li>The <strong>hunter<\/strong> aimed and shot at a <strong>doe<\/strong> but missed it.  <\/li>\n<li>He is a <strong>businessman<\/strong> while his <strong>wife<\/strong> is a <strong>lawyer<\/strong>.  <\/li>\n<li>The <strong>emperor<\/strong> asked the <strong>lady<\/strong> to speak her mind.  <\/li>\n<li>The <strong>prince<\/strong> arrived with his retinue of <strong>servants<\/strong>.  <\/li>\n<li>My <strong>uncle<\/strong> has come from America with his <strong>wife<\/strong> and a <strong>cousin<\/strong>.  <\/li>\n<li>The <strong>viceroy<\/strong> threw a party in honour of the <strong>duchess<\/strong> who was visiting India with her <strong>child<\/strong>.  <\/li>\n<li>This successful <strong>author<\/strong> is an <strong>orphan<\/strong> who was brought up by his <strong>teacher<\/strong>.  <\/li>\n<li>My <strong>great-aunt<\/strong> waded through soft <strong>mud<\/strong> and got into the boat in which her <strong>husband<\/strong> and her <strong>friend<\/strong> were already seated.  <\/li>\n<li>The <strong>hero<\/strong> of the <strong>film<\/strong> walked up to the <strong>director<\/strong>, who was sitting on the grass, and said that he needed to meet a <strong>friend<\/strong>.  <\/li>\n<\/ol>\n<p><strong>Number<\/strong><br />\nIn English, a noun may either be singular or plural in number.  <\/p>\n<p>When we speak about one person, one animal or one thing, we use the noun in the <strong>singular<\/strong> form. For example, <strong>boy, tiger, box<\/strong>.  <\/p>\n<p>When we speak about two or more people, animals or things, we use the noun in the <strong>plural<\/strong> form. For example, <strong>boys, tigers, boxes<\/strong>.  <\/p>\n<p>Singular nouns can be changed to plural in various ways. Look at this table and revise the rules that you have studied before.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Rule<\/th>\n<th>Singular<\/th>\n<th>Plural<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>By adding -s to the singular form<\/td>\n<td>garden, stone<\/td>\n<td>gardens, stones<\/td>\n<\/tr>\n<tr>\n<td>By adding -es to nouns ending in -x, -ch, -s, -sh<\/td>\n<td>tax, watch, gas, dish<\/td>\n<td>taxes, watches, gases, dishes<\/td>\n<\/tr>\n<tr>\n<td>In nouns ending in -y, by changing -y into -i and adding -es<\/td>\n<td>duty, story<\/td>\n<td>duties, stories<\/td>\n<\/tr>\n<tr>\n<td>In nouns ending in -y but preceded by a vowel, by adding s<\/td>\n<td>day, monkey<\/td>\n<td>days, monkeys<\/td>\n<\/tr>\n<tr>\n<td>In nouns ending in -o preceded by a consonant, by adding -es<\/td>\n<td>mosquito, volcano, hero, buffalo<\/td>\n<td>mosquitoes, volcanoes, heroes, buffaloes<\/td>\n<\/tr>\n<tr>\n<td>In nouns ending in -ie, -oo or -eo and in some words ending in -o preceded by a consonant, by adding -s<\/td>\n<td>tie, cuckoo, video, piano<\/td>\n<td>ties, cuckoos, videos, pianos<\/td>\n<\/tr>\n<tr>\n<td>In nouns ending in -f or -fe, by changing -f or -fe into -v and adding -es<\/td>\n<td>calf, knife<\/td>\n<td>calves, knives<\/td>\n<\/tr>\n<tr>\n<td>In some nouns ending in -f, by adding -s<\/td>\n<td>gulf, roof, cliff<\/td>\n<td>gulfs, roofs, cliffs<\/td>\n<\/tr>\n<tr>\n<td>Some nouns do not follow any of the above rules<\/td>\n<td>hoof, dwarf<\/td>\n<td>hoofs/hooves, dwarfs/dwarves<\/td>\n<\/tr>\n<tr>\n<td>Some nouns have the same singular and plural forms<\/td>\n<td>bison, deer, moose, aircraft<\/td>\n<td>bison, deer, moose, aircraft<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Fill in the blanks with the plural forms of the nouns in the brackets.  <\/p>\n<ol start=\"2\">\n<li>The <code>____<\/code> (<strong>dormouse<\/strong>) scampered off at the sound of <code>____<\/code> (<strong>footstep<\/strong>).  <\/li>\n<li>We were stung by <code>____<\/code> (<strong>mosquito<\/strong>) and <code>____<\/code> (<strong>wasp<\/strong>).  <\/li>\n<li>The <code>____<\/code> (<strong>child<\/strong>) as well as the <code>____<\/code> (<strong>woman<\/strong>) of the <code>____<\/code> (<strong>colony<\/strong>) walked to the mayor's office.  <\/li>\n<li>The <code>____<\/code> (<strong>deer<\/strong>) ran into the forest as they were being chased by <code>____<\/code> (<strong>wolf<\/strong>).  <\/li>\n<li>The <code>____<\/code> (<strong>goose<\/strong>) wandered into the <code>____<\/code> (<strong>pond<\/strong>) where some <code>____<\/code> (<strong>calf<\/strong>) were bathing.  <\/li>\n<li>The <code>____<\/code> (<strong>elf<\/strong>) stitched the <code>____<\/code> (<strong>shoe<\/strong>) in record time.  <\/li>\n<li>The <code>____<\/code> (<strong>footman<\/strong>) ran down the <code>____<\/code> (<strong>stair<\/strong>) to stop the <code>____<\/code> (<strong>carriage<\/strong>).  <\/li>\n<\/ol>\n<p>Now, read some more rules.  <\/p>\n<ul>\n<li>\n<p>Compound nouns generally form their plurals by adding -s to the main noun. For example,  <\/p>\n<ul>\n<li>father-in-law—fathers-in-law<\/li>\n<li>step-daughter—stepdaughters  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>Some words are generally used in the singular form. For example, <strong>poetry, information, furniture, scenery, mathematics, politics, advice, machinery, alms, innings<\/strong>.  <\/p>\n<\/li>\n<li>\n<p>Nouns that describe things having two similar parts are considered to be plural nouns. For example, <strong>jeans, glasses, tongs, socks, trousers, scissors<\/strong>.  <\/p>\n<\/li>\n<li>\n<p>Some nouns denoting a specific quantity or amount are considered to be singular. For example, <strong>three dozen apples, two hundred miles<\/strong>.  <\/p>\n<\/li>\n<li>\n<p>Some words in the English language have been borrowed from Latin. Some nouns of Latin origin that end in <strong>-us<\/strong> form their plurals by adding <strong>-es<\/strong>. For example, <strong>circuses, campuses, viruses<\/strong>.  <\/p>\n<\/li>\n<li>\n<p>In the table below, there are some more Latin words that are used in the English language. Observe the pattern which they follow when changed from singular to plural.  <\/p>\n<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Singular<\/th>\n<th>Plural<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>larva<\/td>\n<td>larvae<\/td>\n<\/tr>\n<tr>\n<td>bacterium<\/td>\n<td>bacteria<\/td>\n<\/tr>\n<tr>\n<td>axis<\/td>\n<td>axes<\/td>\n<\/tr>\n<tr>\n<td>curriculum<\/td>\n<td>curricula<\/td>\n<\/tr>\n<tr>\n<td>criterion<\/td>\n<td>criteria<\/td>\n<\/tr>\n<tr>\n<td>basis<\/td>\n<td>bases<\/td>\n<\/tr>\n<tr>\n<td>alumnus<\/td>\n<td>alumni<\/td>\n<\/tr>\n<tr>\n<td>focus<\/td>\n<td>foci<\/td>\n<\/tr>\n<tr>\n<td>phenomenon<\/td>\n<td>phenomena<\/td>\n<\/tr>\n<tr>\n<td>stimulus<\/td>\n<td>stimuli<\/td>\n<\/tr>\n<tr>\n<td>oasis<\/td>\n<td>oases<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Some Latin nouns have two plural forms, one English and one Latin. For example,  <\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Singular<\/th>\n<th>English plural<\/th>\n<th>Latin plural<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>cactus<\/td>\n<td>cactuses<\/td>\n<td>cacti<\/td>\n<\/tr>\n<tr>\n<td>radius<\/td>\n<td>radiuses<\/td>\n<td>radii<\/td>\n<\/tr>\n<tr>\n<td>hippopotamus<\/td>\n<td>hippopotamuses<\/td>\n<td>hippopotami<\/td>\n<\/tr>\n<tr>\n<td>stadium<\/td>\n<td>stadiums<\/td>\n<td>stadia<\/td>\n<\/tr>\n<tr>\n<td>syllabus<\/td>\n<td>syllabuses<\/td>\n<td>syllabi<\/td>\n<\/tr>\n<tr>\n<td>index<\/td>\n<td>indexes<\/td>\n<td>indices<\/td>\n<\/tr>\n<tr>\n<td>antenna<\/td>\n<td>antennas<\/td>\n<td>antennae<\/td>\n<\/tr>\n<tr>\n<td>millennium<\/td>\n<td>millenniums<\/td>\n<td>millennia<\/td>\n<\/tr>\n<tr>\n<td>gymnasium<\/td>\n<td>gymnasiums<\/td>\n<td>gymnasia<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Some words of French origin too have both English plurals and French plurals. For example,  <\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Singular<\/th>\n<th>English plural<\/th>\n<th>French plural<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>bureau<\/td>\n<td>bureaus<\/td>\n<td>bureaux<\/td>\n<\/tr>\n<tr>\n<td>plateau<\/td>\n<td>plateaus<\/td>\n<td>plateaux<\/td>\n<\/tr>\n<tr>\n<td>chateau<\/td>\n<td>chateaus<\/td>\n<td>chateaux<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>G. Correct the errors in these sentences. Make necessary changes.<\/strong>  <\/p>\n<ol>\n<li>Our planet rotates on its axes.  <\/li>\n<li>I need some advices from you.  <\/li>\n<li>The beggar asked the emperor for alm.  <\/li>\n<li>The Chinese are hardworking peoples.  <\/li>\n<li>Measles are a highly infectious disease.  <\/li>\n<li>The beautiful scenarios was captured by the camera.  <\/li>\n<li>Ten thousands mens marched to the Town Hall.  <\/li>\n<li>A numbers of crisis has crippled the official machineries.  <\/li>\n<li>We need to gather more informations regarding the poetries by Wordsworth.  <\/li>\n<li>The phenomena of day and night occurs because the earth moves around the sun constantly.  <\/li>\n<\/ol>\n<hr />\n<hr />\n<h1>Answers – Nouns<\/h1>\n<p><strong>A. Pick out the nouns in the passage and classify them.<\/strong>  <\/p>\n<ul>\n<li>Proper Nouns: Nainital, Kancheepuram  <\/li>\n<li>Common Nouns: years, hotel, lake, hills, impression, boats, tourists, shops, pastries, evening, officers, uniforms, ladies, saris, children, woollens, benches, lakeside, students, college, mother, bangle, silversmith, statuettes, people, trip  <\/li>\n<li>Collective Nouns: army, batch  <\/li>\n<li>Abstract Nouns: beauty, kindness, nature  <\/li>\n<li>Material Nouns: bronze  <\/li>\n<\/ul>\n<p><strong>B. Form abstract nouns from these words.<\/strong>  <\/p>\n<ol>\n<li>captain – captaincy / captainship  <\/li>\n<li>deep – depth  <\/li>\n<li>idiot – idiocy  <\/li>\n<li>bore – boredom  <\/li>\n<li>high – height  <\/li>\n<li>false – falsehood  <\/li>\n<li>child – childhood  <\/li>\n<li>deceive – deceit / deception  <\/li>\n<li>dismiss – dismissal  <\/li>\n<li>cheap – cheapness  <\/li>\n<li>king – kingdom / kingship  <\/li>\n<li>friend – friendship  <\/li>\n<\/ol>\n<p><strong>C. What do these collective nouns describe?<\/strong>  <\/p>\n<ol>\n<li>pack – wolves / dogs / cards  <\/li>\n<li>shoal – fish  <\/li>\n<li>sheaf – grain / wheat / corn / arrows  <\/li>\n<li>bevy – ladies / girls  <\/li>\n<li>gang – robbers / thieves / labourers  <\/li>\n<li>mob – rioters / angry crowd  <\/li>\n<li>stack – hay / wood / books  <\/li>\n<li>suite – rooms / furniture  <\/li>\n<li>clump – trees / bushes  <\/li>\n<li>congregation – worshippers / churchgoers  <\/li>\n<li>den – thieves / robbers / lions  <\/li>\n<li>colony – ants / termites / bats  <\/li>\n<\/ol>\n<p><strong>D. Fill in the blanks with suitable collective nouns.<\/strong>  <\/p>\n<ol>\n<li>anthology  <\/li>\n<li>posse  <\/li>\n<li>choir  <\/li>\n<li>crew  <\/li>\n<li>audience  <\/li>\n<li>clump  <\/li>\n<li>jury  <\/li>\n<li>band  <\/li>\n<li>gang  <\/li>\n<li>clutch  <\/li>\n<\/ol>\n<p><strong>E. Identify the gender of the highlighted nouns. In case the noun is masculine or feminine, name its opposite too.<\/strong>  <\/p>\n<ol>\n<li>jury – Neuter / Collective gender; criminal – Common gender  <\/li>\n<li>hunter – Masculine gender (Opposite: huntress); doe – Feminine gender (Opposite: buck)  <\/li>\n<li>businessman – Masculine gender (Opposite: businesswoman); wife – Feminine gender (Opposite: husband); lawyer – Common gender  <\/li>\n<li>emperor – Masculine gender (Opposite: empress); lady – Feminine gender (Opposite: gentleman)  <\/li>\n<li>prince – Masculine gender (Opposite: princess); servants – Common gender  <\/li>\n<li>uncle – Masculine gender (Opposite: aunt); wife – Feminine gender (Opposite: husband); cousin – Common gender  <\/li>\n<li>viceroy – Masculine gender (Opposite: vicereine); duchess – Feminine gender (Opposite: duke); child – Common gender  <\/li>\n<li>author – Masculine gender (Opposite: authoress); orphan – Common gender; teacher – Common gender  <\/li>\n<li>great-aunt – Feminine gender (Opposite: great-uncle); mud – Neuter gender; husband – Masculine gender (Opposite: wife); friend – Common gender  <\/li>\n<li>hero – Masculine gender (Opposite: heroine); film – Neuter gender; director – Common gender; friend – Common gender  <\/li>\n<\/ol>\n<p><strong>Plural Forms of Nouns<\/strong>  <\/p>\n<ol start=\"2\">\n<li>dormice, footsteps  <\/li>\n<li>mosquitoes, wasps  <\/li>\n<li>children, women, colonies  <\/li>\n<li>deer, wolves  <\/li>\n<li>geese, ponds, calves  <\/li>\n<li>elves, shoes  <\/li>\n<li>footmen, stairs, carriages  <\/li>\n<\/ol>\n<p><strong>G. Correct the errors in these sentences.<\/strong>  <\/p>\n<ol>\n<li>Our planet rotates on its axis.  <\/li>\n<li>I need some advice from you.  <\/li>\n<li>The beggar asked the emperor for alms.  <\/li>\n<li>The Chinese are hardworking people.  <\/li>\n<li>Measles is a highly infectious disease.  <\/li>\n<li>The beautiful scenery was captured by the camera.  <\/li>\n<li>Ten thousand men marched to the Town Hall.  <\/li>\n<li>A number of crises have crippled the official machinery.  <\/li>\n<li>We need to gather more information regarding the poetry by Wordsworth.  <\/li>\n<li>The phenomenon of day and night occurs because the earth moves around the sun constantly.  <\/li>\n<\/ol>\n<hr />"}, {"title": "Pronouns", "html": "<p>You have learnt that words that take the place of nouns are called <strong>pronouns<\/strong>.  <\/p>\n<p>Pronouns are of different kinds.  <\/p>\n<ul>\n<li>personal pronouns  <\/li>\n<li>possessive pronouns  <\/li>\n<li>demonstrative pronouns  <\/li>\n<li>interrogative pronouns  <\/li>\n<li>reflexive pronouns  <\/li>\n<li>emphasising pronouns  <\/li>\n<li>indefinite pronouns  <\/li>\n<li>distributive pronouns  <\/li>\n<li>relative pronouns  <\/li>\n<\/ul>\n<p><strong>Read this sentence.<\/strong>  <\/p>\n<ul>\n<li>Mohit is an athlete. He practises regularly. The coach likes him.<br />\nIn the above sentence, he and him take the place of Mohit. These pronouns take the place of persons or things.  <\/li>\n<\/ul>\n<p>Pronouns that take the place of people and things are called <strong>personal pronouns<\/strong>.  <\/p>\n<p>We use personal pronouns depending upon—  <\/p>\n<ul>\n<li><strong>number<\/strong>—singular or plural. For example,  <ul>\n<li>The children went to a <strong>party<\/strong>. They enjoyed <strong>it<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li><strong>gender<\/strong>—male, female or neuter. For example,  <ul>\n<li><strong>Mahima<\/strong> is in the pool. <strong>She<\/strong> loves swimming.<\/li>\n<li><strong>Tanish<\/strong> is a good boy. <strong>He<\/strong> always obeys his parents.<\/li>\n<\/ul>\n<\/li>\n<li><strong>person<\/strong>—first person, second person or third person. For example,  <ul>\n<li>I told you not to tell her the secret.<\/li>\n<li>They agreed to meet us at 8 a.m.<\/li>\n<\/ul>\n<\/li>\n<li><strong>case<\/strong>—subject or object. For example,  <ul>\n<li>Gaurav is a good student. He is also good in sports.<\/li>\n<li>Jayant gave me the book.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nThe pronoun, <strong>it<\/strong> is used—  <\/p>\n<ul>\n<li>for non-living things. For example,  <ul>\n<li>Here is your knife. Keep it carefully.<\/li>\n<\/ul>\n<\/li>\n<li>to refer to an earlier statement. For example,  <ul>\n<li>He must leave. He knows it.<\/li>\n<\/ul>\n<\/li>\n<li>to emphasise a noun or pronoun that follows it. For example,  <\/li>\n<li>It was I who promised to help you.  <\/li>\n<\/ul>\n<p>Now, read these sentences.  <\/p>\n<pre><code>- This chair is mine.\n- Those books are theirs.\n<\/code><\/pre>\n<p>The highlighted pronouns show possession or belonging.  <\/p>\n<p>Pronouns that show possession are known as <strong>possessive pronouns<\/strong>.  <\/p>\n<p>Now, read these sentences.  <\/p>\n<ul>\n<li><strong>This<\/strong> is a beautiful dress.  <\/li>\n<li><strong>Those<\/strong> are ripe mangoes.  <\/li>\n<\/ul>\n<p>Pronouns like <strong>this, that, those<\/strong> and <strong>these<\/strong> are used to point out certain objects.  <\/p>\n<p>Pronouns that are used to point out the objects which they refer to are known as <strong>demonstrative pronouns<\/strong>.  <\/p>\n<p>Now, read these sentences.  <\/p>\n<ul>\n<li>What would you like to have—tea or coffee?  <\/li>\n<li>Which is the way to the university?  <\/li>\n<\/ul>\n<p>Pronouns like <strong>what, who<\/strong> and <strong>which<\/strong> are used to ask questions.  <\/p>\n<p>Pronouns that are used to ask questions are called interrogative pronouns.  <\/p>\n<p><strong>NOTE<\/strong>:<br />\n<strong>This<\/strong> and <strong>these<\/strong> are used to refer to things that are close by. <strong>That<\/strong> and <strong>those<\/strong> are used to refer to things that are far away.  <\/p>\n<p><strong>NOTE<\/strong>:<br />\n<strong>Who<\/strong> is used to refer to persons. <strong>Which<\/strong> is used to refer to persons or things. <strong>What<\/strong> is used only for things.  <\/p>\n<p>Read this sentence.  <\/p>\n<ul>\n<li>He hurt himself.  <\/li>\n<li>The cat licked itself.  <\/li>\n<\/ul>\n<p>The highlighted pronouns tell us that the subject is the receiver of the action.  <\/p>\n<p>The highlighted pronouns are called <strong>reflexive pronouns<\/strong> because the action of the subject reflects upon the subject itself.  <\/p>\n<p><strong>NOTE<\/strong>:<br />\nThe reflexive pronoun is used when the subject and the object of the verb refer to the same person or thing.<br />\nA reflexive pronoun can never be the subject of a sentence.  <\/p>\n<ul>\n<li>My sister and myself went to Kolkata. (incorrect)  <\/li>\n<li>My sister and I went to Kolkata. (correct)  <\/li>\n<\/ul>\n<p>Now, read these sentences.  <\/p>\n<ul>\n<li>He himself should finish the work.  <\/li>\n<li>I myself closed the door.<br />\nThe highlighted pronouns are used for emphasis.  <\/li>\n<\/ul>\n<p>Pronouns that are used for the sake of emphasis are called <strong>emphasising pronouns<\/strong>.  <\/p>\n<p><strong>A. Fill in the blanks with pronouns that refer to the highlighted word/group of words.<\/strong>  <\/p>\n<ol>\n<li>The man left behind two <strong>jackets<\/strong>. Where are <code>____<\/code>?  <\/li>\n<li><strong>Mr Rahim<\/strong> is my teacher. <code>____<\/code> teaches us geography.  <\/li>\n<li><strong>The kittens<\/strong> are playing in the sun. <code>____<\/code> are three months old.  <\/li>\n<li><strong>Mr Biswas<\/strong>, how are <code>____<\/code> feeling this morning?  <\/li>\n<li><strong>I<\/strong> will meet <strong>you<\/strong> at the station. <code>____<\/code> can discuss the matter there.  <\/li>\n<li><strong>Jamal<\/strong> will be attending the conference by <code>____<\/code>.  <\/li>\n<li>Here is your <strong>axe<\/strong>. Keep <code>____<\/code> carefully.  <\/li>\n<li><strong>Mr Das<\/strong> is our accountant. You could consult <code>____<\/code>.  <\/li>\n<\/ol>\n<p><strong>B. Tick the correct option and mark whether the pronoun you have chosen is a reflexive pronoun (RP) or an emphasising pronoun (EP).<\/strong>  <\/p>\n<ol>\n<li>Jaya <strong>himself/herself/yourself<\/strong> locked the door.  <\/li>\n<li>Did you do the homework <strong>yourself/herself/ourselves<\/strong>?  <\/li>\n<li>I <strong>yourself/myself/themselves<\/strong> made the reservations.  <\/li>\n<li>I cut my hair <strong>ourselves/myself/themselves<\/strong>.  <\/li>\n<li>She looked at <strong>itself/herself/themselves<\/strong> in the mirror.  <\/li>\n<li>You express <strong>himself/herself/yourself<\/strong> very well.  <\/li>\n<li>They <strong>themselves/ourselves/yourself<\/strong> started the fight first.  <\/li>\n<li>Roshni doesn't care about anyone. She only thinks about <strong>himself/herself/themselves<\/strong>.  <\/li>\n<\/ol>\n<p>Now, read these sentences.  <\/p>\n<ul>\n<li>Somebody has left the door open.  <\/li>\n<li>Few escaped punishment that morning.<br />\nThese highlighted pronouns do not refer to any specific person or thing.  <\/li>\n<\/ul>\n<p>Pronouns that refer to some person or thing in a general way and do not refer to any person in particular are called <strong>indefinite pronouns<\/strong>.  <\/p>\n<p>The other indefinite pronouns are—all, another, any, anybody, anyone, anything, each, everybody, everyone, everything, few, many, nobody, none, one, several, some, somebody, someone.  <\/p>\n<p><strong>NOTE<\/strong>:<br />\nThe indefinite pronoun one, if used in a sentence should be used throughout.  <\/p>\n<ul>\n<li><strong>One<\/strong> must never abandon one's duties.  <\/li>\n<\/ul>\n<p><strong>C. There are errors in each of these sentences. Rewrite the sentences correctly.<\/strong>  <\/p>\n<ol>\n<li>They blamed themselves.  <\/li>\n<li>I am shorter than him.  <\/li>\n<li>Which is the news that you bring?  <\/li>\n<li>It was him who should have protested.  <\/li>\n<li>I and Ram have been chosen to lead the team.  <\/li>\n<li>Which is the purpose of this plan?  <\/li>\n<li>She and me are to blame for this mess.  <\/li>\n<li>The members of the jury was divided in its opinion.  <\/li>\n<li>Between you and I, there is no truth in this.  <\/li>\n<li>One must be careful about what he says.  <\/li>\n<li>Anybody was there to save the drowning child.  <\/li>\n<li>My uncle asked my sister and I to accompany him.  <\/li>\n<li>My aunt and myself decided to see a film.  <\/li>\n<li>Any of the children are ready to participate in the programme tomorrow.  <\/li>\n<li>Our players were better prepared than that of China.  <\/li>\n<li>The money has been stolen by anybody who entered the room when we were away.  <\/li>\n<\/ol>\n<p>Now, read these sentences.  <\/p>\n<ul>\n<li><strong>Each<\/strong> of us must contribute generously.  <\/li>\n<li><strong>Either<\/strong> of you can take down the notes.  <\/li>\n<li><strong>Neither<\/strong> of them attended the ceremony.  <\/li>\n<li><strong>Either<\/strong> of the two students may be sent to the competition.  <\/li>\n<li><strong>Neither<\/strong> of the coats is suitable for the occasion.  <\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\n<strong>Either<\/strong> and neither can be used only when speaking about two persons or things. Either means one or the other of two. <strong>Neither<\/strong> means not one nor the other of two.  <\/p>\n<p>The pronouns each, either and neither refer to persons or things one at a time.<br />\nPronouns that refer to nouns one at a time are called <strong>distributive pronouns<\/strong>.<br />\nDistributive pronouns are always in the singular and take singular verbs.  <\/p>\n<p>Now, read this sentence.  <\/p>\n<ul>\n<li>The boy <strong>who<\/strong> you were talking to is the captain of the cricket team.  <\/li>\n<\/ul>\n<p>In this sentence, <strong>who<\/strong> is <strong>a relative pronoun<\/strong> that refers to the noun boy that comes before. The noun is thus the <strong>antecedent<\/strong> of the pronoun. The relative pronoun should ideally be placed close to its antecedent in the sentence.  <\/p>\n<p><strong>NOTE<\/strong>:<br />\nGenerally, <strong>who<\/strong> is used while referring to people, <strong>which<\/strong> for non-living things or animals and <strong>that<\/strong> is used for people and things. As the relative pronoun refers to a noun or a pronoun, it must be of the same number and person as its antecedent. It is the verb that shows the number and person of the relative pronoun.<br />\nSometimes the relative pronoun is omitted. For example,  <\/p>\n<ul>\n<li>This is the house (<strong>that<\/strong>) my grandfather built.  <\/li>\n<\/ul>\n<p><strong>D. Fill in the blanks with an appropriate distributive or relative pronoun.<\/strong>  <\/p>\n<ol>\n<li><code>____<\/code> of the girls was given a certificate.  <\/li>\n<li>This is the best film <code>____<\/code> he ever made.  <\/li>\n<li>This is the man <code>____<\/code> has three sons in the army.  <\/li>\n<li>The crowd <code>____<\/code> had gathered near the market, grew restive.  <\/li>\n<li>They <code>____<\/code> are gifted do well in life.  <\/li>\n<li>The boy <code>____<\/code> was elected captain of the team has resigned.  <\/li>\n<li><code>____<\/code> of the roads will be empty now.  <\/li>\n<li>The tornado <code>____<\/code> struck the town destroyed several houses.  <\/li>\n<li>I hate people <code>____<\/code> throw stones at dogs.  <\/li>\n<li>These are the boys <code>____<\/code> were called to his office.  <\/li>\n<li>The good <code>____<\/code> men do, lives after them.  <\/li>\n<li>The answer <code>____<\/code> I gave is incorrect.  <\/li>\n<li><code>____<\/code> of the programmes may be chosen.  <\/li>\n<li>This is the teacher about <code>____<\/code> we were speaking.  <\/li>\n<\/ol>\n<p><strong>E. Join these sets of sentences with relative pronouns. One is done for you.<\/strong>  <\/p>\n<ol>\n<li>The boy arrived late. He was scolded by his teacher. The boy who arrived late was scolded by his teacher.  <\/li>\n<li>The tiger was pursuing a buck. The buck was injured.  <\/li>\n<li>Bring me the purse. It is on the bed.  <\/li>\n<li>This is the prize. He won it for his essay.  <\/li>\n<li>This is the man. We were saved by his presence of mind.  <\/li>\n<li>Unfortunately, I missed the bus. It was to take me to Shimla.  <\/li>\n<li>Here is the surgeon. He will operate on my friend tomorrow.  <\/li>\n<li>Let us visit the old market. It was set up by the British.  <\/li>\n<\/ol>\n<hr />\n<hr />\n<h1>Answers – Pronouns<\/h1>\n<p><strong>A. Fill in the blanks with pronouns that refer to the highlighted word/group of words.<\/strong>  <\/p>\n<ol>\n<li>them  <\/li>\n<li>He  <\/li>\n<li>They  <\/li>\n<li>you  <\/li>\n<li>We  <\/li>\n<li>himself  <\/li>\n<li>it  <\/li>\n<li>him  <\/li>\n<\/ol>\n<p><strong>B. Tick the correct option and mark whether the pronoun you have chosen is a reflexive pronoun (RP) or an emphasising pronoun (EP).<\/strong>  <\/p>\n<ol>\n<li>herself – Emphasising pronoun (EP)  <\/li>\n<li>yourself – Reflexive pronoun (RP)  <\/li>\n<li>myself – Emphasising pronoun (EP)  <\/li>\n<li>myself – Reflexive pronoun (RP)  <\/li>\n<li>herself – Reflexive pronoun (RP)  <\/li>\n<li>yourself – Reflexive pronoun (RP)  <\/li>\n<li>themselves – Emphasising pronoun (EP)  <\/li>\n<li>herself – Reflexive pronoun (RP)  <\/li>\n<\/ol>\n<p><strong>C. There are errors in each of these sentences. Rewrite the sentences correctly.<\/strong>  <\/p>\n<ol>\n<li>They blamed each other.  <\/li>\n<li>I am shorter than he.  <\/li>\n<li>What is the news that you bring?  <\/li>\n<li>It was he who should have protested.  <\/li>\n<li>Ram and I have been chosen to lead the team.  <\/li>\n<li>What is the purpose of this plan?  <\/li>\n<li>She and I are to blame for this mess.  <\/li>\n<li>The members of the jury were divided in their opinion.  <\/li>\n<li>Between you and me, there is no truth in this.  <\/li>\n<li>One must be careful about what one says.  <\/li>\n<li>Nobody was there to save the drowning child.  <\/li>\n<li>My uncle asked my sister and me to accompany him.  <\/li>\n<li>My aunt and I decided to see a film.  <\/li>\n<li>Each of the children is ready to participate in the programme tomorrow.  <\/li>\n<li>Our players were better prepared than those of China.  <\/li>\n<li>The money has been stolen by somebody who entered the room when we were away.  <\/li>\n<\/ol>\n<p><strong>D. Fill in the blanks with an appropriate distributive or relative pronoun.<\/strong>  <\/p>\n<ol>\n<li>Each  <\/li>\n<li>that  <\/li>\n<li>who  <\/li>\n<li>which  <\/li>\n<li>who  <\/li>\n<li>who  <\/li>\n<li>Either  <\/li>\n<li>which  <\/li>\n<li>who  <\/li>\n<li>who  <\/li>\n<li>that  <\/li>\n<li>that  <\/li>\n<li>Either  <\/li>\n<li>whom  <\/li>\n<\/ol>\n<p><strong>E. Join these sets of sentences with relative pronouns.<\/strong>  <\/p>\n<ol>\n<li>The boy who arrived late was scolded by his teacher.  <\/li>\n<li>The tiger was pursuing a buck which was injured.  <\/li>\n<li>Bring me the purse which is on the bed.  <\/li>\n<li>This is the prize which he won for his essay.  <\/li>\n<li>This is the man by whose presence of mind we were saved.  <\/li>\n<li>Unfortunately, I missed the bus which was to take me to Shimla.  <\/li>\n<li>Here is the surgeon who will operate on my friend tomorrow.  <\/li>\n<li>Let us visit the old market which was set up by the British.  <\/li>\n<\/ol>\n<hr />"}, {"title": "Adjectives", "html": "<p>Words that are used to describe a noun or a pronoun are called <strong>adjectives<\/strong>. Adjectives help us to know more about nouns and pronouns by expressing their qualities.  <\/p>\n<p><strong>Kinds of Adjectives<\/strong><br />\nThere are six kinds of adjectives. They are—  <\/p>\n<ul>\n<li>adjectives of quality  <\/li>\n<li>adjectives of quantity  <\/li>\n<li>adjectives of number  <\/li>\n<li>demonstrative adjectives  <\/li>\n<li>interrogative adjectives  <\/li>\n<li>emphasising adjectives  <\/li>\n<\/ul>\n<p>Read these sentences.  <\/p>\n<ul>\n<li>He is a <strong>brave<\/strong> soldier.  <\/li>\n<li>Mana is a <strong>kind<\/strong> girl.  <\/li>\n<\/ul>\n<p>The highlighted adjectives tell us <strong>what kind<\/strong> of noun is being spoken about.  <\/p>\n<p><strong>Adjectives of quality<\/strong> express the kind or quality of a person or a thing.  <\/p>\n<p>Now, read these sentences.  <\/p>\n<ul>\n<li>I need some money to buy stationery.  <\/li>\n<li>There is not much ink in the bottle.  <\/li>\n<\/ul>\n<p>The highlighted adjectives tell us what kind <strong>how much<\/strong> of a thing is meant.  <\/p>\n<p><strong>Adjectives of quantity<\/strong> tell us how much of a thing is meant.  <\/p>\n<p>Look at these sentences.  <\/p>\n<ul>\n<li>This box contains ten apples.  <\/li>\n<li>Today is the last day of the festival.<br />\nThe highlighted adjectives answer the question <strong>how many<\/strong> or in <strong>what order<\/strong>.  <\/li>\n<\/ul>\n<p><strong>Adjectives of number<\/strong> tell us how many people or things are meant or in what order a person or a thing stands.  <\/p>\n<p>Adjectives of number are of three kinds.  <\/p>\n<ul>\n<li><strong>Definite numeral adjectives<\/strong> tell us the exact number of people or things. They are of two kinds—  <ul>\n<li><strong>cardinals<\/strong> state the number of people or things. For example, forty thieves, twenty-five years.<\/li>\n<li><strong>ordinals<\/strong> give the order of people or things in a series. For example, first man on the moon, last day of the week.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Indefinite numeral adjectives<\/strong> do not indicate the exact number. For example, few children, many people.  <\/li>\n<li><strong>Distributive numeral adjectives<\/strong> refer to each one of a number.  <ul>\n<li><strong>Every<\/strong> person must attend the meeting.<\/li>\n<li><strong>Each<\/strong> girl should participate in the competition.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nSome adjectives can be classified as adjectives of number as well as adjectives of quantity depending on their usage in a sentence. Look at the examples given below.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Adjective of quantity<\/th>\n<th>Adjective of number<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>He has lost all his money.<\/td>\n<td>All participants must submit a letter.<\/td>\n<\/tr>\n<tr>\n<td>He did not drink any water.<\/td>\n<td>Are there any charts in the book?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Look at these sentences.  <\/p>\n<ul>\n<li>This book is expensive.  <\/li>\n<li>These apples are from Himachal Pradesh.  <\/li>\n<\/ul>\n<p><strong>Demonstrative adjectives<\/strong> point out which person or thing is meant.  <\/p>\n<p>Now, read these sentences.  <\/p>\n<ul>\n<li>Which pen do you want to buy?  <\/li>\n<li>Whose house is that?<br />\nThe highlighted adjectives are used to ask questions about the nouns that follow them.  <\/li>\n<\/ul>\n<p>Words like <strong>what, which<\/strong> and <strong>whose<\/strong> when used with nouns to ask questions are called <strong>interrogative adjectives<\/strong>.  <\/p>\n<p>Take a look at these sentences.  <\/p>\n<ul>\n<li>The campaign was a complete success.  <\/li>\n<li>This is the very dress that I wanted to buy.<br />\nThe highlighted adjectives are used to lay emphasis on the nouns that follow.  <\/li>\n<\/ul>\n<p>The adjectives that we use to emphasise what we want to say are called <strong>emphasising adjectives<\/strong>.  <\/p>\n<p><strong>NOTE<\/strong>:  <\/p>\n<ul>\n<li><strong>Some<\/strong> and <strong>any<\/strong> are used in affirmative and negative sentences, respectively. For example,  <ul>\n<li>I have bought <strong>some<\/strong> pens.<\/li>\n<li>I have not purchased <strong>any<\/strong> pens.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Little<\/strong> is used with uncountable nouns and <strong>few<\/strong> with countable nouns. For example,  <ul>\n<li>There is <strong>little<\/strong> hope of recovery.<\/li>\n<li>There were a <strong>few<\/strong> chairs scattered around the room.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Few<\/strong> means not many, while <strong>a few<\/strong> means some. For example,  <ul>\n<li>Sometimes, <strong>a few<\/strong> birds perch on this tree.<\/li>\n<li><strong>Few<\/strong> students were at school today
