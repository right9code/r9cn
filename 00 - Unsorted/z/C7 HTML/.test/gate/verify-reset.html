>to fetch<\/strong> milk.<br />\nThere are three kinds of non-finite verbs—infinitives, participles and gerunds. Let us learn about them in detail.  <\/li>\n<\/ul>\n<p><strong>Infinitives<\/strong>  <\/p>\n<p>Read these sentences.  <\/p>\n<ul>\n<li>I <strong>want to buy<\/strong> some perfume.  <\/li>\n<li>Indira <strong>wants to buy<\/strong> some clothes.<br />\nIn these sentences, the verb <strong>want<\/strong> is the <strong>finite verb<\/strong> and <strong>to buy<\/strong> is the <strong>infinitive<\/strong>.  <\/li>\n<\/ul>\n<p><strong>Intuitives<\/strong> are also called the <strong>to-verb<\/strong> because to is usually a part of the infinitive form. Let us learn about some of the functions of infinitives.  <\/p>\n<ul>\n<li>\n<p>Infinitives can function as the subject or the object of a sentence.  <\/p>\n<ul>\n<li>I want <strong>to bathe<\/strong>. <strong>(object)<\/strong><\/li>\n<li><strong>To delay<\/strong> is bad. <strong>(subject)<\/strong>  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>The infinitive can be the object of the verb and also modified by an adverb.  <\/p>\n<ul>\n<li>Many men prefer to work slowly.  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>An infinitive can also qualify an adjective or a noun.  <\/p>\n<ul>\n<li>Apples are sweet to eat.<\/li>\n<li>This is not the time to sleep.<br />\n<strong>NOTE<\/strong>:<br />\nInfinitives are useful when—  <\/li>\n<\/ul>\n<\/li>\n<li>\n<p>we wish to state an aim or purpose.  <\/p>\n<ul>\n<li>He called <strong>to apologise<\/strong>.<\/li>\n<li>He wanted <strong>to buy<\/strong> milk.<\/li>\n<li>They agreed <strong>to help<\/strong> us.<\/li>\n<\/ul>\n<\/li>\n<li>when we wish to indicate result.  <ul>\n<li>She lived <strong>to see<\/strong> the outcome.<\/li>\n<li>The news proved <strong>to be<\/strong> true.<\/li>\n<\/ul>\n<\/li>\n<li>Infinitives can also be the object of a preposition.  <ul>\n<li>The teacher is about <strong>to start<\/strong>.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p>Take a look at these sentences.  <\/p>\n<ul>\n<li><strong>To steal<\/strong> is a sin.  <\/li>\n<li>\n<p><strong>To eat<\/strong> too much is harmful.<br />\nThese sentences are grammatically correct, but sound strange. Now, read these sentences.  <\/p>\n<\/li>\n<li>\n<p>It is a sin <strong>to steal<\/strong>.  <\/p>\n<\/li>\n<li>It is harmful <strong>to eat<\/strong> too much.<br />\nIt is better to use it as the subject and the infinitive as the object in such sentences.  <\/li>\n<\/ul>\n<p>When the <strong>to+verb<\/strong> form is used in a sentence and functions as a noun, it is called the <strong>infinitive<\/strong>.  <\/p>\n<p>We usually use <strong>to<\/strong> with the infinitive. However it is not essential. When an infinitive is used without <strong>to<\/strong> it is called a bare infinitive.  <\/p>\n<ul>\n<li>We do not use to when we use infinitives with auxiliary verbs like <strong>must, can, should, shall, will, may, might<\/strong> and <strong>do<\/strong>. For example,  <ul>\n<li>I must <strong>go<\/strong> home now.<\/li>\n<li>They might <strong>leave<\/strong> for Dehradun next week.<\/li>\n<\/ul>\n<\/li>\n<li>We do not use to with the infinitive after verbs of perception like <strong>see, hear, watch, know<\/strong> and <strong>feel<\/strong>. For example,  <ul>\n<li>I saw Leena <strong>leave<\/strong> the house.<\/li>\n<li>I <strong>felt<\/strong> an ant crawl up my leg.<\/li>\n<\/ul>\n<\/li>\n<li>We do not use to when we use infinitives after verbs like <strong>make, let, dare<\/strong> or <strong>need<\/strong>. For example,  <ul>\n<li>I <strong>made<\/strong> him <em>speak<\/em>.<\/li>\n<li><strong>Let<\/strong> me <em>try<\/em> this.<\/li>\n<li>How <strong>dare<\/strong> you <em>touch<\/em> my books?<\/li>\n<li>You <strong>need<\/strong> not <strong>solve<\/strong> these problems.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nWith verbs like need and dare, note that we use the infinitive with to in affirmative sentences.<br />\nLook at these sentences.  <\/p>\n<ul>\n<li>He <strong>dared<\/strong> to dream, and achieved his ambition.  <\/li>\n<li>I need to visit the doctor soon.  <\/li>\n<\/ul>\n<p><strong>A. Fill in the blanks with the infinitive forms of the verbs in the brackets, with or without to as the case may be.<\/strong>  <\/p>\n<ol>\n<li>Let us <code>__EAT__<\/code>. <strong>(eat)<\/strong>  <\/li>\n<li>I am sorry <code>__to LEaRN__<\/code> this. <strong>(learn)<\/strong>  <\/li>\n<li>I hope <code>__TO WIN__<\/code> the order. <strong>(win)<\/strong>  <\/li>\n<li><code>_TO RETURN___<\/code> was impossible. <strong>(return)<\/strong>  <\/li>\n<li>I will not let you <code>_TO LEAVE___<\/code>. <strong>(leave)<\/strong>  <\/li>\n<li>Bid him <code>__TO STAY__<\/code> there. <strong>(stay)<\/strong>  <\/li>\n<li>He was quick <code>__TO UNDERSTAND__<\/code> the matter. <strong>(understand)<\/strong>  <\/li>\n<li>You need not <code>__TO GO__<\/code> now. <strong>(go)<\/strong>  <\/li>\n<li>I saw him <code>__TAKE__<\/code> the phone. <strong>(take)<\/strong>  <\/li>\n<li>I felt something cold <code>__TOUCH__<\/code> my hand. <strong>(touch)<\/strong>  <\/li>\n<li>The police wanted <code>__TO SEARCH__<\/code> the premises. <strong>(search)<\/strong>  <\/li>\n<li><code>__TO WASTE__<\/code> is a crime against humanity. <strong>(waste)<\/strong>  <\/li>\n<li>It was wrong <code>_TO SCOLD___<\/code> him. <strong>(scold)<\/strong>  <\/li>\n<li>I failed <code>__TO REACH__<\/code> you. <strong>(reach)<\/strong>  <\/li>\n<li>It is too late <code>__TO START__<\/code> now. <strong>(start)<\/strong>  <\/li>\n<\/ol>\n<p>Look at these sentences.  <\/p>\n<ul>\n<li>It is <strong>very<\/strong> cold. I cannot go out now.  <ul>\n<li>It is <strong>too<\/strong> cold for me to go out now.<\/li>\n<\/ul>\n<\/li>\n<li>This is a <strong>very<\/strong> small room. The exhibition cannot be held here.  <ul>\n<li>This room is <strong>too<\/strong> small to hold the exhibition here.<br />\nDid you notice that in joining these sentences, one of the finite verbs was replaced by its infinitive form? The adverb too is often used along with the infinitive while joining sentences.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p>Now, look at these sets of sentences.  <\/p>\n<ul>\n<li>I hope <strong>that<\/strong> I shall do well in the exams.  <ul>\n<li>I hope to do well in the exams.<\/li>\n<\/ul>\n<\/li>\n<li>We were surprised <strong>when<\/strong> we heard the news.  <ul>\n<li>We were surprised to hear the news.<br />\nIn the above pairs of sentences, we have dropped the underlined conjunction in the first sentence of each pair and replaced one of the finite verbs with the infinitive. This is sometimes done to make sentences compact.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>B. Rewrite each of these sentences by replacing the highlighted verb with an infinitive. Make necessary changes.<\/strong>  <\/p>\n<ol>\n<li>I agreed that I <strong>would do<\/strong> the work.  <\/li>\n<li>Our country expects that its citizens <strong>will do<\/strong> their duty.  <\/li>\n<li>He has many sisters whom he <strong>must provide for<\/strong>.  <\/li>\n<li>As he had no money he <strong>could<\/strong> not <strong>buy<\/strong> vegetables.  <\/li>\n<li>We were delighted when we <strong>heard<\/strong> the good news.  <\/li>\n<li>The mayor was elated when he <strong>learnt<\/strong> that his city was declared the cleanest city.  <\/li>\n<li>Our landlord was the last man who <strong>left<\/strong> the apartment.  <\/li>\n<li>I was the last person who <strong>saw<\/strong> him here.  <\/li>\n<li>Mr Sen hopes that he <strong>will get<\/strong> the contract.  <\/li>\n<li>We were delighted when we <strong>reached<\/strong> Shimla by the toy train.  <\/li>\n<\/ol>\n<p><strong>C. Join these sets of sentences using infinitives.<\/strong>  <\/p>\n<ol>\n<li>I was happy to hear of your new job.  <\/li>\n<li>He has a plan  to execute.  <\/li>\n<li>Every company has a manager to take care of the business.  <\/li>\n<li>He is not afraid to speak the truth.  <\/li>\n<li>All teams have coaches to guide them.  <\/li>\n<li>I stayed at home to rest.  <\/li>\n<li>He went to Mumbai to get a job.  <\/li>\n<li>He must study to achieve success.  <\/li>\n<li>To collect precious stones is his hobby.  <\/li>\n<li>Our teacher is very kind to scold anyone.  <\/li>\n<\/ol>\n<p><strong>D. Complete the following sentences with a ‘to-infinitive’ and any other necessary words.<\/strong>  <\/p>\n<ol>\n<li>I think you will be surprised <code>____<\/code>.  <\/li>\n<li>Miss Shyama Chona is certainly qualified <code>____<\/code>.  <\/li>\n<li>Actually, I am not fully prepared <code>____<\/code>.  <\/li>\n<li>We will be ready <code>____<\/code>.  <\/li>\n<li>My friend is inclined <code>____<\/code>.  <\/li>\n<li>Everyone will be disappointed <code>____<\/code>.  <\/li>\n<li>He bought some flowers <code>____<\/code>.  <\/li>\n<li>Remind me <code>____<\/code>.  <\/li>\n<li>Leave early <code>____<\/code>.  <\/li>\n<li>I would like you <code>____<\/code>.  <\/li>\n<\/ol>\n<p><strong>Participles<\/strong>  <\/p>\n<p>You have learnt about <strong>present participles (verb+-ing)<\/strong> and <strong>past participles 'verb+-ed/-d/-t/-en/-n)<\/strong>.  <\/p>\n<p>Now, read these sentences.  <\/p>\n<ul>\n<li>The <strong>creaking<\/strong> noise disturbed us.  <\/li>\n<li>The <strong>leaking<\/strong> pipe must be replaced.  <\/li>\n<li>The <strong>quiverin<\/strong>g leaves of the willow trees rustled in the breeze.<br />\nThe highlighted words are present participles that have been used as adjectives.  <\/li>\n<\/ul>\n<p>Now, read these sentences.  <\/p>\n<ul>\n<li>The <strong>injured<\/strong> boy was taken to the hospital.  <\/li>\n<li>The <strong>frightened<\/strong> girl shouted loudly.  <\/li>\n<li>They <strong>rescued<\/strong> the passengers from the wrecked car.  <\/li>\n<li>Nobody ate the <strong>burnt<\/strong> toast.<br />\nThe highlighted words are past participles that have been used as adjectives.  <\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nWe may say that a participle is a verbal adjective.  <\/p>\n<p>A <strong>participle<\/strong> is that form of the verb that can act as an adjective in a sentence.  <\/p>\n<p>Participles may be used—  <\/p>\n<ul>\n<li>as attributes. For example,  <ul>\n<li>The <strong>torn<\/strong> sheet flew away.<\/li>\n<li>A <strong>burnt<\/strong> child dreads the fire.<\/li>\n<\/ul>\n<\/li>\n<li>in the predicate, modifying the subject or the object. For example,  <ul>\n<li>The boy looked <strong>terrified<\/strong>.<\/li>\n<li>He kept me <strong>standing<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li>to talk about an earlier action. For example,  <ul>\n<li><strong>Seeing<\/strong> the tiger, the man fled.<\/li>\n<li><strong>Dejected<\/strong> by his failure, he left his home.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>E. Complete these sentences by inserting the participles given in the brackets in the appropriate place. Rewrite making other necessary changes. Follow the example.<\/strong>  <\/p>\n<ol>\n<li>Over the wall, the thief escaped. <strong>(jumping)<\/strong>  <ul>\n<li><strong>jumping over the wall, the thief escaped.<\/strong><\/li>\n<\/ul>\n<\/li>\n<li>The noise, the thieves fled. <strong>(hearing)<\/strong>  <\/li>\n<li>A baby is difficult to manage. <strong>(crying)<\/strong>  <\/li>\n<li>The men ran into the factory loudly. <strong>(screaming)<\/strong>  <\/li>\n<li>By the enemy, the soldier put up a brave front. <strong>(captured)<\/strong>  <\/li>\n<li>Slept, we felt fresh. <strong>(having)<\/strong>  <\/li>\n<li>By the door, the child waved goodbye. <strong>(standing)<\/strong>  <\/li>\n<li>The night cold, we stayed indoors. <strong>(being)<\/strong>  <\/li>\n<li>The poor children slept by the cinders. <strong>(smouldering)<\/strong>  <\/li>\n<li>By endless suffering, the man grew hopeless. <strong>(broken)<\/strong>  <\/li>\n<li>The waters of the stream sparkled in the sunlight. <strong>(gurgling)<\/strong>  <\/li>\n<li>Fed her little daughter, Rosy sat down to eat. <strong>(having)<\/strong>  <\/li>\n<li>The lodge has water. <strong>(running)<\/strong>  <\/li>\n<li>Goa boasts of a tourist business. <strong>(growing)<\/strong>  <\/li>\n<li>Bright and cheerful, the clown smiled at the audience. <strong>(appearing)<\/strong>  <\/li>\n<\/ol>\n<p>We can join pairs of sentences by using participles. Look at these pairs of sentences.  <\/p>\n<ul>\n<li>The girl noticed a car. The car was coming towards her.  <ul>\n<li>The girl noticed a car <strong>coming<\/strong> towards her.<\/li>\n<\/ul>\n<\/li>\n<li>Roma opened the cupboard. Roma took out a shawl.  <ul>\n<li><strong>Opening<\/strong> the cupboard, Roma took out a shawl.<\/li>\n<\/ul>\n<\/li>\n<li>I saw an elephant. I ran for my life.  <ul>\n<li><strong>Seeing<\/strong> an elephant, I ran for my life.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p>In the above examples, both actions take place at the same time. When we join the sentences, one finite verb is removed and we use its present participle form instead.  <\/p>\n<p>But sometimes, the second action begins only after the first has been completed. In that case, we convert the finite verb denoting the first action into the participle.  <\/p>\n<ul>\n<li>He had lost all his books. He went to his friend for help.  <\/li>\n<li><strong>Having<\/strong> lost all his books, he went to his friend for help.  <\/li>\n<\/ul>\n<p><strong>F. Join these pairs of sentences using participles.<\/strong>  <\/p>\n<ol>\n<li>He picked up his stick. He ran to the door.  <\/li>\n<li>He walked into an empty room. He looked around.  <\/li>\n<li>I walked into the library. I went to the counter.  <\/li>\n<li>I was mesmerised by the scene. I stood rooted to the spot.  <\/li>\n<li>I alighted from the train. I looked for my mother.  <\/li>\n<li>We saw some boys. They were quarrelling among themselves.  <\/li>\n<li>He was deceived by his employer. He lost all hope.  <\/li>\n<li>I heard a loud noise. I got up from my bed.  <\/li>\n<li>The man was injured. He was hospitalised.  <\/li>\n<li>A man was walking down the lane. He spotted a kitten.  <\/li>\n<\/ol>\n<p><strong>NOTE<\/strong>:<br />\nLook at these sentences. Do they seem correct?  <\/p>\n<ul>\n<li>Walking through the forest, the surrounding was cold.  <\/li>\n<li>\n<p>Going down the road, horrifying sight was seen.<br />\nIn each of these sentences, there is no noun or pronoun to which the highlighted particle refers.<br />\nThese sentences should be written as—  <\/p>\n<\/li>\n<li>\n<p>Walking through the forest, I found the surrounding cold.  <\/p>\n<\/li>\n<li>Going down the road, I saw a horrifying sight.  <\/li>\n<\/ul>\n<p><strong>Gerunds<\/strong><br />\nLook at these sentences. Notice how the <strong>-ing<\/strong> words have been used in these sentences.  <\/p>\n<ul>\n<li><strong>Swimming<\/strong> is a good way to exercise. <strong>(subject of the sentence)<\/strong>  <\/li>\n<li>I enjoy <strong>reading<\/strong>. <strong>(object of the sentence)<\/strong>  <\/li>\n<li>He is fond of <strong>eating<\/strong> ice-cream. <strong>(object of the preposition)<\/strong>  <\/li>\n<li>What I quite abhor is <strong>lying<\/strong>. <strong>(complement of the verb)<\/strong><br />\nIn these sentences, the <strong>-ing<\/strong> words function like nouns. However, all these words are derived from verbs.  <\/li>\n<\/ul>\n<p>When the <strong>-ing<\/strong> form of the verb is used as a noun in a sentence, we call it the <strong>gerund<\/strong>.  <\/p>\n<p><strong>NOTE<\/strong>:<br />\nA gerund is a verbal noun.  <\/p>\n<p><strong>NOTE<\/strong>:<br />\nThe -ing word can be used in different ways. For example,  <\/p>\n<ul>\n<li>Dancing is her hobby. (subject)  <\/li>\n<li>The girl is dancing gracefully. (verb)  <\/li>\n<li>Everybody gathered to see the dancing peacock. (adjective)  <\/li>\n<\/ul>\n<p><strong>G. Identify the highlighted words as participles or gerunds in these sentences.<\/strong>  <\/p>\n<ol>\n<li><strong>Loitering<\/strong> in the corridor is forbidden.  <\/li>\n<li>The <strong>thundering<\/strong> clouds soon came down as rains.  <\/li>\n<li><strong>Rowing<\/strong> down the stream, we came across a beautiful waterfall.  <\/li>\n<li><strong>Killing<\/strong> wild animals is a cruel sport.  <\/li>\n<li>We were tired of <strong>listening<\/strong> to his complaints.  <\/li>\n<li><strong>Driving<\/strong> down the lane, I found a puppy.  <\/li>\n<li>My sister dislikes <strong>waiting<\/strong>.  <\/li>\n<li><strong>Being<\/strong> frightened, she hid in the closet.  <\/li>\n<li>His behaviour was <strong>frustrating<\/strong>.  <\/li>\n<li>I love <strong>watching<\/strong> the stars at night.  <\/li>\n<li>The children slid on the <strong>frozen<\/strong> lake.  <\/li>\n<li>The boys, <strong>swimming<\/strong> in the pond, had a merry time.  <\/li>\n<li><strong>Duped<\/strong> by a local thug, he lost all his savings.  <\/li>\n<li><strong>Excusing<\/strong> herself from the conference, she went to answer the phone.  <\/li>\n<li><strong>Sleeping<\/strong> is my cat's favourite hobby.  <\/li>\n<li>The <strong>speeding<\/strong> car crashed against the tree.  <\/li>\n<li>James loves <strong>swimming<\/strong>.  <\/li>\n<li><strong>Camping<\/strong> along the banks of the Ganga is my idea of a vacation.  <\/li>\n<li>I love <strong>cooking<\/strong> for friends.  <\/li>\n<li>The <strong>gurgling<\/strong> stream provided a picturesque view.  <\/li>\n<\/ol>\n<p><strong>Gerunds or Infinitives?<\/strong><br />\nAs both gerrunds and infinitives can act as nouns and verbs, they have the same uses. Thus, in many sentences either of them may be used. For example,  <\/p>\n<ul>\n<li>Teach me <strong>to sing<\/strong>. <strong>(infinitive)<\/strong>  <\/li>\n<li>Teach me <strong>singing<\/strong>. <strong>(gerund)<\/strong>  <\/li>\n<li>No one likes <strong>to wait<\/strong>. <strong>(infinitive)<\/strong>  <\/li>\n<li>No one likes <strong>waiting<\/strong>. <strong>(gerund)<\/strong>  <\/li>\n<\/ul>\n<p><strong>H. Circle the correct answer.<\/strong>  <\/p>\n<ol>\n<li>I would like <strong>see/to see<\/strong> you again.  <\/li>\n<li>I saw him <strong>cross/to cross<\/strong> the road.  <\/li>\n<li>He likes <strong>swimming/to swimming<\/strong>.  <\/li>\n<li>He does nothing but <strong>watch/to watch<\/strong> TV all day long.  <\/li>\n<li><strong>To learning/Learning<\/strong> French is not difficult.  <\/li>\n<li>Do not get off a <strong>run/running<\/strong> bus.  <\/li>\n<li><strong>Finishing/Having finished<\/strong> their work, they went home.  <\/li>\n<li>After completing his homework, he went out to <strong>play/playing<\/strong>.  <\/li>\n<li>He is anxious <strong>to get/getting<\/strong> the news.  <\/li>\n<\/ol>\n<p><strong>I. Rewrite each of these sentences using a gerund in place of the infinitive.<\/strong>  <\/p>\n<ol>\n<li>Teach me to cook.  <\/li>\n<li>To dance will require training.  <\/li>\n<li>To waste is not wise.  <\/li>\n<li>To sleep is Rajnish's favourite activity.  <\/li>\n<li>Children love to eat chocolates.  <\/li>\n<li>To save is a good habit.  <\/li>\n<li>I like to swim in the lake.  <\/li>\n<li>Farishta prefers to read, than to play outdoors.  <\/li>\n<\/ol>\n<p><strong>J. Complete these sentences in your own words, using a gerund or an infinitive, whichever you think is correct.<\/strong>  <\/p>\n<ol>\n<li>I am tired <code>____<\/code>  <\/li>\n<li>We objected <code>____<\/code>  <\/li>\n<li>She is waiting <code>____<\/code>  <\/li>\n<li>The man was punished <code>____<\/code>  <\/li>\n<li>The child began <code>____<\/code>  <\/li>\n<li>He tried <code>____<\/code>  <\/li>\n<li>The architect is <code>____<\/code>  <\/li>\n<li>The lady enjoys <code>____<\/code>  <\/li>\n<li>She prefers <code>____<\/code>  <\/li>\n<li>He refused <code>____<\/code>  <\/li>\n<\/ol>\n<p><strong>K. A daughter has written a letter to her mother describing the journey that she and her younger brother undertook to see their uncle. Complete the letter using appropriate non-finites ('-ing', '-ed' and 'to' verb form).<\/strong>  <\/p>\n<p>Dear Mother<br />\nIt would perhaps interest you a) <code>____<\/code> that b) <code>____<\/code> by bus is a lot of fun. We keep c) <code>____<\/code> out of the window. It is good d) <code>____<\/code> such a lot of greenery. Sheep and cows e) <code>____<\/code> in the field is a common sight. I enjoy f) <code>____<\/code> the birds in flight. We hope g) <code>____<\/code> our uncle's home in an hour.  <\/p>\n<p>Love<br />\nKiran  <\/p>\n<p><strong>L. Pick out the non-finite verbs in the following text.<\/strong><br />\n<strong>Kaffol<\/strong><br />\nYour best protection<br />\nagainst heart trouble!<br />\nMake Kaffol part of your family's total health care plan, together with a balanced diet and regular exercise. Light and easy to digest, Kaffol can be used for cooking, frying, baking and in salad dressings to prepare all kinds of tasty dishes.  <\/p>\n<p>Start your family on Kaffol, Today!<br />\nGood for your heart.  <\/p>\n<hr />\n<hr />\n<h1>Answers – Non-finite Verbs<\/h1>\n<p><strong>A. Fill in the blanks with the infinitive forms of the verbs in the brackets, with or without to as the case may be.<\/strong>  <\/p>\n<ol>\n<li>Let us <strong>eat<\/strong>.  <\/li>\n<li>I am sorry <strong>to learn<\/strong> this.  <\/li>\n<li>I hope <strong>to win<\/strong> the order.  <\/li>\n<li><strong>To return<\/strong> was impossible.  <\/li>\n<li>I will not let you <strong>leave<\/strong>.  <\/li>\n<li>Bid him <strong>stay<\/strong> there.  <\/li>\n<li>He was quick <strong>to understand<\/strong> the matter.  <\/li>\n<li>You need not <strong>go<\/strong> now.  <\/li>\n<li>I saw him <strong>take<\/strong> the phone.  <\/li>\n<li>I felt something cold <strong>touch<\/strong> my hand.  <\/li>\n<li>The police wanted <strong>to search<\/strong> the premises.  <\/li>\n<li><strong>To waste<\/strong> is a crime against humanity.  <\/li>\n<li>It was wrong <strong>to scold<\/strong> him.  <\/li>\n<li>I failed <strong>to reach<\/strong> you.  <\/li>\n<li>It is too late <strong>to start<\/strong> now.  <\/li>\n<\/ol>\n<p><strong>B. Rewrite each of these sentences by replacing the highlighted verb with an infinitive. Make necessary changes.<\/strong>  <\/p>\n<ol>\n<li>I agreed to do the work.  <\/li>\n<li>Our country expects its citizens to do their duty.  <\/li>\n<li>He has many sisters to provide for.  <\/li>\n<li>He had no money to buy vegetables.  <\/li>\n<li>We were delighted to hear the good news.  <\/li>\n<li>The mayor was elated to learn that his city was declared the cleanest city.  <\/li>\n<li>Our landlord was the last man to leave the apartment.  <\/li>\n<li>I was the last person to see him here.  <\/li>\n<li>Mr Sen hopes to get the contract.  <\/li>\n<li>We were delighted to reach Shimla by the toy train.  <\/li>\n<\/ol>\n<p><strong>C. Join these sets of sentences using infinitives.<\/strong>  <\/p>\n<ol>\n<li>I was happy to hear of your new job.  <\/li>\n<li>He has a plan to execute.  <\/li>\n<li>Every company has a manager to take care of the business.  <\/li>\n<li>He is not afraid to speak the truth.  <\/li>\n<li>All teams have coaches to guide them.  <\/li>\n<li>I stayed at home to rest.  <\/li>\n<li>He went to Mumbai to get a job.  <\/li>\n<li>He must study to achieve success.  <\/li>\n<li>To collect precious stones is his hobby.  <\/li>\n<li>Our teacher is too kind to scold anyone.  <\/li>\n<\/ol>\n<p><strong>D. Complete the following sentences with a ‘to-infinitive’ and any other necessary words.<\/strong>  <\/p>\n<ol>\n<li>I think you will be surprised <strong>to see the results<\/strong>.  <\/li>\n<li>Miss Shyama Chona is certainly qualified <strong>to lead the school<\/strong>.  <\/li>\n<li>Actually, I am not fully prepared <strong>to take the test<\/strong>.  <\/li>\n<li>We will be ready <strong>to leave by five o'clock<\/strong>.  <\/li>\n<li>My friend is inclined <strong>to accept the offer<\/strong>.  <\/li>\n<li>Everyone will be disappointed <strong>to hear the bad news<\/strong>.  <\/li>\n<li>He bought some flowers <strong>to give to his mother<\/strong>.  <\/li>\n<li>Remind me <strong>to buy groceries today<\/strong>.  <\/li>\n<li>Leave early <strong>to avoid the traffic<\/strong>.  <\/li>\n<li>I would like you <strong>to complete this task<\/strong>.  <\/li>\n<\/ol>\n<p><strong>E. Complete these sentences by inserting the participles given in the brackets in the appropriate place. Rewrite making other necessary changes.<\/strong>  <\/p>\n<ol>\n<li>Jumping over the wall, the thief escaped.  <\/li>\n<li>Hearing the noise, the thieves fled.  <\/li>\n<li>A crying baby is difficult to manage.  <\/li>\n<li>Screaming loudly, the men ran into the factory.  <\/li>\n<li>Captured by the enemy, the soldier put up a brave front.  <\/li>\n<li>Having slept, we felt fresh.  <\/li>\n<li>Standing by the door, the child waved goodbye.  <\/li>\n<li>The night being cold, we stayed indoors.  <\/li>\n<li>The poor children slept by the smouldering cinders.  <\/li>\n<li>Broken by endless suffering, the man grew hopeless.  <\/li>\n<li>The gurgling waters of the stream sparkled in the sunlight.  <\/li>\n<li>Having fed her little daughter, Rosy sat down to eat.  <\/li>\n<li>The lodge has running water.  <\/li>\n<li>Goa boasts of a growing tourist business.  <\/li>\n<li>Appearing bright and cheerful, the clown smiled at the audience.  <\/li>\n<\/ol>\n<p><strong>F. Join these pairs of sentences using participles.<\/strong>  <\/p>\n<ol>\n<li>Picking up his stick, he ran to the door.  <\/li>\n<li>Walking into an empty room, he looked around.  <\/li>\n<li>Walking into the library, I went to the counter.  <\/li>\n<li>Mesmerised by the scene, I stood rooted to the spot.  <\/li>\n<li>Alighting from the train, I looked for my mother.  <\/li>\n<li>We saw some boys quarrelling among themselves.  <\/li>\n<li>Deceived by his employer, he lost all hope.  <\/li>\n<li>Hearing a loud noise, I got up from my bed.  <\/li>\n<li>Being injured, the man was hospitalised.  <\/li>\n<li>Walking down the lane, a man spotted a kitten.  <\/li>\n<\/ol>\n<p><strong>G. Identify the highlighted words as participles or gerunds in these sentences.<\/strong>  <\/p>\n<ol>\n<li>Loitering – Gerund  <\/li>\n<li>thundering – Participle  <\/li>\n<li>Rowing – Participle  <\/li>\n<li>Killing – Gerund  <\/li>\n<li>listening – Gerund  <\/li>\n<li>Driving – Participle  <\/li>\n<li>waiting – Gerund  <\/li>\n<li>Being – Participle  <\/li>\n<li>frustrating – Participle  <\/li>\n<li>watching – Gerund  <\/li>\n<li>frozen – Participle  <\/li>\n<li>swimming – Participle  <\/li>\n<li>Duped – Participle  <\/li>\n<li>Excusing – Participle  <\/li>\n<li>Sleeping – Gerund  <\/li>\n<li>speeding – Participle  <\/li>\n<li>swimming – Gerund  <\/li>\n<li>Camping – Gerund  <\/li>\n<li>cooking – Gerund  <\/li>\n<li>gurgling – Participle  <\/li>\n<\/ol>\n<p><strong>H. Circle the correct answer.<\/strong>  <\/p>\n<ol>\n<li>to see  <\/li>\n<li>cross  <\/li>\n<li>swimming  <\/li>\n<li>watch  <\/li>\n<li>Learning  <\/li>\n<li>running  <\/li>\n<li>Having finished  <\/li>\n<li>play  <\/li>\n<li>to get  <\/li>\n<\/ol>\n<p><strong>I. Rewrite each of these sentences using a gerund in place of the infinitive.<\/strong>  <\/p>\n<ol>\n<li>Teach me cooking.  <\/li>\n<li>Dancing will require training.  <\/li>\n<li>Wasting is not wise.  <\/li>\n<li>Sleeping is Rajnish's favourite activity.  <\/li>\n<li>Children love eating chocolates.  <\/li>\n<li>Saving is a good habit.  <\/li>\n<li>I like swimming in the lake.  <\/li>\n<li>Farishta prefers reading to playing outdoors.  <\/li>\n<\/ol>\n<p><strong>J. Complete these sentences in your own words, using a gerund or an infinitive, whichever you think is correct.<\/strong>  <\/p>\n<ol>\n<li>I am tired <strong>of waiting for the bus<\/strong>.  <\/li>\n<li>We objected <strong>to paying extra charges<\/strong>.  <\/li>\n<li>She is waiting <strong>to meet the doctor<\/strong>.  <\/li>\n<li>The man was punished <strong>for stealing money<\/strong>.  <\/li>\n<li>The child began <strong>to cry loudly<\/strong>.  <\/li>\n<li>He tried <strong>to lift the heavy box<\/strong>.  <\/li>\n<li>The architect is <strong>planning to design a new building<\/strong>.  <\/li>\n<li>The lady enjoys <strong>gardening in the evening<\/strong>.  <\/li>\n<li>She prefers <strong>reading books to watching television<\/strong>.  <\/li>\n<li>He refused <strong>to obey the orders<\/strong>.  <\/li>\n<\/ol>\n<p><strong>K. Complete the letter using appropriate non-finites ('-ing', '-ed' and 'to' verb form).<\/strong><br />\na) to know<br />\nb) travelling<br />\nc) looking<br />\nd) to see<br />\ne) grazing<br />\nf) watching<br />\ng) to reach  <\/p>\n<p><strong>L. Pick out the non-finite verbs in the following text.<\/strong>  <\/p>\n<ol>\n<li>balanced (past participle)  <\/li>\n<li>to digest (infinitive)  <\/li>\n<li>cooking (gerund)  <\/li>\n<li>frying (gerund)  <\/li>\n<li>baking (gerund)  <\/li>\n<li>to prepare (infinitive)<\/li>\n<\/ol>"}, {"title": "Transitive and Intransitive Verbs", "html": "<p>We know that a sentence will always have a verb. A verb tells us—  <\/p>\n<ul>\n<li>what a person or thing does—He <strong>repairs<\/strong> cars.  <\/li>\n<li>what a person has—The girl <strong>has<\/strong> a pretty frock.  <\/li>\n<li>what a person or thing is—The ostrich <strong>is<\/strong> a huge bird.  <\/li>\n<\/ul>\n<p>Now, look at this sentence.  <\/p>\n<ul>\n<li>My mother <strong>cut<\/strong> the cake.<br />\nIn this sentence, the cake receives the action of the verb.  <\/li>\n<\/ul>\n<p>The person or thing that receives the action of the verb is called the <strong>object<\/strong>.  <\/p>\n<p>When a verb has an object that receives the action of the verb, it is called a <strong>transitive verb<\/strong>.  <\/p>\n<p>Now, read this sentence.  <\/p>\n<ul>\n<li>The child <strong>wept<\/strong> loudly.<br />\nIn this sentence, there is no object. No one receives the action of the <strong>verb<\/strong>.  <\/li>\n<\/ul>\n<p>When a verb has no object, it is called an <strong>intransitive verb<\/strong>.  <\/p>\n<p>Read these sentences.  <\/p>\n<ul>\n<li>My father gave me a fruit.  <\/li>\n<li>My father gave a fruit to me.  <\/li>\n<\/ul>\n<p>Answer these questions.  <\/p>\n<ul>\n<li>Who is the doer of the action? <code>____<\/code> (This is the subject.)  <\/li>\n<li>What did Father give? <code>____<\/code> (This is the direct object.)  <\/li>\n<li>To whom did Father give? <code>____<\/code> (This is the indirect object.)  <\/li>\n<\/ul>\n<p>Most transitive verbs take a single object. But some transitive verbs like <strong>give, ask, promise, tell,<\/strong> etc. take two objects—<strong>a direct object<\/strong> and <strong>an indirect object<\/strong>. In the above sentences, the direct object is <strong>fruit<\/strong>, while the indirect object is <strong>me<\/strong>.  <\/p>\n<p>The person or thing that receives the action of the verb is called the <strong>direct object<\/strong>.  <\/p>\n<p>The person or thing to whom or on whom the action of the verb is done or who receives the direct object is called the <strong>indirect object<\/strong>.  <\/p>\n<p><strong>NOTE<\/strong>:<br />\nDo remember that most verbs can be used both transitively as well as intransitively. For example,  <\/p>\n<ul>\n<li>The lawyer spoke the truth.  <\/li>\n<li>The teacher spoke softly.  <\/li>\n<\/ul>\n<p>Sometime the subject and the object refer to the same person or thing. We then say that the verb has been used reflexively.  <\/p>\n<ul>\n<li>The girl cut <strong>herself<\/strong>.  <\/li>\n<\/ul>\n<p>In such sentences, the object is sometimes omitted.  <\/p>\n<ul>\n<li>The tyre burst (itself).  <\/li>\n<\/ul>\n<p><strong>A. Underline the verbs in these sentences and state in each case whether the verb is used transitively or intransitively. If the verb is used transitively, point out the object/objects.<\/strong>  <\/p>\n<ol>\n<li>The teacher gave me a book.  <\/li>\n<li>The children sang a lovely song.  <\/li>\n<li>The birds sang sweetly.  <\/li>\n<li>The men declared a truce.  <\/li>\n<li>He felled the trees.  <\/li>\n<li>The boy narrated a tale.  <\/li>\n<li>He fell asleep.  <\/li>\n<li>Can you spare a few minutes?  <\/li>\n<li>He spoke rudely.  <\/li>\n<li>The car halted suddenly.  <\/li>\n<li>I burnt my hand.  <\/li>\n<li>The fire raged through the forest.  <\/li>\n<li>They laughed at the joke.  <\/li>\n<li>The storm destroyed the house.  <\/li>\n<li>The farmer sold me some potatoes.  <\/li>\n<li>The boat floated down the river.  <\/li>\n<li>I moved the bowl.  <\/li>\n<li>The glass broke.  <\/li>\n<li>He taught me dancing.  <\/li>\n<li>The officer arrested the thief.  <\/li>\n<li>She sleeps in the next bedroom.  <\/li>\n<li>The dog chased the white mouse.  <\/li>\n<li>The door opened.  <\/li>\n<li>He promised me a book.  <\/li>\n<\/ol>\n<p><strong>A. Fill in the blanks with appropriate objects for the verbs.<\/strong>  <\/p>\n<ol>\n<li>My brother has polished his <code>____<\/code>.  <\/li>\n<li>I brought <code>____<\/code> for my sister.  <\/li>\n<li>The boy threw a <code>____<\/code> at the window.  <\/li>\n<li>Frustrated with the official's call, Ethan kicked the <code>____<\/code>.  <\/li>\n<li>The student guessed the <code>____<\/code> correctly.  <\/li>\n<li>Reema cleaned the <code>____<\/code> thoroughly.  <\/li>\n<li>I corrected the <code>____<\/code> yesterday.  <\/li>\n<li>Shabnam cooked <code>____<\/code> for all of us.  <\/li>\n<li>We staged <code>____<\/code> on our Parents' Day.  <\/li>\n<li>Mother helped <code>____<\/code>.  <\/li>\n<li>He locked up all the <code>____<\/code> before leaving.  <\/li>\n<li>They pushed the <code>____<\/code> down the stairs.  <\/li>\n<li>She made <code>____<\/code> for us.  <\/li>\n<li>The farmer grows <code>____<\/code> in these fields.  <\/li>\n<li>We saw the <code>____<\/code> land on the runway.  <\/li>\n<\/ol>\n<p><strong>Verbs of Incomplete Predication<\/strong><br />\nWe know that intransitive verbs do not require objects.  <\/p>\n<p>Look at these sentences.  <\/p>\n<ul>\n<li>The child <strong>cries<\/strong>.  <\/li>\n<li>Men <strong>eat<\/strong>.  <\/li>\n<li>Tigers <strong>roar<\/strong>.  <\/li>\n<\/ul>\n<p>he highlighted verbs in these sentences do not require any words to make complete sense.  <\/p>\n<p>An intransitive verb that makes complete sense on its own is called <strong>a verb of complete predication<\/strong>.  <\/p>\n<p>Sometimes, an intransitive verb requires another word or words to make complete sense and to complete the predicate.  <\/p>\n<p>An intransitive verb that requires a word or phrase to complete its meaning is called a verb of incomplete predication. The word or words required to make the sense complete is called <strong>the complement of the verb<\/strong>.  <\/p>\n<p>For example,  <\/p>\n<ul>\n<li>The boy appears <strong>sad<\/strong>.  <\/li>\n<li>She is <strong>talented<\/strong>.  <\/li>\n<li>She seems <strong>happy<\/strong>.  <\/li>\n<li>The child continued <strong>laughing<\/strong>.  <\/li>\n<\/ul>\n<p>In the above examples, the complements tell us something about the subject. So, these are called <strong>subjective complements<\/strong>.  <\/p>\n<p>We know that transitive verbs have objects. Sometimes, just an object is not good enough. Something more is required to complete the predicate.  <\/p>\n<p>Look at this sentence.  <\/p>\n<ul>\n<li>The members elected Sam captain.<br />\nHere the word captain refers to Sam, the object of the verb. So captain is the objective complement.  <\/li>\n<\/ul>\n<p><strong>C. Indicate whether the verbs in these sentences are transitive or intransitive. Name the object of each transitive verb and the complements of each verb of incomplete predication.<\/strong>  <\/p>\n<ol>\n<li>The child has fallen asleep.  <\/li>\n<li>The count found him guilty.  <\/li>\n<li>The dog has gone quite crazy.  <\/li>\n<li>The boy watered the plants.  <\/li>\n<li>Pushpa speaks the truth.  <\/li>\n<li>They are Tibetans.  <\/li>\n<li>Rahul became the secretary.  <\/li>\n<li>She appears lonely.  <\/li>\n<li>The sky grew dark in the evening.  <\/li>\n<li>They opened the box.  <\/li>\n<li>He was elected chairman.  <\/li>\n<li>They set the prisoners free.  <\/li>\n<li>They looked relieved.  <\/li>\n<li>I have become an engineer.  <\/li>\n<li>The students blamed him.  <\/li>\n<li>The tea tastes bitter.  <\/li>\n<li>Rahim proved me wrong.  <\/li>\n<li>He became a minister.  <\/li>\n<li>The weather is pleasant.  <\/li>\n<li>We found grandfather asleep.  <\/li>\n<\/ol>\n<hr />\n<hr />\n<h1>Answers – Transitive and Intransitive Verbs<\/h1>\n<p><strong>In-text Questions (Page 2005):<\/strong>  <\/p>\n<ul>\n<li>Subject (Doer): Father  <\/li>\n<li>Direct Object: fruit  <\/li>\n<li>Indirect Object: me  <\/li>\n<\/ul>\n<p><strong>A. Underline the verbs in these sentences and state in each case whether the verb is used transitively or intransitively. If the verb is used transitively, point out the object/objects.<\/strong>  <\/p>\n<ol>\n<li>Verb: gave | Transitive | Objects: indirect object: me, direct object: book  <\/li>\n<li>Verb: sang | Transitive | Object: a lovely song  <\/li>\n<li>Verb: sang | Intransitive  <\/li>\n<li>Verb: declared | Transitive | Object: a truce  <\/li>\n<li>Verb: felled | Transitive | Object: the trees  <\/li>\n<li>Verb: narrated | Transitive | Object: a tale  <\/li>\n<li>Verb: fell | Intransitive | Complement: asleep  <\/li>\n<li>Verb: can spare | Transitive | Object: a few minutes  <\/li>\n<li>Verb: spoke | Intransitive  <\/li>\n<li>Verb: halted | Intransitive  <\/li>\n<li>Verb: burnt | Transitive | Object: my hand  <\/li>\n<li>Verb: raged | Intransitive  <\/li>\n<li>Verb: laughed | Intransitive  <\/li>\n<li>Verb: destroyed | Transitive | Object: the house  <\/li>\n<li>Verb: sold | Transitive | Objects: indirect object: me, direct object: some potatoes  <\/li>\n<li>Verb: floated | Intransitive  <\/li>\n<li>Verb: moved | Transitive | Object: the bowl  <\/li>\n<li>Verb: broke | Intransitive  <\/li>\n<li>Verb: taught | Transitive | Objects: indirect object: me, direct object: dancing  <\/li>\n<li>Verb: arrested | Transitive | Object: the thief  <\/li>\n<li>Verb: sleeps | Intransitive  <\/li>\n<li>Verb: chased | Transitive | Object: the white mouse  <\/li>\n<li>Verb: opened | Intransitive  <\/li>\n<li>Verb: promised | Transitive | Objects: indirect object: me, direct object: a book  <\/li>\n<\/ol>\n<p><strong>B. Fill in the blanks with appropriate objects for the verbs.<\/strong>  <\/p>\n<ol>\n<li>shoes  <\/li>\n<li>a present  <\/li>\n<li>stone  <\/li>\n<li>ball  <\/li>\n<li>answer  <\/li>\n<li>room  <\/li>\n<li>mistake  <\/li>\n<li>dinner  <\/li>\n<li>a play  <\/li>\n<li>me  <\/li>\n<li>doors  <\/li>\n<li>cart  <\/li>\n<li>tea  <\/li>\n<li>crops  <\/li>\n<li>aeroplane  <\/li>\n<\/ol>\n<p><strong>C. Indicate whether the verbs in these sentences are transitive or intransitive. Name the object of each transitive verb and the complements of each verb of incomplete predication.<\/strong>  <\/p>\n<ol>\n<li>Intransitive | Subjective complement: asleep  <\/li>\n<li>Transitive | Object: him | Objective complement: guilty  <\/li>\n<li>Intransitive | Subjective complement: quite crazy  <\/li>\n<li>Transitive | Object: the plants  <\/li>\n<li>Transitive | Object: the truth  <\/li>\n<li>Intransitive | Subjective complement: Tibetans  <\/li>\n<li>Intransitive | Subjective complement: the secretary  <\/li>\n<li>Intransitive | Subjective complement: lonely  <\/li>\n<li>Intransitive | Subjective complement: dark  <\/li>\n<li>Transitive | Object: the box  <\/li>\n<li>Intransitive | Subjective complement: chairman  <\/li>\n<li>Transitive | Object: the prisoners | Objective complement: free  <\/li>\n<li>Intransitive | Subjective complement: relieved  <\/li>\n<li>Intransitive | Subjective complement: an engineer  <\/li>\n<li>Transitive | Object: him  <\/li>\n<li>Intransitive | Subjective complement: bitter  <\/li>\n<li>Transitive | Object: me | Objective complement: wrong  <\/li>\n<li>Intransitive | Subjective complement: a minister  <\/li>\n<li>Intransitive | Subjective complement: pleasant  <\/li>\n<li>Transitive | Object: grandfather | Objective complement: asleep<\/li>\n<\/ol>"}, {"title": "Active and Passive Voice", "html": "<p>Take a look at these sentences. How are these sentences different?  <\/p>\n<ul>\n<li>He <strong>wrote<\/strong> a letter.  <\/li>\n<li>A letter <strong>was written<\/strong> by him.  <\/li>\n<\/ul>\n<p>In most sentences, the <strong>subject<\/strong> of the sentence is the <strong>doer<\/strong> of an action and the <strong>object<\/strong> of the sentence is the <strong>receiver<\/strong> of the action. For example,  <\/p>\n<ul>\n<li>Cats eat fish. (cat—subject; fish—object)  <\/li>\n<li>Rohan posted the letter. (Rohan—subject; letter—object)  <\/li>\n<\/ul>\n<p>The verb that expresses that the action is carried out by the subject is said to be in the <strong>active voice<\/strong>. The active voice is used when the agent or the doer is to be made prominent.  <\/p>\n<p>However, in some sentences, the subject receives the action of the verb. For example,  <\/p>\n<ul>\n<li>Fish are eaten by cats. (fish—subject; cats—object)  <\/li>\n<li>The letter was posted by Rohan. (letter—subject; Rohan—object)  <\/li>\n<\/ul>\n<p>The verb that expresses what is done to the subject is said to be in the <strong>passive voice<\/strong>.  <\/p>\n<p><strong>Voice<\/strong> is that form of the verb which indicates whether the subject is the doer of the action or something is being done to it.  <\/p>\n<p>See how the following sentences in the active voice have been changed into the passive voice without changing their meanings.  <\/p>\n<ul>\n<li>The captain called the players. (<strong>active<\/strong>)  <ul>\n<li>The players were called by the captain. (<strong>passive<\/strong>)<\/li>\n<\/ul>\n<\/li>\n<li>He is painting a portrait. (<strong>active<\/strong>)  <ul>\n<li>A portrait is being painted by him. (<strong>passive<\/strong>)  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Can you point out the differences in each of the pairs of sentences?<\/strong>  <\/p>\n<p>Read these rules to be kept in mind when changing the voice of the verb from active to passive.  <\/p>\n<ul>\n<li>The positions of the subject and the object of the verb are interchanged. The subject of the verb in the active voice is made the object of the verb in the passive voice.  <\/li>\n<li>In the passive voice, the preposition <strong>by<\/strong> is added before the object.  <\/li>\n<li>The number of the verb is changed according to the number and person of the subject.  <\/li>\n<\/ul>\n<p>Study the table to understand how the verb is changed into the passive voice form in different tenses.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Tense<\/th>\n<th>Active voice<\/th>\n<th>Passive voice<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Simple present<\/td>\n<td>He paints a wall.<\/td>\n<td>A wall is painted by him.<\/td>\n<\/tr>\n<tr>\n<td>Present continuous<\/td>\n<td>He is painting a wall.<\/td>\n<td>A wall is being painted by him.<\/td>\n<\/tr>\n<tr>\n<td>Present perfect<\/td>\n<td>He has painted a wall.<\/td>\n<td>A wall has been painted by him.<\/td>\n<\/tr>\n<tr>\n<td>Simple past<\/td>\n<td>He painted a wall.<\/td>\n<td>A wall was painted by him.<\/td>\n<\/tr>\n<tr>\n<td>Past continuous<\/td>\n<td>He was painting a wall.<\/td>\n<td>A wall was being painted by him.<\/td>\n<\/tr>\n<tr>\n<td>Past perfect<\/td>\n<td>He had painted a wall.<\/td>\n<td>A wall had been painted by him.<\/td>\n<\/tr>\n<tr>\n<td>Simple future<\/td>\n<td>He will paint a wall.<\/td>\n<td>A wall will be painted by him.<\/td>\n<\/tr>\n<tr>\n<td>Future continuous<\/td>\n<td>He will be painting a wall.<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Future perfect<\/td>\n<td>He will have painted a wall.<\/td>\n<td>A wall will have been painted by him.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>A. Underline the verbs in these sentences and state whether they are in the active or in the passive voice.<\/strong>  <\/p>\n<ol>\n<li>The farmer ploughed his land regularly.  <\/li>\n<li>The storm had caused extensive damage.  <\/li>\n<li>The ball was gifted by my coach.  <\/li>\n<li>He drank the glass of milk.  <\/li>\n<li>I dug the pit in the darkness of the night.  <\/li>\n<li>The teacher opened the door of the cupboard.  <\/li>\n<li>The mission was accomplished.  <\/li>\n<li>A moment later, the door was flung open by the prince.  <\/li>\n<li>The chocolate cake was baked by my mother.  <\/li>\n<li>The hunter continued to step cautiously ahead.  <\/li>\n<li>I picked up the heavy box from the table.  <\/li>\n<li>Mowgli laughed at the joke.  <\/li>\n<li>The girl was chewing the same piece of gum for hours.  <\/li>\n<li>I unfastened the strings of the bag.  <\/li>\n<li>The servant obeyed his orders.  <\/li>\n<li>The prescription will be written by Dr Mitra.  <\/li>\n<li>The squeaky mouse ate the cheese.  <\/li>\n<li>The crowd lined the road and cheered the leader.  <\/li>\n<li>He lit a candle.  <\/li>\n<li>He picked up the ring furtively.  <\/li>\n<li>The letter was mailed by Pragya.  <\/li>\n<li>The book was bought by my father.  <\/li>\n<li>They called off the meeting.  <\/li>\n<li>Someone cleaned the window.  <\/li>\n<li>English is spoken all over the world.  <\/li>\n<\/ol>\n<p><strong>NOTE<\/strong>:  <\/p>\n<ul>\n<li>If the active verb has two objects—one direct and the other indirect—either of them becomes the subject of the passive verb, and the other remains as an object of the verb in the passive voice. The object that comes after the passive verb is called the <strong>retained object<\/strong>. For example,  <ul>\n<li>My father gave me a cycle. (active voice)<\/li>\n<li>I was given a cycle by my father. (passive voice)<\/li>\n<li>A cycle was given to me by my father. (passive voice)<\/li>\n<\/ul>\n<\/li>\n<li>Active verbs followed by a preposition retain the preposition.  <ul>\n<li>The students laughed at the clown.<\/li>\n<li>The clown was laughed at by the students.  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\n<strong>Do<\/strong>, <strong>does<\/strong> and <strong>did<\/strong> are not used in the passive voice.  <\/p>\n<p>Study this table that shows the changes in imperative sentences where the subject is omitted.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Active voice<\/th>\n<th>Passive voice<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Take it home.<\/td>\n<td>Let it be taken home.<\/td>\n<\/tr>\n<tr>\n<td>Do it right now.<\/td>\n<td>Let it be done right now.<\/td>\n<\/tr>\n<tr>\n<td>Open the door.<\/td>\n<td>Let the door be opened.<\/td>\n<\/tr>\n<tr>\n<td>Do not heat the food.<\/td>\n<td>Let not the food be heated.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>The imperative sentence in the passive voice takes this form—<strong>Let + object + be + past participle<\/strong>  <\/li>\n<li>If the sentence is in the negative, then the structure is—<strong>Let not + object + be + past participle<\/strong>  <\/li>\n<\/ul>\n<p>Study this table to understand how verbs in the active voice in interrogative sentences are changed into the passive voice.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Active voice<\/th>\n<th>Passive voice<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Did Suman invite you?<\/td>\n<td>Were you invited by Suman?<\/td>\n<\/tr>\n<tr>\n<td>Do the children like chocolates?<\/td>\n<td>Are chocolates liked by the children?<\/td>\n<\/tr>\n<tr>\n<td>Have you finished the work?<\/td>\n<td>Has the work been finished by you?<\/td>\n<\/tr>\n<tr>\n<td>Can anybody cure this disease?<\/td>\n<td>Can this disease be cured? (Anybody is not used.)<\/td>\n<\/tr>\n<tr>\n<td>Who hit the ball?<\/td>\n<td>By whom was the ball hit?<\/td>\n<\/tr>\n<tr>\n<td>When will they announce the date?<\/td>\n<td>When will the date be announced? (They is not used.)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>B. Change the verbs in these sentences from the active to the passive voice. Make changes as required.<\/strong>  <\/p>\n<ol>\n<li>Children love cakes.  <\/li>\n<li>Open the door.  <\/li>\n<li>Gargi made special biscuits for everyone.  <\/li>\n<li>Suresh picked up the ball and kicked it.  <\/li>\n<li>My mother loves her pet dog.  <\/li>\n<li>Have you completed the painting?  <\/li>\n<li>We elected Malini our class monitor.  <\/li>\n<li>Santa Claus gave me a gift.  <\/li>\n<li>Everyone loves ice creams in summer.  <\/li>\n<li>When will they shift the office?  <\/li>\n<li>They knew this.  <\/li>\n<li>Maya kept Rita waiting.  <\/li>\n<li>One should keep one's promises.  <\/li>\n<li>Who has done this?  <\/li>\n<li>Your uncle taught me maths.  <\/li>\n<li>The masons are building the house.  <\/li>\n<li>Somebody has stolen my ring.  <\/li>\n<li>They are watching us closely.  <\/li>\n<li>What does this packet contain?  <\/li>\n<li>The gardener tends to the flowers in my garden.  <\/li>\n<\/ol>\n<p>Let us look at the instances when the use of the passive voice is preferred.  <\/p>\n<p>We use the passive voice when—  <\/p>\n<ul>\n<li>the person or thing acted upon is to be made prominent. The passive voice is thus preferred when the active form would involve the use of a vague pronoun or noun such as somebody, they, people, anybody, as the subject. For example,  <ul>\n<li>My book <strong>has been stolen<\/strong>. (Someone has stolen my book.)<\/li>\n<li>I <strong>was asked<\/strong> my identity. (They asked me my identity.)<\/li>\n<li>I <strong>have been invited<\/strong> to the conference. (Someone has invited me to the conference.)<\/li>\n<\/ul>\n<\/li>\n<li>the doer is not known or when it is not intended to name the doer. For example,  <ul>\n<li>The victim <strong>was carried<\/strong> out.<\/li>\n<\/ul>\n<\/li>\n<li>we wish to focus on the person or the thing acted upon rather than the doer or the agent. For example,  <ul>\n<li>The building <strong>was destroyed<\/strong> by lightning.<\/li>\n<\/ul>\n<\/li>\n<li>When the subject in the active voice is implied from the context.  <ul>\n<li>He <strong>was fired<\/strong> from his job (by his employer).<\/li>\n<li>The city <strong>has been captured<\/strong> (by the enemy).  <\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\nSince the object of a verb in the active voice becomes the subject of the passive form, it means that only transitive verbs can be used in the passive, because an intransitive verb has no object.  <\/p>\n<p>See how sentences in the passive voice can be changed into the active voice.  <\/p>\n<ul>\n<li><strong>Passive:<\/strong> The work will be finished <em>by<\/em> the plumber in a week.  <\/li>\n<li>\n<p><strong>Active:<\/strong> The plumber will finish the work in a week.  <\/p>\n<\/li>\n<li>\n<p><strong>Passive:<\/strong> <em>By<\/em> whom was this major task accomplished?  <\/p>\n<\/li>\n<li>\n<p><strong>Active:<\/strong> Who accomplished this major task?  <\/p>\n<\/li>\n<li>\n<p><strong>Passive:<\/strong> I have been asked to attend this meeting.  <\/p>\n<\/li>\n<li><strong>Active:<\/strong> Someone has asked me to attend this meeting.  <\/li>\n<\/ul>\n<p><strong>C. Change the verbs in these sentences into active voice. Make changes as required.<\/strong>  <\/p>\n<ol>\n<li>The procession was led by a noted politician.  <\/li>\n<li>Jerry is troubled by Tom.  <\/li>\n<li>Let the painting be unveiled.  <\/li>\n<li>A cup of coffee was ordered by my mother.  <\/li>\n<li>The factory was inaugurated by Mr Gomes.  <\/li>\n<li>The ball was kicked hard by Dorian.  <\/li>\n<li>Mr Sultan was elected captain by the members of the club.  <\/li>\n<li>Can the lead pieces be moved by you?  <\/li>\n<li>Nothing can be done by anyone now.  <\/li>\n<li>A large box was opened by my friend.  <\/li>\n<li>A large crowd was seen by me.  <\/li>\n<li>A very comfortable night was spent by me at the hotel.  <\/li>\n<li>A huge bag was carried by the porter.  <\/li>\n<li>The streets were crowded by anxious supporters of the national team.  <\/li>\n<li>The tree was knocked down by a speeding vehicle.  <\/li>\n<\/ol>\n<p><strong>D. Given below are six pairs of jumbled up sentences. The verb in one sentence in each pair is in active voice, while the other is in passive voice. Rearrange them to form meaningful sentences and write down if they are in active or passive voice. Follow the example.<\/strong>  <\/p>\n<ol>\n<li>the bone / chewed / dog / the  <ul>\n<li>The dog chewed the bone. <strong>(active voice)<\/strong><\/li>\n<li>was chewed / by / the bone / dog/ the  <\/li>\n<li>The bone was chewed by the dog. <strong>(passive voice)<\/strong><\/li>\n<\/ul>\n<\/li>\n<li>were cheered / of the debate / the winners / by the children<br />\n- the winners / cheered / the children / of the debate  <\/li>\n<li>by grandpa / was made / a sandwich<br />\n-  a sandwich / made / grandpa  <\/li>\n<li>Ritika / the flowers / is watering<br />\n -  by Ritika / are being watered / the flowers<\/li>\n<li>helped the old lady / Koel / cross the road<br />\n-  to cross the road / by Koel / the old lady / was helped  <\/li>\n<li>a pizza / Abhinav / bought<br />\n-   by Abhinav / was bought / a pizza  <\/li>\n<\/ol>\n<p><strong>E. Rewrite this passage in the passive voice.<\/strong><br />\nAmit opened the door, switched on the lights and turned on the TV. He took out his wallet and threw it on the bed. Someone had broken the flower vase. Who could have done that? A strange sense of fear plagued him. Was it a haunted room? The sound of a creaking door nearby startled him. Everyone had warned him not to spend the night there.  <\/p>\n<hr />\n<h1>Answers – Active and Passive Voice<\/h1>\n<p><strong>In-text Question (Line 2149):<\/strong><br />\nIn the active voice, the subject performs the action. In the passive voice, the subject receives the action, the object of the active verb becomes the subject, and the verb is expressed in 'be + past participle' form accompanied by 'by'.  <\/p>\n<p><strong>A. Underline the verbs in these sentences and state whether they are in the active or in the passive voice.<\/strong>  <\/p>\n<ol>\n<li>Verb: ploughed | Active voice  <\/li>\n<li>Verb: had caused | Active voice  <\/li>\n<li>Verb: was gifted | Passive voice  <\/li>\n<li>Verb: drank | Active voice  <\/li>\n<li>Verb: dug | Active voice  <\/li>\n<li>Verb: opened | Active voice  <\/li>\n<li>Verb: was accomplished | Passive voice  <\/li>\n<li>Verb: was flung | Passive voice  <\/li>\n<li>Verb: was baked | Passive voice  <\/li>\n<li>Verb: continued | Active voice  <\/li>\n<li>Verb: picked up | Active voice  <\/li>\n<li>Verb: laughed | Active voice  <\/li>\n<li>Verb: was chewing | Active voice  <\/li>\n<li>Verb: unfastened | Active voice  <\/li>\n<li>Verb: obeyed | Active voice  <\/li>\n<li>Verb: will be written | Passive voice  <\/li>\n<li>Verb: ate | Active voice  <\/li>\n<li>Verbs: lined, cheered | Active voice  <\/li>\n<li>Verb: lit | Active voice  <\/li>\n<li>Verb: picked up | Active voice  <\/li>\n<li>Verb: was mailed | Passive voice  <\/li>\n<li>Verb: was bought | Passive voice  <\/li>\n<li>Verb: called off | Active voice  <\/li>\n<li>Verb: cleaned | Active voice  <\/li>\n<li>Verb: is spoken | Passive voice  <\/li>\n<\/ol>\n<p><strong>B. Change the verbs in these sentences from the active to the passive voice. Make changes as required.<\/strong>  <\/p>\n<ol>\n<li>Cakes are loved by children.  <\/li>\n<li>Let the door be opened.  <\/li>\n<li>Special biscuits were made for everyone by Gargi.  <\/li>\n<li>The ball was picked up and kicked by Suresh.  <\/li>\n<li>Her pet dog is loved by my mother.  <\/li>\n<li>Has the painting been completed by you?  <\/li>\n<li>Malini was elected our class monitor by us.  <\/li>\n<li>I was given a gift by Santa Claus. / A gift was given to me by Santa Claus.  <\/li>\n<li>Ice creams are loved by everyone in summer.  <\/li>\n<li>When will the office be shifted?  <\/li>\n<li>This was known to them.  <\/li>\n<li>Rita was kept waiting by Maya.  <\/li>\n<li>Promises should be kept.  <\/li>\n<li>By whom has this been done?  <\/li>\n<li>I was taught maths by your uncle. / Maths was taught to me by your uncle.  <\/li>\n<li>The house is being built by the masons.  <\/li>\n<li>My ring has been stolen.  <\/li>\n<li>We are being watched closely by them.  <\/li>\n<li>What is contained in this packet?  <\/li>\n<li>The flowers in my garden are tended to by the gardener.  <\/li>\n<\/ol>\n<p><strong>C. Change the verbs in these sentences into active voice. Make changes as required.<\/strong>  <\/p>\n<ol>\n<li>A noted politician led the procession.  <\/li>\n<li>Tom troubles Jerry.  <\/li>\n<li>Unveil the painting.  <\/li>\n<li>My mother ordered a cup of coffee.  <\/li>\n<li>Mr Gomes inaugurated the factory.  <\/li>\n<li>Dorian kicked the ball hard.  <\/li>\n<li>The members of the club elected Mr Sultan captain.  <\/li>\n<li>Can you move the lead pieces?  <\/li>\n<li>No one can do anything now.  <\/li>\n<li>My friend opened a large box.  <\/li>\n<li>I saw a large crowd.  <\/li>\n<li>I spent a very comfortable night at the hotel.  <\/li>\n<li>The porter carried a huge bag.  <\/li>\n<li>Anxious supporters of the national team crowded the streets.  <\/li>\n<li>A speeding vehicle knocked down the tree.  <\/li>\n<\/ol>\n<p><strong>D. Rearrange the jumbled up sentences into active or passive voice.<\/strong>  <\/p>\n<ol>\n<li>\n<ul>\n<li>The dog chewed the bone. <strong>(active voice)<\/strong>  <\/li>\n<li>The bone was chewed by the dog. <strong>(passive voice)<\/strong>  <\/li>\n<\/ul>\n<\/li>\n<li>\n<ul>\n<li>The children cheered the winners of the debate. <strong>(active voice)<\/strong>  <\/li>\n<li>The winners of the debate were cheered by the children. <strong>(passive voice)<\/strong>  <\/li>\n<\/ul>\n<\/li>\n<li>\n<ul>\n<li>Grandpa made a sandwich. <strong>(active voice)<\/strong>  <\/li>\n<li>A sandwich was made by grandpa. <strong>(passive voice)<\/strong>  <\/li>\n<\/ul>\n<\/li>\n<li>\n<ul>\n<li>Ritika is watering the flowers. <strong>(active voice)<\/strong>  <\/li>\n<li>The flowers are being watered by Ritika. <strong>(passive voice)<\/strong>  <\/li>\n<\/ul>\n<\/li>\n<li>\n<ul>\n<li>Koel helped the old lady cross the road. <strong>(active voice)<\/strong>  <\/li>\n<li>The old lady was helped to cross the road by Koel. <strong>(passive voice)<\/strong>  <\/li>\n<\/ul>\n<\/li>\n<li>\n<ul>\n<li>Abhinav bought a pizza. <strong>(active voice)<\/strong>  <\/li>\n<li>A pizza was bought by Abhinav. <strong>(passive voice)<\/strong>  <\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>E. Rewrite this passage in the passive voice.<\/strong><br />\nThe door was opened, the lights were switched on and the TV was turned on by Amit. His wallet was taken out by him and thrown on the bed. The flower vase had been broken by someone. By whom could that have been done? He was plagued by a strange sense of fear. Was it a haunted room? He was startled by the sound of a creaking door nearby. He had been warned by everyone not to spend the night there.<\/p>"}], "writing": [{"title": "Notice Writing", "html": "<h2>📌 What is a Notice?<\/h2>\n<p>A <strong>notice<\/strong> is a formal, concise piece of writing used by institutions, schools, or organizations to announce events, issue instructions, or make appeals to a targeted audience. It must be brief, factual, and to the point.  <\/p>\n<h2>📝 Format / Structure (Word Limit: 50 words)<\/h2>\n<p>A notice MUST be enclosed in a <strong>BOX<\/strong>.  <\/p>\n<pre><code class=\"language-text\">+-----------------------------------------------------------------------------+\n|                        NAME OF THE INSTITUTION/SCHOOL                       |\n|                                                                             |\n|                                  NOTICE                                     |\n|                                                                             |\n| Date (e.g., 14 May 2026)                                                    |\n|                                                                             |\n|                             HEADING / TITLE                                 |\n|                                                                             |\n| Body of the Notice: (Target audience, what the event is, date, time, venue, |\n| and whom to contact for further details. Keep it brief and to the point.)   |\n|                                                                             |\n| Signature                                                                   |\n| Name                                                                        |\n| Designation                                                                 |\n+-----------------------------------------------------------------------------+\n<\/code><\/pre>\n<h2>⚖️ CBSE Marking Scheme (Typically 3 Marks)<\/h2>\n<ul>\n<li><strong>Format<\/strong>: 1 Mark (Box, Name of Institution, \"NOTICE\", Date, Heading, Name/Designation)<\/li>\n<li><strong>Content<\/strong>: 1 Marks (What, When, Where, Whom to contact)<\/li>\n<li><strong>Expression<\/strong>: 1 Mark (Grammar, Spelling, Formal Tone)  <\/li>\n<\/ul>\n<h2>💡 Language Tips &amp; Key Rules<\/h2>\n<ul>\n<li><strong>Tone<\/strong>: Formal and objective. Avoid first-person pronouns (I, we) unless used in the designation (e.g., \"The undersigned\").<\/li>\n<li><strong>Passive Voice<\/strong>: Prefer passive structures (e.g., <em>It is hereby notified that...<\/em> or <em>Students are informed that...<\/em>).<\/li>\n<li><strong>The 5 Ws<\/strong>: Ensure your notice answers: <em>What<\/em> is the event? <em>Where<\/em> is the venue? <em>When<\/em> is the date and time? <em>Who<\/em> is eligible? <em>Whom<\/em> to contact?<\/li>\n<li><strong>Word Limit<\/strong>: Strictly adhere to the 50-word limit for the body.  <\/li>\n<\/ul>\n<h2>⚠️ Common Mistakes to Avoid<\/h2>\n<ul>\n<li><strong>Forgetting the Box<\/strong>: This is a guaranteed deduction of marks.<\/li>\n<li><strong>Informal language<\/strong>: Do not use conversational greetings like \"Hello friends\".<\/li>\n<li><strong>Missing deadlines<\/strong>: If an event requires registration, always mention a \"last date to register\".  <\/li>\n<\/ul>\n<hr />\n<h2>🌟 Model Example<\/h2>\n<p><strong>Q: You are the Cultural Secretary of Bal Bharati Public School, Delhi. Your school is organizing an Inter-House Dramatics Competition. Write a notice in about 50 words inviting names from students of Classes IX and X.<\/strong>  <\/p>\n<pre><code class=\"language-text\">+-----------------------------------------------------------------------------+\n|                        BAL BHARATI PUBLIC SCHOOL, DELHI                     |\n|                                                                             |\n|                                    NOTICE                                   |\n|                                                                             |\n| 20 August 2026                                                              |\n|                                                                             |\n|                       INTER-HOUSE DRAMATICS COMPETITION                     |\n|                                                                             |\n| This is to inform all students of Classes IX and X that the school is       |\n| organizing an Inter-House Dramatics Competition on 5 September 2026 in the  |\n| school auditorium from 10:00 AM onwards. The theme for the play is &quot;Unity   |\n| in Diversity&quot;. Interested students must register their names with their     |\n| respective House Captains latest by 28 August 2026.                         |\n|                                                                             |\n| (Signature)                                                                 |\n| Kavita Sharma                                                               |\n| Cultural Secretary                                                          |\n+-----------------------------------------------------------------------------+\n<\/code><\/pre>\n<hr />\n<h2>✍️ Practice Prompts<\/h2>\n<ol>\n<li><strong>Tour/Camp:<\/strong> You are the Sports Captain. Write a notice informing students of Class IX about a 3-day Trekking Camp to Shimla. Mention dates, fees, and the last date for submitting consent forms.<\/li>\n<li><strong>Found:<\/strong> You found a silver wristwatch in the school computer lab. Write a notice for the school notice board asking the rightful owner to claim it by providing necessary identification details.<\/li>\n<\/ol>"}, {"title": "Diary Writing", "html": "<p><strong>Read this extract from the 1864 science-fiction novel by Jules Verne (1828-1905) called <em>the Journey to the Interior of the Earth (also called Journey to the Centre of the Earth)<\/em>.<\/strong>  <\/p>\n<p><em><strong>Monday, August 17<\/strong>: I am trying to recall the peculiar instincts of the monsters of the pre-adamite world, who, coming next in succession after the molluscs, the crustaceans and the fishes, preceded the animals of mammalian race upon the earth. The world then belonged to reptiles. Those monsters held the mastery in the seas of the secondary period. They possessed a perfect organisation, gigantic proportions, prodigious strength. The saurians of our day, the alligators and the crocodiles, are but feeble reproductions of their forefathers of primitive ages.<\/em><br />\n<em>I shudder as I recall these monsters to my remembrance. No human eye has ever beheld them living. I saw at the Hamburg museum the skeleton of one of these creatures thirty feet in length. Am I then fated—I, a denizen of earth—to be placed face to face with these representatives of long extinct families? No; surely it cannot be! Yet the deep marks of conical teeth upon the iron pick are certainly those of the crocodile.<\/em><br />\n<em>My eyes are fearfully bent upon the sea. I dread to see one of these monsters darting forth from its submarine caverns. I suppose Professor Liedenbrock was of my opinion too, and even shared my fears, for after having examined the pick, his eyes traversed the ocean from side to side. What a very bad notion that was of his, I thought to myself, to take soundings just here! He has disturbed some monstrous beast in its remote den, and if we are not attacked on our voyage.<\/em><br />\n<em>I look at our guns and see that they are all right. My uncle notices it, and looks on approvingly.<\/em><br />\n<em>Already widely disturbed regions on the surface of the water indicate some commotion below. The danger is approaching. We must be on the lookout.<\/em>  <\/p>\n<p>What you have just read is a very different form of writing which is written in the first person.<br />\nThis form of writing is called <strong>diary writing<\/strong>. This is yet another form of creative writing and it does have some special features. Let us list them.  <\/p>\n<ul>\n<li>It is written in the first person and the day and date are carefully recorded.  <\/li>\n<li>It is not only a chronicle of the events that have taken place on that day and date, but also a spontaneous expression of emotions.  <\/li>\n<li>Sometimes the diary is given a name. Anne Frank called her diary, 'Kitty'.  <\/li>\n<li>Usually, a diary is maintained by an individual and is not meant for public viewing. So, one can really be honest to the diary and write without inhibitions. However, in a classroom situation, perhaps one has to be diplomatic.  <\/li>\n<li>When writing in a diary, you should keep in mind the normal rules of good writing. Be careful about sentence constructions, paragraphs, ornamentations in language, etc.  <\/li>\n<\/ul>\n<p><strong>NOTE<\/strong>:<br />\n<strong>Mind the format!<\/strong> Every entry must begin with the date and day of the week. Diary entries may also be signed off like letters. You have a wide choice of tenses to use. You may start with the past as you are trying to recall the incidents of the day and end with the present or the past when you are trying to sum up your emotions.  <\/p>\n<p><strong>Now, attempt writing diary entries for the following situations.<\/strong>  <\/p>\n<ol>\n<li>Suppose your parents have left town and you are alone at home for a week. Write a diary entry for each day of the week describing what you did and how you managed.  <\/li>\n<li>Imagine your plane has crashed in the Amazonian rainforest. You are the lone survivor. In the form of a diary, narrate how you spent your days (at least seven) in the wilderness before you were rescued.  <\/li>\n<li>Imagine you have been selected to represent the school at some event (it could be a sports meet, a debate or a quiz). Write three diary entries—the first describing how you prepared for the selection process, the second describing how you felt after you were selected and the third describing what happened when you participated in the competition.  <\/li>\n<\/ol>\n<hr />\n<hr />\n<h1>Answers – Diary Writing<\/h1>\n<p><strong>1.<\/strong>  <\/p>\n<p>Monday, 10 October 20XX<br />\n9:30 p.m.  <\/p>\n<p>Dear Diary,<br />\nMy parents left for Mumbai early this morning to attend an official seminar, leaving me in charge of the house for an entire week. At first, I felt a surge of excitement thinking about the freedom of having the house to myself. However, as evening approached, the silence in the living room felt quite unusual. I cooked simple noodles for dinner and made sure all the doors were locked securely. It is going to be a true test of my independence, but I am determined to manage everything responsibly!  <\/p>\n<p>Tuesday, 11 October 20XX<br />\n10:00 p.m.  <\/p>\n<p>Dear Diary,<br />\nToday was my second day on my own, and it went fairly smoothly. I woke up early on my own alarm, made myself breakfast, and packed my school bag without any reminders. After returning from school, I watered the garden plants and completed my homework before heating up the meal mom had stored in the refrigerator. Managing daily chores alongside studies is definitely harder than it looks, but I am learning to organize my time efficiently.  <\/p>\n<p>Wednesday, 12 October 20XX<br />\n9:45 p.m.  <\/p>\n<p>Dear Diary,<br />\nA minor challenge arose this evening when the kitchen tap started leaking after dinner! For a moment, I panicked seeing water pool on the sink counter. Remembering dad's advice, I located the main valve under the sink and turned it off safely. I then called our neighborhood plumber to fix it. Resolving the issue independently gave me a huge boost of confidence. I spoke to mom on the phone later and she was very proud of how I handled it.  <\/p>\n<p>Thursday, 13 October 20XX<br />\n10:15 p.m.  <\/p>\n<p>Dear Diary,<br />\nToday was a busy school day, but keeping the house tidy has become second nature now. I swept the rooms in the afternoon and kept my study table neatly organized. To avoid feeling lonely in the evening, I played my acoustic guitar for an hour and read a chapter of my adventure novel. Being alone has given me time for quiet self-reflection, and I am enjoying this newly discovered self-reliance.  <\/p>\n<p>Friday, 14 October 20XX<br />\n9:15 p.m.  <\/p>\n<p>Dear Diary,<br />\nWith the weekend approaching, I decided to finish all my pending homework tonight so that I could relax tomorrow. I prepared a simple vegetable stir-fry for dinner, which surprisingly turned out quite delicious! My aunt called in the evening to check on me and invited me over for lunch tomorrow, but I politely declined because I want to complete this week entirely on my own strength.  <\/p>\n<p>Saturday, 15 October 20XX<br />\n10:30 p.m.  <\/p>\n<p>Dear Diary,<br />\nWhat a productive Saturday! I spent the morning doing laundry and cleaning out the refrigerator to make sure everything was fresh. In the afternoon, my friend Rohan visited for a couple of hours, and we played board games in the living room. Handling all household responsibilities while keeping the house spotless has given me a great sense of accomplishment.  <\/p>\n<p>Sunday, 16 October 20XX<br />\n9:00 p.m.  <\/p>\n<p>Dear Diary,<br />\nMy parents finally returned home this evening! They were pleasantly surprised to find the house neat, clean, and well-managed. Mom gave me a warm hug and praised my maturity, while dad gave me an approving pat on the back. This week has been an incredible learning experience. I proved to myself that I can be responsible, self-sufficient, and dependable in any situation.  <\/p>\n<p><strong>2.<\/strong>  <\/p>\n<p>Monday, 4 June 20XX<br />\n8:00 p.m.  <\/p>\n<p>Dear Diary,<br />\nI am writing this with trembling hands by the dim light of a small campfire. Our light aircraft suffered engine failure during a sudden storm and crashed deep inside the Amazon rainforest. Miraculously, I survived with only minor scrapes, but the plane is destroyed and there is no trace of the pilots. I managed to salvage a pocket knife, a flashlight, and a small water bottle from the wreckage. Fear surrounds me in this dense, dark jungle, but I must stay strong to survive.  <\/p>\n<p>Tuesday, 5 June 20XX<br />\n7:30 p.m.  <\/p>\n<p>Dear Diary,<br />\nMy second day in the wilderness was spent securing basic necessities. I built a temporary shelter using fallen palm fronds and branches near the crash site so that rescue teams can spot me easily from the air. Drinking water was my biggest concern, but I managed to collect fresh rainwater using large leaves. The endless calls of unseen birds and insects echo through the trees, keeping me awake, but I am holding onto hope.  <\/p>\n<p>Wednesday, 6 June 20XX<br />\n8:15 p.m.  <\/p>\n<p>Dear Diary,<br />\nHunger set in severely today. Remembering survival documentaries, I carefully avoided bright berries and instead searched for wild bananas and edible palm shoots near a nearby stream. Navigating the thick foliage was exhausting, and I had to be constantly vigilant against snakes and insects. I maintained a smoky fire near my shelter throughout the day, hoping the smoke signal would attract searching aircraft.  <\/p>\n<p>Thursday, 7 June 20XX<br />\n7:45 p.m.  <\/p>\n<p>Dear Diary,<br />\nA heavy tropical downpour battered the rainforest for hours today, dampening my shelter and putting out my fire. It was a miserable, shivering day, but I managed to protect my notebook and matches inside a waterproof pouch from my backpack. Rebuilding the fire after the rain stopped was tough, but seeing the flames flicker back to life restored my spirits. I will not give up.  <\/p>\n<p>Friday, 8 June 20XX<br />\n8:30 p.m.  <\/p>\n<p>Dear Diary,<br />\nToday I heard the distant rumble of a helicopter engine in the afternoon! I rushed to add damp leaves to my fire to create thick white smoke, but the aircraft moved away before spotting me. Though disappointed, hearing search teams gave me immense comfort—it means people are actively looking for me! I constructed a giant 'SOS' sign on a clear patch of ground using light-colored rocks and tree trunks.  <\/p>\n<p>Saturday, 9 June 20XX<br />\n8:00 p.m.  <\/p>\n<p>Dear Diary,<br />\nPhysical fatigue is taking a heavy toll on my body, but my mind remains resolute. I spent the day reinforcing my shelter and gathering firewood to keep the wild animals at bay during the night. Looking up at the tiny patches of night sky visible through the thick jungle canopy, I prayed dearly for my family. I know rescue is near; I just have to endure a little longer.  <\/p>\n<p>Sunday, 10 June 20XX<br />\n6:00 p.m.  <\/p>\n<p>Dear Diary,<br />\nI am writing this from inside a rescue helicopter! Late this afternoon, a search and rescue team spotted my 'SOS' sign and smoke signal while patrolling the sector. A rescue swimmer descended via cable, lifted me to safety, and wrapped me in warm blankets. As the helicopter rose above the green canopy of the Amazon, tears of overwhelming gratitude filled my eyes. I survived seven long days in the wild, and I am finally going home!  <\/p>\n<p><strong>3.<\/strong>  <\/p>\n<p>Friday, 5 August 20XX<br />\n9:00 p.m.  <\/p>\n<p>Dear Diary,<br />\nTomorrow is the final selection trial to choose our school's representative for the State Inter-School Debate Championship. I spent the entire evening refining my speech on renewable energy, double-checking facts, and practicing my delivery in front of the mirror. My throat feels a bit dry from constant practice, and my heart races whenever I think about speaking before the selection panel tomorrow. I have put weeks of hard work into this preparation, and I truly hope I can deliver my best performance.  <\/p>\n<p>Saturday, 6 August 20XX<br />\n8:30 p.m.  <\/p>\n<p>Dear Diary,<br />\nI can hardly contain my joy—I have been selected to represent our school at the State Debate Championship! When the teacher announced my name as the official delegate this afternoon, I felt an overwhelming wave of relief and happiness. My classmates cheered warmly, and the teacher commended my strong arguments and clear voice modulation during the trial. Carrying the responsibility of representing my institution is both thrilling and humbling. I am determined to work even harder now to bring home the trophy!  <\/p>\n<p>Wednesday, 17 August 20XX<br />\n9:30 p.m.  <\/p>\n<p>Dear Diary,<br />\nWhat an unforgettable day! The State Championship took place today at the city auditorium, featuring brilliant speakers from over thirty schools. When my turn came, I stepped up to the podium, took a deep breath, and delivered my speech with utmost conviction and poise. The rebuttal round was intense, but I countered the opposing arguments effectively. To my immense delight, our school won the First Runner-Up trophy! Holding the glittering trophy on stage alongside my mentor teacher was a moment of supreme pride that I will cherish forever.<\/p>"}, {"title": "Narrative Writing", "html": "<p>There are different ways of going about writing a story, and there are no set guidelines that can be followed to ensure a good short story. However, one of the first things to remember is that for your story to be a success, you have to hold the reader's attention.  <\/p>\n<p>Here are some points to keep in mind when writing a short story.  <\/p>\n<ul>\n<li>Decide on a situation—this could be a problem that has to be resolved by the main character or a set of characters. This situation can depend on the title or theme that you are given. The plot is the most important aspect of a short story. Decide the main events and try to think of a twist at the end. Your story must have a beginning, a middle and a satisfactory ending. Everything could end unhappily for all the characters, but at least the reader must know what happened to the people in the story.  <\/li>\n<li>Choose a narrative point of view. You can write your story in the first person (as if you were one of the characters), or in the third person (as a detached narrator who presents the thoughts and observations of several characters). If you write in the first person, be consistent about the use of the pronoun 'I'.  <\/li>\n<li>Create a list of characters. Try to give them individual characteristics. Focus more on the main character.  <\/li>\n<li>Establish believable characters and settings, with vivid descriptions and dialogues, to create a story that your readers will care about. Remember that you have to work within a limited number of words; you cannot go on for pages, so you must use language effectively. Appeal to your readers' five senses to make your settings more real.  <\/li>\n<li>Never underestimate the power of dialogue in revealing the character of a person or the complexity of a situation, but in a short story, there is no place for long speeches. Every word you put into the mouth of your characters must contribute to revealing your theme.  <\/li>\n<\/ul>\n<p><strong>A. Write original short stories based on the given instructions.<\/strong>  <\/p>\n<ol>\n<li>Begin
