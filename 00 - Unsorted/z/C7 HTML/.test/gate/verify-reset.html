different animal species peacefully at the same time.  <\/p>\n<ol>\n<li>He can overcome these challenges by creating organized waiting spaces and separate entrances for different animals, taking help from assistants, and managing treatment schedules efficiently.  <\/li>\n<\/ol>\n<p><strong>III. Arrange the following events in correct order according to the story. Two have been done for you. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Event<\/th>\n<th>Correct Order<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Doctor Dolittle decides to stop being a doctor for people and becomes a doctor for animals.<\/td>\n<td>(iv)<\/td>\n<\/tr>\n<tr>\n<td>2. Animals from near and far come to Doctor Dolittle for help, crowding his garden.<\/td>\n<td>(viii)<\/td>\n<\/tr>\n<tr>\n<td>3. A man with a stomach-ache visits Doctor Dolittle and suggests he should treat animals instead of people.<\/td>\n<td>(i)<\/td>\n<\/tr>\n<tr>\n<td>4. Polynesia teaches Doctor Dolittle animal languages, and he starts understanding and communicating with animals.<\/td>\n<td>(iii)<\/td>\n<\/tr>\n<tr>\n<td>5. A plough horse with vision problems visits Doctor Dolittle, who prescribes green spectacles, to improve the horse's eyesight.<\/td>\n<td>(vi)<\/td>\n<\/tr>\n<tr>\n<td>6. The parrot, Polynesia, encourages Doctor Dolittle to become an animal doctor, revealing that animals can talk.<\/td>\n<td>(ii)<\/td>\n<\/tr>\n<tr>\n<td>7. Doctor Dolittle installs special doors for different animals to enter his house for treatment.<\/td>\n<td>(ix)<\/td>\n<\/tr>\n<tr>\n<td>8. Doctor Dolittle's ability to communicate with animals helps him diagnose and treat their illnesses effectively.<\/td>\n<td>(vii)<\/td>\n<\/tr>\n<tr>\n<td>9. Doctor Dolittle gains fame among animals worldwide, and they come to him from various places for his help.<\/td>\n<td>(x)<\/td>\n<\/tr>\n<tr>\n<td>10. Word spreads, and people start bringing their sick pets and farm animals to Doctor Dolittle for treatment.<\/td>\n<td>(v)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Let us think and reflect<\/h2>\n<p><strong>I Read the extracts given below and answer the questions that follow.<\/strong>  <\/p>\n<p><strong>1.<\/strong><br />\n<strong>(i) Complete the sentence by choosing the correct option.<\/strong><br />\nIn the line, \"Good Gracious!\" cried the Doctor, the expression 'Good Gracious' can be replaced by <strong>B. gosh<\/strong>!  <\/p>\n<p><strong>(ii) Why had Polynesia never used bird language with the Doctor earlier?<\/strong><br />\nPolynesia had never used bird language with the Doctor earlier because she knew he would not have understood her.  <\/p>\n<p><strong>(iii) Identify whether the following statement is true or false.<\/strong><br />\nPolynesia had been munching on a food item while talking to Doctor Dolittle.<br />\n<strong>True<\/strong> (She was dusting cracker crumbs off her wing).  <\/p>\n<p><strong>(iv) How did Doctor Dolittle feel according to the extract?<\/strong><br />\nB. surprised  <\/p>\n<p><strong>2.<\/strong><br />\n<strong>(i) Choose a word from the extract to complete the analogy.<\/strong><br />\ndigging: flower bed:: <strong>ploughing<\/strong>: field  <\/p>\n<p><strong>(ii) Choose the correct word to complete the sentence.<\/strong><br />\nDoctor Dolittle's attitude in the extract is <strong>C. understanding<\/strong>.  <\/p>\n<p><strong>(iii) Complete the sentence with an appropriate reason.<\/strong><br />\nBased on the extract, we can conclude that doctors take animals for granted because <strong>they believe anybody can treat animals since animals do not complain<\/strong>.  <\/p>\n<p><strong>(iv) Do you agree with the concluding sentence of the extract? Why/why not?<\/strong><br />\nYes, I agree because animals cannot speak human language to describe their pain. Therefore, an animal doctor needs to be exceptionally clever and observant to understand animal signals and diagnose them accurately.  <\/p>\n<p><strong>II Answer the following questions.<\/strong>  <\/p>\n<p><strong>1. How can we say that Polynesia was a good trainer of animal language?<\/strong><br />\nPolynesia was a good trainer because she explained animal communication clearly, taught Doctor Dolittle patiently, and gave him bird words slowly so he could write them down in his notebook.  <\/p>\n<p><strong>2. Explain how Doctor Dolittle gave equal and individual attention to each animal who came to him for treatment.<\/strong><br />\nDoctor Dolittle gave equal attention to every animal by learning their specific languages to hear their problems directly. He also constructed customized doors and entrances, including a tiny cellar tunnel for mice, so each species had a dedicated and comfortable space to wait for treatment.  <\/p>\n<p><strong>3. How does Doctor Dolittle's readiness to follow the parrot's advice highlight the importance of listening to different viewpoints?<\/strong><br />\nDoctor Dolittle's open-mindedness shows that listening to advice from unexpected sources can lead to great discoveries and positive life changes. By listening to Polynesia, he found his true calling as a successful animal doctor.  <\/p>\n<p><strong>4. Which qualities of Doctor Dolittle made him famous among the animals? Explain with evidence from the text.<\/strong><br />\nDoctor Dolittle was kind, patient, empathetic, and eager to learn. Evidence from the text includes his effort to write down animal vocabulary, his willingness to get custom green glasses for the plough horse, and his care in building special doors for every animal species.  <\/p>\n<p><strong>5. What changes do you think would happen in the world if people suddenly gained the ability like Doctor Dolittle, to understand and communicate with animals?<\/strong><br />\nIf people could speak to animals, humans would show much greater empathy towards them. People would stop harming animals, treat them with care and respect, protect their natural habitats, and ensure proper medical treatment for them.  <\/p>\n<h2>Let us write<\/h2>\n<p><strong>St. Mark's School, Puddleby<\/strong><br />\n<strong>NOTICE<\/strong>  <\/p>\n<p><strong>12 July 20XX<\/strong><br />\n<strong>Annual Health Check-Up<\/strong>  <\/p>\n<p>This is to <strong>inform<\/strong> all the students of Grades 6–8 about the Annual Health Check-up.<br />\nDate: <strong>Thursday and Friday<\/strong>, 27 and 28 July 20XX<br />\nTime: 9:00 a.m. to 12:15 p.m.<br />\nVenue: <strong>assembly hall<\/strong><br />\nAll students are requested to bring their <strong>health card<\/strong> for the check-up.<br />\nFor <strong>queries<\/strong> or further details <strong>please contact<\/strong> the undersigned.  <\/p>\n<p><strong>Asma<\/strong><br />\nAsma<br />\nIn-charge  <\/p>"}, {"title": "A Funny Man", "html": "<h4>Let us read<\/h4>\n<p><em>One day a funny kind of man<\/em><br />\n<em>Came walking down this street<\/em><br />\n<em>He wore a shoe upon his head<\/em><br />\n<em>And hats upon his feet.<\/em>  <\/p>\n<p><em>He raised the shoe and smiled at me,<\/em><br />\n<em>His manners were polite;<\/em><br />\n<em>But never had I seen before<\/em><br />\n<em>Such a funny sounding sight.<\/em>  <\/p>\n<p><em>He said, 'Allow me to present<\/em><br />\n<em>Your Highness with a rose.'<\/em><br />\n<em>And taking out a currant bun<\/em><br />\n<em>He held it to my nose.<\/em>  <\/p>\n<p><em>I staggered back against the wall<\/em><br />\n<em>And then I answered, 'Well!<\/em><br />\n<em>I never saw a rose with such<\/em><br />\n<em>A funny looking smell.'<\/em>  <\/p>\n<p><em>He then began to sing a song,<\/em><br />\n<em>And sat down on the ground;<\/em><br />\n<em>You never heard in all your life<\/em><br />\n<em>Such a funny feeling sound.<\/em>  <\/p>\n<p><em>'My friend, why do you wear two hats<\/em><br />\n<em>Upon your feet?' I said.<\/em><br />\n<em>He turned the other way about,<\/em><br />\n<em>And hopped home on his head.<\/em>  <\/p>\n<p><strong>NATALIE JOAN<\/strong>  <\/p>\n<hr />\n<h2>Summary<\/h2>\n<p>The poem describes a bizarre and amusing encounter with a \"funny kind of man\" who does everything in an upside-down manner — wearing a shoe on his head and hats on his feet, offering a currant bun as a \"rose,\" and hopping home on his head. The speaker engages with the man, finding his behavior absurd yet oddly charming. The poet uses dialogue and repetition of the word \"funny\" to emphasize the nonsensical, lighthearted nature of the encounter. The poem celebrates harmless silliness and the joy of unexpected humor in everyday life.  <\/p>\n<h2>Poetic Devices<\/h2>\n<ul>\n<li>\n<p><strong>Repetition<\/strong> — The word \"funny\" is repeated throughout (\"funny kind of man,\" \"funny sounding sight,\" \"funny looking smell,\" \"funny feeling sound\") to reinforce the humorous and absurd tone.<\/p>\n<\/li>\n<li>\n<p><strong>Alliteration<\/strong> — \"funny feeling,\" \"funny sounding,\" \"funny looking\" create a playful, rhythmic pattern.<\/p>\n<\/li>\n<li>\n<p><strong>Inversion<\/strong> — \"Never had I seen before / Such a funny sounding sight\" uses reversed word order for poetic rhythm.<\/p>\n<\/li>\n<li>\n<p><strong>Dialogue<\/strong> — The inclusion of direct speech (\"Allow me to present Your Highness with a rose\") makes the poem lively and conversational.<\/p>\n<\/li>\n<li>\n<p><strong>Humor/Irony<\/strong> — The contrast between the man's polite manners and his absurd actions creates situational irony.<\/p>\n<\/li>\n<li>\n<p><strong>Synesthesia<\/strong> — \"Funny sounding sight,\" \"funny looking smell,\" \"funny feeling sound\" deliberately mix sensory categories (sound+sight, sight+smell, feeling+sound), creating an absurd, disorienting effect that mirrors the man's upside-down world.<\/p>\n<\/li>\n<li>\n<p><strong>Oxymoron<\/strong> — \"Funny sounding sight\" combines contradictory sensory experiences, heightening the nonsense.<\/p>\n<\/li>\n<li>\n<p><strong>Hyperbole<\/strong> — The entire scenario is exaggerated beyond plausibility — a man wearing shoes on his head and hats on his feet — to maximize comedic effect.<\/p>\n<\/li>\n<li>\n<p><strong>Imagery<\/strong> — \"He wore a shoe upon his head / And hats upon his feet\" paints a vivid, comical visual.<\/p>\n<\/li>\n<\/ul>\n<h2>Rhyme Scheme<\/h2>\n<p>ABCB — each stanza uses a four-line pattern with lines 2 and 4 rhyming (e.g., street/feet, me/be, rose/nose, ground/sound).<\/p>\n<hr />\n<h4>Let us discuss<\/h4>\n<p><strong>I. Work in pairs. Identify the true statements. Check your answers with the teacher.<\/strong>  <\/p>\n<ol>\n<li>The poet says that she had never heard such an amusing song.  <\/li>\n<li>The funny man was quite ill-mannered.  <\/li>\n<li>The funny man wore two hats on his feet.  <\/li>\n<li>The funny man hopped on his head to reach home.  <\/li>\n<li>The funny man gave a rose to the poet.  <\/li>\n<li>The funny man smiled at the poet.  <\/li>\n<\/ol>\n<p><strong>II. Identify the words from the poem based on the meanings given. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<ol>\n<li>a small seedless raisin – <code>C _ R _ _ _ T<\/code>  <\/li>\n<li>moved unsteadily – <code>S _ _ G G _ _ _ D<\/code>  <\/li>\n<\/ol>\n<p><strong>III. Complete the following sentences with a reason.<\/strong>  <\/p>\n<ol>\n<li>The tone of the poem is <code>_______<\/code> because <code>_______<\/code>.  <\/li>\n<li>The rhyme scheme of the poem is <code>_______<\/code>; and it gives a <code>_______<\/code> quality to the poem.  <\/li>\n<li>The poet has frequently repeated the word 'funny' in order to <code>_______<\/code>.  <\/li>\n<\/ol>\n<p><strong>IV. Choose the correct answer from the options given in the brackets.<\/strong>  <\/p>\n<ol>\n<li>The poem uses vivid imagery to create a <code>_______<\/code> (humorous and nonsensical/ confusing but thought-provoking) scene.  <\/li>\n<li>The structure of the poem is in <code>_______<\/code> (monologue/ dialogue) form.  <\/li>\n<li>The phrases 'sounding sight' and 'hopped home' are examples of <code>_______<\/code>. (alliteration/simile)  <\/li>\n<\/ol>\n<p><strong>V. Rewrite the following line from the poem in the correct order.<\/strong>  <\/p>\n<ol>\n<li>\n<p><em>But never had I seen before<\/em><br />\n<em>Such a funny sounding sight.<\/em><br />\n<strong>Sometimes, the poets change the word order (inversion) in a line in order to maintain a rhythm.<\/strong>  <\/p>\n<\/li>\n<li>\n<p>Why has the poet used phrases like 'funny sounding sight' and 'funny feeling sound' with reference to the funny man?  <\/p>\n<\/li>\n<\/ol>\n<p><strong>VI. Can you think of any real-world situations where people do similar things for fun, entertainment, or performance? Share with your classmates and the teacher.<\/strong>  <\/p>\n<h4>Let us think and reflect<\/h4>\n<p><strong>I. Read the extracts given below and answer the questions that follow.<\/strong>  <\/p>\n<ol>\n<li><em>He said, \"Allow me to present Your Highness with a rose.\" And taking out a currant bun He held it to my nose.<\/em><br />\n<em>I staggered back against the wall And then I answered, \"Well!\"<\/em>  <\/li>\n<\/ol>\n<p>(i) Why does the funny man address the poet as 'Your Highness'?<br />\n(ii) Choose a phrase from the extract which indicates a polite request.<br />\n(iii) Choose the option which shows a 'currant bun'.  <\/p>\n<ul>\n<li>A. Image 1  <\/li>\n<li>B. Image 2  <\/li>\n<li>C. Image 3  <\/li>\n<li>D. Image 4<br />\n(iv) Complete the sentence with an appropriate reason.<br />\n<em>When the poet says, 'Well!', it expresses surprise. This was so because <code>__________<\/code>.<\/em>  <\/li>\n<\/ul>\n<ol start=\"2\">\n<li><em>You never heard in all your life<\/em><br />\n<em>Such a funny feeling sound.<\/em><br />\n<em>\"My friend, why do you wear two hats<\/em><br />\n<em>Upon your feet?\" I said.<\/em><br />\n<em>He turned the other way about,<\/em><br />\n<em>And hopped home on his head.<\/em>  <\/li>\n<\/ol>\n<p>(i) Choose the line from the extract which tells us that the sound was unique.<br />\n(ii) Complete the sentence with an appropriate reason.<br />\n<em>The poet calls the funny man 'my friend' because <code>_____<\/code>.<\/em><br />\n(iii) What does the reaction of the funny man to the poet's question tell us about him?<br />\n(iv) Choose the correct option to complete the sentence.<br />\n<em>The last line of the extract makes the readers feel <code>_____<\/code>.<\/em>  <\/p>\n<ul>\n<li>A. dreamy  <\/li>\n<li>B. impatient  <\/li>\n<li>C. worried  <\/li>\n<li>D. cheerful  <\/li>\n<\/ul>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>Which character trait of the funny man was most appealing to you? Why?  <\/li>\n<li>The funny man does unusual things in the poem. How does it affect the overall mood of the poem?  <\/li>\n<li>What alternative title would you suggest for the poem? Give reason(s) for your choice.  <\/li>\n<li>Why do you think the poet has included dialogues in the poem?  <\/li>\n<li>What does the poet wish to convey by highlighting the unusual behaviour of the funny man?  <\/li>\n<\/ol>\n<h4>Let us write<\/h4>\n<p><strong>I. A limerick is a nonsensical and funny verse consisting of five lines. Study the limerick given below and identify the rhyme scheme.<\/strong>  <\/p>\n<ol>\n<li><em>There was an Old Man with a beard,<\/em><br />\n<em>Who said, \"It is just as I feared!<\/em><br />\n<em>Two Owls and a Hen,<\/em><br />\n<em>Four Larks and a Wren,<\/em><br />\n<em>Have all built their nests in my beard!\"<\/em>  <\/li>\n<\/ol>\n<p><strong>Edward Lear<\/strong>  <\/p>\n<p><strong>Now, read another limerick<\/strong>  <\/p>\n<ol start=\"2\">\n<li><em>There were two friends in Bengaluru's lanes,<\/em><br />\n<em>One loved books, the other flew planes.<\/em><br />\n<em>They'd laugh and they'd play,<\/em><br />\n<em>In their own unique way,<\/em><br />\n<em>Creating stories and flying in dreams' trains.<\/em>  <\/li>\n<\/ol>\n<p>Remember all limericks have the same rhyme scheme AABBA.  <\/p>\n<p><strong>II. Follow the structure given below and write a limerick on your own.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Line(s)<\/th>\n<th>Description<\/th>\n<th>Content Template<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Introduction<\/td>\n<td>There was a child from <code>______<\/code><\/td>\n<\/tr>\n<tr>\n<td>2-4<\/td>\n<td>A silly story<\/td>\n<td>Who <code>______<\/code> <br> She/He <code>______<\/code><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Unexpected ending<\/td>\n<td>An unexpected ending <code>______<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h1>Answers – A FUNNY MAN<\/h1>\n<h2>Let us discuss<\/h2>\n<p><strong>I. Work in pairs. Identify the true statements. Check your answers with the teacher.<\/strong>  <\/p>\n<ol>\n<li>True  <\/li>\n<li>True  <\/li>\n<li>True  <\/li>\n<li>True<br />\n(Statements 2 and 5 are false.)  <\/li>\n<\/ol>\n<p><strong>II. Identify the words from the poem based on the meanings given. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<ol>\n<li>a small seedless raisin – <strong>CURRANT<\/strong>  <\/li>\n<li>moved unsteadily – <strong>STAGGERED<\/strong>  <\/li>\n<\/ol>\n<p><strong>III. Complete the following sentences with a reason.<\/strong>  <\/p>\n<ol>\n<li>The tone of the poem is <strong>humorous and light-hearted<\/strong> because <strong>it describes the silly and upside-down actions of a funny man in a playful manner<\/strong>.  <\/li>\n<li>The rhyme scheme of the poem is <strong>abcb<\/strong>; and it gives a <strong>musical and rhythmic<\/strong> quality to the poem.  <\/li>\n<li>The poet has frequently repeated the word 'funny' in order to <strong>emphasize the nonsensical, odd, and amusing nature of the man and his actions<\/strong>.  <\/li>\n<\/ol>\n<p><strong>IV. Choose the correct answer from the options given in the brackets.<\/strong>  <\/p>\n<ol>\n<li><strong>humorous and nonsensical<\/strong>  <\/li>\n<li><strong>dialogue<\/strong>  <\/li>\n<li><strong>alliteration<\/strong>  <\/li>\n<\/ol>\n<p><strong>V. Rewrite the following line from the poem in the correct order.<\/strong>  <\/p>\n<ol>\n<li>\n<p><em>But never had I seen before / Such a funny sounding sight.<\/em><br />\n<strong>Rewritten order<\/strong>: But I had never seen such a funny sounding sight before.  <\/p>\n<\/li>\n<li>\n<p><strong>Why has the poet used phrases like 'funny sounding sight' and 'funny feeling sound' with reference to the funny man?<\/strong><br />\nThe poet used these phrases with mixed senses (sight, sound, feeling) to highlight the upside-down, absurd, and comical nature of the funny man.  <\/p>\n<\/li>\n<\/ol>\n<p><strong>VI. Can you think of any real-world situations where people do similar things for fun, entertainment, or performance? Share with your classmates and the teacher.<\/strong><br />\nYes, circus clowns, street performers, acrobats, and stage actors often wear silly costumes, perform absurd tricks, and act in upside-down ways to entertain audiences and bring laughter to people.  <\/p>\n<h2>Let us think and reflect<\/h2>\n<p><strong>I. Read the extracts given below and answer the questions that follow.<\/strong>  <\/p>\n<p><strong>1.<\/strong><br />\n<strong>(i) Why does the funny man address the poet as 'Your Highness'?<\/strong><br />\nThe funny man addresses the poet as 'Your Highness' in a mock-polite and humorous way to act like a grand, formal gentleman.  <\/p>\n<p><strong>(ii) Choose a phrase from the extract which indicates a polite request.<\/strong><br />\n\"Allow me to present\"  <\/p>\n<p><strong>(iii) Choose the option which shows a 'currant bun'.<\/strong><br />\nB. Image 2  <\/p>\n<p><strong>(iv) Complete the sentence with an appropriate reason.<\/strong><br />\nWhen the poet says, 'Well!', it expresses surprise. This was so because <strong>the funny man offered a currant bun to her nose while calling it a rose<\/strong>.  <\/p>\n<p><strong>2.<\/strong><br />\n<strong>(i) Choose the line from the extract which tells us that the sound was unique.<\/strong><br />\n\"Such a funny feeling sound.\"  <\/p>\n<p><strong>(ii) Complete the sentence with an appropriate reason.<\/strong><br />\nThe poet calls the funny man 'my friend' because <strong>he was polite, friendly, and amusing, making her feel comfortable despite his strange behavior<\/strong>.  <\/p>\n<p><strong>(iii) What does the reaction of the funny man to the poet's question tell us about him?<\/strong><br />\nHis reaction shows that he is playful, mysterious, nonsensical, and prefers doing comical actions rather than giving a logical explanation.  <\/p>\n<p><strong>(iv) Choose the correct option to complete the sentence.<\/strong><br />\nThe last line of the extract makes the readers feel <strong>D. cheerful<\/strong>.  <\/p>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<p><strong>1. Which character trait of the funny man was most appealing to you? Why?<\/strong><br />\nThe most appealing character trait of the funny man was his polite and cheerful behavior. Even while doing absurd things like wearing a shoe on his head or hopping on his head, he remained polite and friendly.  <\/p>\n<p><strong>2. The funny man does unusual things in the poem. How does it affect the overall mood of the poem?<\/strong><br />\nThe unusual actions of the funny man make the overall mood of the poem light-hearted, joyful, humorous, and entertaining for the readers.  <\/p>\n<p><strong>3. What alternative title would you suggest for the poem? Give reason(s) for your choice.<\/strong><br />\nAn alternative title would be \"The Upside-Down Gentleman\", because the man acts like a polite gentleman while wearing shoes on his head and hats on his feet.  <\/p>\n<p><strong>4. Why do you think the poet has included dialogues in the poem?<\/strong><br />\nThe poet included dialogues to make the poem more lively and conversational, allowing readers to directly hear the funny interaction between the poet and the man.  <\/p>\n<p><strong>5. What does the poet wish to convey by highlighting the unusual behaviour of the funny man?<\/strong><br />\nThe poet wishes to convey that harmless silliness, humor, and fun can make daily life cheerful and delightful.  <\/p>\n<h2>Let us write<\/h2>\n<p><strong>I. A limerick is a nonsensical and funny verse consisting of five lines. Study the limerick given below and identify the rhyme scheme.<\/strong>  <\/p>\n<ol>\n<li><strong>Rhyme scheme<\/strong>: AABBA (beard - A, feared - A, Hen - B, Wren - B, beard - A)  <\/li>\n<li><strong>Rhyme scheme<\/strong>: AABBA (lanes - A, planes - A, play - B, way - B, trains - A)  <\/li>\n<\/ol>\n<p><strong>II. Follow the structure given below and write a limerick on your own.<\/strong>  <\/p>\n<p>There was a young child from Bengal,<br />\nWho bounced up and down like a ball.<br />\nHe wore boots on his nose,<br />\nAnd picked flowers with his toes,<br />\nAnd hopped past the high garden wall.  <\/p>"}, {"title": "Say the Right Thing", "html": "<h4>Let us read<\/h4>\n<p>This is a humorous play in which a mother advises her daughter to say the right thing at the right time. However, when guests arrive, the daughter hilariously forgets her mother's guidance.  <\/p>\n<p>Read the play to find out how she commits blunders and embarrasses the guests as well as her mother.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Character<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>MARY SHAW<\/td>\n<td>a young girl<\/td>\n<\/tr>\n<tr>\n<td>MRS. SHAW<\/td>\n<td>Mary's mother<\/td>\n<\/tr>\n<tr>\n<td>MRS. HARDING<\/td>\n<td>the wife of Mr. Harding, a wealthy man<\/td>\n<\/tr>\n<tr>\n<td>MRS. LEE<\/td>\n<td>Mr. Harding's married sister<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>hilariously<\/strong><\/td>\n<td>in a very funny way<\/td>\n<\/tr>\n<tr>\n<td><strong>blunders<\/strong><\/td>\n<td>careless mistakes<\/td>\n<\/tr>\n<tr>\n<td><strong>embarrasses<\/strong><\/td>\n<td>makes (the guests) uncomfortable<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Scene I<\/strong>  <\/p>\n<p><strong>MRS. SHAW<\/strong>: The room looks cleaner now. Put that coat away in your bedroom. This room isn't the place for coats.  <\/p>\n<p>Mrs. Harding and Mrs. Lee will soon be here, and they don't want to see that.  <\/p>\n<p><strong>MARY<\/strong> : You're always telling me to put things away.  <\/p>\n<p><strong>MRS. SHAW<\/strong>: Yes, I am. You leave your clothes all over the house.  <\/p>\n<p><strong>MARY<\/strong> : I'm not a child!  <\/p>\n<p><strong>MRS. SHAW<\/strong>: No, you're not. So please keep your clothes in your own room.  <\/p>\n<p><strong>MARY<\/strong> : Why are those two women coming here? Who's Mrs. Harding?  <\/p>\n<p><strong>MRS. SHAW<\/strong>: She's the wife of a wealthy man, Mr. Harding. He has just bought a big house in Lanfield. They lived in London before. She's coming to have a talk. I met her in a shop and asked her to come.  <\/p>\n<p><strong>MARY<\/strong> : Oh, I've seen her children. They often come along the road. Who's Mrs. Lee?  <\/p>\n<p><strong>MRS. SHAW<\/strong>: She's Mr. Harding's sister. She has been staying with them for a while.  <\/p>\n<p><strong>MARY<\/strong> : What are you going to talk about?  <\/p>\n<p><strong>MRS. SHAW<\/strong>: I don't know. All kinds of things. One day you'll have to go to some of these houses yourself and talk to the people there.  <\/p>\n<p><strong>MARY<\/strong> : I can talk now. I've been able to talk for a long time.  <\/p>\n<p><strong>MRS. SHAW<\/strong>: Yes, that's true. You always talk too much. But does anyone want to hear the things that you say?  <\/p>\n<p><strong>MARY<\/strong> : I can talk very well when I like. I'll stay with you today and talk to them when they come.  <\/p>\n<p><strong>MRS. SHAW<\/strong>: Oh, I don't think so. You can go out for a walk. It will be better if you do that.  <\/p>\n<p><strong>MARY<\/strong> : Why?  <\/p>\n<p><strong>MRS. SHAW<\/strong>: If you stay with me, you may not say the right thing.  <\/p>\n<p><strong>MARY<\/strong> : I know the right things to say: 'Good afternoon', 'How are you?' and things like that. Let me stay today. I can do it very well. I'll show you. Anyone can talk.  <\/p>\n<p><strong>MRS. SHAW<\/strong>: You may stay if you like. But take care. I want to know Mrs. Harding well. I want her to ask me to go to their house. There isn't much to do here in Lanfield, and I want to know some more people. I want some more friends here. So take care when you say anything.  <\/p>\n<p><strong>MARY<\/strong> : Tell me what to say.  <\/p>\n<p><strong>MRS. SHAW<\/strong>: I can't tell you everything, but you'll always be right if you're kind to people. Say things that will please them. Then they'll like you. Laugh a lot, and try to make them laugh too. And if everyone stops talking, say something to make them talk again. They don't want to sit here and look at the floor without speaking. Think of something to say.  <\/p>\n<p><strong>MARY<\/strong> : I can do that. There's always something to say. Must I do anything else?  <\/p>\n<p><strong>MRS. SHAW<\/strong>: When they are ready to leave, don't jump out of your chair and look gladly at the door. You must look sorry when they want to leave.  <\/p>\n<p><strong>MARY<\/strong> : What shall I do when they want to go?  <\/p>\n<p><strong>MRS. SHAW<\/strong>: Ask them to stay a little while longer. Just say, 'Must you go? Can't you stay?' or something like that. You like them and you want them to stay, and you must let them understand that.  <\/p>\n<p><strong>MARY<\/strong> : That's not very hard, is it? I'll remember that. 'Must you go? Can't you stay? Must you go? Can't you stay?'  <\/p>\n<p><strong>MRS. SHAW<\/strong>: That's right. Now take your coat to your room and change into a clean dress. You must look nice when they come. And if everyone stops talking, say something kind to make them talk again. And don't say anything that will make them angry.  <\/p>\n<p><strong>MARY<\/strong> : I will remember. I've often done harder things than this.  <\/p>\n<h4>Let us discuss<\/h4>\n<p><strong>I. Complete the table given below based on Scene I of the play. An example has been done for you. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Speaker<\/th>\n<th>Words of the Speaker<\/th>\n<th>Reason<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Mrs. Shaw<\/td>\n<td>The room looks cleaner now. Put that coat away in your bedroom.<\/td>\n<td>To instruct Mary to keep the room tidy<\/td>\n<\/tr>\n<tr>\n<td>Mary<\/td>\n<td>You're always telling me to put things away.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>I'm not a child!<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Mrs. Shaw<\/td>\n<td><\/td>\n<td>To highlight the importance of being kind as a way to ensure Mary says the appropriate things when guests arrive<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>II. Do you think Mary will be able to follow her mother's advice successfully when Mrs. Harding and Mrs. Lee visit? Why or why not?<\/strong>  <\/p>\n<p><strong>Scene II<\/strong>  <\/p>\n<p><strong>MRS. SHAW<\/strong> : So you like Lanfield, Mrs. Harding! I'm very glad.  <\/p>\n<p><strong>MRS. HARDING<\/strong> : Yes, we like it very much. It's not the same as London, but there are some very nice people here, and we've found a good house. <em>(No one says anything more, and Mrs. Shaw looks at Mary.)<\/em>  <\/p>\n<p><strong>MARY<\/strong> : What beautiful children you have, Mrs. Harding! I've often seen them walking along the road.  <\/p>\n<p><strong>MRS. HARDING<\/strong> : Oh, I haven't any children.  <\/p>\n<p><strong>MARY<\/strong> : Oh, yes, you have! I've seen them: a little boy and a little girl.  <\/p>\n<p><strong>MRS. HARDING<\/strong> : <em>(not very pleased)<\/em> I have no children; believe me.  <\/p>\n<p><strong>MARY<\/strong> : Oh!  <\/p>\n<p><strong>MRS. SHAW<\/strong> : <em>(quietly)<\/em> They must be someone else's children. Have you met Mr. Best? He's a nice man. He lives near you.  <\/p>\n<p><strong>MARY<\/strong> : Oh, Mr. Best! He lives here and he works in London. He goes all the way to London by train every morning, and then he comes all the way back by train every night. He lives in trains! <em>(she laughs)<\/em> What kind of life is that? Why do people do things like that? They do not know how to live. And he reads two newspapers in the train every day. He never reads a book. But he's only a banker, and bankers can't think.  <\/p>\n<p><strong>MRS. LEE<\/strong> : My brother's a banker. He goes to London by train every morning and comes back every night. He reads two newspapers in the train in the morning, and another every night.  <\/p>\n<p><strong>MARY<\/strong> : Oh, I'm sorry. I didn't know.  <\/p>\n<p><strong>MRS. SHAW<\/strong> : Bankers always have to read a lot of newspapers. Do you know Mrs. Best? She's a nice woman. I like her.  <\/p>\n<p><strong>MARY<\/strong> : But have you seen her clothes? She goes out in a blue dress with a red coat over it. <em>(she laughs)<\/em>  <\/p>\n<p><strong>MRS. HARDING<\/strong>: I have a blue dress, and I often put on my red coat at the same time.  <\/p>\n<p><strong>MRS. SHAW<\/strong>: <em>(quickly)<\/em> I like blue dresses and red coats. <em>(No one says anything.)<\/em>  <\/p>\n<p><strong>MARY<\/strong>: I saw Mrs. Cotter this afternoon. I met her in the street. No one sees her in the morning because she always stays in bed then. And she's always asking the doctor to go to see her. I can't understand women who stay in bed in the morning. And why must she always ask for the doctor? I've never been to a doctor in my life.  <\/p>\n<p><strong>MRS. HARDING<\/strong>: I stay in bed in the morning myself.  <\/p>\n<p><strong>MRS. LEE<\/strong>: I often go to the doctor.  <\/p>\n<p><strong>MARY<\/strong>: Oh, I'm sorry. <em>(No one speaks.)<\/em>  <\/p>\n<p><strong>MRS. SHAW<\/strong>: Do you know Mrs. Grantley? She's one of my best friends.  <\/p>\n<p><strong>MARY<\/strong>: But she's so talkative! Talkative women aren't very interesting, are they?  <\/p>\n<p><strong>MRS. LEE<\/strong>: My mother's a very talkative woman.  <\/p>\n<p><strong>MARY<\/strong>: Oh, I'm sorry. I didn't know. <em>(No one says anything.)<\/em>  <\/p>\n<p><strong>MARY<\/strong>: <em>(looking out of the window):<\/em> Oh, there's that dog again! It always looks very dirty. I don't like dogs, do you? Who wants a dog? That dog's always near our house. Why do people keep dogs? Who wants a dog? Why doesn't its owner keep it clean? Have you seen it?  <\/p>\n<p><strong>MRS. HARDING<\/strong>: <em>(looking out of the window)<\/em> Yes, I've seen it. That's Towzer. It's our dog.  <\/p>\n<p><strong>MARY<\/strong> : <em>(with a red face)<\/em> Oh, I didn't know! <em>(No one speaks.)<\/em>  <\/p>\n<p><strong>MARY<\/strong> : <em>(still looking out of the window)<\/em> There's Mr. Pomeroy on his horse. He's always talking about horses. He rides a horse every day, and practises shooting. Why must he do that? What have they done to Mr. Pomeroy? Why do some men like horses more than they like people? It's hard to understand men.  <\/p>\n<p><strong>MRS. LEE<\/strong> : My brother practises shooting when he has the time, and he rides his horse when he can. He sold his house in London and bought a house here because he wanted to ride and practise shooting.  <\/p>\n<p><strong>MRS. HARDING<\/strong> : <em>(looking at Mrs. Lee)<\/em> It's getting a little late. We must go now, Mrs. Shaw. It has been very nice to have a little talk. <em>(She looks at Mary.)<\/em>  <\/p>\n<p><strong>MRS. LEE<\/strong> : Very nice. <em>(She looks at Mary.)<\/em>  <\/p>\n<p><strong>MRS. SHAW<\/strong> : It was very good of you to come to see us. Please stay a little longer.  <\/p>\n<p><strong>MARY<\/strong> : <em>(unable to say the right thing even now)<\/em> Oh, must you stay? Can't you go?  <\/p>\n<p><strong>G.C. THORNLEY<\/strong>  <\/p>\n<h4>Let us discuss<\/h4>\n<p><strong>I. Rectify the <em>false<\/em> statements given below from Scene II of the play. An example has been done for you. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<ol>\n<li>\n<p>Mrs. Harding states that they do not like London as it is not the same as Lanfield.<br />\n   Rectification: Mrs. Harding states that they like Lanfield very much even though it is not the same as London.<\/p>\n<\/li>\n<li>\n<p>Mrs. Harding was pleased to know that Mary was familiar with her children.  <\/p>\n<\/li>\n<li>Mrs. Shaw shared that she liked Mrs. Best as she read a lot of newspapers.  <\/li>\n<li>Mrs. Harding and Mrs. Shaw agree that wearing a blue dress with a red coat is unfashionable.  <\/li>\n<li>Mary shares that she finds the dog outside the window cute.  <\/li>\n<\/ol>\n<h4>Let us think and reflect<\/h4>\n<p><strong>I. Read the extracts given below and answer the questions that follow.<\/strong>  <\/p>\n<ol>\n<li><strong>MARY<\/strong> : What are you going to talk about?  <\/li>\n<\/ol>\n<p><strong>MRS. SHAW<\/strong>: I don't know. All kinds of things. One day you'll have to go to some of these houses yourself and talk to the people there.  <\/p>\n<p><strong>MARY<\/strong> : I can talk now. I've been able to talk for a long time.  <\/p>\n<p><strong>MRS. SHAW<\/strong>: Yes, that's true. You always talk too much. But does anyone want to hear the things that you say?  <\/p>\n<p><strong>MARY<\/strong> : I can talk very well when I like. I'll stay with you today and talk to them when they come.  <\/p>\n<p><strong>MRS. SHAW<\/strong>: Oh, I don't think so. You can go out for a walk. It will be better if you do that.  <\/p>\n<p>(i) What does Mrs. Shaw imply when she says, \"One day you'll have to go to some of these houses yourself and talk to the people there\"?  <\/p>\n<ul>\n<li>A. She believes Mary should start learning about hosting guests then.  <\/li>\n<li>B. She thinks Mary is ready to visit these houses independently.  <\/li>\n<li>C. She wants Mary to develop social skills for the future.  <\/li>\n<li>D. She hopes Mary will avoid these social interactions entirely.  <\/li>\n<\/ul>\n<p>(ii) Complete the following sentence with the correct option from the brackets.<br />\n<em>Mrs. Shaw and Mary are discussing how to <code>____________<\/code>.(have a polite conversation/ get to know people better)<\/em><br />\n(iii) Why did Mary insist on staying with her mother when the guests arrived?<br />\n(iv) Match the following character traits to the characters in the extract:  <\/p>\n<ul>\n<li>A. eager  <\/li>\n<li>B. inexperienced  <\/li>\n<li>C. cautious<br />\n<strong>Mary<\/strong>      <strong>Mrs. Shaw<\/strong>  <\/li>\n<\/ul>\n<ol start=\"2\">\n<li><strong>MARY<\/strong> : I saw Mrs. Cotter this afternoon. I met her in the street. No one sees her in the morning because she always stays in bed then. And she's always asking the doctor to go to see her. I can't understand women who stay in bed in the morning. And why must she always ask for the doctor? I've never been to a doctor in my life.  <\/li>\n<\/ol>\n<p><strong>MRS. HARDING<\/strong> : I stay in bed in the morning myself.  <\/p>\n<p>(i) Complete the following sentence suitably.<br />\n<em>Mary could spot Mrs. Cotter in the street because <code>_______<\/code>.<\/em><br />\n(ii) What does Mary's comment about Mrs. Cotter staying in bed and calling the doctor suggest about her understanding?  <\/p>\n<ul>\n<li>A. She is worried about why Mrs. Cotter stays in bed all morning.  <\/li>\n<li>B. She is unable to understand why people need medical help.  <\/li>\n<li>C. She thinks Mrs. Cotter is scared and lonely for staying in bed.  <\/li>\n<li>D. She believes Mrs. Cotter is right to rest and take care of herself.<br />\n(iii) How can we say that Mary enjoyed good health?<br />\n(iv) Identify whether the following statement is true or false.<br />\n<em>Mary might have unintentionally offended Mrs. Harding.<\/em>  <\/li>\n<\/ul>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>What does Mary's comment about Mr. Best's routine and profession reveal about her viewpoint on bankers and their way of life?  <\/li>\n<li>What can we infer about Mary's understanding of polite conversation based on her interactions with the guests?  <\/li>\n<li>What do you think the repeated stage direction 'no one speaks' indicates about the atmosphere in the room when Mary speaks?  <\/li>\n<li>How does Mary's attitude towards the guests change throughout the play?  <\/li>\n<li>What do Mrs. Harding's and Mrs. Lee's responses to Mary's blunders during their visit reveal about their characters?  <\/li>\n<li>In what way does the play show the importance of knowing how to engage in polite conversation?  <\/li>\n<\/ol>\n<h4>Let us write<\/h4>\n<p>Rewrite the play 'Say the Right Thing' as a short story, focusing on Mary's interactions with her mother and the guests.  <\/p>\n<ul>\n<li>Ensure the story captures the main events, character emotions, and humorous moments effectively.  <\/li>\n<li>Use paragraphs to organise your story and include descriptive language to bring the characters and events to life.  <\/li>\n<\/ul>\n<p>You may refer to the following hints:  <\/p>\n<ul>\n<li>Begin with an introduction: describe Mary and Mrs. Shaw, their relationship and the setting of the story.  <\/li>\n<li>Explain Mrs. Shaw's instructions to Mary before the guests arrive and Mary's confidence in handling the situation.  <\/li>\n<li>Narrate the events when Mrs. Harding and Mrs. Lee visit, highlighting Mary's remarks and the guests' reactions.  <\/li>\n<li>Include key moments of humour and awkwardness to maintain the tone of the play.  <\/li>\n<li>Conclude by commenting on how the visit ended and Mary's impact on the situation.  <\/li>\n<\/ul>\n<hr />\n<h2>UNIT 3: DREAMS AND DISCOVERIES<\/h2>\n<hr />\n<h1>Answers – SAY THE RIGHT THING<\/h1>\n<h2>Let us discuss<\/h2>\n<h3>Scene I<\/h3>\n<p><strong>I. Complete the table given below based on Scene I of the play. An example has been done for you. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Speaker<\/th>\n<th>Words of the Speaker<\/th>\n<th>Reason<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Mrs. Shaw<\/td>\n<td>The room looks cleaner now. Put that coat away in your bedroom.<\/td>\n<td>To instruct Mary to keep the room tidy<\/td>\n<\/tr>\n<tr>\n<td>Mary<\/td>\n<td>You're always telling me to put things away.<\/td>\n<td>To complain about her mother constantly reminding her to keep things tidy<\/td>\n<\/tr>\n<tr>\n<td>Mary<\/td>\n<td>I'm not a child!<\/td>\n<td>To assert her independence and maturity<\/td>\n<\/tr>\n<tr>\n<td>Mrs. Shaw<\/td>\n<td>You'll always be right if you're kind to people. Say things that will please them.<\/td>\n<td>To highlight the importance of being kind as a way to ensure Mary says the appropriate things when guests arrive<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>II. Do you think Mary will be able to follow her mother's advice successfully when Mrs. Harding and Mrs. Lee visit? Why or why not?<\/strong><br />\nNo, Mary will likely not be able to follow her mother's advice successfully because she is overly confident, talkative, and speaks without thinking about whether her remarks might offend others.  <\/p>\n<h3>Scene II<\/h3>\n<p><strong>I. Rectify the <em>false<\/em> statements given below from Scene II of the play. An example has been done for you. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<ol>\n<li>\n<p>Mrs. Harding states that they do not like London as it is not the same as Lanfield.<br />\n   Rectification: Mrs. Harding states that they like Lanfield very much even though it is not the same as London.  <\/p>\n<\/li>\n<li>\n<p>Mrs. Harding was pleased to know that Mary was familiar with her children.<br />\n   Rectification: Mrs. Harding was not pleased because she had no children and Mary insisted that she did.  <\/p>\n<\/li>\n<li>\n<p>Mrs. Shaw shared that she liked Mrs. Best as she read a lot of newspapers.<br />\n   Rectification: Mrs. Shaw said she liked Mrs. Best because she was a nice woman, not because she read newspapers.  <\/p>\n<\/li>\n<li>\n<p>Mrs. Harding and Mrs. Shaw agree that wearing a blue dress with a red coat is unfashionable.<br />\n   Rectification: Mrs. Harding wears a blue dress with a red coat herself, and Mrs. Shaw stated that she likes blue dresses and red coats.  <\/p>\n<\/li>\n<li>\n<p>Mary shares that she finds the dog outside the window cute.<br />\n   Rectification: Mary shares that the dog outside looks very dirty and that she does not like dogs at all.  <\/p>\n<\/li>\n<\/ol>\n<h2>Let us think and reflect<\/h2>\n<p><strong>I. Read the extracts given below and answer the questions that follow.<\/strong>  <\/p>\n<p><strong>1.<\/strong><br />\n<strong>(i) What does Mrs. Shaw imply when she says, \"One day you'll have to go to some of these houses yourself and talk to the people there\"?<\/strong><br />\nC. She wants Mary to develop social skills for the future.  <\/p>\n<p><strong>(ii) Complete the following sentence with the correct option from the brackets.<\/strong><br />\nMrs. Shaw and Mary are discussing how to <strong>have a polite conversation<\/strong>.  <\/p>\n<p><strong>(iii) Why did Mary insist on staying with her mother when the guests arrived?<\/strong><br />\nMary insisted on staying because she was confident in her talking skills and wanted to show her mother that she could converse well with adult guests.  <\/p>\n<p><strong>(iv) Match the following character traits to the characters in the extract:<\/strong><br />\n<strong>Mary<\/strong>: A. eager, B. inexperienced<br />\n<strong>Mrs. Shaw<\/strong>: C. cautious  <\/p>\n<p><strong>2.<\/strong><br />\n<strong>(i) Complete the following sentence suitably.<\/strong><br />\nMary could spot Mrs. Cotter in the street because <strong>Mrs. Cotter was out in the street in the afternoon, which was the only time she got out of bed<\/strong>.  <\/p>\n<p><strong>(ii) What does Mary's comment about Mrs. Cotter staying in bed and calling the doctor suggest about her understanding?<\/strong><br />\nB. She is unable to understand why people need medical help.  <\/p>\n<p><strong>(iii) How can we say that Mary enjoyed good health?<\/strong><br />\nWe can say Mary enjoyed good health because she proudly stated that she had never been to a doctor in her life.  <\/p>\n<p><strong>(iv) Identify whether the following statement is true or false.<\/strong><br />\nMary might have unintentionally offended Mrs. Harding.<br />\n<strong>True<\/strong> (Mrs. Harding stays in bed in the morning herself).  <\/p>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<p><strong>1. What does Mary's comment about Mr. Best's routine and profession reveal about her viewpoint on bankers and their way of life?<\/strong><br />\nMary's comment reveals that she views bankers as dull and unthinking individuals who spend long hours commuting on trains reading newspapers rather than enjoying life or reading books.  <\/p>\n<p><strong>2. What can we infer about Mary's understanding of polite conversation based on her interactions with the guests?<\/strong><br />\nWe can infer that Mary thinks polite conversation just means speaking continuously to fill silence, completely lacking tact, empathy, and an understanding of what might hurt or offend others.  <\/p>\n<p><strong>3. What do you think the repeated stage direction 'no one speaks' indicates about the atmosphere in the room when Mary speaks?<\/strong><br />\nThe repeated stage direction indicates an uncomfortable, tense, and awkward silence in the room caused by Mary's tactless and offensive remarks.  <\/p>\n<p><strong>4. How does Mary's attitude towards the guests change throughout the play?<\/strong><br />\nAt first, Mary is overly confident and excited to entertain the guests. However, as she makes continuous blunders and receives silence or direct corrections, she grows embarrassed, flustered, and blushes with a red face.  <\/p>\n<p><strong>5. What do Mrs. Harding's and Mrs. Lee's responses to Mary's blunders during their visit reveal about their characters?<\/strong><br />\nTheir responses reveal that they are polite, dignified, yet firm and protective of their family. They calmly but directly correct Mary whenever she insults their relatives or personal habits.  <\/p>\n<p><strong>6. In what way does the play show the importance of knowing how to engage in polite conversation?<\/strong><br />\nThe play shows that polite conversation requires careful listening, tact, empathy, and thinking before speaking. Without these qualities, a person can embarrass themselves and ruin relationships with guests.  <\/p>\n<h2>Let us write<\/h2>\n<p><strong>Say the Right Thing<\/strong>  <\/p>\n<p>In the quiet town of Lanfield, Mrs. Shaw was tidying her living room in preparation for a visit from Mrs. Harding, the wife of a wealthy local man, and her sister-in-law, Mrs. Lee. Mrs. Shaw wanted to make a good impression and make new friends. Her young daughter, Mary, wanted to stay and meet the guests. Although Mrs. Shaw advised Mary to go for a walk because she feared Mary might say the wrong things, Mary insisted she was fully capable of polite conversation. Mrs. Shaw gave her final advice: be kind, say pleasing things, and fill awkward silences.  <\/p>\n<p>When the guests arrived, Mary immediately began attempting conversation, but every attempt turned into a hilarious blunder. First, Mary complimented Mrs. Harding on her \"beautiful children,\" only to be told firmly that Mrs. Harding had no children at all. Next, Mary mocked Mr. Best for commuting on trains and reading newspapers, calling bankers unthinking people—only for Mrs. Lee to reveal that her own brother was a banker who did the exact same thing.  <\/p>\n<p>Mary's blunders continued without pause. She made fun of Mrs. Best's combination of a blue dress and red coat, only to learn Mrs. Harding wore the exact same outfit. She criticized women who stay in bed in the morning and call doctors, only to have Mrs. Harding state that she stayed in bed in the morning and Mrs. Lee add that she visited the doctor often. She complained about talkative women, dirty dogs, and men who ride horses, only to discover each remark insulted Mrs. Lee's mother, Mrs. Harding's dog Towzer, and Mrs. Lee's brother respectively. Each blunder was met with awkward silence and Mary's face growing redder.  <\/p>\n<p>Finally, when the uncomfortable guests rose to leave, Mrs. Shaw politely asked them to stay longer. Mary tried to repeat her mother's coached farewell phrase, but mixed up her words completely, asking, \"Must you stay? Can't you go?\" The visit ended in utter awkwardness, proving that confidence without tact and thinking before speaking can turn any polite conversation into a disaster.  <\/p>"}, {"title": "My Brother'S Great Invention", "html": "<h4>Let us read<\/h4>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>racket<\/strong><\/td>\n<td>a loud and disturbing noise<\/td>\n<\/tr>\n<tr>\n<td><strong>sopping<\/strong><\/td>\n<td>soaking<\/td>\n<\/tr>\n<tr>\n<td><strong>scowling<\/strong><\/td>\n<td>having an angry or frowning expression<\/td>\n<\/tr>\n<tr>\n<td><strong>rigged up<\/strong><\/td>\n<td>assembled something temporarily<\/td>\n<\/tr>\n<tr>\n<td><strong>tinkering<\/strong><\/td>\n<td>experimenting or fiddling<\/td>\n<\/tr>\n<tr>\n<td><strong>dynamos<\/strong><\/td>\n<td>electric generator<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>I<\/strong>.  <\/p>\n<p>\"Who put that water bag here?\" roared my father from the front doorstep. \"Your burglar alarm,\" I hissed to my brother Anand, who was getting ready to disappear from the house. Ma rushed in to see what the racket was all about and found Papa standing there, sopping wet and scowling.  <\/p>\n<p>\"I want to know who is behind this nonsense,\" Papa said grimly.  <\/p>\n<p>\"I think it's supposed to be a burglar alarm,\" Ma said, in a soothing voice.  <\/p>\n<p>\"I don't care what it's supposed to be,\" Papa said.  <\/p>\n<p>\"Where's that boy? I'm sure he rigged this up.\"  <\/p>\n<p>Anand had vanished by this time and reappeared only after dinner when Papa had cooled down.  <\/p>\n<p>Before this story, let me put you in the picture. I am Anita, fourteen years old. My brother Anand, one year younger than me, caused all that hoo-ha with his burglar alarm.  <\/p>\n<p>And this is not the first time he's got on Papa's nerves or frightened someone half to death in the house. The trouble with him is that he thinks he is a scientist. He loves tinkering with all sorts of electrical gadgets, tools, dynamos, planks of wood, and things like that. And he keeps creating 'inventions' that never work out as they are supposed to.  <\/p>\n<p>Recently there had been a rush of thefts in the colony and Anand had got it into his head that what was needed was a burglar alarm. So, the minute Papa left for the office and Ma for the market, he started on his latest scheme. As usual I had to be involved, though I'd have preferred to finish my novel. \"If you get a shelling, don't bring me in,\" I warned Anand.  <\/p>\n<p>\"Nothing will go wrong this time. I've planned it out carefully. See the blueprint.\"  <\/p>\n<p>Anand loves words like blueprint—it makes him feel professional! Anyway, I looked at the elaborate drawing of doors, wires, and bells and asked, \"How does this thing work?\"  <\/p>\n<p>\"It's quite simple. The moment the door opens, this alarm is tripped off and makes a clanging sound. Then this water bag here is loosened and falls on the thief's head. By then we call the police—simple!\"  <\/p>\n<p>\"But how does the alarm know that a burglar is opening the door?\"  <\/p>\n<p>\"I've taken care of that,\" Anand said loftily. I had my own doubts about the alarm's guessing powers, but kept them to myself because when Anand is in one of his inventive moods, nothing stops him.  <\/p>\n<p>\"You see,\" Anand explained smugly, \"A thief tries to open the door stealthily. I've rigged it up so that the alarm works only when the door is opened gently.\"  <\/p>\n<p>I was sceptical. \"Remember, if Papa asks, I'm not involved,\" I warned. \"Now clean up this mess before anyone gets home.\"  <\/p>\n<p>As you already know, my doubts about the alarm were quite justified. Papa, who always opens the door softly, was thoroughly soaked and angry as angry could be. Anyway, for a week after this, Anand did not dare try out anything new. Then we saw this film 'Back to the Future'. I don't know if you have seen it, but it's all about a time machine. Well, that was  <\/p>\n<p>the end of peace and quiet in the house.  <\/p>\n<p>My brother decided that he had to make a time machine too. Papa locked up his tool box and hid the key while Ma kept a wary eye on her oven and mixer. Because, as I told you, when Anand is on one of his inventing binges, he takes apart all the gadgets in the house to collect parts. You can't imagine the noise that  <\/p>\n<table>\n<thead>\n<tr>\n<th><strong>Word<\/strong><\/th>\n<th><strong>Meaning<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>elaborate<\/strong><\/td>\n<td>detailed<\/td>\n<\/tr>\n<tr>\n<td><strong>clanging<\/strong><\/td>\n<td>a loud ringing sound like that of a metal being hit<\/td>\n<\/tr>\n<tr>\n<td><strong>smugly<\/strong><\/td>\n<td>proudly<\/td>\n<\/tr>\n<tr>\n<td><strong>stealthily<\/strong><\/td>\n<td>quietly or carefully so that one is not seen or heard<\/td>\n<\/tr>\n<tr>\n<td><strong>sceptical<\/strong><\/td>\n<td>doubtful<\/td>\n<\/tr>\n<tr>\n<td><strong>frantic<\/strong><\/td>\n<td>hurried and disorganised<\/td>\n<\/tr>\n<tr>\n<td><strong>crestfallen look<\/strong><\/td>\n<td>sad and disappointed appearance<\/td>\n<\/tr>\n<tr>\n<td><strong>offended<\/strong><\/td>\n<td>felt upset or hurt<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>was going on—hammering and sawing and clattering. Anand's room, next to our room, was transformed into a network of wires, springs, levers, and bulbs. There was an enormous panel which was to be control switchboard. As for Anand, he went around looking like a savage. When Ma didn't notice, the fellow didn't even comb his hair.  <\/p>\n<p>Anand just wouldn't let anyone into his room. Finally, after a fortnight of frantic activity, the time machine was ready. \"We can try it out tonight,\" Anand announced to everyone at home at lunch time.  <\/p>\n<p>\"I don't know what you've been up to in that room, but you're not trying out anything new,\" Papa said firmly.  <\/p>\n<p>\"But it's a time machine! I've invented it,\" Anand protested.  <\/p>\n<p>\"When I say NO, I mean NO,\" Papa said, glaring.  <\/p>\n<p>\"Poor boy,\" Ma said noticing Anand's crestfallen look.  <\/p>\n<p>\"At least let's take a look at it.\"  <\/p>\n<p>Papa sighed. \"All right, but if the house falls, it's your fault.\"  <\/p>\n<p>As it turned out, we could not try out the time machine that day at all. The next day, Papa and Ma were going to Kharagpur, a few hours away from Calcutta (now Kolkata), for a wedding. Ma was worried about leaving us alone, but we reassured her. \"We're old enough to look after ourselves, Ma,\" I said. \"And we can go next door to Sharma Aunty if we need anything.\"  <\/p>\n<p>\"And it's only one night,\" Anand added.  <\/p>\n<p>\"All right. But promise me you won't do anything with that time machine till we come back,\" Ma said sternly, looking at Anand. He promised half-heartedly, offended at this lack of respect for his creation. I breathed a sigh of relief.  <\/p>\n<h4>Let us discuss<\/h4>\n<p><strong>I. Complete the cause-and-effect table given below.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Causes<\/th>\n<th>Effects<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Anand set up his burglar alarm and rigged it to work when the door was opened softly.<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2.<\/td>\n<td>Anita was able to avoid any responsibility as Anand faced the consequences alone.<\/td>\n<\/tr>\n<tr>\n<td>3. We watched the movie 'Back to the Future'.<\/td>\n<td>Anand:<\/td>\n<\/tr>\n<tr>\n<td>4. Papa firmly said 'NO' to trying out the time machine.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>II. Do you think Anand was able to keep his promise regarding the time machine? If yes, why? If no, why not?<\/strong>  <\/p>\n<p><strong>II<\/strong>.  <\/p>\n<p>They left by the afternoon train and were coming back the following evening. Anand fell asleep immediately, but I stayed up to finish a novel. At about eleven thirty I thought I heard a scratching at the front door. Telling myself it was only my imagination, I went back to the book. A little later there was a rattle and a click. I was really scared, I can tell you, what with a murder story before me and then strange noises in the middle of the night! I shook Anand and whispered, 'Listen, there's someone at the door.'  <\/p>\n<p>'Go and open it then,' he muttered groggily.  <\/p>\n<p>'You silly! Someone's trying to get in,' I said.  <\/p>\n<p>Anand sat up. 'Who? What?'  <\/p>\n<p>'I don't know,' I said. 'What shall we do?'  <\/p>\n<p>'Let's holler for help,' he said. Before we could do anything, the door swung open and we found ourselves looking at a ruffianly fellow with a green scarf around his neck. Anand gasped.  <\/p>\n<p>'Hey, it's Boppa!' I whispered. It was indeed the fellow who had recently begun sweeping out the compounds in our row of houses. So, he was the thief, and no wonder. He knew exactly when the occupants were out, leaving the coast clear.  <\/p>\n<p>The fellow gave an evil grin. 'One squeak out of you and see what happens,' he said, brandishing his cudgel and backing out of the room. We heard him slide the latch in.  <\/p>\n<p>'What do we do now?' I asked in a low voice.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>groggily<\/strong><\/td>\n<td>sleepily<\/td>\n<\/tr>\n<tr>\n<td><strong>ruffianly<\/strong><\/td>\n<td>rough or violent looking<\/td>\n<\/tr>\n<tr>\n<td><strong>gasped<\/strong><\/td>\n<td>took a short, deep breath in surprise<\/td>\n<\/tr>\n<tr>\n<td><strong>brandishing<\/strong><\/td>\n<td>waving<\/td>\n<\/tr>\n<tr>\n<td><strong>cudgel<\/strong><\/td>\n<td>a short, thick stick used as a weapon<\/td>\n<\/tr>\n<tr>\n<td>\"Let's shout anyway,\" Anand suggested.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The door opened suddenly again in the middle of our discussion.  <\/p>\n<p>\"No noise from you! Now, where is your father's room?\"  <\/p>\n<p>I was about to direct him upstairs when Anand said quickly, \"The one next to this one.\"  <\/p>\n<p>\"You silly goose!\" I said angrily as soon as the man had gone.  <\/p>\n<p>\"That's your room. He'll come back as mad as mad can be.\"  <\/p>\n<p>\"At least it will give us some time to think of something,\" Anand said. \"He'll take a while to locate the light switch. Let's shout.\" All of a sudden there was a crash followed by a loud scream. More strange noises emerged from the next room—a few muffled thumps, an eerie whine, and a low, humming sound.  <\/p>\n<p>\"My time machine, he's started it!\" Anand gasped. \"I wish we could get out of this room and see what is happening out there.\"  <\/p>\n<p>There was another howl, much fainter this time, and a great deal of clattering. We shouted for all we were worth. In a few minutes, we heard footsteps running up our drive. Thankfully we recognised Mrs. Sharma's voice, along with her husband and Dr. Mohan—also a neighbour.  <\/p>\n<p>\"Anand! Anita! Children, what's the matter? Where are you?\"  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>muffled<\/strong><\/td>\n<td>not a very clear and loud sound<\/td>\n<\/tr>\n<tr>\n<td><strong>eerie<\/strong><\/td>\n<td>strange<\/td>\n<\/tr>\n<tr>\n<td><strong>clattering<\/strong><\/td>\n<td>continuous loud noises<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>\"Here!\" we shouted in unison. In a minute the door was unlocked.  <\/p>\n<p>\"What on earth has been happening here, children?\" Sharma Uncle asked. Both Anand and I fell over ourselves trying to explain. \"Where is the fellow now?\"  <\/p>\n<p>\"The last we heard, he was in the time machine,\" I explained hastily, seeing everyone looking rather puzzled.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>unison<\/strong><\/td>\n<td>together<\/td>\n<\/tr>\n<tr>\n<td><strong>hastily<\/strong><\/td>\n<td>quickly<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>We entered the room cautiously and turned on the lights. The time machine was still humming softly but otherwise there was no other sound from the room.  <\/p>\n<p>\"Well, where is he?\" Dr. Mohan asked, peering behind the door. \"Did you imagine this?\"  <\/p>\n<p>\"Oh no,\" I protested. \"How could both of us have imagined the same thing?\"  <\/p>\n<p>\"Maybe he ran out,\" Anand suggested.  <\/p>\n<p>\"I'm sure we'd have seen him. There's only one way out of this house and we came the same way as soon as we heard you,\" Sharma Uncle sounded very sure.  <\/p>\n<p>\"Look!\" Anand said, pointing to the floor. \"He was wearing that.\" Near the panel of switches was the green scarf.  <\/p>\n<table>\n<thead>\n<tr>\n<th><strong>Word<\/strong><\/th>\n<th><strong>Meaning<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>peering<\/strong><\/td>\n<td>looking carefully<\/td>\n<\/tr>\n<tr>\n<td><strong>indulgently<\/strong><\/td>\n<td>fondly<\/td>\n<\/tr>\n<tr>\n<td><strong>intruders<\/strong><\/td>\n<td>people who enter a place without permission<\/td>\n<\/tr>\n<tr>\n<td><strong>dismantled<\/strong><\/td>\n<td>taken apart<\/td>\n<\/tr>\n<tr>\n<td><strong>niggling<\/strong><\/td>\n<td>slight feeling (of)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>\"Let's search the house—perhaps he's still around,\" Dr. Mohan said, going upstairs.  <\/p>\n<p>Boppa was nowhere to be seen. \"Well maybe he did run out and we missed him,\" Mrs. Sharma said at last, \"I can't imagine what else could have happened.\"  <\/p>\n<p>\"My time machine! He's gone through that!\" Anand burst out, his eyes shining.  <\/p>\n<p>\"What an imagination this boy has!\" Mr. Sharma said, smiling <strong>indulgently<\/strong>. \"Now off to bed, both of you. I'll spend the night here so you needn't worry about any more <strong>intruders<\/strong> now.\"  <\/p>\n<p>Needless to say, Boppa was never seen again. Anand insists that his time machine worked and he disappeared into the past. The machine itself was <strong>dismantled<\/strong> because Papa thought it wasn't safe (maybe he also had a <strong>niggling<\/strong> suspicion that it worked), so we couldn't try it out.  <\/p>\n<p>As for Anand, he is convinced that he is a genius and has launched a new project—something about a telephone to contact creatures in outer space. Tell you all about it next time.  <\/p>\n<p><strong>ANITA RAU BADAMI<\/strong>  <\/p>\n<h4>Let us discuss<\/h4>\n<p><strong>Arrange the following events in the correct order of occurrence.<\/strong>  <\/p>\n<ol>\n<li>The door swings open, and they see Boppa, standing there with an evil grin.  <\/li>\n<li>Boppa is nowhere to be found, but his green scarf is lying near the time machine.  <\/li>\n<li>Mrs. Sharma, her husband, and Dr. Mohan unlock the door and enter the house to help the children.  <\/li>\n<li>Anita wakes Anand up, informing him that someone is trying to get into the house.  <\/li>\n<li>Anand misleads Boppa into entering his room instead of his father's room.  <\/li>\n<\/ol>\n<h4>Let us think and reflect<\/h4>\n<p><strong>I. Read the extracts given below and answer the questions that follow.<\/strong>  <\/p>\n<ol>\n<li><em>Before beginning this story, let me put you in the picture. I am Anita, fourteen years old. My brother Anand, one year younger than me, caused all that hoo-ha with his burglar alarm. The trouble with him is that he thinks he is a scientist. He loves tinkering with all sorts of electrical gadgets, tools, dynamos, planks of wood, and things like that. And he keeps creating 'inventions' that never work out as they are supposed to.<\/em>  <\/li>\n<\/ol>\n<p>(i) Complete the following sentence suitably by choosing the correct option from those given in the brackets.<br />\n<em>When Anita says, \"...let me put you in the picture\", she wants to <code>_______<\/code> (introduce/summarise) the situation for the benefit of the readers.<\/em><br />\n(ii) Anand loves 'tinkering' with all sorts of electrical gadgets. This means that he enjoys <code>_______<\/code> gadgets.  <\/p>\n<ul>\n<li>A. dismantling and creating  <\/li>\n<li>B. labelling or naming  <\/li>\n<li>C. repairing or improving  <\/li>\n<li>\n<p>D. collecting and displaying<br />\n(iii) Which of the following options most suitably describes Anand's personality?  <\/p>\n<\/li>\n<li>\n<p>A. methodical and cautious  <\/p>\n<\/li>\n<li>B. creative and experimental  <\/li>\n<li>C. energetic and hasty  <\/li>\n<li>D. shy and reserved<br />\n(iv) Based on the extract, compare what Anita thinks of her brother Anand with what he thinks of himself.  <\/li>\n<\/ul>\n<ol start=\"2\">\n<li><em>I was about to direct him upstairs, when Anand said quickly, \"The one next to this one.\"<\/em>  <\/li>\n<\/ol>\n<p><em>\"You silly goose!\" I said angrily as soon as the man had gone.<\/em>  <\/p>\n<p><em>\"That's your room. He'll come back as mad as mad can be.\"<\/em>  <\/p>\n<p><em>\"At least it will give us some time to think of something,\" Anand said. \"He'll take a while to locate the light switch. Let's shout.\" All of a sudden there was a crash followed by a loud scream. More strange noises emerged from the next room—a few muffled thumps, an eerie whine, and a low, humming sound.<\/em>  <\/p>\n<p>(i) Complete the sentence given below with a suitable reason.<br />\n<em>Anita was angry with Anand because <code>_______<\/code>.<\/em><br />\n(ii) Which action of Anand shows his presence of mind?<br />\n(iii) What might be the cause of the strange noises emerging from the next room?  <\/p>\n<ul>\n<li>A. The intruder moving furniture around  <\/li>\n<li>B. Anand's time machine getting activated  <\/li>\n<li>C. The intruder locating the light switch  <\/li>\n<li>\n<p>D. Anand's invention malfunctioning<br />\n(iv) Which of the following best describes the atmosphere in this extract?  <\/p>\n<\/li>\n<li>\n<p>A. relaxing  <\/p>\n<\/li>\n<li>B. peaceful  <\/li>\n<li>C. tense  <\/li>\n<li>D. sad  <\/li>\n<li>E. suspenseful  <\/li>\n<li>\n<p>F. joyful  <\/p>\n<\/li>\n<li>\n<p>(a) A, D and E  <\/p>\n<\/li>\n<li>(b) B and F  <\/li>\n<li>(c) C and E  <\/li>\n<li>(d) Only D  <\/li>\n<\/ul>\n<p><strong>II. Complete the table with the suitable traits of the characters based on evidence from the text. Choose the traits given in the box below. An example has been done for you.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>creative<\/th>\n<th>curious<\/th>\n<th>careful<\/th>\n<th>responsible<\/th>\n<th>bothersome<\/th>\n<th>confident<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Character<\/th>\n<th>Traits<\/th>\n<th>Evidence from the Text<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Anand<\/td>\n<td>1. bothersome<\/td>\n<td><em>And this is not the first time he's got on Papa's nerves or frightened someone half to death in the house.<\/em><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>2. <code>_____<\/code><\/td>\n<td><em>He loves tinkering with all sorts of electrical gadgets, tools, dynamos, planks of wood, and things like that. And he keeps creating 'inventions' that never work out as they are supposed to.<\/em><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3. <code>_____<\/code><\/td>\n<td><em>'Nothing will go wrong this time. I've planned it out carefully. See the blueprint.'<\/em><\/td>\n<\/tr>\n<tr>\n<td>Anita<\/td>\n<td>1. <code>_____<\/code><\/td>\n<td><em>'We're old enough to look after ourselves, Ma...'<\/em><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>2. <code>_____<\/code><\/td>\n<td><em>'But how does the alarm know that a burglar is opening the door?'<\/em><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3. <code>_____<\/code><\/td>\n<td><em>'Now clean up this mess before anyone gets home.'<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>III. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>What prompted Anand to create the burglar alarm?  <\/li>\n<li>How did Anand's father become the target of the burglar alarm?  <\/li>\n<li>How did Anand's parents and sister react to his ideas?  <\/li>\n<li>How did Anand behave when he was on his 'inventing binges'?  <\/li>\n<li>Why did Mr. Sharma not believe Anand when he spoke about his time machine?  <\/li>\n<li>Give an ending to this story, explaining what might have happened to Boppa.  <\/li>\n<\/ol>\n<h4>Let us write<\/h4>\n<p><strong>Think about different vocations that you see around or you are currently studying.<\/strong>  <\/p>\n<p>For example: electrician, mechanic, chef, nurse, graphic designer. You may add more vocations to the list given here.  <\/p>\n<p>Now, choose a vocation and write a paragraph. You may use the hints given below.  <\/p>\n<ul>\n<li>why you like this vocation  <\/li>\n<li>what training is needed  <\/li>\n<li>what tools and equipment are required  <\/li>\n<li>who would your co-workers be  <\/li>\n<li>highlight the importance of team work  <\/li>\n<li>how you would deal with the customers  <\/li>\n<li>how you plan to pursue it with a sense of pride  <\/li>\n<\/ul>\n<hr />\n<hr />\n<h1>Answers – MY BROTHER'S GREAT INVENTION<\/h1>\n<h2>Let us discuss<\/h2>\n<p><strong>I. Cause-and-effect table<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Causes<\/th>\n<th>Effects<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Anand set up his burglar alarm and rigged it to work when the door was opened softly.<\/td>\n<td>Papa opened the door softly, triggering the alarm, and got soaking wet when the water bag fell on his head.<\/td>\n<\/tr>\n<tr>\n<td>2. Anita warned Anand beforehand that she was not involved and asked him to clean up his mess.<\/td>\n<td>Anita was able to avoid any responsibility as Anand faced the consequences alone.<\/td>\n<\/tr>\n<tr>\n<td>3. We watched the movie 'Back to the Future'.<\/td>\n<td>Anand decided that he had to make a time machine too.<\/td>\n<\/tr>\n<tr>\n<td>4. Papa firmly said 'NO' to trying out the time machine.<\/td>\n<td>Anand felt crestfallen, and Ma persuaded Papa to at least take a look at the machine.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>II. Do you think Anand was able to keep his promise regarding the time machine? If yes, why? If no, why not?<\/strong><br />\nNo, Anand was not able to keep his promise. Although he promised Ma that he would not touch the time machine while his parents were away, an intruder named Boppa entered the house. Anand tricked Boppa into entering his room, where Boppa accidentally turned on the time machine and vanished into the past.  <\/p>\n<p><strong>Arrange the following events in the correct order of occurrence.<\/strong>  <\/p>\n<ol>\n<li>Anita wakes Anand up, informing him that someone is trying to get into the house.  <\/li>\n<li>The door swings open, and they see Boppa, standing there with an evil grin.  <\/li>\n<li>Anand misleads Boppa into entering his room instead of his father's room.  <\/li>\n<li>Mrs. Sharma, her husband, and Dr. Mohan unlock the door and enter the house to help the children.  <\/li>\n<li>Boppa is nowhere to be found, but his green scarf is lying near the time machine.  <\/li>\n<\/ol>\n<h2>Let us think and reflect<\/h2>\n<p><strong>I. Read the extracts given below and answer the questions that follow.<\/strong>  <\/p>\n<ol>\n<li><em>Before beginning this story, let me put you in the picture...<\/em>  <\/li>\n<\/ol>\n<p>(i) When Anita says, \"...let me put you in the picture\", she wants to <strong>introduce<\/strong> the situation for the benefit of the readers.<br />\n(ii) Anand loves 'tinkering' with all sorts of electrical gadgets. This means that he enjoys <strong>C. repairing or improving<\/strong> gadgets.<br />\n(iii) Which of the following options most suitably describes Anand's personality?<br />\n<strong>B. creative and experimental<\/strong><br />\n(iv) Based on the extract, compare what Anita thinks of her brother Anand with what he thinks of himself.<br />\nAnand views himself as an ambitious scientist who creates important inventions. Anita, on the other hand, views him as a mischievous brother whose inventions never work properly and only create chaos and trouble in the house.  <\/p>\n<ol start=\"2\">\n<li><em>I was about to direct him upstairs, when Anand said quickly...<\/em>  <\/li>\n<\/ol>\n<p>(i) Complete the sentence given below with a suitable reason.<br />\nAnita was angry with Anand because <strong>he directed the intruder Boppa into his own room full of valuable gadgets and the time machine, putting Anand's invention and their safety at risk<\/strong>.<br />\n(ii) Which action of Anand shows his presence of mind?<br />\nAnand quickly lied to Boppa that the room next door was their father's room. This gave the children time to plan their next move and call for help while the thief searched for the light switch.<br />\n(iii) What might be the cause of the strange noises emerging from the next room?<br />\n<strong>B. Anand's time machine getting activated<\/strong><br />\n(iv) Which of the following best describes the atmosphere in this extract?<br />\n<strong>(c) C and E<\/strong> (tense and suspenseful)  <\/p>\n<p><strong>II. Complete the table with the suitable traits of the characters based on evidence from the text.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Character<\/th>\n<th>Traits<\/th>\n<th>Evidence from the Text<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Anand<\/td>\n<td>1. bothersome<\/td>\n<td><em>And this is not the first time he's got on Papa's nerves or frightened someone half to death in the house.<\/em><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>2. creative<\/td>\n<td><em>He loves tinkering with all sorts of electrical gadgets, tools, dynamos, planks of wood, and things like that. And he keeps creating 'inventions' that never work out as they are supposed to.<\/em><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3. confident<\/td>\n<td><em>'Nothing will go wrong this time. I've planned it out carefully. See the blueprint.'<\/em><\/td>\n<\/tr>\n<tr>\n<td>Anita<\/td>\n<td>1. responsible<\/td>\n<td><em>'We're old enough to look after ourselves, Ma...'<\/em><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>2. curious<\/td>\n<td><em>'But how does the alarm know that a burglar is opening the door?'<\/em><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>3. careful<\/td>\n<td><em>'Now clean up this mess before anyone gets home.'<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>III. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>\n<p>What prompted Anand to create the burglar alarm?<br />\nA sudden series of thefts in their residential colony prompted Anand to build a burglar alarm to catch thieves.  <\/p>\n<\/li>\n<li>\n<p>How did Anand's father become the target of the burglar alarm?<br />\nAnand designed the burglar alarm to trip when the door was opened gently. Since Papa always opened the door softly, he unintentionally triggered the trap and got soaked by the water bag.  <\/p>\n<\/li>\n<li>\n<p>How did Anand's parents and sister react to his ideas?<br />\nPapa was strict and annoyed by Anand's schemes, Ma was understanding and encouraging yet careful, and Anita was doubtful and made sure to stay out of trouble.  <\/p>\n<\/li>\n<li>\n<p>How did Anand behave when he was on his 'inventing binges'?<br />\nDuring his inventing binges, Anand filled his room with wires, springs, and switches, made loud hammering noises, stopped combing his hair, and took apart household appliances for parts.  <\/p>\n<\/li>\n<li>\n<p>Why did Mr. Sharma not believe Anand when he spoke about his time machine?<br />\nMr. Sharma believed time machines were just imaginary concepts from movies, so he assumed the thief had simply escaped through an open door without being noticed.  <\/p>\n<\/li>\n<li>\n<p>Give an ending to this story, explaining what might have happened to Boppa.<br />\nBoppa accidentally hit the main switch of the time machine in the dark room, activating the device. The machine transported him back into ancient history, leaving only his green scarf behind.  <\/p>\n<\/li>\n<\/ol>\n<h2>Let us write<\/h2>\n<p><strong>Paragraph on Vocation: Electrician<\/strong>  <\/p>\n<p>I would like to become an electrician because I enjoy fixing electrical gadgets and solving circuit problems. To pursue this vocation, one needs vocational training and a certification course in electrical engineering. An electrician requires tools such as insulated pliers, screwdrivers, wire strippers, and a digital multimeter. In this job, my co-workers would be senior technicians, engineers, and construction workers. Teamwork is essential because working with high-voltage electricity requires clear coordination to ensure safety. When dealing with customers, I will communicate politely, listen carefully to their problems, and offer reliable solutions. I plan to pursue this profession with great pride by helping people keep their homes safe and powered.  <\/p>"}, {"title": "Paper Boats", "html": "<h4>Let us read<\/h4>\n<p><em>Day by day I float my paper boats one by one down the running stream.<\/em>  <\/p>\n<p><em>In big black letters I write my name on them and the name of the village where I live.<\/em>  <\/p>\n<p><em>I hope that someone in some strange land will find them and know who I am.<\/em>  <\/p>\n<p><em>I load my little boats with shiuli flower from our garden, and hope that these blooms of the dawn will be carried safely to land in the night.<\/em>  <\/p>\n<p><em>I launch my paper boats and look up into the sky and see the little clouds setting the white bulging sails.<\/em>  <\/p>\n<p><em>I know not what playmate of mine in the sky sends them down the air to race with my boats!<\/em>  <\/p>\n<p><em>When night comes I bury my face in my arms and dream that my paper boats float on and on under the midnight stars.<\/em>  <\/p>\n<p><em>The fairies of sleep are sailing in them, and the lading is their baskets full of dreams.<\/em>  <\/p>\n<p><strong>RABINDRANATH TAGORE<\/strong>  <\/p>\n<hr />\n<h2>Summary<\/h2>\n<p>A child floats paper boats down a running stream each day, writing their name and village on them in the hope that someone in a strange land will discover who they are. The boats are loaded with shiuli flowers, and the child imagines clouds as playmates racing against the boats. At night, the child dreams that the boats continue to float under the midnight stars, sailed by fairies of sleep carrying baskets full of dreams. The poem captures the innocence, imagination, and gentle yearning of childhood — the desire to be known and connected across distances.  <\/p>\n<h2>Poetic Devices<\/h2>\n<ul>\n<li>\n<p><strong>Symbolism<\/strong> — Paper boats represent the child's innocence, dreams, and messages sent out into the world; shiuli flowers symbolize purity and beauty; midnight stars represent the vast universe of dreams.<\/p>\n<\/li>\n<li>\n<p><strong>Personification<\/strong> — Clouds are imagined as \"playmates\" racing with the boats; fairies of sleep are described as sailors.<\/p>\n<\/li>\n<li>\n<p><strong>Imagery<\/strong> — \"Big black letters,\" \"shiuli flower from our garden,\" \"little clouds setting the white bulging sails\" create vivid visu
