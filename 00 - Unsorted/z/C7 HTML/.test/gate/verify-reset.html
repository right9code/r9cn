al and sensory pictures.<\/p>\n<\/li>\n<li>\n<p><strong>Repetition<\/strong> — \"Day by day,\" \"float on and on\" emphasize the passage of time and the continuity of the child's hopes.<\/p>\n<\/li>\n<li>\n<p><strong>Alliteration<\/strong> — \"Day by day,\" \"paper boats,\" \"big black,\" \"baskets full of dreams.\"<\/p>\n<\/li>\n<li>\n<p><strong>Enjambment<\/strong> — Lines flow seamlessly (\"Day by day I float my paper boats one by one down the running stream\"), mimicking the gentle, continuous motion of the boats.<\/p>\n<\/li>\n<li>\n<p><strong>Apostrophe<\/strong> — The child addresses the clouds as if they were living playmates (\"I know not what playmate of mine in the sky sends them down the air\").<\/p>\n<\/li>\n<li>\n<p><strong>Pathetic Fallacy<\/strong> — Nature mirrors the child's inner world: clouds become sails, stars become witnesses, fairies become sailors.<\/p>\n<\/li>\n<\/ul>\n<h2>Rhyme Scheme<\/h2>\n<p>Free verse — the poem does not follow a strict rhyme scheme but uses rhythmic prose-like lines.<\/p>\n<hr />\n<h4>Let us discuss<\/h4>\n<p><strong>I. Choose the correct words from the brackets to complete the summary of the poem given below.<\/strong>  <\/p>\n<p>The poet sends paper boats down a 1. <code>_________<\/code> (stream/river) each day, writing his name and the name of his 2. <code>_________<\/code> (school/ village) on them. He hopes that someone in a 3. <code>_________<\/code> (strange/familiar) land will find them and know who he is. The poet fills his boats with 4. <code>_________<\/code> (rose/shiuli) flowers from his garden, hoping they will be safely carried to another land at 5. <code>_________<\/code> (night/morning). As he launches his boats, he imagines that the 6. <code>_________<\/code> (clouds/birds) in the sky are like friends, racing with his boats. At night, he dreams that his paper boats continue to 7. <code>_________<\/code> (swim/float) under the midnight stars, with the fairies of sleep sailing in them, their baskets full of 8. <code>_________<\/code> (dreams/fruits).  <\/p>\n<p><strong>II. Choose the correct option for the following.<\/strong><br />\n<em>The theme of the poem is <code>_________<\/code>.<\/em>  <\/p>\n<ol>\n<li>innocence  <\/li>\n<li>imagination  <\/li>\n<li>ignorance  <\/li>\n<li>playfulness  <\/li>\n<li>travel  <\/li>\n<\/ol>\n<ul>\n<li>(i) 1, 2 and 3  <\/li>\n<li>(ii) 3, 4 and 5  <\/li>\n<li>(iii) 1, 4 and 5  <\/li>\n<li>(iv) 1, 2 and 4  <\/li>\n<\/ul>\n<p><strong>III. Identify whether the following statement is true or false.<\/strong><br />\n<em>The setting of the poem is a natural, outdoor environment.<\/em>  <\/p>\n<p><strong>IV. Complete the following sentence by choosing the correct word given within the brackets.<\/strong><br />\n<em>The tone is <code>_________<\/code> (sad and serious/gentle and wishful) and the mood is <code>_________<\/code> (thoughtful/boring).<\/em>  <\/p>\n<p><strong>V. Identify the examples of alliteration from the poem.<\/strong>  <\/p>\n<p><strong>VI. Fill in the blanks with suitable words from the poem.<\/strong>  <\/p>\n<ol>\n<li>The repetition of words <code>_________<\/code> and <code>_________<\/code> emphasises the passage of time.  <\/li>\n<li>The poet uses imagery like <code>_________<\/code> and <code>_________<\/code> to create a clear picture in the minds of the readers.  <\/li>\n<\/ol>\n<p><strong>VII. Match the descriptions in Column 1 with what they symbolise in Column 2.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Column 1<\/th>\n<th>Column 2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. the child's innocence, dreams, hopes, and messages sent out into the world<\/td>\n<td>(i) midnight stars<\/td>\n<\/tr>\n<tr>\n<td>2. purity, beauty, and the start of a new day<\/td>\n<td>(ii) paper boats<\/td>\n<\/tr>\n<tr>\n<td>3. the vast universe and the child's dreams continuing through the night<\/td>\n<td>(iii) shiuli flowers<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4><strong>Let us think and reflect<\/strong><\/h4>\n<p><strong>I. Read the extract given below and answer the questions that follow.<\/strong>  <\/p>\n<ol>\n<li><em>When night comes I bury my face in my arms and dream that my paper boats float on and on under the midnight stars. The fairies of sleep are sailing in them, and the lading is their baskets full of dreams.<\/em>  <\/li>\n<\/ol>\n<p>(i) Select the option that is most likely to be the speaker as per the extract.  <\/p>\n<ul>\n<li>A.  <\/li>\n<li>B.  <\/li>\n<li>C.  <\/li>\n<li>\n<p>D.<br />\n(ii) What can be inferred about the speaker's feelings when night comes?<br />\n(iii) What kind of beings are the 'fairies of sleep' imagined as? Select the most appropriate option.  <\/p>\n<\/li>\n<li>\n<p>A. mischievous  <\/p>\n<\/li>\n<li>B. gentle  <\/li>\n<li>C. fearsome  <\/li>\n<li>D. playful<br />\n(iv) Fill in the blank by selecting the correct option from those given in the brackets.<br />\n<em>The phrase 'lading is their baskets full of dreams' suggests that the speaker imagines the fairies of sleep carefully <code>_________<\/code> (carrying his dreams /collecting his wishes) in their baskets.<\/em>  <\/li>\n<\/ul>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>Why do you think the poet writes his personal details on the paper boats?  <\/li>\n<li>The poet talks about the imagination of a child. Support this view with examples from the poem.  <\/li>\n<li>How does the poet bring together imagination and reality to make the poem more interesting?  <\/li>\n<\/ol>\n<h4>Let us write<\/h4>\n<p><strong>A diary entry is a personal document. It records an individual's account of a day of her or his life expressing the thoughts, feelings and opinions in the individual's mind.<\/strong>  <\/p>\n<p>The guidelines to compose a diary entry include:  <\/p>\n<ul>\n<li>mentioning day, date and time of writing it  <\/li>\n<li>beginning with a general sentence describing the day or feelings towards an event or experience  <\/li>\n<li>giving details  <\/li>\n<li>concluding with a final remark  <\/li>\n<\/ul>\n<p>Now, write a diary entry expressing your joy experiencing a rainy day. You may begin as given below:  <\/p>\n<p><em>Friday, 15 July 20XX<\/em>  <\/p>\n<p><em>6:30 p.m.<\/em>  <\/p>\n<p><em>Dear Diary,<\/em>  <\/p>\n<p><em>It was quite humid today. On my journey back from school, I wished that it would rain. And it did! ...<\/em>  <\/p>\n<hr />\n<hr />\n<h1>Answers – PAPER BOATS<\/h1>\n<h2>Let us discuss<\/h2>\n<p><strong>I. Choose the correct words from the brackets to complete the summary of the poem given below.<\/strong>  <\/p>\n<p>The poet sends paper boats down a 1. <strong>stream<\/strong> (stream/river) each day, writing his name and the name of his 2. <strong>village<\/strong> (school/ village) on them. He hopes that someone in a 3. <strong>strange<\/strong> (strange/familiar) land will find them and know who he is. The poet fills his boats with 4. <strong>shiuli<\/strong> (rose/shiuli) flowers from his garden, hoping they will be safely carried to another land at 5. <strong>night<\/strong> (night/morning). As he launches his boats, he imagines that the 6. <strong>clouds<\/strong> (clouds/birds) in the sky are like friends, racing with his boats. At night, he dreams that his paper boats continue to 7. <strong>float<\/strong> (swim/float) under the midnight stars, with the fairies of sleep sailing in them, their baskets full of 8. <strong>dreams<\/strong> (dreams/fruits).  <\/p>\n<p><strong>II. Choose the correct option for the following.<\/strong><br />\n<em>The theme of the poem is <code>_________<\/code>.<\/em><br />\n<strong>(iv) 1, 2 and 4<\/strong> (innocence, imagination, and playfulness)  <\/p>\n<p><strong>III. Identify whether the following statement is true or false.<\/strong><br />\n<em>The setting of the poem is a natural, outdoor environment.<\/em><br />\n<strong>True<\/strong>  <\/p>\n<p><strong>IV. Complete the following sentence by choosing the correct word given within the brackets.<\/strong><br />\nThe tone is <strong>gentle and wishful<\/strong> (sad and serious/gentle and wishful) and the mood is <strong>thoughtful<\/strong> (thoughtful/boring).  <\/p>\n<p><strong>V. Identify the examples of alliteration from the poem.<\/strong><br />\nExamples of alliteration in the poem are:  <\/p>\n<ol>\n<li>\"Day by day\" (repetition of 'd' sound)  <\/li>\n<li>\"paper boats\" (repetition of 'p' sound)  <\/li>\n<li>\"big black\" (repetition of 'b' sound)  <\/li>\n<li>\"strange land\" (repetition of 's' sound)  <\/li>\n<li>\"baskets full of dreams\" (repetition of 'b' or 'f' sound)  <\/li>\n<\/ol>\n<p><strong>VI. Fill in the blanks with suitable words from the poem.<\/strong>  <\/p>\n<ol>\n<li>The repetition of words <strong>\"Day\"<\/strong> and <strong>\"day\"<\/strong> emphasises the passage of time.  <\/li>\n<li>The poet uses imagery like <strong>\"big black letters\"<\/strong> and <strong>\"shiuli flower\"<\/strong> to create a clear picture in the minds of the readers.  <\/li>\n<\/ol>\n<p><strong>VII. Match the descriptions in Column 1 with what they symbolise in Column 2.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Column 1<\/th>\n<th>Column 2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. the child's innocence, dreams, hopes, and messages sent out into the world<\/td>\n<td>(ii) paper boats<\/td>\n<\/tr>\n<tr>\n<td>2. purity, beauty, and the start of a new day<\/td>\n<td>(iii) shiuli flowers<\/td>\n<\/tr>\n<tr>\n<td>3. the vast universe and the child's dreams continuing through the night<\/td>\n<td>(i) midnight stars<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Let us think and reflect<\/h2>\n<p><strong>I. Read the extract given below and answer the questions that follow.<\/strong>  <\/p>\n<ol>\n<li><em>When night comes I bury my face in my arms and dream...<\/em>  <\/li>\n<\/ol>\n<p>(i) Select the option that is most likely to be the speaker as per the extract.<br />\n<strong>A<\/strong>  <\/p>\n<p>(ii) What can be inferred about the speaker's feelings when night comes?<br />\nThe speaker feels calm, peaceful, and imaginative as he drifts off to sleep, carrying his world of dreams into the night.  <\/p>\n<p>(iii) What kind of beings are the 'fairies of sleep' imagined as? Select the most appropriate option.<br />\n<strong>B. gentle<\/strong>  <\/p>\n<p>(iv) Fill in the blank by selecting the correct option from those given in the brackets.<br />\nThe phrase 'lading is their baskets full of dreams' suggests that the speaker imagines the fairies of sleep carefully <strong>carrying his dreams<\/strong> (carrying his dreams /collecting his wishes) in their baskets.  <\/p>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>\n<p>Why do you think the poet writes his personal details on the paper boats?<br />\nThe poet writes his name and village name on the paper boats hoping that someone in a distant land will find them and connect with him.  <\/p>\n<\/li>\n<li>\n<p>The poet talks about the imagination of a child. Support this view with examples from the poem.<br />\nThe poem demonstrates child-like imagination when the child sees clouds as playmates setting white sails to race his boats, and when he envisions sleep fairies riding his boats carrying baskets of dreams.  <\/p>\n<\/li>\n<li>\n<p>How does the poet bring together imagination and reality to make the poem more interesting?<br />\nThe poet grounds the poem in reality by describing floating paper boats loaded with shiuli flowers, and then weaves in fantasy by imagining cloud races and nocturnal sleep fairies under the stars.  <\/p>\n<\/li>\n<\/ol>\n<h2>Let us write<\/h2>\n<p><strong>Diary Entry: Joy of experiencing a rainy day<\/strong>  <\/p>\n<p>Friday, 15 July 20XX<br />\n6:30 p.m.  <\/p>\n<p>Dear Diary,  <\/p>\n<p>It was quite humid today. On my journey back from school, I wished that it would rain. And it did! Dark clouds gathered in the sky, and soon a cool breeze brought down heavy drops of rain. I splashed through the puddles with my friends and made paper boats to float in the streaming water. The fresh smell of wet earth filled the air and completely refreshed my mind. It was a wonderful and joyful day that I will cherish for a long time.  <\/p>"}, {"title": "North, South, East, West", "html": "<h4>Let us read<\/h4>\n<p>Shaana, who lives in Rameswaram island, is travelling the length and breadth of the country with her parents, exploring the many landscapes, people and cultures of India. She shares her travel experiences through postcards that she writes to her friends back at school. Let us read these postcards.  <\/p>\n<p><em>30 April 20XX<\/em>  <\/p>\n<p><em>Hi everyone,<\/em><br />\n<em>You won't believe where I am!<\/em><br />\n<em>I'm way up north, at the Thajiwas glacier in Kashmir. The glaciers are white and blue and we have to wear four layers of clothes. Appa and Amma love it here, and they like throwing snowballs at each other. But they say there was much more snow last year.<\/em>  <\/p>\n<p><em>I also like the snow, but my hands are shaking from not wearing gloves, so I don't think I can write any more.<\/em>  <\/p>\n<p><em>Send my love to PT Miss and Library Ma'am.<\/em>  <\/p>\n<p><em>Love,<\/em><br />\n<em>Shaana<\/em>  <\/p>\n<table>\n<thead>\n<tr>\n<th><strong>Word<\/strong><\/th>\n<th><strong>Meaning<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>chirping<\/strong><\/td>\n<td>short, sharp sound made by birds<\/td>\n<\/tr>\n<tr>\n<td><strong>snoring<\/strong><\/td>\n<td>making a loud noise as one breathes while sleeping<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>10 May 20XX<\/em>  <\/p>\n<p><em>Dear class,<\/em><br />\n<em>We took another train yesterday and reached Himachal Pradesh. It is very quiet, and we can see so many mountains from our cabin. Colourful birds wake me with their chirping when the Sun rises in the east.<\/em>  <\/p>\n<p><em>I also think I hear bears growling in the west when it gets dark. But Amma says that's just Appa snoring. I would love to meet a bear and give it a hug.<\/em>  <\/p>\n<p><em>With love from your best friend,<\/em><br />\n<em>Shaana<\/em>  <\/p>\n<p><em>17 May 20XX<\/em>  <\/p>\n<p><em>Hi everyone,<\/em><br />\n<em>Did you know that Arunachal Pradesh is far away from Himachal Pradesh? Himachal is in the north but Arunachal is all the way in the east. I thought all the Pradesh states sat next to each other.<\/em>  <\/p>\n<p><em>We took two trains and drove a long time to get here. This morning, we walked through a forest to reach our treehouse. The forest here is so thick that if you blink or stop to tie your shoelaces, you will get lost.<\/em>  <\/p>\n<p><em>I love Arunachal the best so far and am beginning to enjoy myself. I hope we get to see red pandas.<\/em>  <\/p>\n<p><em>With love,<\/em><br />\n<em>Shaana<\/em>  <\/p>\n<p><em>24 May 20XX<\/em>  <\/p>\n<p><em>Dear classmates,<\/em><br />\n<em>It did not take any time at all to travel south west and get to the Sundarbans in West Bengal. Today, Amma and Appa took me out onto the river in a small boat. Amma tells me that places like the Sundarbans are called wetlands. I never knew such a place existed, and that it was possible for trees called mangroves to grow in seawater! But Amma is sad about how much this place floods today.<\/em>  <\/p>\n<p><em>We also saw crocodiles and a lonely snake while boating. I hope they don't follow us home.<\/em>  <\/p>\n<p><em>How is everyone? Are you missing me yet?<\/em>  <\/p>\n<p><em>Love,<\/em><br />\n<em>Shaana<\/em>  <\/p>\n<p><em>30 May 20XX<\/em>  <\/p>\n<p><em>Hi everyone,<\/em><br />\n<em>We travelled across the country, all the way from east to west, from West Bengal to Gujarat, and it took us two-and-a-half days!<\/em>  <\/p>\n<p><em>I don't know why my Amma and Appa brought me to the middle of the desert. It's hot, dry, and there's sand everywhere. It's like a beach without the sea! But I do really love the clothes here. They're so pretty and colourful.<\/em>  <\/p>\n<p><em>I am sure you're all busy with your holiday homework. Amma gave me a surprise test today, and I passed with 88 per cent.<\/em>  <\/p>\n<p><em>Love,<\/em><br />\n<em>Shaana<\/em>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>rafting<\/strong><\/td>\n<td>the sport of travelling down a river in an air-filled rubber boat<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>7 June 20XX<\/em>  <\/p>\n<p><em>Dear class,<\/em><br />\n<em>Today was the best day ever! We drove east from the desert to the Narmada river, which flows all the way to the centre of India, and it only took us six hours. In the afternoon, Amma, Appa, and I went <strong>rafting<\/strong> in the river and you won't believe how wild and scary it was. I always thought rivers were calm, but up close they're really fast. Appa says that there used to be a lot more water, and rafting was much scarier then.<\/em>  <\/p>\n<p><em>I was fully wet by the time I was done, and Appa was so scared that he decided never to go rafting ever again. I love the water so much and can't wait to go back.<\/em>  <\/p>\n<p><em>Your best friend,<\/em><br />\n<em>Shaana<\/em>  <\/p>\n<p><em>12 June 20XX<\/em>  <\/p>\n<p><em>Dear classmates,<\/em><br />\n<em>Amma and Appa are fast asleep, and I should be sleeping too, but I just love looking out of the window. I think we're in the southwest part of the country, in Goa, and you won't believe how nice the plateaus look. There are so many hills here, and beaches too.<\/em>  <\/p>\n<p><em>There are also a lot of tunnels that the train goes through. I used to be afraid of tunnels, but I'm not any more. Someday, I wish we could all go on a tour of the plateaus. Maybe when we're in Class 11.<\/em>  <\/p>\n<p><em>Love,<\/em><br />\n<em>Shaana<\/em>  <\/p>\n<p><em>17 June 20XX<\/em>  <\/p>\n<p><em>Dear friends,<\/em><br />\n<em>I can't believe we're in the same state again! We travelled south, and I will be home soon.<\/em>  <\/p>\n<p><em>We reached Chennai yesterday, and on the way to Puducherry, we decided to learn how to surf. I think I'm good at it now because I only fell down twice. Amma and Appa splashed water on each other and behaved like children. It's a good thing I was there to control them.<\/em>  <\/p>\n<p><em>The beaches here are not like the ones we have on our island. The waves are a lot rougher and the water is browner, but I still like it here.<\/em>  <\/p>\n<p><em>Your best friend,<\/em><br />\n<em>Shaana<\/em>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>surf<\/strong><\/td>\n<td>a water sport that involves standing on a long lightweight board and riding a wave to the seashore<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>22 June 20XX  <\/p>\n<p>Hi everyone,  <\/p>\n<p>I just crossed the Pamban bridge.<br />\nI could see the ocean on both sides. How amazing that a train can travel across the sea like this!<br />\nI'm almost home, and I can't wait to give you my final letter in person.  <\/p>\n<p>Love,<br />\nShaana  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>dive<\/strong><\/td>\n<td>Swim underwater with special breathing equipment (past tense: <strong>dove<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td><strong>pebbles<\/strong><\/td>\n<td>Small, smooth stones<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>24 June 20XX<\/em>  <\/p>\n<p><em>Dear classmates,<\/em><br />\n<em>I thought Amma and Appa would be tired from all our travelling, but we made one last stop at the Olaikaadu beach before we reached home. And I'm so happy we did.<\/em>  <\/p>\n<p><em>Amma wanted to teach me how to <strong>dive<\/strong>, but they did not have diving suits my size, so I spent the day floating and looking at the fish while my parents dove below me.<\/em>  <\/p>\n<p><em>We found all sorts of <strong>pebbles<\/strong> on the beach, and I can't wait to give them to you in person tomorrow.<\/em>  <\/p>\n<p><em>Your best friend,<\/em><br />\n<em>Shaana<\/em>  <\/p>\n<p><em>25 June 20XX<\/em>  <\/p>\n<p><em>Dear Amma and Appa,<\/em><br />\n<em>I can't believe we travelled across the whole country! I know we're going to miss visiting the forests, glaciers, deserts, wetlands, plateaus, and mountains. And we are going to miss hearing all those new languages and meeting all those different people. But we're finally home now, and we can join our friends again.<\/em>  <\/p>\n<p><em>I hope we get to travel like this again, and maybe next time we can take our friends with us.<\/em>  <\/p>\n<p><em>With love,<\/em><br />\n<em>Shaana<\/em>  <\/p>\n<p><strong>C.G. SALAMANDER<\/strong>  <\/p>\n<p>(Excerpts from <em>North, South, East, West<\/em>)  <\/p>\n<h4>Let us discuss<\/h4>\n<p><strong>Complete the table given below based on Shaana's postcards. An example has been done for you. Share your answers with your classmates and the teacher.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Places Visited<\/th>\n<th>Interesting Descriptions and Activities<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Thajiwas glacier, Kashmir<\/td>\n<td>white and blue glaciers; throwing snowballs<\/td>\n<\/tr>\n<tr>\n<td>2. Himachal Pradesh<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3.<\/td>\n<td>walking through a thick forest to reach the tree house<\/td>\n<\/tr>\n<tr>\n<td>4. Gujarat<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5. The Narmada river<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6. Chennai<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7.<\/td>\n<td>floating and looking at the fish; Appa and Amma went for a dive<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>Let us think and reflect<\/h4>\n<p><strong>I. Read the extracts given below and answer the questions that follow.<\/strong>  <\/p>\n<ol>\n<li><em>Amma tells me that places like the Sundarbans are called wetlands. I never knew such a place existed, and that it was possible for trees called mangroves to grow in seawater! But Amma is sad about how much this place floods today.<\/em>  <\/li>\n<\/ol>\n<p><em>We also saw crocodiles and a lonely snake while boating. I hope they don't follow us home.<\/em>  <\/p>\n<p><em>How is everyone? Are you missing me yet?<\/em>  <\/p>\n<p>(i) What feeling does Shaana most likely experience when she says, 'I never knew such a place existed...'?  <\/p>\n<ul>\n<li>A. pride  <\/li>\n<li>B. hope  <\/li>\n<li>C. relief  <\/li>\n<li>D. wonder  <\/li>\n<\/ul>\n<p>(ii) Complete the following sentence with a suitable reason.<br />\n<em>Amma is sad about the frequent flooding in Sundarbans because <code>_____<\/code>.<\/em><br />\n(iii) Select the evidence from the text that reflects a feeling of the speaker's slight nervousness.<br />\n(iv) Select the option that applies to both the Assertion and the Reason.<br />\n<em><strong>Assertion<\/strong>: The speaker is missing her friends.<\/em><br />\n<em><strong>Reason<\/strong>: The speaker wishes to know the well-being of her friends.<\/em>  <\/p>\n<p>A. Both the assertion and the reason are true, and the reason correctly explains the assertion.<br />\nB. Both the assertion and the reason are true, but the reason does not correctly explain the assertion.<br />\nC. The assertion is true, but the reason is false.<br />\nD. Both the assertion and the reason are false.  <\/p>\n<ol start=\"2\">\n<li><em>Amma and Appa are fast asleep, and I should be sleeping too, but I just love looking out of the window. I think we're in the southwest part of the country, in Goa, and you won't believe how nice the plateaus look. There are so many hills here, and beaches too.<\/em>  <\/li>\n<\/ol>\n<p><em>There are also a lot of tunnels that the train goes through. I used to be afraid of tunnels, but I'm not any more. Someday, I wish we could all go on a tour of the plateaus.<\/em>  <\/p>\n<p>(i) Complete the sentence with a suitable reason.<br />\n<em>The speaker chooses to stay awake because <code>____________<\/code>.<\/em><br />\n(ii) What does the speaker mean by saying, 'You won't believe how nice the plateaus look'?<br />\n(iii) What has been the change in the speaker's attitude towards tunnels?  <\/p>\n<ul>\n<li>A. from fear to comfort  <\/li>\n<li>B. from courage to confidence  <\/li>\n<li>C. from doubt to clarity  <\/li>\n<li>D. from fascination to delight<br />\n(iv) Fill in the blanks with the correct option from those given in the brackets.<br />\n<em>The speaker's wish to share the experience of touring the plateaus with others indicates her <code>____________<\/code> (ability to communicate/sense of connection) as well as the value she places on <code>____________<\/code> (shared experiences/updating information) with her peers.<\/em>  <\/li>\n<\/ul>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>Shaana mentions that she used to be afraid of tunnels. What could have been the most likely reason for her to be scared of tunnels?  <\/li>\n<li>Do you think Shaana's Appa and Amma enjoyed themselves, just like children do? Support your answer with evidence from the text.  <\/li>\n<li>Shaana mentions less snow in the glaciers and more flooding in the Sundarbans. Explain what these observations indicate.  <\/li>\n<li>Shaana's visits to different parts of the country highlight the diversity of India's geography. Support this statement with evidence from the text.  <\/li>\n<li>How does Shaana use language to convey her excitement, curiosity, and sometimes her fears about the places she visits?  <\/li>\n<li>What might Shaana have learnt from her travels across India? How would it impact her understanding of the country?  <\/li>\n<li>What could be the author's purpose of presenting the text in the form of postcards?  <\/li>\n<\/ol>\n<h4>Let us write<\/h4>\n<p>Imagine that you have to travel to your hometown to attend a family event. Write an application to the Principal of your school, requesting leave of absence. Remember to include the duration of the leave, the reason for the leave and mention how you will complete your school work. Use the format of the application and the verbal cues given below.  <\/p>\n<p><em><code>________<\/code> (House no. and street)<\/em><br />\n<em><code>________<\/code> (City)<\/em><br />\n<em><code>________<\/code> (State or Union territory)<\/em><br />\n<em><code>________<\/code> (Date)<\/em>  <\/p>\n<p><em>The Principal<\/em><br />\n<em><code>________<\/code> (Name of your school)<\/em><br />\n<em><code>________<\/code> (City)<\/em><br />\n<em><code>________<\/code> (State or Union territory)<\/em>  <\/p>\n<p><em>Subject: Request for leave for... days<\/em>  <\/p>\n<p><em>Dear <code>________<\/code> (Madam or Sir),<\/em>  <\/p>\n<p><em>I am writing to request <code>________<\/code> days leave with effect from <code>________<\/code> to <code>________<\/code> in order to attend <code>________<\/code>.<\/em><br />\n<em>I would like to assure you that I would <code>________<\/code>.<\/em><br />\n<em>I would be grateful if you could grant me the leave.<\/em>  <\/p>\n<p><em>Yours sincerely,<\/em><br />\n<em><code>________<\/code> (Name)<\/em><br />\n<em><code>________<\/code> (Class, Section, Roll Number)<\/em>  <\/p>\n<hr />\n<h2>UNIT 4: TRAVEL AND ADVENTURE<\/h2>\n<hr />\n<h1>Answers – NORTH, SOUTH, EAST, WEST<\/h1>\n<h2>Let us discuss<\/h2>\n<p><strong>Complete the table given below based on Shaana's postcards.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Places Visited<\/th>\n<th>Interesting Descriptions and Activities<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Thajiwas glacier, Kashmir<\/td>\n<td>white and blue glaciers; throwing snowballs<\/td>\n<\/tr>\n<tr>\n<td>2. Himachal Pradesh<\/td>\n<td>quiet environment; seeing many mountains; listening to colourful birds chirping and Appa snoring<\/td>\n<\/tr>\n<tr>\n<td>3. Arunachal Pradesh<\/td>\n<td>walking through a thick forest to reach the tree house<\/td>\n<\/tr>\n<tr>\n<td>4. Gujarat<\/td>\n<td>visiting a hot, dry desert with sand everywhere; admiring pretty and colourful clothes<\/td>\n<\/tr>\n<tr>\n<td>5. The Narmada river<\/td>\n<td>river rafting in wild and fast waters; getting completely wet<\/td>\n<\/tr>\n<tr>\n<td>6. Chennai<\/td>\n<td>learning how to surf on rough waves; parents splashing water like children<\/td>\n<\/tr>\n<tr>\n<td>7. Olaikaadu beach<\/td>\n<td>floating and looking at the fish; Appa and Amma went for a dive<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Let us think and reflect<\/h2>\n<p><strong>I. Read the extracts given below and answer the questions that follow.<\/strong>  <\/p>\n<ol>\n<li><em>Amma tells me that places like the Sundarbans are called wetlands...<\/em>  <\/li>\n<\/ol>\n<p>(i) What feeling does Shaana most likely experience when she says, 'I never knew such a place existed...'?<br />\n<strong>D. wonder<\/strong>  <\/p>\n<p>(ii) Complete the following sentence with a suitable reason.<br />\nAmma is sad about the frequent flooding in Sundarbans because <strong>it harms the fragile mangrove ecosystem and threatens the survival of local wildlife and communities<\/strong>.  <\/p>\n<p>(iii) Select the evidence from the text that reflects a feeling of the speaker's slight nervousness.<br />\n<em>\"I hope they don't follow us home.\"<\/em>  <\/p>\n<p>(iv) Select the option that applies to both the Assertion and the Reason.<br />\nAssertion: The speaker is missing her friends.<br />\nReason: The speaker wishes to know the well-being of her friends.<br />\n<strong>A. Both the assertion and the reason are true, and the reason correctly explains the assertion.<\/strong>  <\/p>\n<ol start=\"2\">\n<li><em>Amma and Appa are fast asleep...<\/em>  <\/li>\n<\/ol>\n<p>(i) Complete the sentence with a suitable reason.<br />\nThe speaker chooses to stay awake because <strong>she loves looking out of the train window to admire the scenery of hills, plateaus, and beaches in Goa<\/strong>.  <\/p>\n<p>(ii) What does the speaker mean by saying, 'You won't believe how nice the plateaus look'?<br />\nShe means that the plateaus are exceptionally beautiful and impressive beyond her expectation.  <\/p>\n<p>(iii) What has been the change in the speaker's attitude towards tunnels?<br />\n<strong>A. from fear to comfort<\/strong>  <\/p>\n<p>(iv) Fill in the blanks with the correct option from those given in the brackets.<br />\nThe speaker's wish to share the experience of touring the plateaus with others indicates her <strong>sense of connection<\/strong> (ability to communicate/sense of connection) as well as the value she places on <strong>shared experiences<\/strong> (shared experiences/updating information) with her peers.  <\/p>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>\n<p>Shaana mentions that she used to be afraid of tunnels. What could have been the most likely reason for her to be scared of tunnels?<br />\nTunnels are dark, enclosed, and create loud echoing sounds when trains pass through, which can be scary for young children.  <\/p>\n<\/li>\n<li>\n<p>Do you think Shaana's Appa and Amma enjoyed themselves, just like children do? Support your answer with evidence from the text.<br />\nYes, Shaana's parents enjoyed themselves like children. For instance, they threw snowballs at each other in Kashmir, splashed water while surfing in Chennai, and went diving together at Olaikaadu beach.  <\/p>\n<\/li>\n<li>\n<p>Shaana mentions less snow in the glaciers and more flooding in the Sundarbans. Explain what these observations indicate.<br />\nThese observations indicate the ongoing impact of global climate change, causing glaciers to melt faster and sea levels to rise, resulting in frequent flooding.  <\/p>\n<\/li>\n<li>\n<p>Shaana's visits to different parts of the country highlight the diversity of India's geography. Support this statement with evidence from the text.<br />\nShaana visited glaciers in Kashmir, mountain forests in Himachal and Arunachal Pradesh, mangrove wetlands in Bengal, deserts in Gujarat, river valleys in MP, and coastal beaches and plateaus in Goa and Tamil Nadu.  <\/p>\n<\/li>\n<li>\n<p>How does Shaana use language to convey her excitement, curiosity, and sometimes her fears about the places she visits?<br />\nShaana uses casual greetings, enthusiastic exclamations, vivid descriptions, and direct questions to share her joy, curiosity, and minor fears with her friends.  <\/p>\n<\/li>\n<li>\n<p>What might Shaana have learnt from her travels across India? How would it impact her understanding of the country?<br />\nShaana learnt about India's geographical diversity, rich cultural heritage, different languages, and environmental issues, deepening her love and appreciation for her homeland.  <\/p>\n<\/li>\n<li>\n<p>What could be the author's purpose of presenting the text in the form of postcards?<br />\nThe author uses postcards to present travel information in an engaging, personal, and friendly narrative format that appeals to young readers.  <\/p>\n<\/li>\n<\/ol>\n<h2>Let us write<\/h2>\n<p><strong>Application to the Principal requesting leave of absence<\/strong>  <\/p>\n<p>House No. 42, Green Park Avenue<br />\nRameswaram<br />\nTamil Nadu<br />\n28 July 20XX  <\/p>\n<p>The Principal<br />\nSt. Joseph High School<br />\nRameswaram<br />\nTamil Nadu  <\/p>\n<p>Subject: Request for leave of absence for 3 days  <\/p>\n<p>Dear Madam,  <\/p>\n<p>I am writing to request 3 days leave with effect from 1 August 20XX to 3 August 20XX in order to attend a family wedding in my hometown.<br />\nI would like to assure you that I would complete all my missed classwork and homework immediately after returning.<br />\nI would be grateful if you could grant me the leave.  <\/p>\n<p>Yours sincerely,<br />\nShaana R.<br />\nClass VII, Section A, Roll No. 15  <\/p>"}, {"title": "The Tunnel", "html": "<h4>Let us read<\/h4>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>shimmered<\/strong><\/td>\n<td>shined with a light that appears to move<\/td>\n<\/tr>\n<tr>\n<td><strong>railway embankment<\/strong><\/td>\n<td>a stone wall made to carry the railway over low ground<\/td>\n<\/tr>\n<tr>\n<td><strong>cutting<\/strong><\/td>\n<td>a narrow valley cut through a hill to make space for a railway line<\/td>\n<\/tr>\n<tr>\n<td><strong>scrub-covered<\/strong><\/td>\n<td>covered with short trees and bushes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>I<\/strong>.  <\/p>\n<p>It was almost noon, and the jungle was very still, very silent. Heat waves shimmered along the railway embankment where it cut a path through the tall evergreen trees. The railway lines were two straight black serpents disappearing into the tunnel in the hillside.  <\/p>\n<p>Suraj stood near the cutting, waiting for the midday train. It wasn't a station, and he wasn't catching a train. He was waiting so that he could watch the steam engine come roaring out of the tunnel.  <\/p>\n<p>He had cycled out of the town and taken the jungle path until he had come to a small village. He had left the cycle there, and walked over a low scrub-covered hill and down to the tunnel exit.  <\/p>\n<p>Now he looked up. He had heard, in the distance, the shrill whistle of the engine. He couldn't see anything, because the train was approaching from the other side of the hill; but presently a sound like distant thunder issued from the tunnel, and he knew the train was coming through.  <\/p>\n<p>A second or two later, the steam engine shot out of the tunnel, snorting and puffing like some green, black, and gold dragon, some beautiful monster out of Suraj's dreams. Showering sparks left and right, it roared a challenge to the jungle.  <\/p>\n<p>Instinctively, Suraj stepped back a few paces. Waves of hot steam struck him in the face. Even the trees seemed to flinch from the noise and heat. And then the train had gone, leaving only a plume of smoke to drift lazily over the tall shisham trees.  <\/p>\n<p>The jungle was still again. No one moved.  <\/p>\n<p>Suraj turned from his contemplation of the drifting smoke and began walking along the embankment towards the tunnel.  <\/p>\n<p>The tunnel grew darker as he walked further into it. When he had gone about twenty yards, it became pitch dark. Suraj had to turn and look back at the opening to reassure himself that there was still daylight outside. Ahead of him, the tunnel's other opening was just a small round circle of light.  <\/p>\n<p>The tunnel was still full of smoke from the train, but it would be several hours before another train came through. Till then, the cutting belonged to the jungle again.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>instinctively<\/strong><\/td>\n<td>without thought or plan<\/td>\n<\/tr>\n<tr>\n<td><strong>flinch<\/strong><\/td>\n<td>make a quick movement<\/td>\n<\/tr>\n<tr>\n<td><strong>plume of smoke<\/strong><\/td>\n<td>long, thin cloud of smoke<\/td>\n<\/tr>\n<tr>\n<td><strong>shisham<\/strong><\/td>\n<td>a tree found in northern parts of India<\/td>\n<\/tr>\n<tr>\n<td><strong>contemplation<\/strong><\/td>\n<td>deep thought<\/td>\n<\/tr>\n<tr>\n<td><strong>reassure<\/strong><\/td>\n<td>comfort, calm<\/td>\n<\/tr>\n<tr>\n<td><strong>scuttled<\/strong><\/td>\n<td>ran hurriedly<\/td>\n<\/tr>\n<tr>\n<td><strong>dazzled<\/strong><\/td>\n<td>blinded by bright light<\/td>\n<\/tr>\n<tr>\n<td><strong>swishing<\/strong><\/td>\n<td>moving with a brushing sound<\/td>\n<\/tr>\n<tr>\n<td>Suraj didn't stop, because there was nothing to do in the tunnel and nothing to see. He had simply wanted to walk through, so that he would know what the inside of a tunnel was really like. The walls were damp and sticky. A bat flew past. A lizard scuttled between the lines.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Coming straight from the darkness into the light, Suraj was dazzled by the sudden glare and put a hand up to shade his eyes. He looked up at the tree-covered hillside and thought he saw something moving between the trees.  <\/p>\n<p>It was just a flash of orange and gold, and a long swishing tail. It was there between the trees for a second or two, and then it was gone.  <\/p>\n<p>About fifteen metres from the entrance to the tunnel stood the watchman's hut. Marigolds grew in front of the hut, and at the back there was a small vegetable patch. It was the watchman's duty to inspect the tunnel and keep it clear of obstacles.  <\/p>\n<p>Every day, before the train came through, he would walk the length of the tunnel. If all was well, he would  <\/p>\n<p>return to his hut and take a nap. If something was wrong, he would walk back up the line and wave a red flag, and the engine driver would slow down. At night, the watchman lit an oil lamp and made a similar inspection of the tunnel. Of course, he would not stop the train if there was a porcupine on the line. But if there was any danger to the train, he'd go back up the line and wave his lamp to the approaching engine. If all was well, he'd hang his lamp at the door of his hut and go to sleep.  <\/p>\n<p>He was just settling down on his cot for an afternoon nap when he saw the boy emerge from the tunnel. He waited until Suraj was only a metre or so away and then said, \"Welcome, welcome. I don't often have visitors. Sit down for a while, and tell me why you were inspecting my tunnel.\"  <\/p>\n<p>\"Is it your tunnel?\" asked Suraj.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>obstacles<\/strong><\/td>\n<td>things that block the way<\/td>\n<\/tr>\n<tr>\n<td><strong>porcupine<\/strong><\/td>\n<td>a small animal (large rodent) with sharp spikes on its back<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>\"It is,\" said the watchman. \"It is truly my tunnel, since no one else will have anything to do with it. I have only lent it to the Government.\"  <\/p>\n<p>Suraj sat down on the edge of the cot.  <\/p>\n<p>\"I wanted to see the train come through,\" he said. \"And then, when it had gone, I thought I'd walk through the tunnel.\"  <\/p>\n<p>\"And what did you find in it?\"  <\/p>\n<p>\"Nothing. It was very dark. But when I came out, I thought I saw an animal—up on the hill—but I'm not sure, it moved off very quickly.\"  <\/p>\n<p>\"It was a leopard you saw,\" said the watchman. \"My leopard.\"  <\/p>\n<p>\"Do you own a leopard too?\"  <\/p>\n<p>\"I do.\"  <\/p>\n<p>\"And do you lend it to the Government?\"  <\/p>\n<p>\"I do not.\"  <\/p>\n<p>\"Is it dangerous?\"  <\/p>\n<p>\"No, it's a leopard that minds its own business. It comes to this range for a few days every month.\"  <\/p>\n<p>\"Have you been here a long time?\" asked Suraj.  <\/p>\n<p>\"Many years. My name is Sunder Singh.\"  <\/p>\n<p>\"My name's Suraj.\"  <\/p>\n<p>\"There is one train during the day. And there is one train during the night. Have you seen the night mail come through the tunnel?\"  <\/p>\n<table>\n<thead>\n<tr>\n<th><strong>Word<\/strong><\/th>\n<th><strong>Meaning<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>range<\/strong><\/td>\n<td>area<\/td>\n<\/tr>\n<tr>\n<td><strong>night mail<\/strong><\/td>\n<td>a train that runs at night<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>\"No. At what time does it come?\"  <\/p>\n<p>\"About nine o'clock, if it isn't late. You could come and sit here with me, if you like. And after it has gone, instead of going to sleep I will take you home.\"  <\/p>\n<p>\"I'll ask my parents,\" said Suraj. \"Will it be safe?\"  <\/p>\n<p>\"Of course. It is safer in the jungle than in the town. Nothing happens to me out here. But last month, when I went into town, I was almost run over by a bus.\"  <\/p>\n<p>Sunder Singh yawned and stretched himself out on the cot. \"And now I am going to take a nap, my friend. It is too hot to be up and about in the afternoon.\"  <\/p>\n<p>\"Everyone goes to sleep in the afternoon,\" complained Suraj. \"My father lies down as soon as he's had his lunch.\"  <\/p>\n<p>\"Well, the animals also rest in the heat of the day. It is only the tribe of boys who cannot, or will not, rest.\"  <\/p>\n<p>Sunder Singh placed a large banana leaf over his face to keep away the flies, and was soon snoring gently. Suraj stood up, looking up and down the railway tracks. Then he began walking back to the village.  <\/p>\n<h4>Let us discuss<\/h4>\n<ol>\n<li>Suraj compares the train to a magical creature. Pick the phrases that convey the meaning.  <\/li>\n<li>Suraj knew that the train was close by because <code>____________<\/code>.  <\/li>\n<li>What did Suraj see inside the tunnel?  <\/li>\n<li>\n<p>Select the correct option.<br />\n   What does Sunder Singh convey about the tunnel?<br />\n   He says that <code>____________<\/code> (it is damp and sticky inside/he has lent it to the Government).<\/p>\n<\/li>\n<li>\n<p>The watchman has created a system through which he informs the locomotive driver about any danger in the tunnel. The following flow chart shows this system. Refer to the text and complete the flow chart.  <\/p>\n<\/li>\n<\/ol>\n<p><strong>II<\/strong>.  <\/p>\n<p>The following evening, towards dusk, as the flying foxes swooped silently out of the trees, Suraj made his way to the watchman's hut.  <\/p>\n<p>It had been a long hot day, but now the earth was cooling, and a light breeze was moving through the trees. It carried with it the scent of mango blossoms, the promise of rain.  <\/p>\n<p>Sunder Singh was waiting for Suraj. He had watered his small garden, and the flowers looked cool and fresh. A kettle was boiling on a small oil stove.  <\/p>\n<p>\"I am making tea,\" he said. \"There is nothing like a glass of hot tea while waiting for a train.\"  <\/p>\n<p>They drank their tea, listening to the sharp notes of the tailorbird and the noisy chatter of the seven sisters.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>swooped<\/strong><\/td>\n<td>moved quickly through the air downwards<\/td>\n<\/tr>\n<tr>\n<td><strong>seven sisters<\/strong><\/td>\n<td>birds, also called jungle babblers and found in groups of six to eight<\/td>\n<\/tr>\n<tr>\n<td><strong>quaint<\/strong><\/td>\n<td>unusual<\/td>\n<\/tr>\n<tr>\n<td><strong>nightjar<\/strong><\/td>\n<td>a nocturnal bird with a short bill<\/td>\n<\/tr>\n<tr>\n<td><strong>flexing<\/strong><\/td>\n<td>bending<\/td>\n<\/tr>\n<tr>\n<td><strong>trimming<\/strong><\/td>\n<td>(here) adjusting the wick of the lamp<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>As the brief twilight faded, most of the birds fell silent. Sunder Singh lit his oil lamp and said it was time for him to inspect the tunnel. He moved off towards the tunnel, while Suraj sat on the cot, sipping his tea. In the dark, the trees seemed to move closer to him. And the nightlife of the forest was conveyed on the breeze—the sharp call of a barking deer, the cry of a fox, the <strong>quaint<\/strong> tonk-tonk of a <strong>nightjar<\/strong>. There were some sounds that Suraj didn't recognise—sounds that came from the trees, creakings and whisperings, as though the trees were coming to life, stretching their limbs in the dark, shifting a little, <strong>flexing<\/strong> their fingers.  <\/p>\n<p>Sunder Singh stood inside the tunnel, <strong>trimming<\/strong> his lamp. The night sounds were familiar to him and he did not give them much thought; but something else—a padded footfall, a rustle of dry leaves—made him stand still for a few seconds, peering into the darkness. Then, humming softly to himself, he returned to where Suraj was waiting. Ten minutes remained for the night mail to arrive.  <\/p>\n<p>As Sunder Singh sat down on the cot beside Suraj, a new sound reached both of them quite distinctly—a rhythmic sawing sound, as if someone cutting through the branch of a tree.  <\/p>\n<p>\"What's that?\" whispered Suraj.  <\/p>\n<p>\"It's the leopard,\" said Sunder Singh. \"I think it's in the tunnel.\"  <\/p>\n<p>\"The train will soon be here,\" said Suraj.  <\/p>\n<p>\"Yes, my friend. And if we don't drive the leopard out of the tunnel, it will be run over and killed. I can't let that happen.\"  <\/p>\n<p>\"But won't it attack us if we try to drive it out?\" asked Suraj, beginning to share the watchman's concern.  <\/p>\n<p>\"Not this leopard. It knows me well. We have seen each other many times. It has a weakness for goats and stray dogs, but it will not harm us. Even so, I'll take my axe with me. You stay here, Suraj.\"  <\/p>\n<p>\"No, I'm coming with you. It will be better than sitting here alone in the dark!\"  <\/p>\n<p>\"All right, but stay close behind me. And remember, there is nothing to fear.\"  <\/p>\n<p>Raising his lamp, Sunder Singh advanced into the tunnel, shouting at the top of his voice to try and scare away the animal. Suraj followed close behind, but he found he was unable to do any shouting. His throat was quite dry.  <\/p>\n<p>They had gone about twenty paces into the tunnel when the light from the lamp fell upon the leopard. It was crouching between the tracks, only five metres away from them. It was not a very big leopard, but it looked lithe and sinewy. Baring its teeth and snarling, it went down on its belly, tail twitching.  <\/p>\n<p>Suraj and Sunder Singh both shouted together. Their voices rang through the tunnel. And the leopard, uncertain as to how many terrifying humans were there in the tunnel with him, turned swiftly and disappeared into the darkness.  <\/p>\n<p>To make sure that it had gone, Sunder Singh and Suraj walked the length of the tunnel. When they returned to the entrance, the rails were beginning to hum. They knew the train was coming.  <\/p>\n<p>Suraj put his hand to one of the rails and felt its tremor. He heard the distant rumble of the train. And then the engine came round the bend, hissing at them, scattering sparks into the darkness, defying the jungle as it roared through the steep sides of the cutting. It charged straight at the tunnel, and into it, thundering past Suraj like the beautiful dragon of his dreams.  <\/p>\n<table>\n<thead>\n<tr>\n<th>Word<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>lithe<\/strong><\/td>\n<td>thin, graceful<\/td>\n<\/tr>\n<tr>\n<td><strong>sinewy<\/strong><\/td>\n<td>lean and muscular<\/td>\n<\/tr>\n<tr>\n<td><strong>snarling<\/strong><\/td>\n<td>growling<\/td>\n<\/tr>\n<tr>\n<td><strong>twitching<\/strong><\/td>\n<td>a short, sudden movement<\/td>\n<\/tr>\n<tr>\n<td><strong>defying<\/strong><\/td>\n<td>opposing<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>And when it had gone, the silence returned and the forest seemed to breathe, to live again. Only the rails still trembled with the passing of the train.  <\/p>\n<p>They trembled again to the passing of the same train, almost a week later, when Suraj and his father were both travelling in it.  <\/p>\n<p>Suraj's father was scribbling in a notebook, doing his accounts. Suraj sat at an open window staring out at the darkness. His father was going to Delhi on a business trip and had decided to take the boy along. (\"I don't know where he gets to, most of the time,\" he'd complained. \"I think it's time he learnt something about my business.\")  <\/p>\n<p>The night mail rushed through the forest with its hundreds of passengers. The carriage wheels beat out a steady rhythm on the rails. Tiny flickering lights came and went, as they passed small villages on the fringe of the jungle.  <\/p>\n<p>Suraj heard the rumble as the train passed over a small bridge. It was too dark to see the hut near the cutting, but he knew they must be approaching the tunnel. He strained his eyes looking out into the night; and then, just as the engine let out a shrill whistle, Suraj saw the lamp.  <\/p>\n<p>He couldn't see Sunder Singh, but he saw the lamp, and he knew that his friend was out there.  <\/p>\n<p>The train went into the tunnel and out again; it left the jungle behind and thundered across the endless plains.  <\/p>\n<p>Suraj stared out at the darkness, thinking of the lonely cutting in the forest and the watchman with the lamp, who would always remain a firefly for those travelling thousands as he lit up the darkness for steam engines and leopards.  <\/p>\n<table>\n<thead>\n<tr>\n<th><strong>Word<\/strong><\/th>\n<th><strong>Meaning<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>flickering<\/strong><\/td>\n<td>burning unsteadily<\/td>\n<\/tr>\n<tr>\n<td><strong>fringe<\/strong><\/td>\n<td>edge<\/td>\n<\/tr>\n<tr>\n<td><strong>shrill<\/strong><\/td>\n<td>sharp sound<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>RUSKIN BOND<\/strong>  <\/p>\n<h4>Let us discuss<\/h4>\n<ol>\n<li>Sunder Singh knew that the leopard was in the tunnel because <code>_________<\/code>.  <\/li>\n<li>\n<p>Why do you think Suraj was unable to do any shouting in the tunnel in the beginning?<br />\n   (i) He was afraid of the leopard.<br />\n   (ii) He didn't want to disturb the leopard.<br />\n   (iii) He was trying to listen for the leopard.<br />\n   (iv) He didn't really believe Sunder Singh.<\/p>\n<\/li>\n<li>\n<p>What made the leopard disappear into the darkness?  <\/p>\n<\/li>\n<li>How did Suraj know Sunder Singh was at the tunnel?  <\/li>\n<li>Why did Suraj's father take him along to Delhi?  <\/li>\n<\/ol>\n<h4>Let us think and reflect<\/h4>\n<p>I Read the following lines and answer the questions that follow.  <\/p>\n<ol>\n<li><em>Suraj had to turn and look back at the opening to reassure himself that there was still daylight outside. Ahead of him, the tunnel's other opening was just a small round circle of light.<\/em><br />\n<em>The tunnel was still full of smoke from the train, but it would be several hours before another train came through. Till then, the cutting belonged to the jungle again.<\/em><br />\n<em>Suraj didn't stop, because there was nothing to do in the tunnel and nothing to see. He had simply wanted to walk through, so that he would know what the inside of a tunnel was really like.<\/em>  <\/li>\n<\/ol>\n<p>(i) Write whether the following statement is <strong>true<\/strong> or <strong>false<\/strong>.<br />\n<em>Suraj looked back at the opening of the tunnel to check if the train was coming.<\/em><br />\n(ii) Choose the correct option to complete the sentence given below.<br />\n<em>Suraj did not stop anywhere in the tunnel because <code>_________<\/code>.<\/em><\/p>\n<ul>\n<li>A. there was nothing to see in the tunnel  <\/li>\n<li>B. the tunnel was damp and sticky  <\/li>\n<li>C. he was in a hurry to get out of the tunnel  <\/li>\n<li>D. it was time for another train to come<br />\n(iii) What does the sentence 'Till then, the cutting belonged to the jungle again' mean?<br />\n(iv) Suraj wanted to know the inside of the tunnel. What character trait of Suraj is highlighted here?  <\/li>\n<\/ul>\n<ol start=\"2\">\n<li><em>'The train will soon be here,' said Suraj.<\/em>  <\/li>\n<\/ol>\n<p><em>'Yes, my friend. And if we don't drive the leopard out of the tunnel, it will be run over and killed. I can't let that happen.'<\/em>  <\/p>\n<p><em>'But won't it attack us if we try to drive it out?' asked Suraj, beginning to share the watchman's concern.<\/em>  <\/p>\n<p><em>'Not this leopard. It knows me well. We have seen each other many times. It has a weakness for goats and stray dogs, but it will not harm us. Even so, I'll take my axe with me. You stay here, Suraj.'<\/em>  <\/p>\n<p>(i) What was the watchman's concern?<br />\n(ii) Complete the sentence with a suitable reason.<br />\n<em>Sunder Singh was sure that the leopard in the tunnel would not attack him and Suraj because <code>_____<\/code>.<\/em><br />\n(iii) Select the sentences that are <strong>true<\/strong> from those given below.  <\/p>\n<ul>\n<li>A. Suraj wants to see the leopards in the jungle.  <\/li>\n<li>B. Suraj is concerned about Sunder Singh's safety.  <\/li>\n<li>C. The leopard in the tunnel attacks goats and stray dogs.  <\/li>\n<li>D. Sunder Singh wants to protect Suraj.  <\/li>\n<li>E. Sunder Singh knows all about the animals in the jungle.  <\/li>\n<\/ul>\n<p>(iv) Choose the correct option to complete the sentence.<br />\n<em>Sunder Singh decides to take his axe with him. This tells us that he was <code>_____<\/code>.<\/em>  <\/p>\n<ul>\n<li>A. violent  <\/li>\n<li>B. cautious  <\/li>\n<li>C. bold  <\/li>\n<li>D. afraid  <\/li>\n<\/ul>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>What does Sunder Singh convey by saying that he has lent his tunnel to the Government?  <\/li>\n<li>According to Sunder Singh, 'It is safer in the forest than in the town'. What example does Sunder Singh give to support his opinion? What does this tell us about him?  <\/li>\n<li>Sunder Singh has become part of the jungle life. Support the view with a suitable reason.  <\/li>\n<li>\n<p>Sunder Singh and Suraj form an unlikely friendship.<br />\nWhat draws them together?  <\/p>\n<\/li>\n<li>\n<p>Why is Sunder Singh referred to as a 'firefly'?  <\/p>\n<\/li>\n<li>Do you think Suraj is an adventure-loving boy? Give reasons.  <\/li>\n<\/ol>\n<h4>Let us write<\/h4>\n<p><strong>Write a descriptive paragraph about your experience of a train journey. Describe the sights, sounds, and feelings you experienced during the journey. Include details about the people around you, the scenery outside, and the atmosphere inside the train to make your paragraph vivid and engaging.<\/strong>  <\/p>\n<p>You may use the following guidelines to help you create the paragraph.  <\/p>\n<ul>\n<li>Start with how the journey began: boarding the train, finding your seat, and the initial impressions.  <\/li>\n<li>Describe the sounds: the whistle of the train, the chatter of passengers, and the rhythmic clatter of wheels on the tracks.  <\/li>\n<li>Mention the sights: the changing scenery outside the window, the hustle and bustle inside the train, and any interesting moments.  <\/li>\n<li>Reflect on your feelings: Were you excited, relaxed, or curious? How did the journey make you feel overall?  <\/li>\n<\/ul>\n<hr />\n<h1>Answers – The Tunnel<\/h1>\n<h2>Let us discuss<\/h2>\n<h3>Part I<\/h3>\n<ol>\n<li>\n<p>Suraj compares the train to a magical creature. Pick the phrases that convey the meaning.<br />\nAnswer: The phrases that convey this meaning are \"snorting and puffing like some green, black, and gold dragon\" and \"some beautiful monster out of Suraj's dreams\".  <\/p>\n<\/li>\n<li>\n<p>Suraj knew that the train was close by because <code>____________<\/code>.<br />\nAnswer: Suraj knew that the train was close by because he heard a sound like distant thunder issued from the tunnel.  <\/p>\n<\/li>\n<li>\n<p>What did Suraj see inside the tunnel?<br />\nAnswer: Inside the tunnel, Suraj saw damp and sticky walls, a bat flying past, and a lizard scuttling between the railway tracks.  <\/p>\n<\/li>\n<li>\n<p>Select the correct option.<br />\nWhat does Sunder Singh convey about the tunnel?<br />\nHe says that <code>____________<\/code> (it is damp and sticky inside/he has lent it to the Government).<br />\nAnswer: He says that he has lent it to the Government.  <\/p>\n<\/li>\n<li>\n<p>The watchman has created a system through which he informs the locomotive driver about any danger in the tunnel. The following flow chart shows this system. Refer to the text and complete the flow chart.<br />\nAnswer:<br />\nDaytime Inspection System:  <\/p>\n<\/li>\n<\/ol>\n<ul>\n<li>Walk the length of the tunnel before the train arrives.  <\/li>\n<li>If all is well: Return to his hut and take a nap.  <\/li>\n<li>If there is danger/obstacle: Walk back up the railway line and wave a red flag so the engine driver slows down.  <\/li>\n<\/ul>\n<p>Nighttime Inspection System:  <\/p>\n<ul>\n<li>Light an oil lamp and inspect the length of the tunnel.  <\/li>\n<li>If all is well: Hang his lamp at the door of his hut and go to sleep.  <\/li>\n<li>If there is danger/obstacle: Walk back up the railway line and wave his oil lamp to warn the approaching engine.  <\/li>\n<\/ul>\n<h3>Part II<\/h3>\n<ol>\n<li>\n<p>Sunder Singh knew that the leopard was in the tunnel because <code>_________<\/code>.<br />\nAnswer: Sunder Singh knew that the leopard was in the tunnel because he heard a rhythmic sawing sound coming from inside the tunnel.  <\/p>\n<\/li>\n<li>\n<p>Why do you think Suraj was unable to do any shouting in the tunnel in the beginning?<br />\n(i) He was afraid of the leopard.<br />\n(ii) He didn't want to disturb the leopard.<br />\n(iii) He was trying to listen for the leopard.<br />\n(iv) He didn't really believe Sunder Singh.<br />\nAnswer: (i) He was afraid of the leopard.  <\/p>\n<\/li>\n<li>\n<p>What made the leopard disappear into the darkness?<br />\nAnswer: The leopard disappeared into the darkness because Suraj and Sunder Singh shouted together at the top of their voices, which frightened and confused the leopard.  <\/p>\n<\/li>\n<li>\n<p>How did Suraj know Sunder Singh was at the tunnel?<br />\nAnswer: Suraj saw Sunder Singh's oil lamp glowing near the entrance of the tunnel from the window of the passing night mail train.  <\/p>\n<\/li>\n<li>\n<p>Why did Suraj's father take him along to Delhi?<br />\nAnswer: Suraj's father took him along to Delhi on a business trip because he felt Suraj spent too much time wandering around and wanted him to learn something about his business.  <\/p>\n<\/li>\n<\/ol>\n<h2>Let us think and reflect<\/h2>\n<h3>I. Read the following lines and answer the questions that follow.<\/h3>\n<ol>\n<li>(i) Write whether the following statement is true or false.<br />\nSuraj looked back at the opening of the tunnel to check if the train was coming.<br />\nAnswer: False (Suraj looked back to reassure himself that there was still daylight outside).  <\/li>\n<\/ol>\n<p>(ii) Choose the correct option to complete the sentence given below.<br />\nSuraj did not stop anywhere in the tunnel because <code>_________<\/code>.  <\/p>\n<ul>\n<li>A. there was nothing to see in the tunnel  <\/li>\n<li>B. the tunnel was damp and sticky  <\/li>\n<li>C. he was in a hurry to get out of the tunnel  <\/li>\n<li>D. it was time for another train to come<br />\nAnswer: A. there was nothing to see in the tunnel  <\/li>\n<\/ul>\n<p>(iii) What does the sentence 'Till then, the cutting belonged to the jungle again' mean?<br />\nAnswer: It means that during the hours between train passing times, the railway cutting became quiet and returned to the natural, peaceful domain of the forest and its wild animals.  <\/p>\n<p>(iv) Suraj wanted to know the inside of the tunnel. What character trait of Suraj is highlighted here?<br />\nAnswer: This highlights Suraj's strong curiosity, adventurous spirit, and desire to experience things firsthand.  <\/p>\n<ol start=\"2\">\n<li>(i) What was the watchman's concern?<br />\nAnswer: The watchman's concern was that if they did not drive the leopard out of the tunnel, it would get run over and killed by the incoming night mail train.  <\/li>\n<\/ol>\n<p>(ii) Complete the sentence with a suitable reason.<br />\nSunder Singh was sure that the leopard in the tunnel would not attack him and Suraj because <code>_____<\/code>.<br />\nAnswer: Sunder Singh was sure that the leopard in the tunnel would not attack him and Suraj because the leopard knew him well, they had seen each other many times, and it was a leopard that minded its own business.  <\/p>\n<p>(iii) Select the sentences that are true from those given below.  <\/p>\n<ul>\n<li>A. Suraj wants to see the leopards in the jungle.  <\/li>\n<li>B. Suraj is concerned about Sunder Singh's safety.  <\/li>\n<li>C. The leopard in the tunnel attacks goats and stray dogs.  <\/li>\n<li>D. Sunder Singh wants to protect Suraj.  <\/li>\n<li>\n<p>E. Sunder Singh knows all about the animals in the jungle.<br />\nAnswer: The true statements are:  <\/p>\n<\/li>\n<li>\n<p>C. The leopard in the tunnel attacks goats and stray dogs.  <\/p>\n<\/li>\n<li>D. Sunder Singh wants to protect Suraj.  <\/li>\n<li>E. Sunder Singh knows all about the animals in the jungle.  <\/li>\n<\/ul>\n<p>(iv) Choose the correct option to complete the sentence.<br />\nSunder Singh decides to take his axe with him. This tells us that he was <code>_____<\/code>.  <\/p>\n<ul>\n<li>A. violent  <\/li>\n<li>B. cautious  <\/li>\n<li>C. bold  <\/li>\n<li>D. afraid<br />\nAnswer: B. cautious  <\/li>\n<\/ul>\n<h3>II. Answer the following questions.<\/h3>\n<ol>\n<li>\n<p>What does Sunder Singh convey by saying that he has lent his tunnel to the Government?<br />\nAnswer: Sunder Singh conveys a deep sense of ownership, pride, and personal responsibility towards the tunnel. Since he lives there alone and protects it daily, he feels it belongs to him and he is merely allowing the Government to use it.  <\/p>\n<\/li>\n<li>\n<p>According to Sunder Singh, 'It is safer in the forest than in the town'. What example does Sunder Singh give to support his opinion? What does this tell us about him?<br />\nAnswer: Sunder Singh gives the example that nothing bad ever happens to him in the jungle, but when he went into town last month, he was almost run over by a bus. This shows that he feels at home in nature, respects the natural world, and finds the wild forest more predictable than city traffic.  <\/p>\n<\/li>\n<li>\n<p>Sunder Singh has become part of the jungle life. Support the view with a suitable reason.<br />\nAnswer: Sunder Singh lives in harmony with nature, recognizes forest sounds, understands animal behavior, and protects wildlife like the leopard rather than fearing or harming them.  <\/p>\n<\/li>\n<li>\n<p>Sunder Singh and Suraj form an unlikely friendship. What draws them together?<br />\nAnswer: They are drawn together by their mutual love for nature, curiosity about trains, and appreciation for the quiet mystery of the jungle.  <\/p>\n<\/li>\n<li>\n<p>Why is Sunder Singh referred to as a 'firefly'?<br />\nAnswer: Sunder Singh is referred to as a 'firefly' because he stands alone in the pitch darkness of the forest with his small glowing oil lamp, bringing guidance and reassurance to train passengers.  <\/p>\n<\/li>\n<li>\n<p>Do you think Suraj is an adventure-loving boy? Give reasons.<br />\nAnswer: Yes, Suraj is an adventure-loving boy. He cycles out of town into the forest, explores a dark railway tunnel on foot, and courageously accompanies Sunder Singh into the tunnel at night to drive away a wild leopard.  <\/p>\n<\/li>\n<\/ol>\n<h2>Let us write<\/h2>\n<p>Write a descriptive paragraph about your experience of a train journey...<br />\nAnswer:  <\/p>\n<p><strong>My Unforgettable Train Journey<\/strong>  <\/p>\n<p>Last summer, I went on an exciting train journey to my grandparents' house in the hills. My adventure began at the bustling railway station, where my family boarded the colorful train and found our seats near a large window. As the train let out a loud whistle and slowly pulled away from the platform, I felt a thrill of excitement. Inside the compartment, passengers were chatting happily, vendors were selling hot tea, and children were looking out of the windows. Soon, the steady, rhythmic clatter of the wheels on the tracks filled the air. Outside, the scenery shifted from busy city streets to green fields, tall trees, and peaceful villages. As dusk fell, tiny lights sparkled in distant houses. I felt completely relaxed and curious as I watched the landscape glide by in the evening light. It was a memorable journey that filled my heart with joy and wonder.  <\/p>"}, {"title": "Travel", "html": "<h4>Let us read<\/h4>\n<p><em>The railroad track is miles away,<\/em><br />\n<em>And the day is loud with voices speaking,<\/em><br />\n<em>Yet there isn't a train goes by all day<\/em><br />\n<em>But I hear its whistle shrieking.<\/em>  <\/p>\n<p><em>All night there isn't a train goes by,<\/em><br />\n<em>Though the night is still for sleep and dreaming,<\/em><br />\n<em>But I see its cinders red on the sky,<\/em><br />\n<em>And hear its engine steaming.<\/em>  <\/p>\n<p><em>My heart is warm with the friends I make,<\/em><br />\n<em>And better friends I'll not be knowing;<\/em><br />\n<em>Yet there isn't a train I wouldn't take,<\/em><br />\n<em>No matter where it's going.<\/em>  <\/p>\n<p><strong>EDNA ST. VINCENT MILLAY<\/strong>  <\/p>\n<hr />\n<h2>Summary<\/h2>\n<p>The speaker, despite living miles from the railroad, is constantly aware of the train — hearing its whistle shriek during the busy day and seeing its red cinders glow against the night sky. Even though the speaker has warm friendships and is content with current companions, there is an irresistible pull toward the train and the promise of adventure it represents. The poem conveys the universal longing for travel and new experiences, suggesting that the desire to explore transcends comfort and familiarity. The train becomes a symbol of opportunity, adventure, and the unknown.  <\/p>\n<h2>Poetic Devices<\/h2>\n<ul>\n<li>\n<p><strong>Personification<\/strong> — The train's whistle is described as \"shrieking,\" giving it a human-like vocal quality; the engine is said to be \"steaming\" as if alive.<\/p>\n<\/li>\n<li>\n<p><strong>Symbolism<\/strong> — The train symbolizes adventure and opportunities for exploration and discovery.<\/p>\n<\/li>\n<li>\n<p><strong>Imagery<\/strong> — \"cinders red on the sky\" (visual), \"whistle shrieking\" (auditory), \"day is loud with voices speaking\" (auditory), \"heart is warm\" (emotional/tactile).<\/p>\n<\/li>\n<li>\n<p><strong>Repetition<\/strong> — \"There isn't a train goes by\" is repeated in all three stanzas to emphasize the speaker's constant preoccupation with the train.<\/p>\n<\/li>\n<li>\n<p><strong>Enjambment<\/strong> — Lines flow without pause (\"The railroad track is miles away, / And the day is loud with voices speaking\"), creating a breathless, longing rhythm.<\/p>\n<\/li>\n<li>\n<p><strong>Juxtaposition<\/strong> — The busy day is set against the still night; contentment with friends is set against the restless pull of the train, creating tension between satisfaction and wanderlust.<\/p>\n<\/li>\n<li>\n<p><strong>Contrast<\/strong> — The busy day vs. the still night; contentment with friends vs. restless desire to travel.<\/p>\n<\/li>\n<li>\n<p><strong>Tone:<\/strong> Enthusiastic, thoughtful, and curious.<\/p>\n<\/li>\n<\/ul>\n<h2>Rhyme Scheme<\/h2>\n<p>ABAB — each stanza uses alternating rhymes (e.g., away/speaking/day/shrieking; by/dreaming/sky/steaming; make/knowing/take/going).<\/p>\n<hr />\n<h4>Let us discuss<\/h4>\n<p><strong>I. The main ideas of each stanza of the poem are given below. Write the number of the stanza against the matching main idea.<\/strong>  <\/p>\n<ol>\n<li>At night, the speaker imagines the train and hears its engine in the quiet.  <\/li>\n<li>The speaker feels a strong desire to take any train, no matter where it goes.  <\/li>\n<li>The speaker hears the train whistle during the day, even though the train is far away.  <\/li>\n<\/ol>\n<p><strong>II. Read the poem and underline the rhyming words in each stanza. Write the rhyming words from each stanza. An example has been done for you.<\/strong>  <\/p>\n<ol>\n<li>Stanza (i): away-day;  <\/li>\n<li>Stanza (ii):  <\/li>\n<li>Stanza (iii):  <\/li>\n<\/ol>\n<p><strong>III. Identify the rhyme scheme of the poem from the options given below.<\/strong>  <\/p>\n<ul>\n<li>\n<ol>\n<li>AABB  <\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>ABCA  <\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>ABAB  <\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"4\">\n<li>ABBC  <\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<p><strong>IV. Identify the word in the poem that personifies the whistle of the train.<\/strong>  <\/p>\n<p><strong>V. Tone refers to the attitude the poet has about the poem. Which of these words can be used to describe the poet's tone in this poem?<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>serious<\/th>\n<th>excited<\/th>\n<th>curious<\/th>\n<th>worried<\/th>\n<th>thoughtful<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>content<\/td>\n<td>enthusiastic<\/td>\n<td>critical<\/td>\n<td>joyful<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>VI. Select the words that tell us what the train symbolises for the poet.<\/strong>  <\/p>\n<ol>\n<li>education  <\/li>\n<li>adventure  <\/li>\n<li>comfort  <\/li>\n<li>opportunities  <\/li>\n<\/ol>\n<p><strong>VII. Complete the following by choosing the correct option from those given in brackets.<\/strong>  <\/p>\n<p><em>The poet repeats the line, '...there isn't a train goes by,' in all three stanzas to <code>______<\/code>. (highlight the speaker's fascination with the train/suggest that the area has many trains passing through)<\/em>  <\/p>\n<p><strong>VIII. The poem contrasts the busy day with the stillness of the night. What is the common factor in these?<\/strong>  <\/p>\n<p><strong>IX Imagery is a literary device that uses descriptive language to create mental pictures and appeal to the reader's senses (sight, sound, smell, taste and touch). It makes the descriptions more relatable.<\/strong><br />\n<strong>Select the phrases from the poem that are examples of imagery.<\/strong><br />\n<em>One example is given: day is loud.<\/em>  <\/p>\n<h4>Let us think and reflect<\/h4>\n<p>I Read the extract given below and answer the questions that follow.  <\/p>\n<ol>\n<li><em>My heart is warm with the friends I make,<br />\nAnd better friends I'll not be knowing...<\/em>  <\/li>\n<\/ol>\n<p>(i) Choose the suitable option to complete the following.<br />\n<em>The line 'My heart is warm' refers to a heart that is <code>_____<\/code>.<\/em>  <\/p>\n<ul>\n<li>A. filled with worries  <\/li>\n<li>B. full of love  <\/li>\n<li>C. feeling upset  <\/li>\n<li>D. experiencing anger<br />\n(ii) What does the speaker say about her current friends?<br />\n(iii) What does the line 'better friends I'll not be knowing' suggest<br />\nabout the speaker's feelings toward their current friends?<br />\n(iv) Complete the following suitably.<br />\n<em>The tone of the speaker in these lines is <code>_____<\/code>. (grateful/content)<\/em>  <\/li>\n<\/ul>\n<p><strong>II. Answer the following questions.<\/strong>  <\/p>\n<ol>\n<li>What does the phrase 'cinders red on the sky' tell us about the train at night?  <\/li>\n<li>What is the significance of the repeated references to the train's whistle?  <\/li>\n<li>What does the line 'no matter where it's going' reveal about the speaker's attitude towards travel?  <\/li>\n<li>Do you think the poet actually sees and hears the train? Why or why not?  <\/li>\n<\/ol>\n<h4>Let us write<\/h4>\n<p><strong>I. A diamante poem is a poem that is shaped like a diamond, which uses specific types of words like adjectives and-ing words.<\/strong><br />\nLet us read an example.  <\/p>\n<p>Day<br />\nBright, sunny<br />\nDancing, playing, running<br />\nOut comes the sun, down goes the sun<br />\nResting, listening, dreaming<br />\nQuiet, peaceful<br />\nNight  <\/p>\n<p>In this example we see how two different ideas—day and night are connected through the poem.  <\/p>\n<p><strong>Let us now write a diamante poem that connects 'reading' and 'adventure'.<\/strong>  <\/p>\n<table>\n<thead>\n<tr>\n<th>Reading<\/th>\n<th><em>the first topic<\/em><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>_____<\/code>, <code>_____<\/code><\/td>\n<td><em>two adjectives about reading<\/em><\/td>\n<\/tr>\n<tr>\n<td><code>_____<\/code>, <code>_____<\/code>, <code>_____<\/code><\/td>\n<td><em>three -ing words about reading<\/em><\/td>\n<\/tr>\n<tr>\n<td><code>_____<\/code><\/td>\n<td><em>four nouns or a short phrase linking your topics<\/em><\/td>\n<\/tr>\n<tr>\n<td><code>_____<\/code>, <code>_____<\/code>, <code>_____<\/code><\/td>\n<td><em>three -ing words about adventure<\/em><\/td>\n<\/tr>\n<tr>\n<td><code>_____<\/code>, <code>_____<\/code><\/td>\n<td><em>two adjectives about adventure<\/em><\/td>\n<\/tr>\n<tr>\n<td>Adventure<\/td>\n<td><em>the second topic<\/em><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Share your poem with your classmates and the teacher.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>II We come across many interesting characters while travelling. They become interesting because of their actions, their behaviour, and manner of speaking. Describe one such character that you met. Follow these steps.<\/strong>  <\/p>\n<ol>\n<li>Choose the character.  <\/li>\n<li>Create a first draft of your description including the following details.  <ul>\n<li>(i) What is the name of the character?<\/li>\n<li>(ii) What does the character look like?<\/li>\n<li>(iii) What does the character do?<\/li>\n<li>(iv) What kind of person is she or he?<\/li>\n<li>(v) Include any line or incident from the text that you like the most.<\/li>\n<\/ul>\n<\/li>\n<li>Check your description for any spelling mistakes or errors.  <\/li>\n<li>Show your classmates your work and ask for suggestions.  <\/li>\n<li>Rewrite your description including all the changes and suggestions for improvement.  <\/li>\n<\/ol>\n<hr />\n<h1>Answers – Travel<\/h1>\n<h2>Let us discuss<\/h2>\n<h3>I. The main ideas of each stanza of the poem are given below. Write the number of the stanza against the matching main idea.<\/h3>\n<ol>\n<li>At night, the speaker imagines the train and hears its engine in the quiet. — Stanza (ii)  <\/li>\n<li>The speaker feels a strong desire to take any train, no matter where it goes. — Stanza (iii)  <\/li>\n<li>The speaker hears the train whistle during the day, even though the train is far away. — Stanza (i)  <\/li>\n<\/ol>\n<h3>II. Read the poem and underline the rhyming words in each stanza. Write the rhyming words from each stanza. An example has been done for you.<\/h3>\n<ol>\n<li>Stanza (i): away-day; speaking-shrieking  <\/li>\n<li>Stanza (ii): by-sky; dreaming-steaming  <\/li>\n<li>Stanza (iii): make-take; knowing-going  <\/li>\n<\/ol>\n<h3>III. Identify the rhyme scheme of the poem from the options given below.<\/h3>\n<ul>\n<li>\n<ol>\n<li>AABB  <\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>ABCA  <\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"2\">\n<li>ABAB  <\/li>\n<\/ol>\n<\/li>\n<li>\n<ol start=\"4\">\n<li>ABBC<br />\nAnswer: 2. ABAB (ABAB)  <\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<h3>IV. Identify the word in the poem that personifies the whistle of the train.<\/h3>\n<p>Answer: shrieking  <\/p>\n<h3>V. Tone refers to the attitude the poet has about the poem. Which of these words can be used to describe the poet's tone in this poem?<\/h3>\n<table>\n<thead>\n<tr>\n<th>serious<\/th>\n<th>excited<\/th>\n<th>curious<\/th>\n<th>worried<\/th>\n<th>thoughtful<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>content<\/td>\n<td>enthusiastic<\/td>\n<td>critical<\/td>\n<td>joyful<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Answer: enthusiastic, excited, thoughtful, curious<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>VI. Select the words that tell us what the train symbolises for the poet.<\/h3>\n<ol>\n<li>education  <\/li>\n<li>adventure  <\/li>\n<li>comfort  <\/li>\n<li>opportunities<br />\nAnswer: 2. adventure, 4. opportunities  <\/li>\n<\/ol>\n<h3>VII. Complete the following by choosing the correct option from those given in brackets.<\/h3>\n<p>The poet repeats the line, '...there isn't a train goes by,' in all three stanzas to <code>______<\/code>. (highlight the speaker's fascination with the train/suggest that the area has many trains passing through)<br />\nAnswer: highlight the speaker's fascination with the train  <\/p>\n<h3>VIII. The poem contrasts the busy day with the stillness of the night. What is the common factor in these?<\/h3>\n<p>Answer: The common factor is the speaker's intense longing for the train and her awareness of its sound and presence during both day and night.  <\/p>\n<h3>IX. Imagery is a literary device that uses descriptive language to create mental pictures and appeal to the reader's senses (sight, sound, smell, taste and touch). It makes the descriptions more relatable.<\/h3>\n<p>Select the phrases from the poem that are examples of imagery.<br />\nOne example is given: day is loud.<br />\nAnswer:  <\/p>\n<ul>\n<li>Visual imagery (sight): \"cinders red on the sky\"  <\/li>\n<li>Auditory imagery (sound): \"voices speaking\", \"whistle shrieking\", \"night is still\", \"engine steaming\"  <\/li>\n<li>Tactile/Emotional imagery (feeling): \"heart is warm\"  <\/li>\n<\/ul>\n<h2>Let us think and reflect<\/h2>\n<h3>I. Read the extract given below and answer the questions that follow.<\/h3>\n<ol>\n<li><em>My heart is warm with the friends I make,<br />\nAnd better friends I'll not be knowing...<\/em>  <\/li>\n<\/ol>\n<p>(i) Choose the suitable option to complete the following.<br />\nThe line 'My heart is warm' refers to a heart that is <code>_____<\/code>.  <\/p>\n<ul>\n<li>A. filled with worries  <\/li>\n<li>B. full of love  <\/li>\n<li>C. feeling upset  <\/li>\n<li>D. experiencing anger<br />\nAnswer: B. full of love  <\/li>\n<\/ul>\n<p>(ii) What does the speaker say about her current friends?<br />\nAnswer: The speaker says that her heart is filled with warmth and affection for the friends she makes.  <\/p>\n<p>(iii) What does the line 'better friends I'll not be knowing' suggest about the speaker's feelings toward their current friends?<br />\nAnswer: It suggests that the speaker deeply values and loves her current friends and believes she could not ask for better companions.  <\/p>\n<p>(iv) Complete the following suitably.<br />\nThe tone of the speaker in these lines is <code>_____<\/code>. (grateful/content)<br />\nAnswer: grateful  <\/p>\n<h3>II. Answer the following questions.<\/h3>\n<ol>\n<li>\n<p>What does the phrase 'cinders red on the sky' tell us about the train at night?<br />\nAnswer: It creates a vivid visual image of bright red embers and sparks flying from the train's steam engine into the dark night sky.  <\/p>\n<\/li>\n<li>\n<p>What is the significance of the repeated r
