        'In Bhindol, a village of about four hundred families, the government school closes at two in the afternoon. For most children the rest of the day was spent helping at home or wandering near the highway. Two years ago, Lalita Devi, a retired teacher of sixty-eight, decided that the empty building should not stay idle. She gathered five other women from the village, none of them younger than fifty, and started an evening class from five to seven.',
        'The class is not like a normal school. There are no bells, no uniforms and no marks. Children come when their chores are done, and the women teach whatever the children ask for — a difficult sum, a letter to a distant father, the spelling of a word heard on the radio. The older women often say that they learn as much as they teach, because a child’s question rarely has an easy answer.',
        'Everything is made from what the village already has. Old newspapers serve as notebooks, the walls are painted with charcoal and chalk, and the class library is a tin trunk holding forty-three books donated by families. When the electricity fails, which happens often, the class moves to the veranda and continues under the light of two lanterns.',
        'Not everyone approved at first. Some parents thought the evening class was a waste of time, and a few said girls should not go out after dark. Lalita Devi answered by walking to each house, and by the second year twenty-two girls were attending regularly. Now the panchayat has given the group a small grant for lanterns and mats, and a younger teacher comes twice a week.',
        'Attendance is still uneven — during harvest, the class empties. Nobody minds very much. The women say that learning can wait for a day, but a family cannot, and that a class which understands this is likely to last longer than one which does not.'

    {
      title: 'Why a City Needs Old Trees',
      paras: [
        'A tree planted today will not shade a street properly for thirty years. That single fact explains why the oldest trees in a city are worth more than their timber, and why cutting one down is rarely a small decision. An old tree has a canopy wide enough to cool a whole lane, roots that hold soil in place during heavy rain, and hollows and cracks that insects, owls and squirrels have used for generations.',
        'The cooling is measurable. Shade and evaporation from leaves can lower the temperature beneath a large tree by several degrees, which matters more each summer. Streets without trees stay hotter long after sunset, because concrete and tar store heat during the day and release it slowly at night. A row of trees along a road therefore does two jobs at once: it cools the air and it makes walking pleasant enough that people leave their cars at home.',
        'Old trees also protect the ground. When rain falls hard on bare soil, it runs off quickly, carrying mud into drains and causing local flooding. Roots break the force of the rain and hold the soil together, so water soaks in slowly instead of rushing away.',
        'None of this is visible in a photograph of a new park, which is why old trees are so easily lost. A road-widening plan may show a neat green strip of saplings and call it compensation. But a sapling cannot replace a tree that took four decades to grow; it can only, in time, become one.',
        'Some cities have begun to count trees as public property rather than decoration. They number each old tree, record its age and health, and require permission before it is removed. In one such city, a plan to cut seventeen trees for a bus terminal was dropped after residents showed that nine of them were older than the neighbourhood itself. The terminal was built elsewhere, and no tree was cut.'
      ],

        { t: 'mcq', q: 'Why do streets without trees stay hot long after sunset?', opts: ['Concrete and tar store heat and release it slowly', 'The wind cannot enter narrow streets', 'Street lights give out a lot of heat', 'There is no rain in such streets'], a: 0, why: 'Concrete and tar store heat during the day and release it slowly at night.' },
        { t: 'mcq', q: 'What happens when heavy rain falls on bare soil?', opts: ['It soaks in slowly and stays there', 'It runs off quickly, carrying mud into drains', 'It turns the soil into stone', 'It keeps the soil cool for months'], a: 1, why: 'It runs off quickly, carrying mud into drains and causing local flooding.' },
        { t: 'mcq', q: 'What happened to the plan to cut seventeen trees for a bus terminal?', opts: ['All seventeen trees were cut', 'The plan was dropped and the trees stayed', 'Only nine of the trees were cut', 'The trees were dug up and moved to a park'], a: 1, why: 'Residents showed that nine of the seventeen were older than the neighbourhood; the plan was dropped and no tree was cut.' },
        { t: 'text', q: 'How many decades does a large tree need to grow? <span class="hint">(one word)</span>', parts: [{ a: ['four', '4'] }], why: 'A sapling cannot replace a tree that took four decades to grow.' },

        { t: 'text', q: 'Fill in the blank: Some cities now count old trees as public ____________. <span class="hint">(one word)</span>', parts: [{ a: ['property'] }], why: 'Some cities have begun to count trees as public property rather than decoration.' }

        'Every evening during the monsoon, a fourteen-year-old named Imran climbs to the flat roof of his house in a village near Kota and reads the rain gauge his uncle fixed there. He writes three things in a notebook: the date, the depth of water in the gauge, and one line about the sky. The notebook is cheap, the gauge is a plastic tube, and the whole habit takes four minutes.',
        'Imran began because his father, a farmer, could never decide when to sow. The first heavy shower is not the same as the start of the rains; if seeds go into dry soil after a single shower, they may never sprout. Old farmers in the village read the sky by signs — the direction of the wind, the calling of a particular bird, the way ants move — but nobody had ever written these signs down.',
        'After two monsoons, Imran had a page for every day. Reading it again, he noticed something the older men had felt but never stated: in his village the first steady rain of the season usually arrived about eleven days after the first heavy shower, and the gap was almost never shorter than a week. He took the notebook to the village meeting and read out the numbers. Some farmers were amused. Three tried it the following year, waited, and sowed later. Their fields came up more evenly than their neighbours’.',

      ],
      questions: [
        { t: 'mcq', q: 'What three things does Imran write in his notebook?', opts: ['The date, the depth of water and one line about the sky', 'The time, the temperature and the wind', 'The date, the crop and the price', 'The rain, the soil and the harvest'], a: 0, why: 'He writes three things: the date, the depth of water in the gauge, and one line about the sky.' },
        { t: 'mcq', q: 'Why did Imran begin keeping the diary?', opts: ['His teacher gave it as homework', 'His father could never decide when to sow', 'The village paid him for it', 'He wanted to win a prize'], a: 1, why: 'Imran began because his father, a farmer, could never decide when to sow.' },
        { t: 'mcq', q: 'What may happen if seeds go into dry soil after a single shower?', opts: ['They grow faster than usual', 'They may never sprout', 'They need less water later', 'They attract birds to the field'], a: 1, why: 'If seeds go into dry soil after a single shower, they may never sprout.' },

        'The shop near the bus stand in Panvel sells vegetables that no other shop will take: tomatoes with a split skin, cucumbers bent like question marks, carrots too short for a machine to peel. None of them is rotten. Each was rejected for its shape, and each would otherwise have been thrown away.',
        'Meera, who runs the shop, learned the trade by accident. She once helped at a wedding where four crates of beans were left over because they were the wrong length for the caterer’s machines. She filled two bags and took them home, and then spent the evening wondering how much good food leaves a market every day simply because it looks unusual.',
        'Her shop works on a simple rule: the price is half the market rate, and the customer is told why the vegetable is there. A hand-written board above the counter says, “These are the ones that were refused. They taste the same.” Some customers laugh at first. Then they come back, because a family that saves forty rupees on vegetables every week notices the saving.',

      questions: [
        { t: 'mcq', q: 'Which vegetables does Meera’s shop sell?', opts: ['Vegetables that are rotten', 'Vegetables rejected for their shape but not rotten', 'Only the cheapest vegetables in the market', 'Vegetables grown in her own garden'], a: 1, why: 'None of them is rotten; each was rejected for its shape.' },
        { t: 'mcq', q: 'How did Meera learn this trade?', opts: ['From a training course', 'By accident, after a wedding left four crates of beans', 'From her mother', 'By reading a newspaper article'], a: 1, why: 'She learned the trade by accident, when a wedding left over four crates of beans.' },
        { t: 'mcq', q: 'What is the shop’s rule about price?', opts: ['The price is half the market rate and the customer is told why the vegetable is there', 'Everything costs ten rupees', 'The price changes every hour', 'Customers pay whatever they wish'], a: 0, why: 'The price is half the market rate, and the customer is told why the vegetable is there.' },
        { t: 'mcq', q: 'How do the farmers gain from the shop?', opts: ['They get free seeds from Meera', 'A farmer paid for a full crate no longer loses money on the refused part', 'They sell their vegetables at double the price', 'They no longer need to grow vegetables'], a: 1, why: 'A farmer paid for a full crate no longer loses money on the part that the wholesale buyer refuses.' },
        { t: 'mcq', q: 'What did Meera do about her neighbour’s complaint?', opts: ['She closed the shop', 'She moved her crates inside', 'She argued with the neighbour', 'She complained to the council'], a: 1, why: 'Meera agrees that it does and has moved her crates inside.' },
        { t: 'text', q: 'How many rupees does a family save on vegetables each week? <span class="hint">(one word)</span>', parts: [{ a: ['forty', '40'] }], why: 'The passage says a family that saves forty rupees on vegetables every week notices the saving.' },
        { t: 'text', q: 'Find words from the passage which mean the following: <span class="hint">(one word each)</span>', parts: [{ label: '(a) no longer good enough to eat; decayed —', a: ['rotten'] }, { label: '(b) refused; not accepted —', a: ['rejected'] }], why: '‘Rotten’ means decayed; ‘rejected’ means refused or not accepted.' },
        { t: 'tf', q: 'State whether the following statement is TRUE or FALSE: “The vegetables sold in the shop are rotten.”', a: false, why: 'The passage says plainly that none of them is rotten.' },
        { t: 'mcq', q: 'Complete the sentence: Meera is not interested in arguing that her shop is a good deed because ____________.', opts: ['she earns a large profit from it', 'she would rather it were simply a shop that made sense', 'the neighbours disagree with her', 'the farmers do not support her'], a: 1, why: 'She would rather it were simply a shop that made sense.' },
        { t: 'text', q: 'What took the vegetables that even Meera could not sell? <span class="hint">(one word)</span>', parts: [{ a: ['compost'] }], why: 'The compost heap behind the counter took what even she could not sell.' }
      ]
    }
  ];

  var ROMAN = ['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii', 'viii', 'ix', 'x'];
  var LETTERS = ['a', 'b', 'c', 'd'];

  var root = document.documentElement;
  try { var savedTheme = localStorage.getItem('c7-reading-theme'); if (savedTheme) root.setAttribute('data-theme', savedTheme); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('c7-reading-theme', next); } catch (e) {}
  });

  var tabsEl = document.getElementById('tabs');
  var passageCard = document.getElementById('passageCard');
  var quiz = document.getElementById('quiz');
  var scorebar = document.getElementById('scorebar');
  var cur = 0;
  var state = PASSAGES.map(function () { return { sel: {}, text: {}, res: {}, score: null }; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function norm(s) { return (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' '); }
  function whyHtml(q) { return q.why ? '<span class="why">' + esc(q.why) + '</span>' : ''; }

  function renderTabs() {
    tabsEl.innerHTML = PASSAGES.map(function (p, i) {
      return '<button type="button" class="tab' + (i === cur ? ' active' : '') + '" data-i="' + i + '">Passage ' + (i + 1) + '</button>';
    }).join('');
  }

  function renderPassage() {
    var p = PASSAGES[cur];
    var html = '<span class="section-tag">Section A — Reading Skill</span>';
    html += '<h2>' + (cur + 1) + '. ' + esc(p.title) + '</h2>';
    html += '<div class="passage">' + p.paras.map(function (t) { return '<p>' + t + '</p>'; }).join('');
    if (p.table) {
      var tb = p.table;
      html += '<div class="table-wrap"><table aria-label="' + esc(tb.caption) + '"><thead><tr>' +
        tb.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        tb.rows.map(function (r) {
          return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</div>';
    passageCard.innerHTML = html;
  }

  function questionHtml(q, qi) {
    var h = '<div class="q" data-qi="' + qi + '">';
    h += '<div class="qhead"><span class="num">(' + ROMAN[qi] + ')</span> ' + q.q + '</div>';
    if (q.t === 'mcq' || q.t === 'tf') {
      var opts = q.t === 'tf' ? ['TRUE', 'FALSE'] : q.opts;
      h += '<div class="options">';
      opts.forEach(function (o, oi) {
        var val = q.t === 'tf' ? (oi === 0 ? 'true' : 'false') : String(oi);
        h += '<button type="button" class="opt" data-val="' + val + '">' +
          (q.t === 'tf' ? '' : '<span class="letter">(' + LETTERS[oi] + ')</span>') +
          '<span>' + esc(o) + '</span></button>';
      });
      h += '</div>';
    } else {
      q.parts.forEach(function (part, pi) {
        var id = 'q' + qi + 'p' + pi;
        h += '<div class="subpart">';
        if (part.label) h += '<label for="' + id + '">' + esc(part.label) + '</label>';
        h += '<input id="' + id + '" class="word-input" data-part="' + pi + '" type="text" inputmode="' +
          (part.num ? 'numeric' : 'text') + '" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type one word">';
        h += '</div>';
      });
    }
    h += '<div class="qtools"><button type="button" class="link-btn show-ans" data-shown="false">Show answer</button></div>';
    h += '<div class="feedback"></div>';
    h += '</div>';
    return h;
  }

  function renderQuiz() {
    var p = PASSAGES[cur];
    var html = '<p class="instructions"><strong>Answer the questions.</strong> Tap an option where choices are given; type <strong>one word</strong> where the answer is one word (capital or small letters both accepted). Use <strong>Check answers</strong> for feedback on all ten, or <strong>Show answer</strong> on a single question to see the model answer and why.</p>';
    html += p.questions.map(questionHtml).join('');
    html += '<div class="actions"><button class="btn primary" id="checkBtn" type="button">Check answers</button>' +
      '<button class="btn" id="resetBtn" type="button">Reset this passage</button></div>';
    quiz.innerHTML = html;
    restore();
    updateScore();
  }

  function resetShow(qEl) {
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'false'); sb.textContent = 'Show answer'; }
  }

  function mark(q, qi) {
    var st = state[cur];
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return false;
    var fb = qEl.querySelector('.feedback');
    var ok = false;
    qEl.classList.remove('correct', 'wrong');
    if (q.t === 'mcq' || q.t === 'tf') {
      var ans = q.t === 'tf' ? String(q.a) : String(q.a);
      var sel = st.sel[qi];
      qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('correct', 'wrong'); });
      var good = qEl.querySelector('.opt[data-val="' + ans + '"]');
      if (good) good.classList.add('correct');
      if (sel === undefined) {
        if (good) good.classList.remove('correct');
        fb.textContent = 'Not answered yet.';
        fb.className = 'feedback bad';
        return false;
      }
      if (sel !== ans) {
        var bad = qEl.querySelector('.opt[data-val="' + sel + '"]');
        if (bad) { bad.classList.remove('correct'); bad.classList.add('wrong'); }
      }
      ok = sel === ans;
      fb.innerHTML = esc(ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.') + whyHtml(q);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    } else {
      var inputs = qEl.querySelectorAll('.word-input');
      var filled = true, goodCount = 0;
      q.parts.forEach(function (part, pi) {
        var inp = inputs[pi];
        var val = norm((st.text[qi] || [])[pi] || '');
        if (!inp) return;
        inp.classList.remove('correct', 'wrong');
        if (!val) { filled = false; return; }
        if (part.a.some(function (x) { return norm(x) === val; })) { goodCount++; inp.classList.add('correct'); }
        else inp.classList.add('wrong');
      });
      if (!filled) {
        fb.textContent = q.parts.length > 1 ? 'Not answered yet (fill in both parts, one word each).' : 'Not answered yet (type one word).';
        fb.className = 'feedback bad';
        return false;
      }
      ok = goodCount === q.parts.length;
      var msg;
      if (ok) msg = 'Correct.';
      else if (q.parts.length > 1) msg = 'Not quite. Correct answers: ' + q.parts.map(function (part, pi) { return '(' + LETTERS[pi] + ') ' + part.a[0]; }).join(', ') + '.';
      else msg = 'Not quite. Correct answer: ' + q.parts[0].a[0] + '.';
      fb.innerHTML = esc(msg) + whyHtml(q);
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    }
    qEl.classList.add(ok ? 'correct' : 'wrong');
    st.res[qi] = ok;
    return ok;
  }

  function showAnswer(q, qi) {
    var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
    if (!qEl) return;
    var fb = qEl.querySelector('.feedback');
    if (q.t === 'mcq' || q.t === 'tf') {
      var ans = String(q.a);
      qEl.querySelectorAll('.opt').forEach(function (b) { b.classList.toggle('correct', b.getAttribute('data-val') === ans); });
      var label = q.t === 'tf' ? (q.a ? 'TRUE' : 'FALSE') : '(' + LETTERS[q.a] + ') ' + q.opts[q.a];
      fb.innerHTML = esc('Answer: ' + label + '.') + whyHtml(q);
    } else {
      var txt = q.parts.map(function (part, pi) {
        return q.parts.length > 1 ? '(' + LETTERS[pi] + ') ' + part.a[0] : part.a[0];
      }).join('; ');
      fb.innerHTML = esc('Answer: ' + txt + '.') + whyHtml(q);
    }
    fb.className = 'feedback info';
    var sb = qEl.querySelector('.show-ans');
    if (sb) { sb.setAttribute('data-shown', 'true'); sb.textContent = 'Hide answer'; }
  }

  function restore() {
    var st = state[cur];
    PASSAGES[cur].questions.forEach(function (q, qi) {
      var qEl = quiz.querySelector('.q[data-qi="' + qi + '"]');
      if (!qEl) return;
      if (st.sel[qi] !== undefined) {
        var b = qEl.querySelector('.opt[data-val="' + st.sel[qi] + '"]');
        if (b) b.classList.add('selected');
      }
      if (st.text[qi]) {
        var inputs = qEl.querySelectorAll('.word-input');
        st.text[qi].forEach(function (v, pi) { if (inputs[pi]) inputs[pi].value = v; });
      }
    });
    if (st.score !== null) {
      PASSAGES[cur].questions.forEach(function (q, qi) { mark(q, qi); });
    }
  }

  function updateScore() {
    var st = state[cur];
    var checked = state.filter(function (s) { return s.score !== null; });
    var total = checked.reduce(function (a, s) { return a + s.score; }, 0);
    var head = 'Passage ' + (cur + 1) + ': ' + (st.score === null ? '—' : st.score) + ' / ' + PASSAGES[cur].questions.length;
    var note = checked.length
      ? 'Checked so far: ' + checked.length + ' of ' + PASSAGES.length + ' passages · ' + total + ' / ' + (checked.length * PASSAGES[cur].questions.length) + ' correct.'
      : 'Tap an option to choose it; you can change it any time before you check.';
    scorebar.innerHTML = head + '<div class="small">' + note + '</div>';
  }

  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('.tab');
    if (tab) {
      cur = Number(tab.getAttribute('data-i'));
      renderTabs();
      renderPassage();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    if (ev.target.id === 'checkBtn') {
      var score = 0;
      PASSAGES[cur].questions.forEach(function (q, qi) { if (mark(q, qi)) score++; });
      state[cur].score = score;
      updateScore();
      return;
    }

    if (ev.target.id === 'resetBtn') {
      state[cur] = { sel: {}, text: {}, res: {}, score: null };
      renderQuiz();
      updateScore();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    var sb = ev.target.closest('.show-ans');
    if (sb && quiz.contains(sb)) {
      var qEl = sb.closest('.q');
      var qi = Number(qEl.getAttribute('data-qi'));
      if (sb.getAttribute('data-shown') === 'true') {
        var fb = qEl.querySelector('.feedback');
        fb.textContent = '';
        fb.className = 'feedback';
        qEl.classList.remove('correct', 'wrong');
        qEl.querySelectorAll('.opt').forEach(function (b) {
          b.classList.remove('correct', 'wrong');
          if (state[cur].sel[qi] !== undefined && b.getAttribute('data-val') === state[cur].sel[qi]) b.classList.add('selected');
        });
        resetShow(qEl);
      } else {
        showAnswer(PASSAGES[cur].questions[qi], qi);
      }
      return;
    }

    var opt = ev.target.closest('.opt');
    if (opt && quiz.contains(opt)) {
      var qBox = opt.closest('.q');
      var qi2 = Number(qBox.getAttribute('data-qi'));
      qBox.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('selected', 'correct', 'wrong'); });
      opt.classList.add('selected');
      state[cur].sel[qi2] = opt.getAttribute('data-val');
      delete state[cur].res[qi2];
      state[cur].score = null;
      qBox.classList.remove('correct', 'wrong');
      var fb2 = qBox.querySelector('.feedback');
      fb2.textContent = '';
      fb2.className = 'feedback';
      resetShow(qBox);
      updateScore();
    }
  });

  document.addEventListener('input', function (ev) {
    var inp = ev.target.closest ? ev.target.closest('.word-input') : null;
    if (!inp || !quiz.contains(inp)) return;
    var qBox = inp.closest('.q');
    var qi = Number(qBox.getAttribute('data-qi'));
    var pi = Number(inp.getAttribute('data-part'));
    var st = state[cur];
    st.text[qi] = st.text[qi] || [];
    st.text[qi][pi] = inp.value;
    delete st.res[qi];
    st.score = null;
    inp.classList.remove('correct', 'wrong');
    qBox.classList.remove('correct', 'wrong');
    var fb = qBox.querySelector('.feedback');
    fb.textContent = '';
    fb.className = 'feedback';
    resetShow(qBox);
    updateScore();
  });

  renderTabs();
  renderPassage();
  renderQuiz();
})();
</script>
</body>
</html>
